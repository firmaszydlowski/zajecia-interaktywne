<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>5W w praktyce: świadkowie zdarzenia · podgląd ekranów</title>
<style>
/* Kopia 1:1 z generator-debat/apka/styl.css. Wygląd A „Tablica wyników” (makiety/kierunek-A-v2.html): tokeny i elementy wspólne wszystkich stron.
   Tokeny i typografia 1:1 z makiety. Strony: <body class="k1"> (jasna) albo <body class="k1 k1-ciemny">.
   Kontrast WCAG AA sprawdzony dla par tokenów (najniższa para szary/ciem2: 4,9:1). */
:root {
  --tlo: #F2F0EB; --biel: #FFFFFF; --ink: #16181D; --mute: #4F5560; --linia: #D6D2C8; --ciem: #16181D; --ciem2: #22262E; --ciem3: #2E333D;
  --jasny: #C9CED8; --szary: #8B93A1; --tak: #1D5FD6; --nie: #C2410C; --tak-j: #7AAEFF; --nie-j: #FF9B54; --zolty: #FFC94D; --uwaga: #8A3A0A; --uwaga-t: #FDEBD9;
  --kond: "Avenir Next Condensed", "DIN Condensed", "Bahnschrift SemiCondensed", "Arial Narrow", sans-serif;
  --tekst: "Avenir Next", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
h1, h2, h3, h4, p, dl, dd, figure, blockquote { margin: 0; }
ol, ul { margin: 0; padding: 0; list-style: none; }
[hidden] { display: none !important; }
button { cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--zolty); outline-offset: 2px; }
.k1 :focus-visible { outline-color: var(--tak); }
.k1-ciemny :focus-visible { outline-color: var(--zolty); }

.k1 { font: 16px/1.45 var(--tekst); color: var(--ink); background: var(--tlo); }
:where(.k1) button, :where(.k1) input, :where(.k1) select { font: inherit; }
.k1-ciemny { background: var(--ciem); color: #fff; }
.ik { width: 1em; height: 1em; flex: none; vertical-align: -.14em; }
.kbd { display: inline-block; min-width: 1.9em; padding: 0 .4em; border: 1px solid currentColor; border-bottom-width: 3px; border-radius: 4px; font-size: .85em; text-align: center; line-height: 1.5; }
.num { font-variant-numeric: tabular-nums; }
.qr { display: block; shape-rendering: crispEdges; }
.qr svg { display: block; width: 100%; height: auto; }

/* przełączniki: język i widok urządzenia */
.k1 .jez, .k1 .urz { display: inline-flex; border: 1px solid currentColor; }
.k1 .jez button, .k1 .urz button { background: none; border: 0; color: inherit; font-weight: 600; padding: 0 14px; min-height: 44px; white-space: nowrap; }
.k1 .jez button[aria-pressed="true"], .k1 .urz button[aria-pressed="true"] { background: #fff; color: var(--ciem); }

/* przyciski */
.k1-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border: 1px solid var(--ink); background: var(--biel); color: var(--ink); font-weight: 600; white-space: nowrap; text-decoration: none; }
.k1-btn.pelny { background: var(--ciem); color: #fff; }
.k1-btn:disabled { border-color: var(--linia); color: var(--mute); background: transparent; font-weight: 400; }
.k1-ciemny .k1-btn { background: transparent; color: #fff; border-color: #fff; }
.k1-ciemny .k1-btn.pelny { background: #fff; color: var(--ciem); }
.k1-ciemny .k1-btn:disabled { border-color: var(--ciem3); color: var(--szary); }
.k1-btn-gl { display: inline-flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 24px; border: 0; background: var(--zolty); color: var(--ciem); font: 700 22px/1 var(--kond); }
.k1-btn-gl:disabled { opacity: .6; }
.k1-akcje { display: flex; gap: 8px; flex-wrap: wrap; }

/* drobne teksty */
.k1-meta { font-size: 14px; color: var(--mute); }
.k1-ciemny .k1-meta { color: var(--jasny); }
.k1-ang { display: block; color: var(--mute); font-size: 15px; }
.k1-ciemny .k1-ang { color: var(--jasny); }
.k1-hint { font-size: 14px; color: var(--jasny); }
.k1 a { color: var(--tak); }
.k1-ciemny a { color: var(--tak-j); }
.k1-powiedz { font-size: 13px; font-weight: 700; color: var(--mute); display: block; }
.k1-ciemny .k1-powiedz { color: var(--jasny); }
.k1-tylko { display: flex; gap: 8px; align-items: center; padding: 10px 12px; background: var(--uwaga-t); color: var(--uwaga); font-weight: 700; font-size: 15px; }
.k1-tylko .ik { width: 20px; height: 20px; }
.komunikat { padding: 10px 12px; background: var(--uwaga-t); color: var(--uwaga); font-weight: 600; font-size: 15px; }
.komunikat-sesji { padding: 48px 24px; font: 700 28px/1.2 var(--kond); text-align: center; }

/* stan łącza */
.k1-lacze { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--jasny); white-space: nowrap; }
.k1-lacze::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--nie-j); }
.k1-lacze.czesc::before { background: var(--zolty); }
.k1-lacze.ok::before { background: #4ADE80; }

/* TAK i NIE: kolor plus kształt (kółko i kwadrat), żeby nie polegać na samym kolorze */
.strona-tak { color: var(--tak); }
.strona-nie { color: var(--nie); }
.k1-ciemny .strona-tak { color: var(--tak-j); }
.k1-ciemny .strona-nie { color: var(--nie-j); }

/* tryb testowy */
.baner-testu { background: var(--zolty); color: var(--ciem); font-weight: 700; text-align: center; padding: 8px 16px; letter-spacing: .02em; }

/* TV (ciemny): ekran 1920×1080 liczony w jednostce --u. Strona ustawia --u z okna (styl_tv_strona.css), podgląd z ramki.
   Najmniejszy tekst treści: 64 px przy 1080p. Wyjątki: pasek sterowania i baner próby (znikają w pełnym ekranie / tylko próba). */
.tv-ekran { position: relative; width: calc(1920 * var(--u)); height: calc(1080 * var(--u)); padding: calc(48 * var(--u)) calc(72 * var(--u));
  display: flex; flex-direction: column; gap: calc(32 * var(--u)); overflow: hidden; background: var(--ciem); color: #fff;
  font: 400 calc(64 * var(--u))/1.15 var(--tekst); text-align: left; }
.tv-ekran .ik { width: .9em; height: .9em; }
.tv-g { flex: none; display: flex; justify-content: space-between; align-items: baseline; gap: calc(48 * var(--u)); font: 700 calc(64 * var(--u))/1 var(--kond); color: var(--jasny); }
.tv-gl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tv-g > :not(.tv-gl) { flex: none; white-space: nowrap; }
.tv-zegar-maly { flex: none; color: #fff; font-size: calc(96 * var(--u)); }
.tv-ekran .malo { color: var(--zolty); }
.tv-ekran .koniec { color: var(--nie-j); }
.tv-tresc { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: calc(32 * var(--u)); overflow: hidden; }
.tv-kolumna { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: calc(32 * var(--u)); overflow: hidden; }
.tv-z-obrazem { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); gap: calc(56 * var(--u)); }
.tv-dwie { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: calc(48 * var(--u)); }
.tv-obraz, .tv-obraz-ramka { width: 100%; height: 100%; min-height: 0; }
.tv-obraz { display: block; object-fit: cover; }
.tv-obraz-ramka { display: flex; flex-direction: column; gap: calc(12 * var(--u)); }
.tv-obraz-ramka .tv-obraz { flex: 1; height: auto; }
.tv-obraz-ramka figcaption { font: 700 calc(64 * var(--u))/1.05 var(--kond); color: var(--jasny); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* teksty */
.tv-tytul { font: 700 calc(132 * var(--u))/0.95 var(--kond); }
.tv-pyt { font: 700 calc(84 * var(--u))/1.08 var(--tekst); }
.tv-pyt.maly { font-size: calc(64 * var(--u)); line-height: 1.12; }
.tv-tekst { font-size: calc(64 * var(--u)); line-height: 1.2; }
.tv-akcent { color: var(--tak-j); }
.tv-pole { min-height: 0; display: flex; flex-direction: column; gap: calc(16 * var(--u)); padding: calc(28 * var(--u)) calc(36 * var(--u)); background: var(--ciem2); overflow: hidden; }
.tv-pole h2 { font: 700 calc(64 * var(--u))/1 var(--kond); color: var(--zolty); }
.tv-pole-duze { flex: 1; }
.tv-d { flex: none; margin-top: auto; display: flex; flex-wrap: wrap; justify-content: space-between; gap: calc(16 * var(--u)) calc(48 * var(--u));
  font: 700 calc(64 * var(--u))/1.1 var(--kond); color: var(--jasny); }
.tv-zrodlo { font-family: var(--tekst); font-weight: 400; }
.tv-lista { counter-reset: s; display: grid; gap: calc(20 * var(--u)); }
.tv-lista li { counter-increment: s; display: grid; grid-template-columns: calc(88 * var(--u)) 1fr; font-weight: 700; line-height: 1.12; }
.tv-lista li::before { content: counter(s); font-family: var(--kond); color: var(--zolty); }
ul.tv-lista li { grid-template-columns: 1fr; }
ul.tv-lista li::before { content: none; }
.tv-pozycje { display: grid; gap: calc(12 * var(--u)); }
.tv-pozycje h2 { font: 700 calc(64 * var(--u))/1 var(--kond); color: var(--jasny); }
.tv-lista-pozycji li { padding: calc(10 * var(--u)) 0; border-top: calc(4 * var(--u)) solid var(--ciem3); font-weight: 700; line-height: 1.12; }

/* opcje: kolor plus kształt znaku */
.tv-ekran .op-tak { color: var(--tak-j); }
.tv-ekran .op-nie { color: var(--nie-j); }
.tv-ekran .op-jesli { color: var(--zolty); }
.tv-ekran .op-n { color: #fff; }
.op-litera { display: inline-grid; place-items: center; flex: none; width: 1em; height: 1em; border: .08em solid currentColor; font: 700 .7em/1 var(--kond); }
.tv-opcje { display: grid; gap: calc(8 * var(--u)); }
.tv-opcje li { display: flex; align-items: center; gap: calc(28 * var(--u)); padding: calc(18 * var(--u)) 0; border-top: calc(4 * var(--u)) solid var(--ciem3);
  font: 700 calc(84 * var(--u))/1.02 var(--kond); }
.tv-opcje .op-znak, .tv-opcje .op-litera, .tv-sl-nazwa .op-znak, .tv-sl-nazwa .op-litera { width: calc(76 * var(--u)); height: calc(76 * var(--u)); }
.tv-slupki { display: grid; gap: calc(28 * var(--u)); }
.tv-slupki li { display: grid; grid-template-columns: minmax(0, 860fr) minmax(0, 520fr) calc(230 * var(--u)); align-items: center; gap: calc(32 * var(--u)); }
.tv-sl-nazwa { display: flex; align-items: center; gap: calc(20 * var(--u)); font: 700 calc(72 * var(--u))/1 var(--kond); }
.tv-sl-pasek { display: block; height: calc(76 * var(--u)); background: var(--ciem3); }
.tv-sl-pasek i { display: block; height: 100%; background: currentColor; }
.tv-sl-proc { font: 700 calc(120 * var(--u))/1 var(--kond); text-align: right; }
.przygas { opacity: .35; }
.tv-werdykt-rzad { display: flex; flex-wrap: wrap; align-items: center; gap: calc(24 * var(--u)) calc(48 * var(--u)); }
.tv-werdykt { font: 700 calc(150 * var(--u))/0.95 var(--kond); }
/* odsłona: poprawna opcja wypełniona swoim kolorem, ze znakiem ✓ i napisem „Poprawna”; złe szare, bez wypełnienia */
.tv-odsl { flex: none; display: flex; flex-wrap: wrap; gap: calc(16 * var(--u)) calc(24 * var(--u)); }
.tv-odsl li { display: flex; align-items: center; gap: calc(20 * var(--u)); padding: calc(12 * var(--u)) calc(28 * var(--u));
  border: calc(4 * var(--u)) solid var(--ciem3); font: 700 calc(64 * var(--u))/1 var(--kond); }
.tv-odsl li .ik { width: calc(64 * var(--u)); height: calc(64 * var(--u)); }
.tv-ekran .tv-odsl li.zla { color: var(--szary); }
.tv-odsl li.poprawna { background: currentColor; border-color: currentColor; }
.tv-odsl li.poprawna > * { color: var(--ciem); }
.tv-odsl li.poprawna > .odsl-tag { padding: calc(8 * var(--u)) calc(16 * var(--u)); background: var(--ciem); color: #fff; }
.tv-z-obrazem .tv-odsl li { gap: calc(14 * var(--u)); padding: calc(8 * var(--u)) calc(18 * var(--u)); }
.tv-z-obrazem .tv-odsl li.poprawna > .odsl-tag { padding: calc(4 * var(--u)) calc(12 * var(--u)); }
.tv-odsl.duze li.poprawna { font-size: calc(110 * var(--u)); }
.tv-odsl.duze li.poprawna .ik { width: calc(96 * var(--u)); height: calc(96 * var(--u)); }
.tv-odsl.duze li.poprawna > .odsl-tag { font-size: calc(64 * var(--u)); }
.tv-znacznik { padding: calc(12 * var(--u)) calc(24 * var(--u)); background: var(--zolty); color: var(--ciem); font: 700 calc(64 * var(--u))/1 var(--kond); }

/* start i kod QR */
.tv-start { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) calc(640 * var(--u)); gap: calc(96 * var(--u)); align-items: center; }
.tv-qr-blok { display: flex; flex-direction: column; align-items: center; gap: calc(16 * var(--u)); text-align: center; }
.tv-qr { width: calc(560 * var(--u)); padding: calc(24 * var(--u)); background: #fff; }
.tv-qr svg { display: block; width: 100%; height: auto; }
.tv-adres { font: 700 calc(64 * var(--u))/1.05 var(--kond); color: var(--jasny); overflow-wrap: anywhere; }
.tv-kod { font: 700 calc(64 * var(--u))/1 var(--kond); color: var(--jasny); }
.tv-kod b { color: var(--zolty); font-size: calc(120 * var(--u)); letter-spacing: .06em; }
.tv-nakladka { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: calc(24 * var(--u)); background: var(--ciem); color: #fff; }

/* suwaki */
.tv-suwaki { flex: 1; min-height: 0; display: grid; grid-auto-rows: minmax(0, 1fr); gap: calc(40 * var(--u)); }
.tv-suwak-wynik { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: calc(12 * var(--u)); }
.tv-suwak-g, .tv-konce { display: flex; justify-content: space-between; gap: calc(32 * var(--u)); font: 700 calc(64 * var(--u))/1 var(--kond); }
.tv-suwak-g b { color: var(--zolty); }
.tv-konce { color: var(--jasny); }
.tv-histogram { display: flex; align-items: flex-end; gap: calc(12 * var(--u)); min-height: calc(100 * var(--u)); border-bottom: calc(4 * var(--u)) solid var(--jasny); }
.tv-histogram span { flex: 1; height: 100%; display: flex; align-items: flex-end; }
.tv-histogram i { display: block; width: 100%; min-height: calc(4 * var(--u)); background: var(--tak-j); }

/* ściana tekstów */
.tv-sciana { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, max-content); align-content: start;
  gap: calc(24 * var(--u)); overflow: hidden; }
.tv-wpis { display: flex; flex-direction: column; gap: calc(8 * var(--u)); padding: calc(20 * var(--u)) calc(28 * var(--u)); background: var(--ciem2);
  border-left: calc(10 * var(--u)) solid var(--tak-j); overflow: hidden; }
.tv-wpis p { line-height: 1.15; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tv-dwie .tv-sciana { grid-template-columns: minmax(0, 1fr); }
.tv-wpis-kto { font: 700 calc(64 * var(--u))/1 var(--kond); color: var(--zolty); }
.tv-wpis.ocena-dobrze { border-left-color: #4ADE80; }
.tv-wpis.ocena-popraw { border-left-color: var(--nie-j); }
.tv-ocena { font: 700 calc(64 * var(--u))/1 var(--kond); color: var(--jasny); }

/* stuknięcie */
.tv-dwie-mapa { grid-template-columns: auto minmax(0, 1fr); align-items: start; }
.tv-mapa { position: relative; height: calc(760 * var(--u)); }
.tv-mapa img { display: block; height: 100%; width: auto; }
.tv-cel { position: absolute; border: calc(8 * var(--u)) solid var(--zolty); box-shadow: 0 0 0 calc(4 * var(--u)) var(--ciem); }
.tv-kropka { position: absolute; width: calc(30 * var(--u)); height: calc(30 * var(--u)); margin: calc(-15 * var(--u)) 0 0 calc(-15 * var(--u));
  border-radius: 50%; background: var(--tak-j); border: calc(4 * var(--u)) solid var(--ciem); }
.tv-kropka.poza { background: var(--nie-j); }
.tv-wielka-liczba { font: 700 calc(150 * var(--u))/1 var(--kond); color: var(--zolty); }

/* galeria, timer, ranking */
.tv-galeria { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(var(--kol, 3), minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: calc(32 * var(--u)); }
.tv-galeria li { min-height: 0; display: flex; flex-direction: column; background: var(--ciem2); }
.tv-galeria img { flex: 1; min-height: 0; width: 100%; object-fit: cover; display: block; }
.tv-galeria li.pierwsze { outline: calc(8 * var(--u)) solid var(--zolty); }
.tv-kafel-opis { display: flex; align-items: center; gap: calc(24 * var(--u)); padding: calc(14 * var(--u)) calc(24 * var(--u)); font: 700 calc(64 * var(--u))/1.05 var(--kond);
  white-space: nowrap; overflow: hidden; }
.tv-kafel-opis > b { color: var(--zolty); }
.tv-serca { display: inline-flex; align-items: center; gap: calc(8 * var(--u)); }
.tv-serca .ik { color: var(--nie-j); }
.tv-timer { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(24 * var(--u)); text-align: center; }
.tv-zegar-duzy { font: 700 calc(420 * var(--u))/0.85 var(--kond); }
.tv-ranking li { display: grid; grid-template-columns: calc(150 * var(--u)) 1fr auto; padding: calc(14 * var(--u)) 0; border-top: calc(4 * var(--u)) solid var(--ciem3);
  font: 700 calc(84 * var(--u))/1.1 var(--kond); }
.tv-ranking li:first-child { color: var(--zolty); }
.tv-ranking.dwie { display: grid; grid-auto-flow: column; grid-template-rows: repeat(var(--wiersze), auto); grid-template-columns: 1fr 1fr; column-gap: calc(96 * var(--u)); }

/* dopasowanie, gdy treść się nie mieści (tv_kroki.js: dopasujEkran) */
.ciasno .tv-tytul { font-size: calc(100 * var(--u)); }
.ciasno .tv-pyt { font-size: calc(72 * var(--u)); }
.ciasno .tv-werdykt { font-size: calc(112 * var(--u)); }
.ciasno .tv-odsl.duze li.poprawna { font-size: calc(84 * var(--u)); }
.ciasno .tv-tresc, .ciasno .tv-kolumna { gap: calc(20 * var(--u)); }
.ciasno .tv-opcje li { padding: calc(10 * var(--u)) 0; }
.ciasno .tv-ranking li { padding: calc(6 * var(--u)) 0; font-size: calc(72 * var(--u)); }
.ciasno2 .tv-tytul, .ciasno2 .tv-pyt, .ciasno2 .tv-werdykt, .ciasno2 .tv-odsl.duze li.poprawna { font-size: calc(64 * var(--u)); }
.ciasno2 .tv-tekst, .ciasno2 .tv-pole p, .ciasno2 .tv-lista li, .ciasno2 .tv-lista-pozycji li { font-family: var(--kond); line-height: 1.08; }

/* Telefon ucznia (ciemny) 1:1 jak u.html generatora debat (apka/styl_u.css): pasek ciem2, przyciski z obramowaniem
   w kolorze odpowiedzi, wybrany wypełniony, pola jak pole kodu, żółty przycisk główny. Główne akcje w dolnej części ekranu. */
.u-strona { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; max-width: 560px; margin: 0 auto; background: var(--ciem); color: #fff; }
.u-pasek { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding: max(10px, env(safe-area-inset-top)) 16px 10px; background: var(--ciem2); }
.u-pasek b { margin-right: auto; font: 700 22px/1.1 var(--kond); }
.u-pasek .u-zm { min-height: 44px; padding: 0 4px; border: 0; background: none; color: var(--jasny); text-decoration: underline; font-size: 14px; }
.u-ekran { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 16px 16px max(24px, env(safe-area-inset-bottom)); }
.u-gora { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.u-etyk { font-size: 14px; color: var(--jasny); }
.u-zegar { font: 700 40px/1 var(--kond); color: #fff; }
.u-zegar.malo { color: var(--zolty); }
.u-zegar.koniec { color: var(--nie-j); }
.u-ekran h2 { font: 700 26px/1.12 var(--kond); }
.u-ekran .u-pyt { font: 700 20px/1.3 var(--tekst); }
.u-ekran p { font-size: 17px; line-height: 1.45; }
.u-ekran .u-info { font-size: 15px; color: var(--jasny); }
.u-ekran .u-potw { padding: 10px 12px; background: var(--ciem3); color: #fff; font-size: 15px; }
.u-lista { counter-reset: s; display: grid; gap: 8px; }
.u-lista li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; padding-left: 12px; border-left: 3px solid var(--zolty); font-size: 17px; line-height: 1.4; }
.u-lista li::before { content: counter(s) "."; font-weight: 700; }
.u-obraz, .u-obraz-ramka img { display: block; width: 100%; height: auto; }
.u-obraz-ramka figcaption { margin-top: 4px; font-size: 14px; color: var(--jasny); }
.u-karta { display: grid; gap: 6px; padding: 12px 14px; background: var(--ciem2); }
.u-karta h3 { font: 700 22px/1.1 var(--kond); }
.u-pozycje li, .u-zrodla li { padding: 10px 0; border-bottom: 1px solid var(--ciem3); }
.u-pozycje li p { font-size: 15px; color: var(--jasny); }
.u-pozycje a, .u-zrodla a { display: inline-flex; align-items: center; min-height: 44px; font-weight: 700; }
.u-zrodla li { font-size: 15px; }

/* głosowanie: kolor plus kształt znaku */
.u-ekran .op-tak { color: var(--tak-j); }
.u-ekran .op-nie { color: var(--nie-j); }
.u-ekran .op-jesli { color: var(--zolty); }
.u-ekran .op-n { color: #fff; }
.u-glos { display: grid; gap: 10px; margin-top: 6px; }
.u-glos button { display: flex; align-items: center; gap: 16px; min-height: 104px; padding: 10px 20px; border: 3px solid; background: transparent;
  font: 700 40px/1 var(--kond); text-align: left; }
.u-glos button.op-n { font-size: 30px; }
.u-glos .op-znak, .u-glos .op-litera { width: 48px; height: 48px; }
.u-glos button[aria-pressed="true"] { background: currentColor; }
.u-glos button[aria-pressed="true"] > * { color: var(--ciem); }
.u-glos button:disabled:not([aria-pressed="true"]) { color: var(--szary); border-color: var(--ciem3); }
.u-ekran .u-werdykt { font: 700 48px/1 var(--kond); }
.u-ekran .u-werdykt.maly { font-size: 28px; }
/* odsłona: poprawna opcja wypełniona swoim kolorem, ze znakiem ✓ i napisem „Poprawna”; złe szare; twój głos podpisany */
.u-odsl { display: grid; gap: 8px; }
.u-odsl li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; min-height: 56px; padding: 8px 14px; border: 3px solid var(--ciem3);
  font: 700 24px/1.1 var(--kond); }
.u-odsl li .ik, .u-odsl li .op-litera { width: 28px; height: 28px; }
.u-ekran .u-odsl li.zla { color: var(--szary); }
.u-odsl li.poprawna { background: currentColor; border-color: currentColor; font-size: 30px; }
.u-odsl li.poprawna > * { color: var(--ciem); }
.u-odsl .odsl-tekst { flex: 1 1 auto; min-width: 0; }
.u-odsl li.poprawna > .odsl-tag { padding: 4px 10px; background: var(--ciem); color: #fff; font-size: 18px; }
.u-odsl .odsl-moja { flex-basis: 100%; font: 600 14px/1.2 var(--tekst); }
.u-odsl li.zla.moja { border-color: var(--szary); }
.u-ekran .u-znacznik { align-self: flex-start; padding: 4px 10px; background: var(--zolty); color: var(--ciem); font: 700 20px/1.2 var(--kond); }
.u-dopisek, .u-pole { display: grid; gap: 6px; }
.u-dopisek label, .u-pole label { font-weight: 600; }
.u-rzad { display: flex; gap: 8px; }
.u-rzad input { flex: 1; min-width: 0; }
.u-ekran input[type="text"], .u-pole input, .u-pole textarea { width: 100%; min-height: 56px; padding: 10px 14px; border: 2px solid #fff; border-radius: 0;
  background: var(--ciem2); color: #fff; font-size: 17px; }
.u-pole input:disabled, .u-pole textarea:disabled { border-color: var(--ciem3); color: var(--jasny); }
.u-glowny { justify-content: center; width: 100%; }
.u-ekran .u-ocena { padding: 10px 12px; background: var(--ciem3); font-weight: 700; border-left: 4px solid; }
.u-ekran .ocena-dobrze { color: var(--tak-j); }
.u-ekran .ocena-popraw { color: var(--nie-j); }

/* suwaki */
.u-suwak { display: grid; gap: 4px; padding: 10px 0; border-bottom: 1px solid var(--ciem3); }
.u-suwak label { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-weight: 600; }
.u-wartosc { font: 700 32px/1 var(--kond); }
.u-suwak input { width: 100%; height: 44px; accent-color: var(--zolty); }
.u-konce { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--jasny); }

/* stuknięcie, galeria, timer, zespoły */
.u-mapa { position: relative; }
.u-mapa img { display: block; width: 100%; height: auto; }
.u-mapa.aktywna { cursor: crosshair; }
.u-kropka { position: absolute; width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%; background: var(--tak-j); border: 3px solid var(--ciem); box-shadow: 0 0 0 2px #fff; }
.u-cel { position: absolute; border: 4px solid var(--zolty); outline: 2px solid var(--ciem); }
.u-galeria { display: grid; gap: 12px; }
.u-galeria li { background: var(--ciem2); }
.u-galeria img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.u-galeria p { padding: 8px 12px 0; }
.u-serce { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; margin: 8px 12px 12px; padding: 0 14px; border: 2px solid var(--nie-j);
  background: transparent; color: var(--nie-j); font-weight: 700; }
.u-serce[aria-pressed="true"] { background: var(--nie-j); color: var(--ciem); }
.u-serce:disabled:not([aria-pressed="true"]) { color: var(--szary); border-color: var(--ciem3); }
.u-zegar-duzy { font: 700 120px/1 var(--kond); text-align: center; }
.u-zespoly { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
.u-zespoly button { min-height: 96px; border: 3px solid #fff; background: transparent; color: #fff; font: 700 36px/1 var(--kond); }

/* wpisanie kodu, jak pole kodu w u.html */
.u-strona .wpis-kodu { display: grid; gap: 10px; padding: 24px 16px; }
.u-strona .wpis-kodu h1 { font: 700 28px/1.1 var(--kond); }
.u-strona .wpis-kodu p { color: var(--jasny); }
.u-strona .wpis-kodu label { font-weight: 600; }
.u-strona .wpis-kodu input { min-height: 56px; padding: 0 14px; border: 2px solid #fff; border-radius: 0; background: var(--ciem2); color: #fff;
  font: 700 32px/1 var(--kond); letter-spacing: .08em; text-transform: uppercase; }
.u-strona .wpis-kodu .k1-btn-gl { justify-content: center; }

/* szukanie obrazem: przyciski pod zdjęciem (kroki_wspolne.js: szukajObrazemEl) */
.u-szukaj { display: grid; gap: 6px; }
.u-szukaj .k1-btn { flex: 1 1 auto; justify-content: center; }

/* Konsola prowadzącego (ciemna) jak p.html generatora debat (apka/styl_p.css): pasek ciem2, lista kroków jak lista faz,
   przyciski sterowania 72 px z białym obramowaniem, główny biały, panele ciem2. Szeroko: trzy kolumny; tablet w pionie: dwie; telefon: jedna. */
.p-uklad { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: var(--ciem); color: #fff; }
.p-g { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; min-height: 72px; padding: 10px 24px; background: var(--ciem2); }
.p-tytul { margin-right: auto; font: 700 24px/1.1 var(--kond); }
.p-kod { color: var(--jasny); }
.p-kod b { font: 700 28px/1 var(--kond); color: var(--zolty); letter-spacing: .06em; }
.p-telefony { color: var(--jasny); white-space: nowrap; }
.p-siatka { flex: 1; display: grid; grid-template-columns: 280px minmax(0, 1fr) 340px; gap: 24px; padding: 16px 24px 24px; align-items: start; }
.p-lewa { position: sticky; top: 12px; }
.p-kroki { display: grid; gap: 2px; max-height: calc(100vh - 120px); overflow: auto; }
.p-krok { width: 100%; min-height: 44px; display: grid; grid-template-columns: 34px 1fr; gap: 0 6px; padding: 9px 12px; border: 0; border-left: 4px solid transparent;
  background: none; color: var(--jasny); font-size: 15px; text-align: left; line-height: 1.3; }
.p-krok small { grid-column: 2; font-size: 13px; color: var(--szary); }
.p-kroki li.zrob .p-krok { color: var(--szary); }
.p-kroki li.akt .p-krok { border-left-color: #fff; background: var(--ciem2); color: #fff; font-weight: 700; }
.p-srodek { display: grid; gap: 12px; min-width: 0; }
.p-srodek > .k1-meta { color: var(--jasny); }
.p-naglowek { font: 700 30px/1.08 var(--kond); }
.p-fazy { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; }
.p-fazy li { padding-top: 6px; border-top: 6px solid var(--ciem3); font-size: 13px; color: var(--jasny); }
.p-fazy li.akt { border-top-color: #fff; color: #fff; font-weight: 700; }
.p-ster { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; }
.p-wstecz, .p-dalej { min-height: 72px; padding: 0 24px; border: 2px solid #fff; background: transparent; color: #fff; font: 700 24px/1.1 var(--kond); }
.p-dalej { background: #fff; color: var(--ciem); }
.p-wstecz:disabled, .p-dalej:disabled { opacity: .5; }
.p-mowisz { padding: 4px 0 4px 16px; border-left: 4px solid var(--jasny); }
.p-mowisz small { display: block; font-size: 14px; font-weight: 600; color: var(--jasny); }
.p-mowisz p { font-size: 20px; line-height: 1.35; }
.p-timer { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 12px 16px; background: var(--ciem2); }
.p-zegar { font: 700 96px/0.9 var(--kond); }
.p-zegar.malo { color: var(--zolty); }
.p-zegar.koniec { color: var(--nie-j); }
.p-podsum, .p-pudlo { display: grid; gap: 8px; padding: 14px 16px; background: var(--ciem2); }
.p-podsum:empty { display: none; }
.p-podsum h3, .p-pudlo h3 { font: 700 20px/1.1 var(--kond); }
.p-wyniki li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--ciem3); font-size: 15px; }
.p-wyniki b { font: 700 24px/1 var(--kond); white-space: nowrap; }
.p-wyniki li.p-poprawna { margin: 0 -10px; padding: 8px 10px; background: var(--tak-j); color: var(--ciem); font-weight: 700; }
.p-wyniki li.przygas { opacity: .45; }
.p-ok { width: 18px; height: 18px; vertical-align: -3px; }
.p-wyniki .p-tag { padding: 3px 8px; background: var(--ciem); color: #fff; font: 700 15px/1.2 var(--kond); text-transform: uppercase; letter-spacing: .04em; }
.p-lista { padding-left: 20px; list-style: decimal; }
.p-lista li { padding: 4px 0; }
.p-dopiski li { padding: 6px 0; border-bottom: 1px solid var(--ciem3); font-size: 15px; overflow-wrap: anywhere; }
.p-wpisy { display: grid; gap: 8px; max-height: 60vh; overflow: auto; }
.p-wpisy li { display: grid; gap: 6px; padding: 10px 12px; border: 1px solid var(--ciem3); overflow-wrap: anywhere; }
.p-wpisy li.ukryty { color: var(--szary); border-style: dashed; }
.p-wpisy small { color: var(--jasny); font-size: 13px; }
.p-prawa { display: grid; gap: 12px; }
.p-pudlo p { font-size: 15px; line-height: 1.45; }
.p-zrodla li { padding: 6px 0; border-bottom: 1px solid var(--ciem3); font-size: 14px; overflow-wrap: anywhere; }
.p-proba { outline: 2px dashed var(--zolty); }
.p-dropbox { justify-content: center; }
.p-plik { position: fixed; right: 16px; bottom: 16px; z-index: 20; width: min(480px, 92vw); max-height: 80vh; overflow: auto; display: grid; gap: 8px;
  padding: 12px; background: var(--ciem2); border: 2px solid #fff; color: #fff; }
.p-plik img { width: 100%; height: auto; border: 1px solid var(--ciem3); }
.p-plik textarea { width: 100%; font: 14px/1.4 var(--tekst); padding: 8px; background: var(--ciem); color: #fff; border: 1px solid var(--ciem3); }
@media (max-width: 1100px) { .p-siatka { grid-template-columns: 240px minmax(0, 1fr); } .p-prawa { grid-column: 1 / -1; } }
@media (max-width: 760px) { .p-siatka { grid-template-columns: 1fr; padding: 12px 16px; } .p-lewa { position: static; } .p-kroki { max-height: 220px; } .p-zegar { font-size: 72px; } }

/* podglad.html: jasna strona z ramkami TV (1920×1080 zmniejszone przez --u), telefonu i tabletu (ciemne, klasa k1-ciemny). */
.pg { padding: 0 24px 64px; }
.pg-glowa { max-width: 1320px; margin: 0 auto; padding: 32px 0 8px; display: grid; gap: 8px; }
.pg-glowa h1 { font: 700 40px/1.05 var(--kond); }
.pg-glowa p { max-width: 900px; color: var(--mute); }
.pg-spis { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.pg-spis a { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; padding: 0 10px; border: 1px solid var(--linia);
  background: var(--biel); color: var(--ink); text-decoration: none; font-weight: 600; }
.pg-krok { max-width: 1320px; margin: 0 auto; padding-top: 40px; display: grid; gap: 16px; }
.pg-krok > h2 { font: 700 30px/1.1 var(--kond); padding-top: 16px; border-top: 4px solid var(--ciem); }
.pg-wiersz { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
.pg-ramka { display: grid; gap: 8px; }
.pg-ramka figcaption { max-width: 768px; font-size: 14px; color: var(--mute); }
.pg-tv { --u: 0.4px; position: relative; width: 768px; height: 432px; overflow: hidden; outline: 10px solid #111; }
.pg-tel { width: 360px; height: 640px; overflow: auto; border: 10px solid #202124; border-radius: 28px; background: var(--ciem); }
.pg-tel .u-strona { min-height: 100%; }
.pg-tel .u-pasek { position: static; }
.pg-tablet { width: 1180px; max-width: 100%; border: 12px solid #202124; border-radius: 18px; background: var(--ciem); overflow: hidden; }
.pg-tablet .p-uklad { min-height: 0; }
.pg-tablet .p-lewa { position: static; }
.pg-tablet .p-kroki { max-height: 520px; }
.pg-blad { padding: 8px 12px; background: var(--nie); color: #fff; font-weight: 700; }
@media (max-width: 860px) { .pg-tv { --u: 0.18px; width: 346px; height: 194px; } }

/* Typ kroku „macierz” (typ_macierz.js): tabela na TV (jednostka --u, tekst min. 64 px) i wiersze przycisków na telefonie. */
.tv-macierz { width: 100%; border-collapse: collapse; font: 700 calc(64 * var(--u))/1.1 var(--kond); }
.tv-macierz th, .tv-macierz td { padding: calc(4 * var(--u)) calc(20 * var(--u)); border-top: calc(4 * var(--u)) solid var(--ciem3); text-align: center; }
.tv-macierz thead th { border-top: 0; color: var(--jasny); }
.tv-macierz tbody th { text-align: left; white-space: nowrap; }
.tv-macierz td { font-size: calc(72 * var(--u)); }
.tv-macierz .mz-max { color: var(--zolty); }
.tv-macierz .mz-dobra { background: var(--tak-j); color: var(--ciem); }
.tv-macierz .mz-ok { width: calc(56 * var(--u)); height: calc(56 * var(--u)); margin-right: calc(8 * var(--u)); vertical-align: calc(-6 * var(--u)); }
.tv-macierz .mz-zla { color: var(--szary); opacity: .6; }
.tv-mz-dwie { display: grid; grid-template-columns: 1fr 1fr; gap: calc(64 * var(--u)); align-items: start; }
.tv-mz-dwie .tv-macierz th, .tv-mz-dwie .tv-macierz td { padding-left: calc(12 * var(--u)); padding-right: calc(12 * var(--u)); }
.tv-mz-dwie .tv-macierz thead th:first-child { text-align: left; }
.tv-mz-obok { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.tv-mz-wiersze { display: flex; flex-wrap: wrap; gap: calc(16 * var(--u)) calc(24 * var(--u)); font: 700 calc(64 * var(--u))/1.1 var(--kond); }
.tv-mz-wiersze li { padding: calc(6 * var(--u)) calc(20 * var(--u)); background: var(--ciem2); }

.u-mz-wiersz { display: grid; gap: 6px; padding: 8px 0; border-bottom: 1px solid var(--ciem3); }
.u-mz-wiersz > b { font: 700 20px/1.2 var(--kond); }
.u-glos.u-mz-przyciski { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; }
.u-glos.u-mz-przyciski button { flex: 1 1 0; min-width: 52px; min-height: 52px; padding: 6px 10px; justify-content: center; font: 700 20px/1.1 var(--kond);
  text-align: center; color: #fff; }
.u-glos.u-mz-przyciski button { gap: 6px; }
.u-glos.u-mz-przyciski .mz-ok { width: 22px; height: 22px; }
/* odsłona: poprawne wypełnione ze znakiem ✓, pozostałe szare, twój błędny wybór w pomarańczowej ramce */
.u-ekran .u-glos.u-mz-przyciski button.mz-dobra { background: var(--tak-j); border-color: var(--tak-j); color: var(--ciem); }
.u-ekran .u-glos.u-mz-przyciski button.mz-dobra > * { color: var(--ciem); }
.u-ekran .u-glos.u-mz-przyciski button.mz-zla { background: transparent; border-color: var(--ciem3); color: var(--szary); }
.u-ekran .u-glos.u-mz-przyciski button.mz-zla > * { color: var(--szary); }
.u-ekran .u-glos.u-mz-przyciski button.mz-zla[aria-pressed="true"] { border-color: var(--nie-j); border-style: solid; }

/* Style typów kroków o zdjęciach: zdjecie, przerobka, wyscig, losowanie, galeria_tv, podpisy (typ_*.js). Wchodzą do wszystkich stron.
   TV w jednostce --u, najmniejszy tekst treści 64 px przy 1080p. Czerwona ramka przeróbki: jedyny kolor spoza tokenów wyglądu A (znak „tu zmieniono”). */
:root { --czerwony: #FF4D4D; }

/* zdjecie: przekreślony podpis i tabelka danych */
.tv-falszywy { font: 400 calc(64 * var(--u))/1.15 var(--kond); color: var(--jasny); }
.tv-falszywy s { text-decoration-thickness: calc(6 * var(--u)); text-decoration-color: var(--nie-j); }
/* Na TV wiersz danych to jedna linia „etykieta wartość” (długie wartości łamią się pod spodem), żeby wąska kolumna nie łamała każdej wartości. */
.tv-dane { font: 700 calc(64 * var(--u))/1.15 var(--kond); }
.tv-dane dt { display: inline; color: var(--jasny); font-weight: 400; }
.tv-dane dt::after { content: " "; }
.tv-dane dd { display: inline; margin: 0; overflow-wrap: anywhere; }
.tv-dane dd::after { content: "\A"; white-space: pre; }
.u-falszywy { padding: 10px 12px; background: var(--ciem2); border-left: 4px solid var(--nie-j); }
.u-falszywy s { text-decoration-color: var(--nie-j); text-decoration-thickness: 2px; }
.u-dane { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; font-size: 16px; }
.u-dane dt { color: var(--jasny); }
.u-dane dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; }

/* przerobka: mapa stuknięć, czerwona ramka, oryginał */
.tv-pmapa { position: relative; width: max-content; justify-self: start; }
.tv-pmapa img { display: block; height: calc(760 * var(--u)); width: auto; }
.tv-przerobka { flex: none; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: calc(48 * var(--u)); align-items: start; }
.tv-przerobka .tv-pmapa img { height: calc(520 * var(--u)); }
.tv-przerobka .tv-kolumna { overflow: visible; }
.tv-p-werdykt { font: 700 calc(96 * var(--u))/1 var(--kond); }
.cel-przerobki { position: absolute; border: calc(8 * var(--u)) solid var(--czerwony); box-shadow: 0 0 0 calc(4 * var(--u)) var(--ciem); }
/* Telefon nie ma jednostki --u: pełna ramka w pikselach (bez tego obramowanie znikało i zostawał tylko ciemny cień). */
.u-mapa .cel-przerobki { border: 5px solid var(--czerwony); box-shadow: 0 0 0 2px var(--ciem), inset 0 0 0 2px var(--ciem); }
.tv-pmapa .tv-kropka.poza, .u-mapa .u-kropka.poza { background: var(--szary); }
.tv-p-lewa { display: flex; flex-direction: column; gap: calc(12 * var(--u)); min-height: 0; }
.tv-p-podpis { font: 700 calc(64 * var(--u))/1.05 var(--kond); color: var(--jasny); }
.tv-p-procent { font: 700 calc(84 * var(--u))/1 var(--kond); color: var(--zolty); }
.tv-oryginal { display: flex; flex-direction: column; gap: calc(10 * var(--u)); min-height: 0; }
.tv-oryginal img { display: block; height: calc(220 * var(--u)); width: auto; max-width: 100%; object-fit: contain; object-position: left; }
.tv-oryginal figcaption { font: 700 calc(64 * var(--u))/1.05 var(--kond); color: var(--jasny); }
.ciasno .tv-oryginal img { height: calc(200 * var(--u)); }
.ciasno .tv-przerobka .tv-pmapa img { height: calc(440 * var(--u)); }
.u-brak { justify-content: center; min-height: 56px; }

/* Typ kroku „wybor” (typ_wybor.js): karty, ranking i podium na TV (tekst min. 64 px), lista przycisków na telefonie. */

  font-weight: 700; line-height: 1.1; }

/* Ponad 6 zespołów: tytuł w jednej linii wąskim krojem, nadmiar ucięty wielokropkiem (numer zespołu zawsze widać). */

/* Typ kroku „mapa” (typ_mapa.js): tabela różnic na TV (tekst min. 64 px), karty z dwoma suwakami na telefonie. */
.tv-mapa-tab { display: grid; gap: calc(18 * var(--u)); }
.tv-mapa-tab li { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.2fr); align-items: center; gap: calc(32 * var(--u));
  font: 700 calc(64 * var(--u))/1.05 var(--kond); }

.tv-mapa-st i.s0 { background: var(--zolty); }

.tv-mapa-przydzial li { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) auto; gap: calc(32 * var(--u)); padding: calc(14 * var(--u)) 0;
  border-top: calc(4 * var(--u)) solid var(--ciem3); font: 700 calc(72 * var(--u))/1.1 var(--kond); }

<script>
const ZAJECIA = zajeciaDlaZespolow({"slug":"5w-swiadkowie","tytul":{"pl":"5W w praktyce: świadkowie zdarzenia","en":"5W in practice: witnesses of an event"},"opis":{"pl":"Uczniowie są świadkami przygotowanej scenki i piszą zeznania, potem rozbierają na 5W prawdziwy news i clickbait, a na koniec piszą własny news z checklistą 5W.","en":"Students witness a staged scene and write statements, then take apart a real news story and a clickbait headline with the 5Ws, and finally write their own news with a 5W checklist."},"zespoly":{"liczba":5,"nazwa":{"pl":"Zespół","en":"Team"},"glosuja":false},"instrukcja":{"cel":{"pl":"Uczniowie sami przeżywają, czym jest zasada 5W. Najpierw są świadkami i widzą, że kto, co, gdzie i kiedy da się zobaczyć, a dlaczego trzeba ustalić pytaniem. Potem rozbierają na 5W prawdziwy news, widzą, jak clickbait ukrywa W, i piszą własny news z checklistą.","en":"Students experience the 5W rule themselves. First they are witnesses and see that who, what, where and when can be seen, but why has to be found out by asking. Then they take apart a real news story with the 5Ws, see how clickbait hides the Ws, and write their own news with a checklist."},"przygotowanie":[{"pl":"Telewizor albo rzutnik z komputerem, konsola prowadzącego (tablet albo laptop), telefony uczniów z internetem.","en":"A TV or projector with a computer, the teacher console (tablet or laptop), students' phones with internet."},{"pl":"Scenka dla opiekunów, około 60 sekund. Grają: opiekun 1 (prowadzi zajęcia, zostaje w sali) i opiekun 2 (wbiega). Uczniowie nic nie wiedzą wcześniej.","en":"A scene for the teachers, about 60 seconds. Actors: teacher 1 (leads the lesson, stays in the room) and teacher 2 (runs in). Students know nothing in advance."},{"pl":"Rekwizyty: niebieski plecak (dowolny, byle wyraźnego koloru), ok. 10 kartek A4, czerwona czapka albo inna rzecz łatwa do zapamiętania. Jeśli zamieniacie rekwizyt, poprawcie fakty.","en":"Props: a blue backpack (any, as long as the colour is clear), about 10 sheets of A4 paper, a red cap or another thing that is easy to remember. If you change a prop, correct the facts."},{"pl":"Opiekun 1 zapisuje godzinę, o której opiekun 2 wbiega: to fakt KIEDY.","en":"Teacher 1 writes down the time when teacher 2 runs in: this is the WHEN fact."},{"pl":"Opiekun 2 mówi tylko to, co jest w scenariuszu. Nie tłumaczy, po co mu plecak, i nie odpowiada na pytania aż do konferencji prasowej.","en":"Teacher 2 says only what is in the script. He does not explain why he needs the backpack and does not answer questions until the press conference."},{"pl":"Scenka 0:00: Opiekun 1 prowadzi zwykłe powitanie i mówi o planie dnia. Niebieski plecak leży pod jego stołem od początku zajęć.","en":"Scene 0:00: Teacher 1 gives a normal welcome and talks about the plan for the day. The blue backpack has been under his table since the start of the lesson."},{"pl":"Scenka 0:05: Drzwi otwierają się szybko. Wbiega opiekun 2 w czerwonej czapce, w ręce trzyma plik kartek. Rozgląda się.","en":"Scene 0:05: The door opens fast. Teacher 2 runs in wearing a red cap, holding a pile of papers. He looks around."},{"pl":"Scenka 0:12: Opiekun 2 mówi głośno, dokładnie tymi słowami: „Przepraszam, gdzie jest niebieski plecak? Za dwie minuty odjeżdża!”","en":"Scene 0:12: Teacher 2 says loudly, in exactly these words: “Sorry, where is the blue backpack? It leaves in two minutes!”"},{"pl":"Scenka 0:18: Opiekun 1 bez słowa wskazuje ręką stół.","en":"Scene 0:18: Teacher 1 points at the table without a word."},{"pl":"Scenka 0:22: Opiekun 2 idzie do stołu. Kartki wypadają mu z ręki na podłogę.","en":"Scene 0:22: Teacher 2 walks to the table. The papers fall out of his hand onto the floor."},{"pl":"Scenka 0:30: Zbiera kartki w pośpiechu. Dwie zostawia na podłodze.","en":"Scene 0:30: He picks up the papers in a hurry. He leaves two on the floor."},{"pl":"Scenka 0:40: Wyciąga spod stołu niebieski plecak i zarzuca go na jedno ramię.","en":"Scene 0:40: He pulls the blue backpack from under the table and throws it over one shoulder."},{"pl":"Scenka 0:48: Patrzy na zegarek, mówi „Dziękuję!” i wybiega. Drzwi zostają otwarte.","en":"Scene 0:48: He looks at his watch, says “Thank you!” and runs out. The door stays open."},{"pl":"Scenka 0:55: Opiekun 1 zamyka drzwi i mówi: „Właśnie byliście świadkami. Wyjmijcie telefony.”","en":"Scene 0:55: Teacher 1 closes the door and says: “You have just been witnesses. Take out your phones.”"},{"pl":"Fakty scenki (DLACZEGO zna tylko opiekun 2 i mówi je dopiero na konferencji prasowej): KTO: Opiekun 2, w czerwonej czapce. CO: Wbiegł, zapytał o niebieski plecak, upuścił kartki, zabrał plecak spod stołu prowadzącego i wybiegł. Dwie kartki zostały na podłodze. GDZIE: W naszej sali zajęć: od drzwi do stołu prowadzącego i z powrotem. KIEDY: Dziś, w drugiej minucie zajęć. JAK: W pośpiechu, biegiem. Kartki wypadły mu z ręki. DLACZEGO: Plecak należy do kierowcy autokaru. Kierowca zostawił go rano w sali, a za dwie minuty odjeżdżał.","en":"Facts of the scene (only teacher 2 knows WHY and says it only at the press conference): WHO: Teacher 2, in a red cap. WHAT: Ran in, asked about a blue backpack, dropped some papers, took the backpack from under the teacher's table and ran out. Two sheets stayed on the floor. WHERE: In our classroom: from the door to the teacher's table and back. WHEN: Today, in the second minute of the lesson. HOW: In a hurry, running. The papers fell out of his hand. WHY: The backpack belongs to the coach driver. The driver left it in the room in the morning, and the coach was leaving in two minutes."}],"uwagi":[{"pl":"Rano w dniu zajęć sprawdź, czy o greckim zakazie nie ma nowszej wiadomości. Ustawę uchwalono 23.10.2026 (Al Jazeera i AFP, Reuters w Cyprus Mail).","en":"On the morning of the lesson, check if there is newer news about the Greek ban. The law was passed on 23.10.2026 (Al Jazeera and AFP, Reuters in Cyprus Mail)."},{"pl":"Szczegóły ustawy (które aplikacje, komunikatory, Kids Wallet) znamy tylko z zapowiedzi z kwietnia (Boston Globe) i z marca (heise). Na ekranie są opisane jako zapowiedź.","en":"We know the details of the law (which apps, messengers, Kids Wallet) only from announcements in April (Boston Globe) and March (heise). On screen they are described as announcements."},{"pl":"W dziennikarstwie 5W (who, what, where, when, why) to pytania, którymi sprawdza się lid; często dochodzi szóste: how, po polsku jak. Dlatego pytań jest sześć.","en":"In journalism the 5Ws (who, what, where, when, why) are the questions used to check a lead; often a sixth one is added: how. That is why there are six questions."},{"pl":"Clickbait do newsa napisaliśmy na zajęcia. Zdania o tym, co clickbait robi z czytelnikiem: poradnik Demagoga.","en":"We wrote the clickbait headline for the lesson. The sentences about what clickbait does to readers come from Demagog's guide."},{"pl":"Zespoły pracują dopiero przy własnym newsie. Wcześniej każdy odpowiada sam.","en":"Teams work together only on their own news. Before that, everyone answers alone."}]},"zrodla":[{"nazwa":"Al Jazeera i AFP, „Greece joins push to ban social media for minors”, 23.10.2026","url":"https://www.aljazeera.com/news/2026/10/23/greece-joins-push-to-ban-social-media-for-minors"},{"nazwa":"Reuters w Cyprus Mail, „Greece passes social media ban for children under 15”, 23.10.2026","url":"https://cyprus-mail.com/2026/10/23/greece-passes-social-media-ban-for-children-under-15"},{"nazwa":"Boston Globe, „Greece plans to block social media for children younger than 15”, 8.04.2026 (data z adresu strony, autor niepodany)","url":"https://www.bostonglobe.com/2026/04/08/world/greece-plans-block-social-media-children-younger-than-15"},{"nazwa":"heise online, Stefan Krempl, „Social Media: Greece wants to block under-15s digitally”, 1.03.2026","url":"https://heise.de/-11194339"},{"nazwa":"Wikipedia, „Five Ws”: lista pytań, którą dziennikarstwo sprawdza, czy lid ma wszystkie najważniejsze informacje; wzmianka o dodatkowym „H” (how)","url":"https://en.wikipedia.org/wiki/Five_Ws"},{"nazwa":"Wikipedia, „Lid”: pierwszy, graficznie wyodrębniony akapit tekstu prasowego; może odpowiadać na pytania 5W + H","url":"https://pl.wikipedia.org/wiki/Lid"},{"nazwa":"Demagog, Jak się odnaleźć w gąszczu clickbaitów? Poradnik Demagoga, 26.08.2026","url":"https://demagog.org.pl/analizy_i_raporty/jak-sie-odnalezc-w-gaszczu-clickbaitow-poradnik-demagoga/"}],"kroki":[{"id":"plan","typ":"info","tytul":{"pl":"Plan na dziś","en":"Plan for today"},"lista":[{"pl":"Zeznania świadków","en":"Witness statements"},{"pl":"Rozbierz newsa","en":"Take the news apart"},{"pl":"Mój news","en":"My news"}],"mowisz":{"pl":"Zwykłe powitanie i plan dnia. Nic nie zdradzaj: za chwilę wbiega opiekun 2.","en":"A normal welcome and plan for the day. Give nothing away: teacher 2 is about to run in."},"dla_prowadzacego":{"tekst":{"pl":"Scenka bez zapowiedzi, około 60 sekund. Grają: opiekun 1 (prowadzi, zostaje w sali) i opiekun 2 (wbiega). Uczniowie nic nie wiedzą wcześniej, telefony są schowane. Pełny scenariusz scenki jest w instrukcji. Fakty: KTO: Opiekun 2, w czerwonej czapce. CO: Wbiegł, zapytał o niebieski plecak, upuścił kartki, zabrał plecak spod stołu prowadzącego i wybiegł. Dwie kartki zostały na podłodze. GDZIE: W naszej sali zajęć: od drzwi do stołu prowadzącego i z powrotem. KIEDY: Dziś, w drugiej minucie zajęć. JAK: W pośpiechu, biegiem. Kartki wypadły mu z ręki. DLACZEGO: Plecak należy do kierowcy autokaru. Kierowca zostawił go rano w sali, a za dwie minuty odjeżdżał.","en":"A scene with no warning, about 60 seconds. Actors: teacher 1 (leads, stays in the room) and teacher 2 (runs in). Students know nothing in advance, phones are put away. The full script of the scene is in the instructions. Facts: WHO: Teacher 2, in a red cap. WHAT: Ran in, asked about a blue backpack, dropped some papers, took the backpack from under the teacher's table and ran out. Two sheets stayed on the floor. WHERE: In our classroom: from the door to the teacher's table and back. WHEN: Today, in the second minute of the lesson. HOW: In a hurry, running. The papers fell out of his hand. WHY: The backpack belongs to the coach driver. The driver left it in the room in the morning, and the coach was leaving in two minutes."}}},{"id":"swiadkowie","typ":"info","tytul":{"pl":"Właśnie byliście świadkami","en":"You have just been witnesses"},"qr":true,"tresc":{"pl":"Zapiszcie, co widzieliście. Każdy sam, bez rozmów.","en":"Write down what you saw. On your own, no talking."},"mowisz":{"pl":"Każdy pisze sam. Nie wiesz? Zaznacz „zgaduję”. To nie jest błąd, to uczciwość świadka.","en":"Everyone writes alone. Not sure? Mark “guessing”. That is not a mistake, it is an honest witness."}},{"id":"zeznanie-1","typ":"tekst","naglowek":{"pl":"Zeznanie, część 1 z 2","en":"Statement, part 1 of 2"},"pytanie":{"pl":"Kto? Co? Gdzie? Napisz, co widziałeś.","en":"Who? What? Where? Write what you saw."},"pola":[{"etykieta":{"pl":"KTO?","en":"WHO?"},"maks":80},{"etykieta":{"pl":"CO?","en":"WHAT?"},"maks":140,"na_tv":false},{"etykieta":{"pl":"GDZIE?","en":"WHERE?"},"maks":80,"na_tv":false}],"przyklady":[["opiekun w czerwonej czapce","wbiegł, rozsypał kartki i zabrał plecak","u nas w sali, przy stole"],["nasz opiekun","wbiegł, rozsypał kartki i zabrał plecak","u nas w sali, przy stole"],["pan z kartkami","wbiegł, rozsypał kartki i zabrał plecak","u nas w sali, przy stole"],["jakiś nauczyciel","wbiegł, rozsypał kartki i zabrał plecak","u nas w sali, przy stole"],["pan w czapce","wbiegł, rozsypał kartki i zabrał plecak","u nas w sali, przy stole"],["chyba kierowca (zgaduję)","wbiegł, rozsypał kartki i zabrał plecak","u nas w sali, przy stole"],["opiekun, ten wysoki","wbiegł, rozsypał kartki i zabrał plecak","u nas w sali, przy stole"],["nie widziałam twarzy, siedziałam tyłem (zgaduję)","wbiegł, rozsypał kartki i zabrał plecak","u nas w sali, przy stole"],["drugi opiekun","wbiegł, rozsypał kartki i zabrał plecak","u nas w sali, przy stole"]],"mowisz":{"pl":"Ściana pokazuje odpowiedzi na KTO. Czy wszyscy widzieli to samo?","en":"The wall shows the answers to WHO. Did everyone see the same thing?"}},{"id":"zeznanie-2","typ":"tekst","naglowek":{"pl":"Zeznanie, część 2 z 2","en":"Statement, part 2 of 2"},"pytanie":{"pl":"Kiedy? Jak? Dlaczego? Napisz, co widziałeś.","en":"When? How? Why? Write what you saw."},"pola":[{"etykieta":{"pl":"KIEDY?","en":"WHEN?"},"maks":80,"na_tv":false},{"etykieta":{"pl":"JAK?","en":"HOW?"},"maks":140,"na_tv":false},{"etykieta":{"pl":"DLACZEGO?","en":"WHY?"},"maks":140}],"przyklady":[["na początku zajęć","bardzo szybko, był zdenerwowany","spóźniał się na autobus (zgaduję)"],["na początku zajęć","bardzo szybko, był zdenerwowany","zapomniał plecaka (zgaduję)"],["na początku zajęć","bardzo szybko, był zdenerwowany","ktoś na niego czekał (zgaduję)"],["na początku zajęć","bardzo szybko, był zdenerwowany","bo coś odjeżdżało za dwie minuty"],["na początku zajęć","bardzo szybko, był zdenerwowany","był zły (zgaduję)"],["na początku zajęć","bardzo szybko, był zdenerwowany","nie wiem (zgaduję)"],["na początku zajęć","bardzo szybko, był zdenerwowany","szukał czegoś pilnie"],["na początku zajęć","bardzo szybko, był zdenerwowany","jechał na lotnisko (zgaduję)"],["na początku zajęć","bardzo szybko, był zdenerwowany","to był jego plecak (zgaduję)"]],"mowisz":{"pl":"Ściana pokazuje odpowiedzi na DLACZEGO. Same domysły: nikt nie mógł tego zobaczyć.","en":"The wall shows the answers to WHY. Only guesses: nobody could see it."}},{"id":"pewnosc","typ":"macierz","naglowek":{"pl":"Ilu świadków, tyle wersji","en":"As many witnesses, as many versions"},"pytanie":{"pl":"Przy którym pytaniu widziałeś, a przy którym zgadujesz?","en":"Which answers did you see, and which are you guessing?"},"wiersze":[{"tekst":{"pl":"KTO?","en":"WHO?"}},{"tekst":{"pl":"CO?","en":"WHAT?"}},{"tekst":{"pl":"GDZIE?","en":"WHERE?"}},{"tekst":{"pl":"KIEDY?","en":"WHEN?"}},{"tekst":{"pl":"JAK?","en":"HOW?"}},{"tekst":{"pl":"DLACZEGO?","en":"WHY?"}}],"kolumny":[{"tekst":{"pl":"widziałem","en":"I saw it"}},{"tekst":{"pl":"zgaduję","en":"I'm guessing"}}],"mowisz":{"zbieranie":{"pl":"Przy każdym pytaniu zaznacz uczciwie: widziałeś czy zgadujesz.","en":"For each question, mark honestly: did you see it or are you guessing."},"wyniki":{"pl":"Przy DLACZEGO prawie wszyscy zgadują. Skąd reporter bierze „dlaczego”? Pyta bohatera. Zapraszamy opiekuna 2 na konferencję prasową.","en":"For WHY almost everyone is guessing. Where does a reporter get the “why”? They ask the person. We invite teacher 2 to a press conference."}}},{"id":"konferencja","typ":"info","tytul":{"pl":"Konferencja prasowa","en":"Press conference"},"tresc":{"pl":"Opiekun 2 wraca. Pytajcie o to, czego nie widzieliście.","en":"Teacher 2 comes back. Ask about what you did not see."},"lista":[{"pl":"Pytaj otwarcie: dlaczego? po co? dla kogo?","en":"Ask open questions: why? what for? for whom?"},{"pl":"Zapisz odpowiedź i kto ją powiedział.","en":"Write down the answer and who said it."},{"pl":"Nie zgaduj za bohatera. Zapytaj go.","en":"Do not guess for the person. Ask them."}]},{"id":"fakty","typ":"info","tytul":{"pl":"Fakty: to dało się zobaczyć","en":"Facts: what you could see"},"lista":[{"pl":"KTO? Opiekun 2, w czerwonej czapce.","en":"WHO? Teacher 2, in a red cap."},{"pl":"CO? Wbiegł, zapytał o niebieski plecak, upuścił kartki, zabrał plecak spod stołu prowadzącego i wybiegł. Dwie kartki zostały na podłodze.","en":"WHAT? Ran in, asked about a blue backpack, dropped some papers, took the backpack from under the teacher's table and ran out. Two sheets stayed on the floor."},{"pl":"GDZIE? W naszej sali zajęć: od drzwi do stołu prowadzącego i z powrotem.","en":"WHERE? In our classroom: from the door to the teacher's table and back."},{"pl":"KIEDY? Dziś, w drugiej minucie zajęć.","en":"WHEN? Today, in the second minute of the lesson."},{"pl":"JAK? W pośpiechu, biegiem. Kartki wypadły mu z ręki.","en":"HOW? In a hurry, running. The papers fell out of his hand."}],"mowisz":{"pl":"Porównajcie ze swoim zeznaniem. Gdzie się zgadza, a gdzie dopisaliście coś od siebie?","en":"Compare with your statement. Where does it match, and where did you add something of your own?"}},{"id":"fakty-dlaczego","typ":"info","tytul":{"pl":"DLACZEGO?","en":"WHY?"},"tresc":{"pl":"Plecak należy do kierowcy autokaru. Kierowca zostawił go rano w sali, a za dwie minuty odjeżdżał.","en":"The backpack belongs to the coach driver. The driver left it in the room in the morning, and the coach was leaving in two minutes."},"lista":[{"pl":"Tego nie dało się zobaczyć. Wiemy to tylko od opiekuna 2.","en":"You could not see this. We know it only from teacher 2."},{"pl":"Reporter nie zgaduje, tylko pyta.","en":"A reporter does not guess, they ask."}]},{"id":"zasada","typ":"info","tytul":{"pl":"Zasada 5W","en":"The 5W rule"},"tresc":{"pl":"Dziennikarz sprawdza nimi lid, czyli pierwszy akapit tekstu. Lid ma od razu mówić wszystko, co ważne. Często dochodzi szóste pytanie: jak?","en":"A journalist uses these questions to check the lead, the first paragraph of a text. The lead should say right away everything that matters. Often a sixth question is added: how?"},"lista":[{"pl":"KTO? CO? GDZIE? KIEDY? DLACZEGO? (Five Ws)","en":"WHO? WHAT? WHERE? WHEN? WHY? (Five Ws)"},{"pl":"JAK? (how)","en":"HOW?"}],"do_pliku":true,"dla_prowadzacego":{"tekst":{"pl":"Definicje z Wikipedii, hasła „Five Ws” i „Lid”. Lid to pierwszy, graficznie wyodrębniony akapit tekstu prasowego.","en":"Definitions from Wikipedia, entries “Five Ws” and “Lid” (Polish for lead). The lead is the first, visually set-off paragraph of a press text."},"zrodla":[{"nazwa":"Wikipedia, „Five Ws”: lista pytań, którą dziennikarstwo sprawdza, czy lid ma wszystkie najważniejsze informacje; wzmianka o dodatkowym „H” (how)","url":"https://en.wikipedia.org/wiki/Five_Ws"},{"nazwa":"Wikipedia, „Lid”: pierwszy, graficznie wyodrębniony akapit tekstu prasowego; może odpowiadać na pytania 5W + H","url":"https://pl.wikipedia.org/wiki/Lid"}]}},{"id":"news","typ":"info","tytul":{"pl":"Grecja zakazuje mediów społecznościowych dzieciom poniżej 15 lat","en":"Greece bans social media for children under 15"},"tresc":{"pl":"Na podstawie: Al Jazeera i AFP, 23.10.2026; Reuters w Cyprus Mail, 23.10.2026.","en":"Based on: Al Jazeera and AFP, 23.10.2026; Reuters in Cyprus Mail, 23.10.2026."},"lista":[{"pl":"Grecki parlament uchwalił w piątek 23 października 2026 r. zakaz korzystania z mediów społecznościowych przez osoby poniżej 15 lat.","en":"On Friday 23 October 2026 the Greek parliament passed a ban on social media for people under 15."},{"pl":"Ustawę przegłosowała partia premiera Kyriakosa Micotakisa, Nowa Demokracja, która ma w parlamencie większość. Inne partie jej nie poparły.","en":"The law was voted through by Prime Minister Kyriakos Mitsotakis's party, New Democracy, which has a majority in parliament. Other parties did not support it."},{"pl":"Zakaz zacznie obowiązywać 1 stycznia 2027 r.","en":"The ban will start on 1 January 2027."}],"mowisz":{"pl":"Prawdziwy news. Przeczytajcie go w telefonach, zaraz szukamy w nim każdego W.","en":"A real news story. Read it on your phones; next we look for each W in it."}},{"id":"news-2","typ":"info","tytul":{"pl":"Ciąg dalszy newsa","en":"The news, continued"},"lista":[{"pl":"Władze Grecji tłumaczą, że niekończące się przewijanie odbiera dzieciom sen, koncentrację i czas z przyjaciółmi.","en":"The Greek authorities explain that endless scrolling takes away children's sleep, focus and time with friends."},{"pl":"Platformy mają same sprawdzać wiek użytkowników. Premier dał im na przygotowanie tego dwa i pół miesiąca.","en":"The platforms must check users' age themselves. The prime minister gave them two and a half months to get ready."},{"pl":"Premier nazwał zakaz „trudnym, ale koniecznym”.","en":"The prime minister called the ban “difficult but necessary”."}],"mowisz":{"pl":"Ustawa jest uchwalona, ale część szczegółów znamy tylko z zapowiedzi z wiosny. Dobry reporter to rozróżnia.","en":"The law is passed, but some details we know only from announcements in spring. A good reporter keeps these apart."}},{"id":"stukanie","typ":"macierz","naglowek":{"pl":"Rozbierz newsa","en":"Take the news apart"},"pytanie":{"pl":"W którym zdaniu jest odpowiedź? Przy każdym pytaniu stuknij numer zdania.","en":"Which sentence has the answer? For each question, tap the sentence number."},"lista":[{"pl":"Grecki parlament uchwalił w piątek 23 października 2026 r. zakaz korzystania z mediów społecznościowych przez osoby poniżej 15 lat.","en":"On Friday 23 October 2026 the Greek parliament passed a ban on social media for people under 15."},{"pl":"Ustawę przegłosowała partia premiera Kyriakosa Micotakisa, Nowa Demokracja, która ma w parlamencie większość. Inne partie jej nie poparły.","en":"The law was voted through by Prime Minister Kyriakos Mitsotakis's party, New Democracy, which has a majority in parliament. Other parties did not support it."},{"pl":"Zakaz zacznie obowiązywać 1 stycznia 2027 r.","en":"The ban will start on 1 January 2027."},{"pl":"Władze Grecji tłumaczą, że niekończące się przewijanie odbiera dzieciom sen, koncentrację i czas z przyjaciółmi.","en":"The Greek authorities explain that endless scrolling takes away children's sleep, focus and time with friends."},{"pl":"Platformy mają same sprawdzać wiek użytkowników. Premier dał im na przygotowanie tego dwa i pół miesiąca.","en":"The platforms must check users' age themselves. The prime minister gave them two and a half months to get ready."},{"pl":"Premier nazwał zakaz „trudnym, ale koniecznym”.","en":"The prime minister called the ban “difficult but necessary”."}],"lista_na_tv":false,"wiersze":[{"tekst":{"pl":"KTO?","en":"WHO?"}},{"tekst":{"pl":"CO?","en":"WHAT?"}},{"tekst":{"pl":"GDZIE?","en":"WHERE?"}},{"tekst":{"pl":"KIEDY?","en":"WHEN?"}},{"tekst":{"pl":"JAK?","en":"HOW?"}},{"tekst":{"pl":"DLACZEGO?","en":"WHY?"}}],"kolumny":[{"t /* Przebieg zajęć bez DOM i sieci: kod sesji, fazy kroków, przejścia, timer. Testy: test_logika.js.
   Pozycja na zajęciach to para (krok, faza). Fazy wynikają z typu kroku i jego pól (README.md). */
const ALFABET_KODU = "acdefhjkmnprtuvwxy3479";
const DLUGOSC_KODU = 6;
const WZOR_KODU = /^[acdefhjkmnprtuvwxy3479]{6}$/;
const OSTRZEZENIE_MS = 30000;
const MIN_CZAS_Z_OSTRZEZENIEM_MS = 60000;

const FAZY_ZBIERANIA = ["glosowanie", "zbieranie"];

/* Typy kroków z osobnych plików (np. typ_macierz.js) dopisują się tu: { fazy(krok), tv(k), uczen(u), prowadzacy(p, krok, lista), symulacja(krok, los), plik(krok, lista, zajecia) }. */
const TYPY_DODATKOWE = {};

/* Kod sesji: 6 znaków bez liter i cyfr łatwych do pomylenia (0/O, 1/l/i, 5/s, 8/B). */
function nowyKod(losuj = Math.random) {
  let kod = "";
  for (let i = 0; i < DLUGOSC_KODU; i++) kod += ALFABET_KODU[Math.floor(losuj() * ALFABET_KODU.length)];
  return kod;
}

function poprawnyKod(tekst) {
  const kod = String(tekst || "").trim().toLowerCase().replace(/[\s-]/g, "");
  return WZOR_KODU.test(kod) ? kod : null;
}

/* Adres bazowy z ?baza=: tylko http(s), bez końcowego ukośnika. */
function poprawnaBaza(tekst) {
  if (!tekst || !/^https?:\/\/[^\s"'<>]+$/i.test(tekst)) return null;
  return tekst.replace(/\/+$/, "");
}

/* ?zespoly=N: liczba zespołów 2 do 10 wybrana w konsoli uruchamiania, inna wartość = null (liczba z zajęć). Bez stałych spoza funkcji:
   strona woła ją w pierwszej linii skryptu (zbuduj.py). */
function liczbaZespolowZAdresu(search) {
  const tekst = new URLSearchParams(search || "").get("zespoly");
  const n = /^\d{1,2}$/.test(tekst || "") ? Number(tekst) : NaN;
  return n >= 2 && n <= 10 ? n : null;
}

/* Parametry adresu: ?k=<kod>, ?test (lokalnie, w kartach jednej przeglądarki) albo ?test=siec (przez serwery),
   ?baza=<url> (nadpisuje ADRES_UCZNIOW w kodzie QR), ?jez=pl|en (język domyślny), ?zespoly=2…10 (liczba zespołów, zespoly.js). */
function parametryAdresu(search) {
  const p = new URLSearchParams(search || "");
  const test = p.has("test") ? (p.get("test") === "siec" ? "siec" : "lokalnie") : null;
  const jez = ["pl", "en"].includes(p.get("jez")) ? p.get("jez") : null;
  return { kod: poprawnyKod(p.get("k")), test, baza: poprawnaBaza(p.get("baza")), jez, zespoly: liczbaZespolowZAdresu(search) };
}

/* Zapytanie do linków między widokami. Język tylko angielski (polski jest domyślny); baza tylko między TV i konsolą prowadzącego. */
function zapytanieAdresu(kod, test, baza = null, jez = null, zespoly = null) {
  const czesci = [];
  if (kod) czesci.push(`k=${kod}`);
  if (test === "siec") czesci.push("test=siec");
  else if (test) czesci.push("test");
  if (jez === "en") czesci.push("jez=en");
  if (zespoly) czesci.push(`zespoly=${zespoly}`);
  if (baza) czesci.push(`baza=${encodeURIComponent(baza)}`);
  return czesci.length ? `?${czesci.join("&")}` : "";
}

/* Adres dla telefonów (kod QR): <baza>/<slug>/index.html?k=…, a bez bazy index.html obok bieżącej strony. */
function adresUczniow({ baza, slug, kod, test, biezacy, jez = null, zespoly = null }) {
  const zapytanie = zapytanieAdresu(kod, test, null, jez, zespoly);
  if (baza) return `${baza}/${slug}/index.html${zapytanie}`;
  return new URL(`index.html${zapytanie}`, biezacy).href;
}

/* Pełny publiczny adres pliku zajęć (np. media/x.jpg) dla wyszukiwarek obrazem: z bazy (?baza albo adres_uczniow z ustawień),
   a bez niej względem bieżącej strony. Wyszukiwarka pobiera obraz sama, więc adres musi być bezwzględny. */
function adresPublicznyObrazu({ plik, baza, slug, biezacy }) {
  if (baza) return `${baza}/${slug}/${plik.replace(/^\.?\//, "")}`;
  return new URL(plik, biezacy).href;
}

/* Wyszukiwanie obrazem po adresie: Google Lens, Bing, TinEye. */
function adresySzukaniaObrazem(adres) {
  const a = encodeURIComponent(adres);
  return { lens: `https://lens.google.com/uploadbyurl?url=${a}`, bing: `https://www.bing.com/images/search?view=detailv2&iss=sbi&q=imgurl:${a}`,
    tineye: `https://tineye.com/search?url=${a}` };
}

function prefiksKanalu(kod, test) {
  if (!WZOR_KODU.test(kod || "")) throw new RangeError(`Zły kod sesji: ${kod}`);
  return `${test ? "zi-test" : "zi"}/${kod}`;

function fazyKroku(krok) {
  switch (krok.typ) {
    case "glos": {
      const fazy = ["glosowanie", "wyniki"];
      if (Number.isInteger(krok.poprawna) || krok.odslona) fazy.push("odslona");
      if (krok.dodatek) fazy.push("dodatek");
      return fazy;
    }
    case "suwaki": case "galeria": return ["zbieranie", "wyniki"];
    case "tekst": return ["zbieranie", "sciana"];
    case "stukniecie": return krok.cel ? ["zbieranie", "wyniki", "odslona"] : ["zbieranie", "wyniki"];
    default: return TYPY_DODATKOWE[krok.typ] ? TYPY_DODATKOWE[krok.typ].fazy(krok) : ["pokaz"];
  }
}

const czyZbieranie = (faza) => FAZY_ZBIERANIA.includes(faza);

/* Timer kroku na wejściu: krok z polem czas startuje sam w fazie zbierania; typ timer czeka na Start. */
function timerWejscia(krok, teraz) {
  if (!krok.czas) return null;
  const czasMs = krok.czas * 1000;
  const startuje = krok.typ !== "timer" && czyZbieranie(fazyKroku(krok)[0]);
  return { czasMs, koniec: startuje ? teraz + czasMs : null, zostaloMs: czasMs };
}

/* Stan sesji; przy zajęciach zespołowych z liczbą zespołów (TV i telefony z inną liczbą w adresie przeładowują się, widok.js). */
function nowyStan(teraz, zajecia, jez = "pl") {
  const stan = { v: teraz, krok: 0, faza: "", timer: null, ukryte: {}, pokazane: {}, oceny: {}, qr: false, jez };
  if (zajecia.zespoly) stan.zespoly = zajecia.zespoly.liczba;

function wejdzWKrok(stan, zajecia, indeks, teraz) {
  const krok = zajecia.kroki[indeks];
  return { ...stan, v: nowaWersja(stan, teraz), krok: indeks, faza: fazyKroku(krok)[0], timer: timerWejscia(krok, teraz) };
}

/* Wersja rośnie zawsze, także gdy zegar urządzenia się cofnie. */
const nowaWersja = (stan, teraz) => Math.max(teraz, (stan.v || 0) + 1);

function zmien(stan, teraz, zmiany) {
  return { ...stan, ...zmiany, v: nowaWersja(stan, teraz) };
}

/* Dalej: kolejna faza kroku, a po ostatniej pierwszy etap następnego kroku. Na ostatniej pozycji bez zmian. */
function dalej(stan, zajecia, teraz) {
  const fazy = fazyKroku(zajecia.kroki[stan.krok]);
  const i = fazy.indexOf(stan.faza);
  if (i >= 0 && i < fazy.length - 1) {
    const timer = czyZbieranie(fazy[i + 1]) ? stan.timer : zatrzymajTimer(stan.timer, teraz);
    return zmien(stan, teraz, { faza: fazy[i + 1], timer });
  }
  if (stan.krok >= zajecia.kroki.length - 1) return stan;
  return wejdzWKrok(stan, zajecia, stan.krok + 1, teraz);
}

/* Wstecz: poprzednia faza; z pierwszej fazy do ostatniej fazy poprzedniego kroku. */
function wstecz(stan, zajecia, teraz) {
  const fazy = fazyKroku(zajecia.kroki[stan.krok]);
  const i = fazy.indexOf(stan.faza);
  if (i > 0) return zmien(stan, teraz, { faza: fazy[i - 1] });
  if (stan.krok === 0) return stan;
  const poprzedni = wejdzWKrok(stan, zajecia, stan.krok - 1, teraz);
  const fazyPoprzedniego = fazyKroku(zajecia.kroki[stan.krok - 1]);
  return zmien(poprzedni, teraz, { faza: fazyPoprzedniego[fazyPoprzedniego.length - 1], timer: zatrzymajTimer(poprzedni.timer, teraz) });
}

/* Co zrobi Dalej (tablet podpisuje przycisk): następna faza, następny krok albo koniec. */
function celDalej(stan, zajecia) {
  const fazy = fazyKroku(zajecia.kroki[stan.krok]);
  const i = fazy.indexOf(stan.faza);
  if (i >= 0 && i < fazy.length - 1) return { rodzaj: "faza", faza: fazy[i + 1] };
  return { rodzaj: stan.krok >= zajecia.kroki.length - 1 ? "koniec" : "krok", faza: null };
}

/* Timer: koniec (epoka ms) gdy działa, zostaloMs gdy stoi. */
function zostaloMs(timer, teraz) {
  if (!timer) return null;
  if (timer.koniec === null) return timer.zostaloMs;
  return Math.max(0, timer.koniec - teraz);
}

function uruchomTimer(timer, teraz) {
  if (!timer || timer.koniec !== null) return timer;
  return { ...timer, koniec: teraz + timer.zostaloMs };
}

function zatrzymajTimer(timer, teraz) {
  if (!timer || timer.koniec === null) return timer;
  return { ...timer, koniec: null, zostaloMs: zostaloMs(timer, teraz) };

  if (timer.koniec === null) return { ...timer, zostaloMs: timer.zostaloMs + ms };

/* Język PL/EN na wzór generator-debat/apka/jezyk.js. Interfejs: słownik SLOWNIK (slownik.js) i t(klucz, …argumenty).

   (stan.jez z konsoli prowadzącego) > ?jez= w adresie > polski. Wybór pamięta przeglądarka (w ?test: karta).

const KLUCZ_JEZYKA = "zi-jezyk-v1";
const JEZYKI = ["pl", "en"];

function pamiecJezyka() {
  if (typeof localStorage === "undefined") return null;
  return typeof location !== "undefined" && new URLSearchParams(location.search).has("test") ? sessionStorage : localStorage;
}

function jezykZapisany() {
  try {
    const pamiec = pamiecJezyka();
    const zapisany = pamiec ? pamiec.getItem(KLUCZ_JEZYKA) : null;
    return JEZYKI.includes(zapisany) ? zapisany : null;
  } catch (blad) {
    console.warn("Brak dostępu do pamięci urządzenia", blad);
    return null;
  }
}

let JEZYK = jezykZapisany() || "pl";
let JEZYK_Z_URZADZENIA = true;

function oznaczJezykStrony() {
  if (typeof document !== "undefined") document.documentElement.lang = JEZYK;
}

   (zapamietaj = false), żeby TV otwarty na tym samym komputerze dalej szedł za sesją. */
function ustawJezyk(jezyk, zapamietaj = true) {
  if (!JEZYKI.includes(jezyk)) throw new RangeError(`Nieznany język: ${jezyk}`);
  JEZYK = jezyk;
  if (!zapamietaj) {
    oznaczJezykStrony();
    return;
  }
  try {
    const pamiec = pamiecJezyka();
    if (pamiec) pamiec.setItem(KLUCZ_JEZYKA, jezyk);
  } catch (blad) {
    console.warn("Nie udało się zapamiętać języka", blad);
  }
  oznaczJezykStrony();
}

/* Język sesji albo z adresu: obowiązuje, dopóki ktoś na tym urządzeniu sam nie wybierze. Zwraca true, gdy język się zmienił. */
function jezykDomyslny(jezyk) {
  if ((JEZYK_Z_URZADZENIA && jezykZapisany()) || !JEZYKI.includes(jezyk) || jezyk === JEZYK) return false;
  JEZYK = jezyk;
  oznaczJezykStrony();
  return true;
}

/* Urządzenie bez własnego wyboru (telefon ucznia): język z adresu (?jez), potem z sesji. */
function jezykTylkoZSesji(jezyk) {
  JEZYK_Z_URZADZENIA = false;
  JEZYK = JEZYKI.includes(jezyk) ? jezyk : "pl";
  oznaczJezykStrony();
}

function t(klucz, ...argumenty) {
  const wartosc = SLOWNIK[JEZYK][klucz];
  if (wartosc === undefined) throw new RangeError(`Brak tekstu „${klucz}” (${JEZYK})`);
  return typeof wartosc === "function" ? wartosc(...argumenty) : wartosc;
}

/* Tekst z zajecia.json: {pl, en} w bieżącym języku (brakujący zastępuje drugi) albo napis wspólny dla obu (nazwy źródeł). */
function tx(wartosc) {
  if (!wartosc) return "";
  if (typeof wartosc === "string") return wartosc;
  return wartosc[JEZYK] || wartosc[JEZYK === "pl" ? "en" : "pl"] || "";
}

function przelacznikJezyka(naZmiane, zapamietaj = true) {
  const grupa = el("div", { className: "jez", role: "group" });
  grupa.setAttribute("aria-label", t("jezyk"));
  for (const jezyk of JEZYKI) {
    const przycisk = el("button", { type: "button", textContent: jezyk.toUpperCase() });
    przycisk.setAttribute("aria-pressed", String(JEZYK === jezyk));
    przycisk.addEventListener("click", () => { ustawJezyk(jezyk, zapamietaj); naZmiane(jezyk); });
    grupa.append(przycisk);
  }
  return grupa;
}

oznaczJezykStrony();

/* Zapis na komputerze przy TV: samodzielny plik HTML, zdjęcia przez canvas (bez EXIF, bez GPS), najdłuższy bok 1600 px. */
async function obrazDoZapisu(url) {
  const img = new Image();
  img.src = url;
  await img.decode();
  const skala = Math.min(1, MAKS_BOK_ZAPISU / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.round(img.naturalWidth * skala);
  c.height = Math.round(img.naturalHeight * skala);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.85);
}

const bezpieczny = (s) => String(s).replace(/[&<>"]/g, (z) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[z]));

async function zapiszFotoreportaz(k) {
  const galeria = krokPowiazany(k.zajecia, k.krok.galeria, "galeria_tv");
  const losowanie = krokPowiazany(k.zajecia, k.krok.losowanie, "losowanie");

  const najlepsze = najlepszeZespolow(mapa, wynikSerc(galeria, odpowiedziTelefonow(k.odp, galeria.id), mapa), ile);
  const podpisy = podpisyZespolow(k.krok, odpowiedziTelefonow(k.odp, k.krok.id), ile);
  const tematy = losowanie ? tematyZeStanu(k.stan, losowanie) : null;
  let tresc = "";
  for (const z of Object.keys(najlepsze).map(Number).sort((a, b) => a - b)) {
    const naglowek = [nazwaZespolu(k.zajecia, z), tematy ? tematZespolu(losowanie, tematy, z) : ""].filter(Boolean).join(": ");
    tresc += `<section><h2>${bezpieczny(naglowek)}</h2>`;
    for (const [r, i] of najlepsze[z].entries()) {
      const obraz = await obrazDoZapisu(zdjecia[i].url).catch((b) => { console.warn("Zdjęcie pominięte w pliku", b); return ""; });

    }
    tresc += "</section>";
  }
  const tytul = bezpieczny(tx(k.zajecia.tytul));
  const html = `<!doctype html><html lang="${JEZYK}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${tytul}</title>`
    + "<style>body{margin:0 auto;max-width:960px;padding:24px;font:18px/1.5 system-ui,sans-serif;background:#F2F0EB;color:#16181D}h1{font-size:36px}"
    + "section{margin:32px 0;border-top:4px solid #16181D}figure{margin:16px 0}img{display:block;width:100%;height:auto}figcaption{margin-top:6px}</style></head>"
    + `<body><h1>${tytul}</h1>${tresc}</body></html>`;
  const a = el("a", { href: URL.createObjectURL(new Blob([html], { type: "text/html" })), download: `${k.zajecia.slug}-${new Date().toISOString().slice(0, 10)}.html` });
  document.body.append(a);
  a.click();
  a.remove();
}

/* Wyjazd kroku: pola z JSON (km, dni, noce, kg_pokoj_noc, km_wycieczka) nadpisują domyślne. */
function sladWyjazd(krok) {
  return { ...SLAD_WYJAZD, ...((krok && krok.wyjazd) || {}) };

function sladOdpowiedz(pytanie, odpowiedzi) {
  const wybrana = pytanie.odpowiedzi.find((a) => a.id === odpowiedzi[pytanie.id]);
  if (!wybrana) throw new RangeError(`Brak odpowiedzi na pytanie: ${pytanie.id}`);
  return wybrana;
}

const sladKomplet = (odpowiedzi) => SLAD_PYTANIA.every((p) => p.odpowiedzi.some((a) => a.id === (odpowiedzi || {})[p.id]));

// Prysznic, klimatyzacja i światło to odchylenia od średniej zawartej w noclegu, więc mogą być ujemne.
function sladOblicz(odpowiedzi, wyjazd = SLAD_WYJAZD) {
  const w = Object.fromEntries(SLAD_PYTANIA.map((p) => [p.id, sladOdpowiedz(p, odpowiedzi).wartosc]));
  const nocnyPrad = (kw, godziny, srednio) => ((godziny - srednio) * kw * SLAD.KG_KWH_GRECJA * wyjazd.noce) / w.pokoj;
  const jedzenie = w.mieso * wyjazd.dni;
  const czesci = {
    przejazd: 2 * wyjazd.km * SLAD.KG_KM_AUTOKAR,
    nocleg: (wyjazd.kg_pokoj_noc * wyjazd.noce) / w.pokoj,
    prysznic: (w.prysznic - SLAD.MINUT_PRYSZNIC_SREDNIO) * SLAD.KG_MINUTA_PRYSZNICA * wyjazd.noce,
    klima: nocnyPrad(SLAD.KW_KLIMATYZACJA, w.klima, SLAD.GODZIN_KLIMATYZACJA_SREDNIO),
    swiatlo: nocnyPrad(SLAD.KW_SWIATLO_I_LADOWARKI, w.swiatlo, SLAD.GODZIN_ZOSTAWIONE_SREDNIO),
    jedzenie,
    resztki: jedzenie * w.resztki,
    woda: w.butelki * SLAD.KG_BUTELKA * wyjazd.dni,
    wycieczki: w.wycieczki * wyjazd.km_wycieczka * SLAD.KG_KM_AUTOKAR,

  const suma = Object.values(czesci).reduce((a, b) => a + b, 0);
  return { suma, czesci };
}

// Największe reszty: pokazane całe kilogramy dają dokładnie zaokrągloną sumę, bo uczeń może je dodać na kartce.
function sladZaokraglDoSumy(wartosciKg, suma) {
  const wynik = wartosciKg.map(Math.floor);

  const kolejnosc = wartosciKg.map((v, i) => [v - wynik[i], i]).sort((a, b) => b[0] - a[0]);
  kolejnosc.slice(0, brakuje).forEach(([, i]) => { wynik[i] += 1; });
