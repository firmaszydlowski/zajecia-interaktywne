  const rady = sladPodpowiedzi(odpowiedzi, wyjazd);
  return el("div", { className: "u-karta" }, el("h3", { textContent: t("kalkRady") }), el("p", { className: "u-info", textContent: t("kalkRadyOpis") }),
    el("ul", { className: "u-kalk-rady" }, ...rady.map((r) => el("li", {}, el("span", { textContent: tx(r.rada) }), el("b", { className: "num", textContent: oszczednoscTekst(r.oszczednosc) })))),
    rady.length < SLAD_LIMIT_PODPOWIEDZI ? el("p", { className: "u-info", textContent: t("kalkMalo") }) : null,
    rady.some((r) => r.pytanie === "butelki") ? el("p", { className: "u-info", textContent: t("kalkWoda") }) : null);
}

function jakLiczymyKalk(wyjazd) {
  return el("details", { className: "u-kalk-jak" }, el("summary", { textContent: t("kalkJak") }),
    el("ul", {}, ...t("kalkJakLista", wyjazd, SLAD).map((z) => el("li", { textContent: z }))), zrodlaEl(KALK_ZRODLA, "u-zrodla"));
}

function kartaWynikuKalk(kg, czesci, wyjazd, tytul) {
  return el("div", { className: "u-karta" }, el("h3", { textContent: tytul }),
    el("p", { className: "u-kalk-kg num" }, String(kg), el("small", { textContent: ` ${t("kalkZaPobyt")}` })),
    el("p", { className: "u-info", textContent: t("kalkZCzego") }), paskiKalk(czesci, "u-kalk-paski", "kalk_cz_"),
    el("p", { className: "u-info", textContent: t("kalkPrzejazdOpis", wyjazd.km) }));
}

/* Wynik z odpowiedzi na tym telefonie: liczba, części, rady, drzewa, wysyłka do grupy (raz). odNowa czyści odpowiedzi i rysuje pytania
   od początku; po wysłaniu odpowiedzi są zablokowane, a „Policz od nowa” znika. */
function wynikKalkEl(u, odpowiedzi, wyjazd, odNowa) {
  const dane = kalkDane(odpowiedzi, wyjazd);
  const wyslany = Boolean(u.moja);
  const wyslij = el("button", { type: "button", className: "k1-btn-gl u-glowny", textContent: t("kalkWyslij"), hidden: wyslany });
  wyslij.addEventListener("click", () => u.wyslij(dane));
  const odNowaPrzycisk = el("button", { type: "button", className: "k1-btn", textContent: t("kalkOdNowa"), hidden: wyslany });
  odNowaPrzycisk.addEventListener("click", odNowa);
  return [kartaWynikuKalk(dane.kg, dane.c, wyjazd, t("kalkTwoj")),
    el("p", { className: "u-info", textContent: t("kalkDrzewa", sladIleDrzew(dane.kg), SLAD.KG_DRZEWO_ROK) }),
    radyKalk(odpowiedzi, wyjazd), wyslany ? potwierdzenie(t("kalkWyslane")) : el("p", { className: "u-info", textContent: t("kalkWyslijOpis") }),
    wyslij, el("div", { className: "k1-akcje" }, odNowaPrzycisk), jakLiczymyKalk(wyjazd)];
}

function pytanieKalkEl(p, i, odpowiedzi, naZmiane, zablokowane) {
  const przyciski = p.odpowiedzi.map((a) => {
    const b = el("button", { type: "button", textContent: tx(a.tekst), disabled: zablokowane });
    b.setAttribute("aria-pressed", String(odpowiedzi[p.id] === a.id));
    b.addEventListener("click", () => {
      odpowiedzi[p.id] = a.id;
      for (const inny of przyciski) inny.setAttribute("aria-pressed", String(inny === b));
      naZmiane();
    });
    return b;
  });
  return el("div", { className: "u-kalk-pyt" }, el("h3", { textContent: `${i + 1}. ${tx(p.pytanie)}` }),
    p.podpowiedz ? el("p", { className: "u-info", textContent: tx(p.podpowiedz) }) : null, el("div", { className: "u-kalk-odp" }, ...przyciski));
}

/* Zbieranie: pytania, pod nimi licznik i (gdy komplet) wynik. Kliknięcie odpowiedzi odświeża tylko licznik i wynik, bez przerysowania pytań. */
function kalkulatorTel(u, odpowiedzi, wyjazd) {
  const kontener = el("div", { className: "u-kalk" });
  const rysuj = () => {
    const postep = el("p", { className: "u-kalk-postep num" });
    const wynik = el("div", { className: "u-kalk-dol" });
    const odNowa = () => { for (const klucz of Object.keys(odpowiedzi)) delete odpowiedzi[klucz]; rysuj(); };
    const odswiezWynik = () => {
      postep.textContent = t("kalkPostep", SLAD_PYTANIA.filter((p) => odpowiedzi[p.id]).length, SLAD_PYTANIA.length);
      wstaw(wynik, ...(sladKomplet(odpowiedzi) ? wynikKalkEl(u, odpowiedzi, wyjazd, odNowa) : []));
    };
    wstaw(kontener, el("p", { className: "u-info", textContent: t("kalkWstep", SLAD_PYTANIA.length) }), el("p", { className: "u-info", textContent: t("kalkCo2e") }),
      ...SLAD_PYTANIA.map((p, i) => pytanieKalkEl(p, i, odpowiedzi, odswiezWynik, Boolean(u.moja))), postep, wynik);
    odswiezWynik();
  };
  rysuj();
  return kontener;
}

function uKalkulator(u) {
  const k = u.krok;
  const wyjazd = sladWyjazd(k);
  /* Podgląd (podglad.html) pokazuje kalkulator wypełniony typowymi odpowiedziami, żeby było widać ekran wyniku. */
  if (!KALK_ODPOWIEDZI[k.id]) KALK_ODPOWIEDZI[k.id] = typeof ODP_PODGLADU !== "undefined" ? { ...KALK_TYPOWE } : {};
  const odpowiedzi = KALK_ODPOWIEDZI[k.id];
  const naglowek = el("h2", { className: "u-pyt", textContent: tx(k.pytanie) });
  /* Wynik wysłany wcześniej, a telefon nie pamięta odpowiedzi (np. po odświeżeniu): sama karta wyniku. */
  if (u.faza === "zbieranie" && u.moja && !sladKomplet(odpowiedzi) && dobryWynikKalk(u.moja)) {
    return uRama(u, naglowek, kartaWynikuKalk(u.moja.kg, u.moja.c, wyjazd, t("kalkTwoj")), potwierdzenie(t("kalkWyslane")));
  }
  if (u.faza === "zbieranie") return uRama(u, naglowek, kalkulatorTel(u, odpowiedzi, wyjazd));
  const wlasny = sladKomplet(odpowiedzi) ? kalkDane(odpowiedzi, wyjazd) : dobryWynikKalk(u.moja) ? u.moja : null;
  return uRama(u, naglowek, wlasny ? kartaWynikuKalk(wlasny.kg, wlasny.c, wyjazd, t("kalkTwoj")) : el("p", { className: "u-info", textContent: t("kalkBrakWyniku") }),
    naEkranie(t("kalkSredniaNaEkranie")));
}

/* Typ kroku „wybor”: wybór z listy dłuższej niż 4 opcje (np. 12 obietnic), 1 albo kilka pozycji (ile), opcjonalnie losowanie i własny wpis.
   Pozycja: { tekst, znacznik (np. wartość w rok), wyjasnienie, zrodla }. Odpowiedź telefonu: { s: [numery pozycji] } albo { s: [], w: "własny wpis" }.
   Głos na zespoły: z_kroku = id kroku „tekst”; pozycjami są zespoły, a TV pokazuje ich pierwsze pole (np. tytuł). Na swój zespół się nie głosuje.
   pokaz_wybory = id innego kroku „wybor”: w zbieraniu TV pokazuje, ile osób wybrało każdą pozycję tam. Fazy: zbieranie, wyniki, sciana (gdy wlasna).
   Plik dokłada się do TYPY_DODATKOWE (logika.js) i do słownika. Format: README.md, „wybor”. */
const NA_TV_WYBORU = { ranking: 5, sciana: 6, lista: 6 };
const SZANSA_WLASNEJ = 0.2;

const limitWyboru = (krok) => krok.ile || 1;

/* Liczba pozycji: pozycje z JSON albo zespoły (głos na zespoły). */
const ilePozycji = (krok, zajecia) => (krok.z_kroku ? zajecia.zespoly.liczba : krok.pozycje.length);

function wybraneWyboru(krok, d, n) {
  const surowe = d && Array.isArray(d.s) ? d.s : [];
  return [...new Set(surowe.filter((i) => Number.isInteger(i) && i >= 0 && i < n))].slice(0, limitWyboru(krok));
}

const wlasnyWpis = (krok, d) => (krok.wlasna && d && typeof d.w === "string" && d.w.trim() ? d.w.trim().slice(0, krok.wlasna.maks || 80) : "");

/* liczby: ile razy wybrano każdą pozycję; ranking: numery pozycji malejąco (remis: kolejność z listy); wlasne: wpisy z id do ukrywania. */
function wynikWyboru(krok, lista, n = krok.pozycje.length, stan = {}) {
  const liczby = Array.from({ length: n }, () => 0);
  let glosujacych = 0;
  const wlasne = [];
  for (const d of lista) {
    const wybrane = wybraneWyboru(krok, d, n);
    const wlasny = wlasnyWpis(krok, d);
    if (wybrane.length || wlasny) glosujacych += 1;
    for (const i of wybrane) liczby[i] += 1;
    if (wlasny) {
      const id = `${krok.id}/${d.urz}`;
      wlasne.push({ id, urz: d.urz, z: d.z, t: d.t || 0, tekst: wlasny, ukryty: Boolean((stan.ukryte || {})[id]) });
    }
  }
  const ranking = liczby.map((ile, i) => ({ i, ile })).sort((a, b) => b.ile - a.ile || a.i - b.i);
  wlasne.sort((a, b) => a.t - b.t || (a.urz < b.urz ? -1 : 1));
  return { liczby, ranking, glosujacych, wlasne };
}

function symulujWybor(krok, los) {
  const przyklady = krok.przyklady || [];
  if (krok.wlasna && przyklady.length && los() < SZANSA_WLASNEJ) return { s: [], w: przyklady[Math.floor(los() * przyklady.length)] };
  /* Głos na zespoły: liczba zespołów z zajęć na stronie (ZAJECIA wstawia zbuduj.py). */
  const n = krok.z_kroku ? (typeof ZAJECIA !== "undefined" && ZAJECIA.zespoly ? ZAJECIA.zespoly.liczba : 2) : krok.pozycje.length;
  const wybrane = new Set();
  while (wybrane.size < Math.min(limitWyboru(krok), n)) wybrane.add(Math.floor(los() * n));
  return { s: [...wybrane] };
}

/* Tytuły zespołów z kroku „tekst” (pierwsze pole najnowszego widocznego wpisu): { <zespół>: tekst }. */
function tytulyZespolow(zajecia, krok, odp, stan) {
  const zrodlo = zajecia.kroki.find((x) => x.id === krok.z_kroku);
  const tytuly = {};
  for (const w of wpisyTekstu(zrodlo, odpowiedziKroku(odp, zrodlo.id), stan)) if (w.z && w.teksty[0]) tytuly[w.z] = w.teksty[0];
  return tytuly;
}

/* Nazwa pozycji do wyświetlenia: tekst z JSON albo „Zespół N: tytuł”. */
function nazwaPozycji(zajecia, krok, i, tytuly = {}) {
  if (!krok.z_kroku) return tx(krok.pozycje[i].tekst);
  return tytuly[i + 1] ? `${nazwaZespolu(zajecia, i + 1)}: ${tytuly[i + 1]}` : nazwaZespolu(zajecia, i + 1);
}

/* Typ kroku „mapa”: mapa różnic. Przy każdej pozycji (np. problem przyrody) uczeń ustawia 2 suwaki, po jednym na stronę (np. Grecja i Polska).
   Odpowiedź telefonu: { w: [[strona 1, strona 2], …] } (lista na pozycję). TV w wynikach: średnie obu stron i podpis różnicy.
   Podpis: różnica od MAPA_PROG = „więcej” strony z wyższą średnią (pole wiecej w JSON), mniejsza i obie średnie od MAPA_POWAZNY = „wspólny”,
   mniejsza przy niższych = „podobny”. Z polem przydzial (wymaga zespołów) faza „przydzial”: pozycje z największą różnicą dla zespołów.
   Plik dokłada się do TYPY_DODATKOWE (logika.js) i do słownika. Format: README.md, „mapa”. */
const MAPA_PROG = 1;
const MAPA_POWAZNY = 3;

const zakresMapy = (krok) => ({ min: krok.min ?? 1, max: krok.max ?? 5 });

function wartosciMapy(krok, d, r) {
  const { min, max } = zakresMapy(krok);
  const para = d && Array.isArray(d.w) && Array.isArray(d.w[r]) ? d.w[r] : [];
  return [0, 1].map((s) => (typeof para[s] === "number" && para[s] >= min && para[s] <= max ? para[s] : null));
}

const sredniaMapy = (liczby) => (liczby.length ? Math.round((liczby.reduce((a, b) => a + b, 0) / liczby.length) * 10) / 10 : null);

/* Na pozycję: średnie obu stron, różnica (strona 1 minus strona 2) i rodzaj: „wiecej0”, „wiecej1”, „wspolny”, „podobny” albo null. */
function wynikMapy(krok, lista) {
  const odpowiedzi = lista.filter((d) => krok.pozycje.some((_, r) => wartosciMapy(krok, d, r).some((v) => v !== null)));
  const pozycje = krok.pozycje.map((_, r) => {
    const [a, b] = [0, 1].map((s) => sredniaMapy(odpowiedzi.map((d) => wartosciMapy(krok, d, r)[s]).filter((v) => v !== null)));
    if (a === null || b === null) return { a, b, roznica: null, rodzaj: null };
    const roznica = Math.round((a - b) * 10) / 10;
    const rodzaj = Math.abs(roznica) >= MAPA_PROG ? (roznica > 0 ? "wiecej0" : "wiecej1") : Math.min(a, b) >= MAPA_POWAZNY ? "wspolny" : "podobny";
    return { a, b, roznica, rodzaj };
  });
  return { ile: odpowiedzi.length, pozycje };
}

/* Przydział: tyle pozycji o największej różnicy, ile par zespołów (zaokrąglone w górę); zespoły po kolei, po 2 na pozycję. */
function przydzialMapy(w, liczbaZespolow) {
  const kolejnosc = w.pozycje.map((p, r) => ({ r, d: p.roznica === null ? -1 : Math.abs(p.roznica) })).filter((x) => x.d >= 0)
    .sort((x, y) => y.d - x.d || x.r - y.r);
  const ile = Math.min(kolejnosc.length, Math.ceil(liczbaZespolow / 2));
  const grupy = kolejnosc.slice(0, ile).map((x) => ({ r: x.r, roznica: x.d, zespoly: [] }));
  if (!grupy.length) return [];
  for (let z = 1; z <= liczbaZespolow; z++) grupy[Math.floor(((z - 1) * ile) / liczbaZespolow)].zespoly.push(z);
  return grupy;
}

function symulujMape(krok, los) {
  const { min, max } = zakresMapy(krok);
  const rozpietosc = max - min;
  /* Każda pozycja ma swoje stałe przesunięcie, żeby podgląd pokazał różne rodzaje różnic. */
  return { w: krok.pozycje.map((_, r) => [0, 1].map((s) => {
    const srodek = min + rozpietosc * (((r * 3 + s * 5) % 7) / 6);
    return Math.max(min, Math.min(max, Math.round(srodek + (los() - 0.5) * 2)));
  })) };
}

const liczbaMapy = (x) => (x === null ? t("brak") : JEZYK === "pl" ? String(x.toFixed(1)).replace(".", ",") : x.toFixed(1));

function opisRodzaju(krok, rodzaj) {
  if (rodzaj === "wiecej0") return tx(krok.strony[0].wiecej);
  if (rodzaj === "wiecej1") return tx(krok.strony[1].wiecej);
  return rodzaj ? t(rodzaj === "wspolny" ? "mapaWspolny" : "mapaPodobny") : "";
}

  return el("span", { className: "tv-mapa-st" }, el("span", { className: "kalk-pasek" }, wypelnienie), el("b", { className: "num", textContent: liczbaMapy(wartosc) }));

function tabelaMapy(krok, w) {

function tvMapa(k) {

  }
  if (k.faza === "przydzial") return tvRama(k, null, el("div", { className: "tv-kolumna" }, ...tvPrzydzial(k, w)));

/* podglad.html: wszystkie ekrany zajęć (TV, telefon, tablet) w każdej fazie, z symulowanymi odpowiedziami i podpisami.
   Rysuje tymi samymi funkcjami co strony na żywo. Przełącznik PL/EN (albo ?jez=en) przerysowuje całość w drugim języku.
   Ekran TV, na którym tekst się nie mieści, dostaje czerwone ostrzeżenie; liczba trafia do body[data-przepelnienia]. */
const KOD_PODGLADU = "acd347";
const TERAZ_PODGLADU = Date.UTC(2026, 0, 1, 9, 0, 0);
const ODP_PODGLADU = symulujZajecia(ZAJECIA, 7);
const BEZ_AKCJI = new Proxy({}, { get: () => () => {} });

const adresPodgladu = () => adresUczniow({ baza: poprawnaBaza(USTAWIENIA.adres_uczniow), slug: ZAJECIA.slug, kod: KOD_PODGLADU, test: null, biezacy: location.href });

/* Stan sesji do podglądu: timer zatrzymany na 0:24 w fazach zbierania, ściana z oceną dwóch pierwszych wpisów. */
function stanPodgladu(krok, indeks, faza) {
  const timer = krok.czas && (czyZbieranie(faza) || krok.typ === "timer")
    ? { czasMs: krok.czas * 1000, koniec: null, zostaloMs: Math.min(krok.czas * 1000, 24000) } : null;
  const wpisy = Object.keys(ODP_PODGLADU[krok.id] || {}).map((urz) => `${krok.id}/${urz}`);
  const pokazane = krok.moderacja ? Object.fromEntries(wpisy.slice(1).map((id) => [id, true])) : {};
  const oceny = krok.ocena ? { [wpisy[0]]: "dobrze", [wpisy[1]]: "popraw" } : {};
  return { v: 1, krok: indeks, faza, timer, ukryte: {}, pokazane, oceny, qr: false, jez: JEZYK, dodatki: dodatkiPodgladu() };
}

/* stan.dodatki do podglądu: typy z osobnych plików mogą podać przykładowe dane kroku (np. wylosowane tematy). */
function dodatkiPodgladu() {
  return Object.fromEntries(ZAJECIA.kroki.filter((k) => TYPY_DODATKOWE[k.typ] && TYPY_DODATKOWE[k.typ].podglad)
    .map((k) => [k.id, TYPY_DODATKOWE[k.typ].podglad(k, ZAJECIA)]));
}

function moja(krok) {
  const d = (ODP_PODGLADU[krok.id] || {})["sym-1"];
  if (!d) return null;
  const { z, t: _czas, ...dane } = d;
  return dane;
}

const podpis = (tekst) => el("figcaption", { textContent: tekst });
const symulowane = (krok, faza) => (["info", "timer"].includes(krok.typ) || (krok.typ === "glos" && faza === "dodatek") ? "" : t("pgSym"));

function ramkaTv(wezly, tekst) {
  return el("figure", { className: "pg-ramka" }, el("div", { className: "pg-tv" }, ...wezly), podpis(tekst));
}

function ramkaTelefonu(wezel, tekst) {
  const strona = el("div", { className: "u-strona" }, el("header", { className: "u-pasek" }, el("b", { textContent: tx(ZAJECIA.tytul) })), wezel);
  return el("figure", { className: "pg-ramka" }, el("div", { className: "pg-tel k1-ciemny" }, strona), podpis(tekst));
}

function wierszFazy(krok, indeks, faza) {
  const stan = stanPodgladu(krok, indeks, faza);
  const kontekst = { zajecia: ZAJECIA, indeks, krok, faza, odp: ODP_PODGLADU, stan, teraz: TERAZ_PODGLADU, adres: adresPodgladu(), kod: KOD_PODGLADU };
  const tel = ekranUcznia({ ...kontekst, moja: czyZbieranie(faza) && indeks % 2 ? null : moja(krok), zespol: ZAJECIA.zespoly ? 1 : null, urz: "sym-1", wyslij: () => {} });
  return el("div", { className: "pg-wiersz" },
    ramkaTv(ekranTv(kontekst), t("pgTv", nazwaFazy(faza)) + symulowane(krok, faza)),
    ramkaTelefonu(tel, t("pgTel", nazwaFazy(faza))));
}

function ramkaTabletu(krok, indeks) {
  const fazy = fazyKroku(krok);
  const stan = stanPodgladu(krok, indeks, fazy[Math.min(1, fazy.length - 1)]);
  const widok = widokTabletu({ zajecia: ZAJECIA, stan, odp: ODP_PODGLADU, obecni: { a: 1, b: 1 }, teraz: TERAZ_PODGLADU, kod: KOD_PODGLADU,
    status: { polaczone: 2, wszystkie: 2 }, test: null, adresTv: "tv.html", dropbox: USTAWIENIA.dropbox, dzwiek: false, akcje: BEZ_AKCJI });
  return el("figure", { className: "pg-ramka" }, el("div", { className: "pg-tablet k1-ciemny" }, widok), podpis(t("pgTablet", nazwaFazy(stan.faza))));
}

function sekcjaKroku(krok, indeks) {
  return el("section", { className: "pg-krok", id: `krok-${indeks + 1}` },
    el("h2", { textContent: `${indeks + 1}. ${tx(krok.tytul) || tx(krok.naglowek) || tx(krok.pytanie)}` }),
    el("p", { className: "k1-meta", textContent: `${nazwaTypu(krok.typ)} · ${t("pgFazy", fazyKroku(krok).map((f) => nazwaFazy(f).toLowerCase()).join(", "))}` }),
    ...fazyKroku(krok).map((f) => wierszFazy(krok, indeks, f)), ramkaTabletu(krok, indeks));
}

function sekcjaStartu() {
  const pierwszy = ZAJECIA.kroki[0];
  const stanQr = { ...stanPodgladu(pierwszy, 0, fazyKroku(pierwszy)[0]), qr: true };
  const kontekstQr = { zajecia: ZAJECIA, indeks: 0, krok: pierwszy, faza: stanQr.faza, odp: {}, stan: stanQr, teraz: TERAZ_PODGLADU, adres: adresPodgladu(), kod: KOD_PODGLADU };
  const czekanie = el("section", { className: "u-ekran" }, el("h2", { textContent: tx(ZAJECIA.tytul) }), el("p", { className: "u-info", textContent: t("czekamy") }));
  return el("section", { className: "pg-krok", id: "start" }, el("h2", { textContent: t("pgStart") }),
    el("div", { className: "pg-wiersz" }, ramkaTv([ekranTvStart(ZAJECIA, adresPodgladu(), KOD_PODGLADU)], t("pgTvStart")),
      ZAJECIA.zespoly ? ramkaTelefonu(ekranZespolu(ZAJECIA, () => {}), t("pgTelZespol")) : ramkaTelefonu(czekanie, t("pgTelStart"))),
    el("div", { className: "pg-wiersz" }, ramkaTv(ekranTv(kontekstQr), t("pgTvQr"))));
}

function oznaczPrzepelnienia() {
  let ile = 0;
  for (const ekran of document.querySelectorAll(".pg-tv .tv-ekran")) {
    dopasujEkran(ekran);
    if (!ekran.dataset.przepelnienie) continue;
    ile += 1;
    ekran.closest(".pg-ramka").append(el("p", { className: "pg-blad", textContent: t("pgBlad") }));
  }
  const licznik = document.getElementById("pg-przepelnienia");
  licznik.textContent = ile ? t("pgPrzepelnienia", ile) : t("pgMieszcza");
  licznik.className = ile ? "pg-blad" : "k1-meta";
  document.body.dataset.przepelnienia = String(ile);
}

function rysujPodglad() {
  const spis = el("nav", { className: "pg-spis" }, el("a", { href: "#start", textContent: "Start" }),
    ...ZAJECIA.kroki.map((k, i) => el("a", { href: `#krok-${i + 1}`, textContent: String(i + 1) })));
  wstaw(document.getElementById("podglad"),
    el("header", { className: "pg-glowa" }, przelacznikJezyka(rysujPodglad), el("h1", { textContent: t("pgTytul", tx(ZAJECIA.tytul)) }),
      el("p", { textContent: t("pgOpis") }), el("p", { id: "pg-przepelnienia" }), spis),
    sekcjaStartu(), ...ZAJECIA.kroki.map(sekcjaKroku));
  document.body.dataset.jezyk = JEZYK;
  delete document.body.dataset.przepelnienia;
  requestAnimationFrame(() => setTimeout(oznaczPrzepelnienia, 50));
}

jezykDomyslny(parametryAdresu(location.search).jez);
