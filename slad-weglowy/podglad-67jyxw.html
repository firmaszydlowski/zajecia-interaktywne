/* Tłumaczenie wspólne dla silnika zajęć, quizu i kalkulatora: słownik {pl: {…}, en: {…}}, wartość to napis albo funkcja; pola treści {pl, en}.
   Stan języka (kto wybiera, co pamięta urządzenie) każda apka trzyma we własnym jezyk.js, bo zasady są różne: w silniku konsola
   prowadzącego ustawia język sesji bez zapamiętywania, w quizie tablet nie ma własnego wyboru, w kalkulatorze telefon idzie zawsze za sesją.
   Poza grupaJezykow bez DOM. Testy: test_tlumacz.js. */
const JEZYKI = ["pl", "en"];

function tlumacz(slownik, jezyk, klucz, ...argumenty) {
  const wartosc = slownik[jezyk] && slownik[jezyk][klucz];
  if (wartosc === undefined) throw new RangeError(`Brak tekstu „${klucz}” (${jezyk})`);
  return typeof wartosc === "function" ? wartosc(...argumenty) : wartosc;
}

/* Pole {pl, en} w danym języku; brakujący język zastępuje drugi. Napis zostaje napisem (autor, licencja, nazwy źródeł). */
function tekstWJezyku(pole, jezyk) {
  if (pole === null || pole === undefined) return "";
  if (typeof pole === "string") return pole;
  return pole[jezyk] || pole[jezyk === "pl" ? "en" : "pl"] || "";
}

function czyJezyk(jezyk) {
  return JEZYKI.includes(jezyk);
}

/* Klucze, których brakuje w którymś języku albo mają w językach inny typ. Pusta lista = słownik kompletny. */
function brakiSlownika(slownik) {
  const klucze = new Set(JEZYKI.flatMap((j) => Object.keys(slownik[j] || {})));
  return [...klucze].filter((k) => JEZYKI.some((j) => !slownik[j] || slownik[j][k] === undefined
    || typeof slownik[j][k] !== typeof slownik.pl[k] || slownik[j][k] === ""));
}

/* Słownik strony: wspólny plus własny; ten sam klucz w obu to błąd (łatwo nadpisać tekst przez pomyłkę). */
function polaczSlowniki(...slowniki) {
  const wynik = { pl: {}, en: {} };
  for (const s of slowniki) {
    for (const j of JEZYKI) {
      for (const [k, v] of Object.entries(s[j])) {
        if (k in wynik[j]) throw new RangeError(`Klucz „${k}” jest w dwóch słownikach`);
        wynik[j][k] = v;
      }
    }
  }
  return wynik;
}

/* Przełącznik PL/EN: przyciski z aria-pressed przy aktywnym języku. naWybor(jezyk) robi resztę (zapis wyboru albo zmiana języka sesji).
   Potrzebuje el() z lacze.js i etykiety „jezyk” w słowniku strony (t). */
function grupaJezykow(aktywny, naWybor) {
  const grupa = el("div", { className: "jez", role: "group" });
  grupa.setAttribute("aria-label", t("jezyk"));
  for (const jezyk of JEZYKI) {
    const przycisk = el("button", { type: "button", textContent: jezyk.toUpperCase(), lang: jezyk });
    przycisk.setAttribute("aria-pressed", String(aktywny === jezyk));
    przycisk.addEventListener("click", () => naWybor(jezyk));
    grupa.append(przycisk);
  }
  return grupa;
}

  c.width = Math.round(img.naturalWidth * skala);
  c.height = Math.round(img.naturalHeight * skala);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.85);
}

   typ_przerobki_zespolow.js. */
const MOJE_ZDJECIA = {};
const POLA_ZDJEC = {};

const laczeZdjec = () => typeof zdjecieOdebrane === "function" && typeof sesja !== "undefined";

/* Wysłane zdjęcia tego telefonu w kroku: [{f, n, stan: "wysylanie" | "wyslane" | "blad" | "format"}], zapamiętane na wypadek odświeżenia strony. */
function mojeZdjecia(krokId) {
  if (!MOJE_ZDJECIA[krokId]) MOJE_ZDJECIA[krokId] = laczeZdjec() ? czytajPamiec(kluczMoichZdjec(krokId), []).map((x) => ({ ...x, stan: "wyslane" })) : [];

function zapiszMojeZdjecia(krokId) {
  zapiszPamiec(kluczMoichZdjec(krokId), mojeZdjecia(krokId).filter((x) => x.stan === "wyslane").map(({ f, n, s }) => ({ f, n, ...(s ? { s } : {}) })));

/* Nieudane wysyłki nie zajmują miejsca w limicie zespołu. */
const zajeteMiejsca = (lista) => lista.filter((x) => !STANY_BLEDU_ZDJECIA.includes(x.stan)).length;

/* Pole wyboru zdjęć leży poza ekranem telefonu, który się przerysowuje, więc okno wyboru nie ginie przy nowej wiadomości. */
function poleZdjecTelefonu(id, wiele, naPliki) {
  POLA_ZDJEC[id] = naPliki;
  if (!document.getElementById(id)) {
    const pole = el("input", { type: "file", accept: "image/*", multiple: wiele, id, className: "tv-plik" });

const kluczPokazanych = (krokId) => `${krokId}~zdj`;

function pokazaneZdjecia(stan, krokId) {
  const d = ((stan && stan.dodatki) || {})[kluczPokazanych(krokId)];
  return new Set(d && Array.isArray(d.f) ? d.f.filter((f) => typeof f === "string") : []);

const czyPokazaneZdjecie = (stan, krokId, f) => pokazaneZdjecia(stan, krokId).has(f);

function zmienPokazane(p, krokId, f, pokaz) {
  const zbior = pokazaneZdjecia(p.stan, krokId);
  if (pokaz) zbior.add(f);
  else zbior.delete(f);
  p.akcje.dodatek(kluczPokazanych(krokId), { f: [...zbior] });

/* Wszystkie zdjęcia z telefonów w kroku: [{z, f, n}] po zespołach (1…liczba), w zespole w kolejności wysłania, bez powtórek. */
function zdjeciaSpisow(odp, krokId, liczba) {
  const widziane = new Set();
  return spisyKroku(odp, krokId).flatMap((s) => s.zd.map((x) => ({ z: s.z, f: x.f, n: x.n })))
    .filter((x) => x.z >= 1 && x.z <= liczba && !widziane.has(x.f) && widziane.add(x.f)).sort((a, b) => a.z - b.z);
}

function kartaModeracji(p, krokId, x, pokazane) {
  const o = zdjecieOdebrane(krokId, x.f, x.n, x.z);

  const akcja = pokazane ? przycisk(t("ukryj"), () => zmienPokazane(p, krokId, x.f, false))
    : przycisk(t("pokaz"), () => zmienPokazane(p, krokId, x.f, true), "k1-btn pelny", !o.url);
  return el("li", { className: pokazane ? "pokazane" : "" }, podglad, el("b", { textContent: nazwaZespolu(p.zajecia, x.z) }), el("div", { className: "k1-akcje" }, akcja));
}

/* Konsola: miniatura każdego zdjęcia z telefonów i „Pokaż” / „Ukryj”. Poza łączem (podgląd) nic. */
function moderacjaZdjec(p, krokId) {
  if (!laczeZdjec()) return [];
  const zdjecia = zdjeciaSpisow(p.odp, krokId, liczbaZespolow(p.zajecia));

/* Wysyłka po kolei; po każdym zdjęciu nowy spis telefonu (odp/<krok>~z/<telefon>). Nieudane wpisy z poprzedniej próby znikają z listy. */
async function wyslijZdjeciaGalerii(u, pliki) {
  const lista = mojeZdjecia(u.krok.id);
  lista.splice(0, lista.length, ...lista.filter((x) => !STANY_BLEDU_ZDJECIA.includes(x.stan)));
  const wolne = Math.max(0, (u.krok.na_zespol || DOMYSLNIE_NA_ZESPOL) - zajeteMiejsca(lista));
  for (const plik of pliki.slice(0, wolne)) {
    const wpis = { stan: "wysylanie" };
    lista.push(wpis);
    odswiezWidokZdjec();
    try {
      Object.assign(wpis, await wyslijZdjecie(u.krok.id, plik, u.zespol || 0), { stan: "wyslane" });
      zapiszMojeZdjecia(u.krok.id);
      await opublikujSpis(u.krok.id, u.urz, u.zespol || 0, lista.filter((x) => x.stan === "wyslane").map(({ f, n }) => ({ f, n })));
    } catch (blad) {
      wpis.stan = stanPoBledzie(blad);
      console.warn("Zdjęcie nie wysłane", blad);
    }
    odswiezWidokZdjec();
  }

   Głos na zespoły: z_kroku = id kroku „tekst”; pozycjami są zespoły, a TV pokazuje ich pierwsze pole (np. tytuł). Na swój zespół się nie głosuje.

   Plik dokłada się do TYPY_DODATKOWE (logika.js) i do słownika. Format: README.md, „wybor”. */
const NA_TV_WYBORU = { ranking: 5, sciana: 6, lista: 6 };
const SZANSA_WLASNEJ = 0.2;

const limitWyboru = (krok) => krok.ile || 1;

/* Liczba pozycji: pozycje z JSON albo zespoły (głos na zespoły). */
const ilePozycji = (krok, zajecia) => (krok.z_kroku ? zajecia.zespoly.liczba : krok.pozycje.length);

/* Wybrane pozycje telefonu; w głosie na zespoły bez głosu na własny zespół (przyciski go nie mają, ale wiadomość mogłaby). */
function wybraneWyboru(krok, d, n) {
  const surowe = d && Array.isArray(d.s) ? d.s : [];
  const wlasny = (i) => Boolean(krok.z_kroku) && d.z === i + 1;
  return [...new Set(surowe.filter((i) => Number.isInteger(i) && i >= 0 && i < n && !wlasny(i)))].slice(0, limitWyboru(krok));
}

const wlasnyWpis = (krok, d) => (krok.wlasna && d && typeof d.w === "string" && d.w.trim() ? d.w.trim().slice(0, krok.wlasna.maks || 80) : "");

/* liczby: ile razy wybrano każdą pozycję; ranking: numery pozycji malejąco (remis: kolejność z listy); wlasne: wpisy z id do ukrywania. */
function wynikWyboru(krok, lista, n = krok.pozycje.length, stan = {}) {
  const liczby = Array.from({ length: n }, () => 0);
  let glosujacych = 0;
  const wlasne = [];
  for (const d of lista) {
    const wybrane = wybraneWyboru(krok, d, n);
    const wlasny = wlasnyWpis(krok, d);
    if (wybrane.length || wlasny) glosujacych += 1;
    for (const i of wybrane) liczby[i] += 1;
    if (wlasny) {
      const id = `${krok.id}/${d.urz}`;
      wlasne.push({ id, urz: d.urz, z: d.z, t: d.t || 0, tekst: wlasny, ukryty: Boolean((stan.ukryte || {})[id]) });
    }
  }
  const ranking = liczby.map((ile, i) => ({ i, ile })).sort((a, b) => b.ile - a.ile || a.i - b.i);
  wlasne.sort((a, b) => a.t - b.t || (a.urz < b.urz ? -1 : 1));
  return { liczby, ranking, glosujacych, wlasne };
}

function symulujWybor(krok, los) {
  const przyklady = krok.przyklady || [];
  if (krok.wlasna && przyklady.length && los() < SZANSA_WLASNEJ) return { s: [], w: przyklady[Math.floor(los() * przyklady.length)] };
  /* Głos na zespoły: liczba zespołów z zajęć na stronie (ZAJECIA wstawia zbuduj.py). */
  const n = krok.z_kroku ? (typeof ZAJECIA !== "undefined" && ZAJECIA.zespoly ? ZAJECIA.zespoly.liczba : 2) : krok.pozycje.length;
  const wybrane = new Set();
  while (wybrane.size < Math.min(limitWyboru(krok), n)) wybrane.add(Math.floor(los() * n));
  return { s: [...wybrane] };
}

/* Tytuły zespołów z kroku „tekst” (pierwsze pole najnowszego widocznego wpisu): { <zespół>: tekst }. */
function tytulyZespolow(zajecia, krok, odp, stan) {
  const zrodlo = zajecia.kroki.find((x) => x.id === krok.z_kroku);
  const tytuly = {};
  for (const w of wpisyTekstu(zrodlo, odpowiedziKroku(odp, zrodlo.id), stan)) if (w.z && w.teksty[0]) tytuly[w.z] = w.teksty[0];
  return tytuly;
}

/* Nazwa pozycji do wyświetlenia: tekst z JSON albo „Zespół N: tytuł”. */
function nazwaPozycji(zajecia, krok, i, tytuly = {}) {
  if (!krok.z_kroku) return tx(krok.pozycje[i].tekst);
  return tytuly[i + 1] ? `${nazwaZespolu(zajecia, i + 1)}: ${tytuly[i + 1]}` : nazwaZespolu(zajecia, i + 1);
}

;
/* Typ kroku „mapa”: mapa różnic. Przy każdej pozycji (np. problem przyrody) uczeń ustawia 2 suwaki, po jednym na stronę (np. Grecja i Polska).
   Odpowiedź telefonu: { w: [[strona 1, strona 2], …] } (lista na pozycję). TV w wynikach: średnie obu stron i podpis różnicy.
   Podpis: różnica od MAPA_PROG = „więcej” strony z wyższą średnią (pole wiecej w JSON), mniejsza i obie średnie od MAPA_POWAZNY = „wspólny”,
   mniejsza przy niższych = „podobny”. Z polem przydzial (wymaga zespołów) faza „przydzial”: pozycje z największą różnicą dla zespołów.
   Plik dokłada się do TYPY_DODATKOWE (logika.js) i do słownika. Format: README.md, „mapa”. */
const MAPA_PROG = 1;
const MAPA_POWAZNY = 3;

const zakresMapy = (krok) => ({ min: krok.min ?? 1, max: krok.max ?? 5 });

function wartosciMapy(krok, d, r) {
  const { min, max } = zakresMapy(krok);
  const para = d && Array.isArray(d.w) && Array.isArray(d.w[r]) ? d.w[r] : [];
  return [0, 1].map((s) => (typeof para[s] === "number" && para[s] >= min && para[s] <= max ? para[s] : null));
}

const sredniaMapy = (liczby) => (liczby.length ? Math.round((liczby.reduce((a, b) => a + b, 0) / liczby.length) * 10) / 10 : null);

/* Na pozycję: średnie obu stron, różnica (strona 1 minus strona 2) i rodzaj: „wiecej0”, „wiecej1”, „wspolny”, „podobny” albo null. */
function wynikMapy(krok, lista) {
  const odpowiedzi = lista.filter((d) => krok.pozycje.some((_, r) => wartosciMapy(krok, d, r).some((v) => v !== null)));
  const pozycje = krok.pozycje.map((_, r) => {
    const [a, b] = [0, 1].map((s) => sredniaMapy(odpowiedzi.map((d) => wartosciMapy(krok, d, r)[s]).filter((v) => v !== null)));
    if (a === null || b === null) return { a, b, roznica: null, rodzaj: null };
    const roznica = Math.round((a - b) * 10) / 10;
    const rodzaj = Math.abs(roznica) >= MAPA_PROG ? (roznica > 0 ? "wiecej0" : "wiecej1") : Math.min(a, b) >= MAPA_POWAZNY ? "wspolny" : "podobny";
    return { a, b, roznica, rodzaj };
  });
  return { ile: odpowiedzi.length, pozycje };
}

/* Przydział: tyle pozycji o największej różnicy, ile par zespołów (zaokrąglone w górę); zespoły po kolei, po 2 na pozycję. */
function przydzialMapy(w, liczbaZespolow) {
  const kolejnosc = w.pozycje.map((p, r) => ({ r, d: p.roznica === null ? -1 : Math.abs(p.roznica) })).filter((x) => x.d >= 0)
    .sort((x, y) => y.d - x.d || x.r - y.r);
  const ile = Math.min(kolejnosc.length, Math.ceil(liczbaZespolow / 2));
  const grupy = kolejnosc.slice(0, ile).map((x) => ({ r: x.r, roznica: x.d, zespoly: [] }));
  if (!grupy.length) return [];
  for (let z = 1; z <= liczbaZespolow; z++) grupy[Math.floor(((z - 1) * ile) / liczbaZespolow)].zespoly.push(z);
  return grupy;
}

function symulujMape(krok, los) {
  const { min, max } = zakresMapy(krok);
  const rozpietosc = max - min;
  /* Każda pozycja ma swoje stałe przesunięcie, żeby podgląd pokazał różne rodzaje różnic. */
  return { w: krok.pozycje.map((_, r) => [0, 1].map((s) => {
    const srodek = min + rozpietosc * (((r * 3 + s * 5) % 7) / 6);
    return Math.max(min, Math.min(max, Math.round(srodek + (los() - 0.5) * 2)));
  })) };
}

const liczbaMapy = (x) => (x === null ? t("brak") : JEZYK === "pl" ? String(x.toFixed(1)).replace(".", ",") : x.toFixed(1));

function opisRodzaju(krok, rodzaj) {
  if (rodzaj === "wiecej0") return tx(krok.strony[0].wiecej);
  if (rodzaj === "wiecej1") return tx(krok.strony[1].wiecej);
  return rodzaj ? t(rodzaj === "wspolny" ? "mapaWspolny" : "mapaPodobny") : "";
}

/* ---------- TV ---------- */

function pasekMapy(wartosc, krok, klasa) {

   Testy: test_kalk_porownanie.js. Format: README.md, „kalkulator”. */
const PROG_TRAFIENIA = 0.2;
const KM_AUTEM_OD_KG = 1;

const dobryTypKg = (x) => typeof x === "number" && Number.isFinite(x) && x >= 0 && x <= MAKS_KG_KALK;
const najwiekszaCzesc = (c) => SLAD_CZESCI[c.indexOf(Math.max(...c))];

/* Własna odpowiedź tego telefonu w innym kroku: na żywo z u.moje (uczen.js), w podglądzie z symulowanych odpowiedzi (u.odp). */
function mojaWKroku(u, id) {
  if (u.moje && u.moje[id]) return u.moje[id];
  return (u.odp && u.odp[id] && u.odp[id][u.urz]) || null;
}

/* Pozycja kroku wybor, którą wybrał ten telefon (albo null). */
function wybranaPozycja(u, id) {
  const ref = u.zajecia.kroki.find((k) => k.id === id);
  const moja = ref ? mojaWKroku(u, id) : null;
  return moja && Array.isArray(moja.s) && Number.isInteger(moja.s[0]) ? ref.pozycje[moja.s[0]] || null : null;

/* { zg, zc } do wysłania razem z wynikiem; puste pola, gdy telefon nie zgadywał. */
function typyDoWyslania(u) {
  const z = u.krok.zgadywanie;
  if (!z) return {};
  const wynik = {};
  const kg = z.kg ? mojaWKroku(u, z.kg) : null;
  if (kg && Array.isArray(kg.w) && dobryTypKg(kg.w[0])) wynik.zg = kg.w[0];
  const poz = z.czesc ? wybranaPozycja(u, z.czesc) : null;
  if (poz && SLAD_CZESCI.includes(poz.czesc)) wynik.zc = poz.czesc;
  return wynik;
}

function symulujTypy(krok, los) {
  const z = krok.zgadywanie;
  return { ...(z.kg ? { zg: 100 + Math.round(los() * 50) * 10 } : {}), ...(z.czesc ? { zc: SLAD_CZESCI[Math.floor(los() * SLAD_CZESCI.length)] } : {}) };

/* Pomyłki grupy: typy kg (trafione w granicach ±20% własnego wyniku, za nisko, za wysoko) i trafienia własnej największej części. */
function pomylkiGrupy(lista) {
  const dobre = lista.filter(dobryWynikKalk);
  const zTypem = dobre.filter((d) => dobryTypKg(d.zg));
  const trafione = zTypem.filter((d) => Math.abs(d.zg - d.kg) <= PROG_TRAFIENIA * d.kg).length;
  const nisko = zTypem.filter((d) => d.zg < d.kg * (1 - PROG_TRAFIENIA)).length;
  const zCzescia = dobre.filter((d) => SLAD_CZESCI.includes(d.zc));
  return { zTypem: zTypem.length, trafione, nisko, wysoko: zTypem.length - trafione - nisko,
    zCzescia: zCzescia.length, czesciTrafione: zCzescia.filter((d) => d.zc === najwiekszaCzesc(d.c)).length };
}

/* Zdanie o własnym typie kg; null bez typu. */
function zdanieTypuKg(zg, kg) {
  if (!dobryTypKg(zg)) return null;
  const roznica = Math.abs(kg - zg);
  if (roznica <= PROG_TRAFIENIA * kg) return t("kalkTypTrafiony");
  if (kg < zg) return t("kalkTypMniejszy", roznica);
  return zg > 0 ? t("kalkTypRazy", roznica, kalkLiczba(kg / zg, 1)) : t("kalkTypWiekszy", roznica);
}

  const typCzesci = poz ? tx(poz.tekst) : SLAD_CZESCI.includes(zc) ? t(`kalk_tv_${zc}`) : null;
  const naj = najwiekszaCzesc(wlasny.c);

  return el("div", { className: "u-karta u-porown" }, el("h3", { textContent: t("kalkTypTytul") }),

/* ---------- TV i konsola ---------- */

function pomylkiTv(k, w) {
  const p = pomylkiGrupy(odpowiedziKroku(k.odp, k.krok.id));

    p.zCzescia && naj ? el("p", { className: "tv-kalk-pomylki", textContent: t("kalkPomylkiCzesci", t(`kalk_tv_${naj}`), p.czesciTrafione, p.zCzescia) }) : null];

/* Typ kroku „wyzwanie” bez DOM (rysowanie: typ_wyzwanie.js). Zespoły planują ten sam wyjazd: po jednej opcji w każdej kategorii, kilogramów
   na telefonie nie widać, do tego szacunek wyniku na osobę. Odpowiedź telefonu: { w: [numer opcji na kategorię], s: szacunek w kg }.
   Liczy się pierwszy plan zespołu (najmniejsze t). Ranking: mniejszy ślad wyżej, remis: mniejsza różnica szacunku, potem wcześniejszy plan.
   „Najlepszy szacunek”: zespół z najmniejszą różnicą, niezależnie od miejsca. Format: README.md, „wyzwanie”. Testy: test_wyzwanie.js. */

const sumaStalych = (krok) => (krok.stale || []).reduce((a, s) => a + s.kg, 0);

/* Wybory w każdej kategorii, każdy numer istniejącej opcji. */
const pelnyPlan = (krok, w) => Array.isArray(w) && w.length === krok.kategorie.length
  && w.every((i, k) => Number.isInteger(i) && i >= 0 && i < krok.kategorie[k].opcje.length);

const dobrySzacunek = (krok, s) => typeof s === "number" && Number.isFinite(s) && s >= krok.szacunek.min && s <= krok.szacunek.max;

const dobryPlan = (krok, d) => Boolean(d) && pelnyPlan(krok, d.w) && dobrySzacunek(krok, d.s);

/* Ślad na osobę z planu (kg, bez zaokrąglenia): wybrane opcje plus stała część. Plan bez wyboru w którejś kategorii: RangeError. */
function sumaPlanu(krok, w) {
  if (!pelnyPlan(krok, w)) throw new RangeError("Plan wyzwania musi mieć wybór w każdej kategorii");
  return krok.kategorie.reduce((a, kat, i) => a + kat.opcje[w[i]].kg, sumaStalych(krok));
}

/* Pierwszy dobry plan każdego zespołu 1…liczba: Map(numer zespołu → odpowiedź). Zespół spoza zakresu (np. 99) się nie liczy. */
function pierwszePlany(krok, lista, liczba = Infinity) {
  const plany = new Map();
  for (const d of lista) {
    if (!Number.isInteger(d.z) || d.z < 1 || d.z > liczba || !dobryPlan(krok, d)) continue;
    const obecny = plany.get(d.z);
    if (!obecny || (d.t ?? Infinity) < (obecny.t ?? Infinity)) plany.set(d.z, d);

function grajWideo(wideo) {
  wideo.play().catch((blad) => {

/* Gdy treść się nie mieści (zapas ćwierć linii na zaokrąglenia): najpierw ciaśniejsze nagłówki, potem wąski krój. Tekst treści nigdy poniżej 64 px.
   Jeśli i to nie wystarcza, ekran dostaje data-przepelnienie (podglad.html pokazuje ostrzeżenie). */
function przepelniony(ekran) {
  const zapas = parseFloat(getComputedStyle(ekran).fontSize) / 4;
  return [...ekran.querySelectorAll(".tv-tresc, .tv-kolumna, .tv-pole")].some((w) => w.scrollHeight > w.clientHeight + zapas);
}

function dopasujEkran(ekran) {
  if (!ekran) return;
  ekran.classList.remove("ciasno", "ciasno2");
  delete ekran.dataset.przepelnienie;
  for (const klasa of ["ciasno", "ciasno2"]) {
    if (!przepelniony(ekran)) return;
    ekran.classList.add(klasa);
  }
  if (przepelniony(ekran)) ekran.dataset.przepelnienie = "1";
}

/* Wartość początkowa suwaka: pole start (min <= start <= max, np. 0, żeby nikt nie dostał gotowej odpowiedzi ze środka skali), inaczej środek skali. */
function startSuwaka(s) {
  if (typeof s.start === "number" && s.start >= s.min && s.start <= s.max) return s.start;
  return Math.round((s.min + s.max) / 2 / (s.krok || 1)) * (s.krok || 1);

/* Serca: zaznaczenia w telefonie, potem jedno „Wyślij” (sercaEl dzieli to z galerią zdjęć z TV). */
function sercaEl(u, ile, limit, przyPrzycisku = () => "") {
  const otwarte = u.faza === "zbieranie" && !u.moja;
  const moje = u.moja ? (u.moja.s || []) : zaznaczenia(u.krok.id);
  const licznik = el("p", { className: "u-info" });
  const przyciski = Array.from({ length: ile }, (_, i) => {
    const b = el("button", { type: "button", className: "u-serce" }, ikona("serce"), el("span"));
    if (otwarte) b.addEventListener("click", () => { przelacz(moje, i, limit); odswiez(); });
    return b;
  });
  const wyslij = przyciskWyslij(() => u.wyslij({ s: [...moje] }));
  wyslij.hidden = !otwarte;
  function odswiez() {
    przyciski.forEach((b, i) => {
      const wybrane = moje.includes(i);
      b.setAttribute("aria-pressed", String(wybrane));
      b.disabled = !otwarte || (!wybrane && moje.length >= limit);
      b.lastChild.textContent = przyPrzycisku(i, wybrane) || t(wybrane ? "twojeSerce" : "dajSerce");
    });
    licznik.textContent = t("serca", moje.length, limit);
    wyslij.disabled = !moje.length;
  }
  odswiez();
  return { licznik, przyciski, wyslij, status: u.moja && u.faza === "zbieranie" ? potwierdzenie(t("wyslane")) : null };
}

/* Zaznacz albo odznacz numer i (najwyżej limit zaznaczeń). */
function przelacz(lista, i, limit) {
  const gdzie = lista.indexOf(i);
  if (gdzie >= 0) lista.splice(gdzie, 1);
  else if (lista.length < limit) lista.push(i);
}

  return el("li", {}, el("span", { textContent: etykieta }), el("b", { className: "num", textContent: wartosc }));
}

/* Wiersz opcji: poprawna zawsze z ✓ i napisem „Poprawna”; od odsłony pozostałe przygaszone. */
function wierszOpcji(krok, w, i, odslona) {
  const dobra = i === krok.poprawna;
  const wiersz = wierszWyniku(tx(krok.opcje[i].tekst), `${w.liczby[i]} · ${w.procenty[i]}%`);
  if (dobra) wiersz.firstChild.prepend(ikona("ok", "ik p-ok"), " ");
  if (dobra) wiersz.firstChild.append(" ", el("b", { className: "p-tag", textContent: t("poprawnaTag") }));
  wiersz.className = dobra ? "p-poprawna" : odslona && Number.isInteger(krok.poprawna) ? "przygas" : "";
  return wiersz;
}

function pGlos(p, krok, lista) {
  const w = wynikGlosu(krok, lista);
  const odslona = ["odslona", "dodatek"].includes(p.stan.faza);
  const wiersze = krok.opcje.map((_, i) => wierszOpcji(krok, w, i, odslona));
  wiersze.push(wierszWyniku(t("razem"), String(w.razem)));
  if (w.procentTrafnych !== null) wiersze.push(el("li", {}, el("b", { textContent: t("trafnie", w.procentTrafnych) })));
  const dopiski = krok.dopisek ? lista.filter((d) => d.d).map((d) => `${d.z ? `${nazwaZespolu(p.zajecia, d.z)}: ` : ""}${String(d.d).slice(0, 200)}`) : [];
  return [el("ul", { className: "p-wyniki" }, ...wiersze), dopiski.length ? el("h3", { textContent: tx(krok.dopisek.etykieta) }) : null, listaEl(dopiski, "p-dopiski", false)];
}

function pWpis(p, krok, w) {
  const pokazany = !w.ukryty;
  const akcje = [pokazany ? przycisk(t("ukryj"), () => p.akcje.widocznosc(w.id, false)) : przycisk(t("pokaz"), () => p.akcje.widocznosc(w.id, true), "k1-btn pelny")];
  if (krok.ocena) {
    akcje.push(przycisk(t("dobrze"), () => p.akcje.ocen(w.id, w.ocena === "dobrze" ? null : "dobrze"), w.ocena === "dobrze" ? "k1-btn pelny" : "k1-btn"),
      przycisk(t("doPoprawy"), () => p.akcje.ocen(w.id, w.ocena === "popraw" ? null : "popraw"), w.ocena === "popraw" ? "k1-btn pelny" : "k1-btn"));
  }
  const pola = polaTekstu(krok);
  return el("li", { className: pokazany ? "" : "ukryty" }, w.z ? el("b", { textContent: nazwaZespolu(p.zajecia, w.z) }) : null,
    ...w.teksty.map((tekst, i) => (tekst ? el("p", {}, pola.length > 1 ? el("small", { textContent: `${tx(pola[i].etykieta)}: ` }) : null, tekst) : null)),
    el("div", { className: "k1-akcje" }, ...akcje));
}

function pTekst(p, krok, lista) {
  const wpisy = wpisyTekstu(krok, lista, p.stan, true);
  const ul = el("ul", { className: "p-wpisy" }, ...wpisy.map((w) => pWpis(p, krok, w)));
  ul.dataset.przewin = "wpisy";
  const opis = t(krok.moderacja ? "moderacjaOpis" : "scianaOpis");
  /* Ściana na TV dzieli się na strony (kroki_wspolne.js): liczą się tylko wpisy widoczne na TV. */
  const strony = p.stan.faza === "sciana" ? przyciskiStronSciany(p, krok, wpisyTekstu(krok, lista, p.stan).length) : null;
  return [el("p", { className: "k1-meta", textContent: `${opis} ${t("wpisyLiczba", wpisy.length)}` }), strony, ul];
}

function pPodsumowanie(p, krok) {
  const lista = odpowiedziKroku(p.odp, krok.id);
  if (TYPY_DODATKOWE[krok.typ]) return TYPY_DODATKOWE[krok.typ].prowadzacy(p, krok, lista);
  if (krok.typ === "glos") return pGlos(p, krok, lista);
  if (krok.typ === "tekst") return pTekst(p, krok, lista);
  if (krok.typ === "suwaki") return [el("ul", { className: "p-wyniki" }, ...wynikSuwakow(krok, lista).map((w) => wierszWyniku(tx(w.etykieta), w.srednia === null ? t("brak") : t("sredniaIle", w.srednia, w.ile))))];
  if (krok.typ === "stukniecie") {
    const w = wynikStukniec(krok, lista);
    return [el("ul", { className: "p-wyniki" }, wierszWyniku(t("stuknieciaWiersz"), String(w.razem)), w.trafione === null ? null : wierszWyniku(t("wCeluWiersz"), `${w.trafione} · ${w.procentTrafionych ?? 0}%`))];
  }
  if (krok.typ === "galeria") return [el("ul", { className: "p-wyniki" }, ...wynikGalerii(krok, lista).ranking.map((r) => wierszWyniku(`${r.i + 1}. ${tx(krok.obrazy[r.i].tytul) || tx(krok.obrazy[r.i].opis)}`, t("sercLiczba", r.ile))))];
  if (krok.typ === "ranking") return [el("ul", { className: "p-wyniki" }, ...rankingZespolow(p.zajecia, p.odp).map((r) => wierszWyniku(`${r.miejsce}. ${nazwaZespolu(p.zajecia, r.zespol)}`, t("pkt", r.punkty))))];
  return [listaEl(krok.lista, "p-lista")];
}

function pScena(p) {
  const krok = p.zajecia.kroki[p.stan.krok];
  const mowisz = mowiszWFazie(krok, p.stan.faza);
  const sterowanie = el("div", { className: "p-ster" },
    przycisk(t("wstecz"), p.akcje.wstecz, "p-wstecz", p.stan.krok === 0 && fazyKroku(krok).indexOf(p.stan.faza) === 0),
    przycisk(etykietaDalej(p.stan, p.zajecia), p.akcje.dalej, "p-dalej", celDalej(p.stan, p.zajecia).rodzaj === "koniec"));
  return el("main", { className: "p-srodek" },
    el("p", { className: "k1-meta", textContent: t("krokZ", p.stan.krok + 1, p.zajecia.kroki.length, nazwaTypu(krok.typ)) }),
    el("h1", { className: "p-naglowek", textContent: tx(krok.pytanie) || tx(krok.tytul) || naglowekKroku(p.zajecia, krok) }),
    pFazy(krok, p.stan.faza), sterowanie,
    mowisz ? el("div", { className: "p-mowisz" }, el("small", { textContent: t("mowisz") }), el("p", { textContent: mowisz })) : null,
    pTimer(p, krok), el("section", { className: "p-podsum" }, ...pPodsumowanie(p, krok)));
}

function pBok(p) {
  const krok = p.zajecia.kroki[p.stan.krok];
  const dp = krok.dla_prowadzacego;
  return el("aside", { className: "p-prawa" },
    dp ? el("section", { className: "p-pudlo" }, el("h3", { textContent: t("tylkoProwadzacy") }), dp.tekst ? el("p", { textContent: tx(dp.tekst) }) : null, zrodlaEl(dp.zrodla, "p-zrodla")) : null,
    materialProwadzacy(krok),
    el("section", { className: "p-pudlo" }, el("h3", { textContent: t("wynikiZajec") }),
      el("div", { className: "k1-akcje" }, przycisk(t("zapiszPng"), p.akcje.zapiszObraz, "k1-btn pelny"), przycisk(t("zapiszTekst"), p.akcje.zapiszTekst)),
      p.dropbox ? el("a", { className: "k1-btn p-dropbox", href: p.dropbox, target: "_blank", rel: "noopener", textContent: t("dropbox") }) : null),
    typeof pudloZespolow === "function" ? pudloZespolow(p) : null,
    p.test ? el("section", { className: "p-pudlo p-proba" }, el("h3", { textContent: t("trybProbny") }),
      przycisk(t("symuluj"), p.akcje.symuluj)) : null,
    el("section", { className: "p-pudlo" }, el("div", { className: "k1-akcje" }, przycisk(t("nowaSesja"), p.akcje.nowaSesja),
      przycisk(t("zakonczSesje"), p.akcje.zakonczSesje)),
      p.adresInstrukcji ? el("a", { className: "k1-btn p-instrukcja", href: p.adresInstrukcji, target: "_blank", rel: "noopener", textContent: t("instrukcja") }) : null));
}

function etykietaDalej(stan, zajecia) {
  const cel = celDalej(stan, zajecia);
  if (cel.rodzaj === "faza") return t("dalejFaza", nazwaFazy(cel.faza));
  return t(cel.rodzaj === "koniec" ? "koniecZajec" : "nastepnyKrok");
}

function widokTabletu(p) {
  return el("div", { className: "p-uklad" }, pGora(p), el("div", { className: "p-siatka" }, pListaKrokow(p), pScena(p), pBok(p)));
}

;
/* podglad.html: wszystkie ekrany zajęć (TV, telefon, tablet) w każdej fazie, z symulowanymi odpowiedziami i podpisami.
   Rysuje tymi samymi funkcjami co strony na żywo. Przełącznik PL/EN (albo ?jez=en) przerysowuje całość w drugim języku.
   Ekran TV, na którym tekst się nie mieści, dostaje czerwone ostrzeżenie; liczba trafia do body[data-przepelnienia]. */
const KOD_PODGLADU = "acd347";
const TERAZ_PODGLADU = Date.UTC(2026, 0, 1, 9, 0, 0);
const ODP_PODGLADU = symulujZajecia(ZAJECIA, 7);
const BEZ_AKCJI = new Proxy({}, { get: () => () => {} });

const adresPodgladu = () => adresUczniow({ baza: poprawnaBaza(USTAWIENIA.adres_uczniow), slug: ZAJECIA.slug, kod: KOD_PODGLADU, test: null, biezacy: location.href });

/* Stan sesji do podglądu: timer zatrzymany na 0:24 w fazach zbierania, ściana z oceną dwóch pierwszych wpisów. */
function stanPodgladu(krok, indeks, faza) {
  const timer = krok.czas && (czyZbieranie(faza) || krok.typ === "timer")
    ? { czasMs: krok.czas * 1000, koniec: null, zostaloMs: Math.min(krok.czas * 1000, 24000) } : null;
  const wpisy = Object.keys(ODP_PODGLADU[krok.id] || {}).map((urz) => `${krok.id}/${urz}`);
  const pokazane = krok.moderacja ? Object.fromEntries(wpisy.slice(1).map((id) => [id, true])) : {};
  const oceny = krok.ocena ? { [wpisy[0]]: "dobrze", [wpisy[1]]: "popraw" } : {};
  return { v: 1, krok: indeks, faza, timer, ukryte: {}, pokazane, oceny, qr: false, jez: JEZYK, dodatki: dodatkiPodgladu() };
}

/* stan.dodatki do podglądu: typy z osobnych plików mogą podać przykładowe dane kroku (np. wylosowane tematy). */
function dodatkiPodgladu() {
  return Object.fromEntries(ZAJECIA.kroki.filter((k) => TYPY_DODATKOWE[k.typ] && TYPY_DODATKOWE[k.typ].podglad)
    .map((k) => [k.id, TYPY_DODATKOWE[k.typ].podglad(k, ZAJECIA)]));
}

function moja(krok) {
  const d = (ODP_PODGLADU[krok.id] || {})["sym-1"];
  if (!d) return null;
  const { z, t: _czas, ...dane } = d;
  return dane;
}

const podpis = (tekst) => el("figcaption", { textContent: tekst });
const symulowane = (krok, faza) => (["info", "timer"].includes(krok.typ) || (krok.typ === "glos" && faza === "dodatek") ? "" : t("pgSym"));

function ramkaTv(wezly, tekst) {
  return el("figure", { className: "pg-ramka" }, el("div", { className: "pg-tv" }, ...wezly), podpis(tekst));
}

function ramkaTelefonu(wezel, tekst) {
  const strona = el("div", { className: "u-strona" }, el("header", { className: "u-pasek" }, el("b", { textContent: tx(ZAJECIA.tytul) })), wezel);
  return el("figure", { className: "pg-ramka" }, el("div", { className: "pg-tel k1-ciemny" }, strona), podpis(tekst));
}

function wierszFazy(krok, indeks, faza) {
  const stan = stanPodgladu(krok, indeks, faza);
  const kontekst = { zajecia: ZAJECIA, indeks, krok, faza, odp: ODP_PODGLADU, stan, teraz: TERAZ_PODGLADU, adres: adresPodgladu(), kod: KOD_PODGLADU };
  const tel = ekranUcznia({ ...kontekst, moja: czyZbieranie(faza) && indeks % 2 ? null : moja(krok), zespol: ZAJECIA.zespoly ? 1 : null, urz: "sym-1", wyslij: () => {} });
  return el("div", { className: "pg-wiersz" },
    ramkaTv(ekranTv(kontekst), t("pgTv", nazwaFazy(faza)) + symulowane(krok, faza)),
    ramkaTelefonu(tel, t("pgTel", nazwaFazy(faza))));
}

function ramkaTabletu(krok, indeks) {
  const fazy = fazyKroku(krok);
  const stan = stanPodgladu(krok, indeks, fazy[Math.min(1, fazy.length - 1)]);
  const widok = widokTabletu({ zajecia: ZAJECIA, stan, odp: ODP_PODGLADU, obecni: { a: 1, b: 1 }, teraz: TERAZ_PODGLADU, kod: KOD_PODGLADU,
    status: { polaczone: 2, wszystkie: 2 }, test: null, adresTv: PLIKI.tv, adresInstrukcji: adresInstrukcji(), dropbox: USTAWIENIA.dropbox, dzwiek: false, akcje: BEZ_AKCJI });
  return el("figure", { className: "pg-ramka" }, el("div", { className: "pg-tablet k1-ciemny" }, widok), podpis(t("pgTablet", nazwaFazy(stan.faza))));
}

function sekcjaKroku(krok, indeks) {
  return el("section", { className: "pg-krok", id: `krok-${indeks + 1}` },
    el("h2", { textContent: `${indeks + 1}. ${tx(krok.tytul) || tx(krok.naglowek) || tx(krok.pytanie)}` }),
    el("p", { className: "k1-meta", textContent: `${nazwaTypu(krok.typ)} · ${t("pgFazy", fazyKroku(krok).map((f) => nazwaFazy(f).toLowerCase()).join(", "))}` }),
    ...fazyKroku(krok).map((f) => wierszFazy(krok, indeks, f)), ramkaTabletu(krok, indeks));
}

function sekcjaStartu() {
  const pierwszy = ZAJECIA.kroki[0];
  const stanQr = { ...stanPodgladu(pierwszy, 0, fazyKroku(pierwszy)[0]), qr: true };
  const kontekstQr = { zajecia: ZAJECIA, indeks: 0, krok: pierwszy, faza: stanQr.faza, odp: {}, stan: stanQr, teraz: TERAZ_PODGLADU, adres: adresPodgladu(), kod: KOD_PODGLADU };
  const czekanie = el("section", { className: "u-ekran" }, el("h2", { textContent: tx(ZAJECIA.tytul) }), el("p", { className: "u-info", textContent: t("czekamy") }));
  return el("section", { className: "pg-krok", id: "start" }, el("h2", { textContent: t("pgStart") }),
    el("div", { className: "pg-wiersz" }, ramkaTv([ekranTvStart(ZAJECIA, adresPodgladu(), KOD_PODGLADU)], t("pgTvStart")),
      ZAJECIA.zespoly ? ramkaTelefonu(ekranZespolu(ZAJECIA, () => {}), t("pgTelZespol")) : ramkaTelefonu(czekanie, t("pgTelStart"))),
    el("div", { className: "pg-wiersz" }, ramkaTv(ekranTv(kontekstQr), t("pgTvQr"))));
}

function oznaczPrzepelnienia() {
  let ile = 0;
  for (const ekran of document.querySelectorAll(".pg-tv .tv-ekran")) {
    dopasujEkran(ekran);
    if (!ekran.dataset.przepelnienie) continue;
    ile += 1;
    ekran.closest(".pg-ramka").append(el("p", { className: "pg-blad", textContent: t("pgBlad") }));
  }
  const licznik = document.getElementById("pg-przepelnienia");
  licznik.textContent = ile ? t("pgPrzepelnienia", ile) : t("pgMieszcza");
  licznik.className = ile ? "pg-blad" : "k1-meta";
  document.body.dataset.przepelnienia = String(ile);
}

const adresInstrukcji = () => `${PLIKI.instrukcja}${JEZYK === "en" ? "?jez=en" : ""}`;

function rysujPodglad() {
  const spis = el("nav", { className: "pg-spis" }, el("a", { href: "#start", textContent: "Start" }),
    ...ZAJECIA.kroki.map((k, i) => el("a", { href: `#krok-${i + 1}`, textContent: String(i + 1) })));
  wstaw(document.getElementById("podglad"),
    el("header", { className: "pg-glowa" }, przelacznikJezyka(rysujPodglad), el("h1", { textContent: t("pgTytul", tx(ZAJECIA.tytul)) }),
      el("p", { textContent: t("pgOpis") }), el("p", {}, el("a", { href: adresInstrukcji(), textContent: t("instrukcja") })), el("p", { id: "pg-przepelnienia" }), spis),
    sekcjaStartu(), ...ZAJECIA.kroki.map(sekcjaKroku));
  document.body.dataset.jezyk = JEZYK;
  delete document.body.dataset.przepelnienia;
  requestAnimationFrame(() => setTimeout(oznaczPrzepelnienia, 50));
}

jezykDomyslny(parametryAdresu(location.search).jez);
window.addEventListener("load", rysujPodglad);
