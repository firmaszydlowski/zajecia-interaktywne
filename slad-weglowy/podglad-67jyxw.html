<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mój ślad węglowy z wyjazdu · podgląd ekranów</title>
<style>
/* Kopia 1:1 z generator-debat/apka/styl.css. Wygląd A „Tablica wyników” (makiety/kierunek-A-v2.html): tokeny i elementy wspólne wszystkich stron.
   Tokeny i typografia 1:1 z makiety. Strony: <body class="k1"> (jasna) albo <body class="k1 k1-ciemny">.
   Kontrast WCAG AA sprawdzony dla par tokenów (najniższa para szary/ciem2: 4,9:1). */
:root {
  --tlo: #F2F0EB; --biel: #FFFFFF; --ink: #16181D; --mute: #4F5560; --linia: #D6D2C8; --ciem: #16181D; --ciem2: #22262E; --ciem3: #2E333D;
  --jasny: #C9CED8; --szary: #8B93A1; --tak: #1D5FD6; --nie: #C2410C; --tak-j: #7AAEFF; --nie-j: #FF9B54; --zolty: #FFC94D; --uwaga: #8A3A0A; --uwaga-t: #FDEBD9;
  --kond: "Avenir Next Condensed", "DIN Condensed", "Bahnschrift SemiCondensed", "Arial Narrow", sans-serif;
  --tekst: "Avenir Next", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
h1, h2, h3, h4, p, dl, dd, figure, blockquote { margin: 0; }
ol, ul { margin: 0; padding: 0; list-style: none; }
[hidden] { display: none !important; }
button { cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--zolty); outline-offset: 2px; }
.k1 :focus-visible { outline-color: var(--tak); }
.k1-ciemny :focus-visible { outline-color: var(--zolty); }

.k1 { font: 16px/1.45 var(--tekst); color: var(--ink); background: var(--tlo); }
:where(.k1) button, :where(.k1) input, :where(.k1) select { font: inherit; }
.k1-ciemny { background: var(--ciem); color: #fff; }
.ik { width: 1em; height: 1em; flex: none; vertical-align: -.14em; }
.kbd { display: inline-block; min-width: 1.9em; padding: 0 .4em; border: 1px solid currentColor; border-bottom-width: 3px; border-radius: 4px; font-size: .85em; text-align: center; line-height: 1.5; }
.num { font-variant-numeric: tabular-nums; }
.qr { display: block; shape-rendering: crispEdges; }
.qr svg { display: block; width: 100%; height: auto; }

/* przełączniki: język i widok urządzenia */
.k1 .jez, .k1 .urz { display: inline-flex; border: 1px solid currentColor; }
.k1 .jez button, .k1 .urz button { background: none; border: 0; color: inherit; font-weight: 600; padding: 0 14px; min-height: 44px; white-space: nowrap; }
.k1 .jez button[aria-pressed="true"], .k1 .urz button[aria-pressed="true"] { background: #fff; color: var(--ciem); }

/* przyciski */
.k1-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border: 1px solid var(--ink); background: var(--biel); color: var(--ink); font-weight: 600; white-space: nowrap; text-decoration: none; }
.k1-btn.pelny { background: var(--ciem); color: #fff; }
.k1-btn:disabled { border-color: var(--linia); color: var(--mute); background: transparent; font-weight: 400; }
.k1-ciemny .k1-btn { background: transparent; color: #fff; border-color: #fff; }
.k1-ciemny .k1-btn.pelny { background: #fff; color: var(--ciem); }
.k1-ciemny .k1-btn:disabled { border-color: var(--ciem3); color: var(--szary); }
.k1-btn-gl { display: inline-flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 24px; border: 0; background: var(--zolty); color: var(--ciem); font: 700 22px/1 var(--kond); }
.k1-btn-gl:disabled { opacity: .6; }
.k1-akcje { display: flex; gap: 8px; flex-wrap: wrap; }

/* drobne teksty */
.k1-meta { font-size: 14px; color: var(--mute); }
.k1-ciemny .k1-meta { color: var(--jasny); }
.k1-ang { display: block; color: var(--mute); font-size: 15px; }
.k1-ciemny .k1-ang { color: var(--jasny); }
.k1-hint { font-size: 14px; color: var(--jasny); }
.k1 a { color: var(--tak); }
.k1-ciemny a { color: var(--tak-j); }
.k1-powiedz { font-size: 13px; font-weight: 700; color: var(--mute); display: block; }
.k1-ciemny .k1-powiedz { color: var(--jasny); }
.k1-tylko { display: flex; gap: 8px; align-items: center; padding: 10px 12px; background: var(--uwaga-t); color: var(--uwaga); font-weight: 700; font-size: 15px; }
.k1-tylko .ik { width: 20px; height: 20px; }
.komunikat { padding: 10px 12px; background: var(--uwaga-t); color: var(--uwaga); font-weight: 600; font-size: 15px; }
.komunikat-sesji { padding: 48px 24px; font: 700 28px/1.2 var(--kond); text-align: center; }

/* stan łącza */
.k1-lacze { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--jasny); white-space: nowrap; }
.k1-lacze::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--nie-j); }
.k1-lacze.czesc::before { background: var(--zolty); }
.k1-lacze.ok::before { background: #4ADE80; }

/* TAK i NIE: kolor plus kształt (kółko i kwadrat), żeby nie polegać na samym kolorze */
.strona-tak { color: var(--tak); }
.strona-nie { color: var(--nie); }
.k1-ciemny .strona-tak { color: var(--tak-j); }
.k1-ciemny .strona-nie { color: var(--nie-j); }

/* tryb testowy */
.baner-testu { background: var(--zolty); color: var(--ciem); font-weight: 700; text-align: center; padding: 8px 16px; letter-spacing: .02em; }

/* TV (ciemny): ekran 1920×1080 liczony w jednostce --u. Strona ustawia --u z okna (styl_tv_strona.css), podgląd z ramki.
   Najmniejszy tekst treści: 64 px przy 1080p. Wyjątki: pasek sterowania i baner próby (znikają w pełnym ekranie / tylko próba). */
.tv-ekran { position: relative; width: calc(1920 * var(--u)); height: calc(1080 * var(--u)); padding: calc(48 * var(--u)) calc(72 * var(--u));
  display: flex; flex-direction: column; gap: calc(32 * var(--u)); overflow: hidden; background: var(--ciem); color: #fff;
  font: 400 calc(64 * var(--u))/1.15 var(--tekst); text-align: left; }
.tv-ekran .ik { width: .9em; height: .9em; }
.tv-g { flex: none; display: flex; justify-content: space-between; align-items: baseline; gap: calc(48 * var(--u)); font: 700 calc(64 * var(--u))/1 var(--kond); color: var(--jasny); }
.tv-gl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tv-g > :not(.tv-gl) { flex: none; white-space: nowrap; }
.tv-zegar-maly { flex: none; color: #fff; font-size: calc(96 * var(--u)); }
.tv-ekran .malo { color: var(--zolty); }
.tv-ekran .koniec { color: var(--nie-j); }
.tv-tresc { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: calc(32 * var(--u)); overflow: hidden; }
.tv-kolumna { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: calc(32 * var(--u)); overflow: hidden; }
.tv-z-obrazem { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); gap: calc(56 * var(--u)); }
.tv-dwie { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: calc(48 * var(--u)); }
.tv-obraz, .tv-obraz-ramka { width: 100%; height: 100%; min-height: 0; }
.tv-obraz { display: block; object-fit: cover; }
.tv-obraz-ramka { display: flex; flex-direction: column; gap: calc(12 * var(--u)); }
.tv-obraz-ramka .tv-obraz { flex: 1; height: auto; }
.tv-obraz-ramka figcaption { font: 700 calc(64 * var(--u))/1.05 var(--kond); color: var(--jasny); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* teksty */
.tv-tytul { font: 700 calc(132 * var(--u))/0.95 var(--kond); }
.tv-pyt { font: 700 calc(84 * var(--u))/1.08 var(--tekst); }
.tv-pyt.maly { font-size: calc(64 * var(--u)); line-height: 1.12; }
.tv-tekst { font-size: calc(64 * var(--u)); line-height: 1.2; }
.tv-akcent { color: var(--tak-j); }
.tv-pole { min-height: 0; display: flex; flex-direction: column; gap: calc(16 * var(--u)); padding: calc(28 * var(--u)) calc(36 * var(--u)); background: var(--ciem2); overflow: hidden; }
.tv-pole h2 { font: 700 calc(64 * var(--u))/1 var(--kond); color: var(--zolty); }
.tv-pole-duze { flex: 1; }
.tv-d { flex: none; margin-top: auto; display: flex; flex-wrap: wrap; justify-content: space-between; gap: calc(16 * var(--u)) calc(48 * var(--u));
  font: 700 calc(64 * var(--u))/1.1 var(--kond); color: var(--jasny); }
.tv-zrodlo { font-family: var(--tekst); font-weight: 400; }
.tv-lista { counter-reset: s; display: grid; gap: calc(20 * var(--u)); }
.tv-lista li { counter-increment: s; display: grid; grid-template-columns: calc(88 * var(--u)) 1fr; font-weight: 700; line-height: 1.12; }
.tv-lista li::before { content: counter(s); font-family: var(--kond); color: var(--zolty); }
ul.tv-lista li { grid-template-columns: 1fr; }
ul.tv-lista li::before { content: none; }
.tv-pozycje { display: grid; gap: calc(12 * var(--u)); }
.tv-pozycje h2 { font: 700 calc(64 * var(--u))/1 var(--kond); color: var(--jasny); }
.tv-lista-pozycji li { padding: calc(10 * var(--u)) 0; border-top: calc(4 * var(--u)) solid var(--ciem3); font-weight: 700; line-height: 1.12; }

/* opcje: kolor plus kształt znaku */
.tv-ekran .op-tak { color: var(--tak-j); }
.tv-ekran .op-nie { color: var(--nie-j); }
.tv-ekran .op-jesli { color: var(--zolty); }
.tv-ekran .op-n { color: #fff; }
.op-litera { display: inline-grid; place-items: center; flex: none; width: 1em; height: 1em; border: .08em solid currentColor; font: 700 .7em/1 var(--kond); }
.tv-opcje { display: grid; gap: calc(8 * var(--u)); }
.tv-opcje li { display: flex; align-items: center; gap: calc(28 * var(--u)); padding: calc(18 * var(--u)) 0; border-top: calc(4 * var(--u)) solid var(--ciem3);
  font: 700 calc(84 * var(--u))/1.02 var(--kond); }
.tv-opcje .op-znak, .tv-opcje .op-litera, .tv-sl-nazwa .op-znak, .tv-sl-nazwa .op-litera { width: calc(76 * var(--u)); height: calc(76 * var(--u)); }
.tv-slupki { display: grid; gap: calc(28 * var(--u)); }
.tv-slupki li { display: grid; grid-template-columns: minmax(0, 860fr) minmax(0, 520fr) calc(230 * var(--u)); align-items: center; gap: calc(32 * var(--u)); }
.tv-sl-nazwa { display: flex; align-items: center; gap: calc(20 * var(--u)); font: 700 calc(72 * var(--u))/1 var(--kond); }
.tv-sl-pasek { display: block; height: calc(76 * var(--u)); background: var(--ciem3); }
.tv-sl-pasek i { display: block; height: 100%; background: currentColor; }
.tv-sl-proc { font: 700 calc(120 * var(--u))/1 var(--kond); text-align: right; }
.przygas { opacity: .35; }
.tv-werdykt-rzad { display: flex; flex-wrap: wrap; align-items: center; gap: calc(24 * var(--u)) calc(48 * var(--u)); }
.tv-werdykt { font: 700 calc(150 * var(--u))/0.95 var(--kond); }
/* odsłona: poprawna opcja wypełniona swoim kolorem, ze znakiem ✓ i napisem „Poprawna”; złe szare, bez wypełnienia */
.tv-odsl { flex: none; display: flex; flex-wrap: wrap; gap: calc(16 * var(--u)) calc(24 * var(--u)); }
.tv-odsl li { display: flex; align-items: center; gap: calc(20 * var(--u)); padding: calc(12 * var(--u)) calc(28 * var(--u));
  border: calc(4 * var(--u)) solid var(--ciem3); font: 700 calc(64 * var(--u))/1 var(--kond); }
.tv-odsl li .ik { width: calc(64 * var(--u)); height: calc(64 * var(--u)); }
.tv-ekran .tv-odsl li.zla { color: var(--szary); }
.tv-odsl li.poprawna { background: currentColor; border-color: currentColor; }
.tv-odsl li.poprawna > * { color: var(--ciem); }
.tv-odsl li.poprawna > .odsl-tag { padding: calc(8 * var(--u)) calc(16 * var(--u)); background: var(--ciem); color: #fff; }
.tv-z-obrazem .tv-odsl li { gap: calc(14 * var(--u)); padding: calc(8 * var(--u)) calc(18 * var(--u)); }
.tv-z-obrazem .tv-odsl li.poprawna > .odsl-tag { padding: calc(4 * var(--u)) calc(12 * var(--u)); }
.tv-odsl.duze li.poprawna { font-size: calc(110 * var(--u)); }
.tv-odsl.duze li.poprawna .ik { width: calc(96 * var(--u)); height: calc(96 * var(--u)); }
.tv-odsl.duze li.poprawna > .odsl-tag { font-size: calc(64 * var(--u)); }
.tv-znacznik { padding: calc(12 * var(--u)) calc(24 * var(--u)); background: var(--zolty); color: var(--ciem); font: 700 calc(64 * var(--u))/1 var(--kond); }

/* start i kod QR */
.tv-start { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) calc(640 * var(--u)); gap: calc(96 * var(--u)); align-items: center; }
.tv-qr-blok { display: flex; flex-direction: column; align-items: center; gap: calc(16 * var(--u)); text-align: center; }
.tv-qr { width: calc(560 * var(--u)); padding: calc(24 * var(--u)); background: #fff; }
.tv-qr svg { display: block; width: 100%; height: auto; }
.tv-adres { font: 700 calc(64 * var(--u))/1.05 var(--kond); color: var(--jasny); overflow-wrap: anywhere; }
.tv-kod { font: 700 calc(64 * var(--u))/1 var(--kond); color: var(--jasny); }
.tv-kod b { color: var(--zolty); font-size: calc(120 * var(--u)); letter-spacing: .06em; }
.tv-nakladka { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: calc(24 * var(--u)); background: var(--ciem); color: #fff; }

/* suwaki */
.tv-suwaki { flex: 1; min-height: 0; display: grid; grid-auto-rows: minmax(0, 1fr); gap: calc(40 * var(--u)); }
.tv-suwak-wynik { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: calc(12 * var(--u)); }
.tv-suwak-g, .tv-konce { display: flex; justify-content: space-between; gap: calc(32 * var(--u)); font: 700 calc(64 * var(--u))/1 var(--kond); }
.tv-suwak-g b { color: var(--zolty); }
.tv-konce { color: var(--jasny); }
.tv-histogram { display: flex; align-items: flex-end; gap: calc(12 * var(--u)); min-height: calc(100 * var(--u)); border-bottom: calc(4 * var(--u)) solid var(--jasny); }
.tv-histogram span { flex: 1; height: 100%; display: flex; align-items: flex-end; }
.tv-histogram i { display: block; width: 100%; min-height: calc(4 * var(--u)); background: var(--tak-j); }

/* ściana tekstów */
.tv-sciana { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, max-content); align-content: start;
  gap: calc(24 * var(--u)); overflow: hidden; }
.tv-wpis { display: flex; flex-direction: column; gap: calc(8 * var(--u)); padding: calc(20 * var(--u)) calc(28 * var(--u)); background: var(--ciem2);
  border-left: calc(10 * var(--u)) solid var(--tak-j); overflow: hidden; }
.tv-wpis p { line-height: 1.15; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tv-dwie .tv-sciana { grid-template-columns: minmax(0, 1fr); }
.tv-wpis-kto { font: 700 calc(64 * var(--u))/1 var(--kond); color: var(--zolty); }
.tv-wpis.ocena-dobrze { border-left-color: #4ADE80; }
.tv-wpis.ocena-popraw { border-left-color: var(--nie-j); }
.tv-ocena { font: 700 calc(64 * var(--u))/1 var(--kond); color: var(--jasny); }

/* stuknięcie */
.tv-dwie-mapa { grid-template-columns: auto minmax(0, 1fr); align-items: start; }
.tv-mapa { position: relative; height: calc(760 * var(--u)); }
.tv-mapa img { display: block; height: 100%; width: auto; }
.tv-cel { position: absolute; border: calc(8 * var(--u)) solid var(--zolty); box-shadow: 0 0 0 calc(4 * var(--u)) var(--ciem); }
.tv-kropka { position: absolute; width: calc(30 * var(--u)); height: calc(30 * var(--u)); margin: calc(-15 * var(--u)) 0 0 calc(-15 * var(--u));
  border-radius: 50%; background: var(--tak-j); border: calc(4 * var(--u)) solid var(--ciem); }
.tv-kropka.poza { background: var(--nie-j); }
.tv-wielka-liczba { font: 700 calc(150 * var(--u))/1 var(--kond); color: var(--zolty); }

/* galeria, timer, ranking */
.tv-galeria { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(var(--kol, 3), minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: calc(32 * var(--u)); }
.tv-galeria li { min-height: 0; display: flex; flex-direction: column; background: var(--ciem2); }
.tv-galeria img { flex: 1; min-height: 0; width: 100%; object-fit: cover; display: block; }
.tv-galeria li.pierwsze { outline: calc(8 * var(--u)) solid var(--zolty); }
.tv-kafel-opis { display: flex; align-items: center; gap: calc(24 * var(--u)); padding: calc(14 * var(--u)) calc(24 * var(--u)); font: 700 calc(64 * var(--u))/1.05 var(--kond);
  white-space: nowrap; overflow: hidden; }
.tv-kafel-opis > b { color: var(--zolty); }
.tv-serca { display: inline-flex; align-items: center; gap: calc(8 * var(--u)); }
.tv-serca .ik { color: var(--nie-j); }
.tv-timer { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(24 * var(--u)); text-align: center; }
.tv-zegar-duzy { font: 700 calc(420 * var(--u))/0.85 var(--kond); }
.tv-ranking li { display: grid; grid-template-columns: calc(150 * var(--u)) 1fr auto; padding: calc(14 * var(--u)) 0; border-top: calc(4 * var(--u)) solid var(--ciem3);
  font: 700 calc(84 * var(--u))/1.1 var(--kond); }
.tv-ranking li:first-child { color: var(--zolty); }
.tv-ranking.dwie { display: grid; grid-auto-flow: column; grid-template-rows: repeat(var(--wiersze), auto); grid-template-columns: 1fr 1fr; column-gap: calc(96 * var(--u)); }

/* dopasowanie, gdy treść się nie mieści (tv_kroki.js: dopasujEkran) */
.ciasno .tv-tytul { font-size: calc(100 * var(--u)); }
.ciasno .tv-pyt { font-size: calc(72 * var(--u)); }
.ciasno .tv-werdykt { font-size: calc(112 * var(--u)); }
.ciasno .tv-odsl.duze li.poprawna { font-size: calc(84 * var(--u)); }
.ciasno .tv-tresc, .ciasno .tv-kolumna { gap: calc(20 * var(--u)); }
.ciasno .tv-opcje li { padding: calc(10 * var(--u)) 0; }
.ciasno .tv-ranking li { padding: calc(6 * var(--u)) 0; font-size: calc(72 * var(--u)); }
.ciasno2 .tv-tytul, .ciasno2 .tv-pyt, .ciasno2 .tv-werdykt, .ciasno2 .tv-odsl.duze li.poprawna { font-size: calc(64 * var(--u)); }
.ciasno2 .tv-tekst, .ciasno2 .tv-pole p, .ciasno2 .tv-lista li, .ciasno2 .tv-lista-pozycji li { font-family: var(--kond); line-height: 1.08; }

/* Telefon ucznia (ciemny) 1:1 jak u.html generatora debat (apka/styl_u.css): pasek ciem2, przyciski z obramowaniem
   w kolorze odpowiedzi, wybrany wypełniony, pola jak pole kodu, żółty przycisk główny. Główne akcje w dolnej części ekranu. */
.u-strona { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; max-width: 560px; margin: 0 auto; background: var(--ciem); color: #fff; }
.u-pasek { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding: max(10px, env(safe-area-inset-top)) 16px 10px; background: var(--ciem2); }
.u-pasek b { margin-right: auto; font: 700 22px/1.1 var(--kond); }
.u-pasek .u-zm { min-height: 44px; padding: 0 4px; border: 0; background: none; color: var(--jasny); text-decoration: underline; font-size: 14px; }
.u-ekran { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 16px 16px max(24px, env(safe-area-inset-bottom)); }
.u-gora { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.u-etyk { font-size: 14px; color: var(--jasny); }
.u-zegar { font: 700 40px/1 var(--kond); color: #fff; }
.u-zegar.malo { color: var(--zolty); }
.u-zegar.koniec { color: var(--nie-j); }
.u-ekran h2 { font: 700 26px/1.12 var(--kond); }
.u-ekran .u-pyt { font: 700 20px/1.3 var(--tekst); }
.u-ekran p { font-size: 17px; line-height: 1.45; }
.u-ekran .u-info { font-size: 15px; color: var(--jasny); }
.u-ekran .u-potw { padding: 10px 12px; background: var(--ciem3); color: #fff; font-size: 15px; }
.u-lista { counter-reset: s; display: grid; gap: 8px; }
.u-lista li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; padding-left: 12px; border-left: 3px solid var(--zolty); font-size: 17px; line-height: 1.4; }
.u-lista li::before { content: counter(s) "."; font-weight: 700; }
.u-obraz, .u-obraz-ramka img { display: block; width: 100%; height: auto; }
.u-obraz-ramka figcaption { margin-top: 4px; font-size: 14px; color: var(--jasny); }
.u-karta { display: grid; gap: 6px; padding: 12px 14px; background: var(--ciem2); }
.u-karta h3 { font: 700 22px/1.1 var(--kond); }
.u-pozycje li, .u-zrodla li { padding: 10px 0; border-bottom: 1px solid var(--ciem3); }
.u-pozycje li p { font-size: 15px; color: var(--jasny); }
.u-pozycje a, .u-zrodla a { display: inline-flex; align-items: center; min-height: 44px; font-weight: 700; }
.u-zrodla li { font-size: 15px; }

/* głosowanie: kolor plus kształt znaku */
.u-ekran .op-tak { color: var(--tak-j); }
.u-ekran .op-nie { color: var(--nie-j); }
.u-ekran .op-jesli { color: var(--zolty); }
.u-ekran .op-n { color: #fff; }
.u-glos { display: grid; gap: 10px; margin-top: 6px; }
.u-glos button { display: flex; align-items: center; gap: 16px; min-height: 104px; padding: 10px 20px; border: 3px solid; background: transparent;
  font: 700 40px/1 var(--kond); text-align: left; }
.u-glos button.op-n { font-size: 30px; }
.u-glos .op-znak, .u-glos .op-litera { width: 48px; height: 48px; }
.u-glos button[aria-pressed="true"] { background: currentColor; }
.u-glos button[aria-pressed="true"] > * { color: var(--ciem); }
.u-glos button:disabled:not([aria-pressed="true"]) { color: var(--szary); border-color: var(--ciem3); }
.u-ekran .u-werdykt { font: 700 48px/1 var(--kond); }
.u-ekran .u-werdykt.maly { font-size: 28px; }
/* odsłona: poprawna opcja wypełniona swoim kolorem, ze znakiem ✓ i napisem „Poprawna”; złe szare; twój głos podpisany */
.u-odsl { display: grid; gap: 8px; }
.u-odsl li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; min-height: 56px; padding: 8px 14px; border: 3px solid var(--ciem3);
  font: 700 24px/1.1 var(--kond); }
.u-odsl li .ik, .u-odsl li .op-litera { width: 28px; height: 28px; }
.u-ekran .u-odsl li.zla { color: var(--szary); }
.u-odsl li.poprawna { background: currentColor; border-color: currentColor; font-size: 30px; }
.u-odsl li.poprawna > * { color: var(--ciem); }
.u-odsl .odsl-tekst { flex: 1 1 auto; min-width: 0; }
.u-odsl li.poprawna > .odsl-tag { padding: 4px 10px; background: var(--ciem); color: #fff; font-size: 18px; }
.u-odsl .odsl-moja { flex-basis: 100%; font: 600 14px/1.2 var(--tekst); }
.u-odsl li.zla.moja { border-color: var(--szary); }
.u-ekran .u-znacznik { align-self: flex-start; padding: 4px 10px; background: var(--zolty); color: var(--ciem); font: 700 20px/1.2 var(--kond); }
.u-dopisek, .u-pole { display: grid; gap: 6px; }
.u-dopisek label, .u-pole label { font-weight: 600; }
.u-rzad { display: flex; gap: 8px; }
.u-rzad input { flex: 1; min-width: 0; }
.u-ekran input[type="text"], .u-pole input, .u-pole textarea { width: 100%; min-height: 56px; padding: 10px 14px; border: 2px solid #fff; border-radius: 0;
  background: var(--ciem2); color: #fff; font-size: 17px; }
.u-pole input:disabled, .u-pole textarea:disabled { border-color: var(--ciem3); color: var(--jasny); }
.u-glowny { justify-content: center; width: 100%; }
.u-ekran .u-ocena { padding: 10px 12px; background: var(--ciem3); font-weight: 700; border-left: 4px solid; }
.u-ekran .ocena-dobrze { color: var(--tak-j); }
.u-ekran .ocena-popraw { color: var(--nie-j); }

/* suwaki */
.u-suwak { display: grid; gap: 4px; padding: 10px 0; border-bottom: 1px solid var(--ciem3); }
.u-suwak label { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-weight: 600; }
.u-wartosc { font: 700 32px/1 var(--kond); }
.u-suwak input { width: 100%; height: 44px; accent-color: var(--zolty); }
.u-konce { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--jasny); }

/* stuknięcie, galeria, timer, zespoły */
.u-mapa { position: relative; }
.u-mapa img { display: block; width: 100%; height: auto; }
.u-mapa.aktywna { cursor: crosshair; }
.u-kropka { position: absolute; width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%; background: var(--tak-j); border: 3px solid var(--ciem); box-shadow: 0 0 0 2px #fff; }
.u-cel { position: absolute; border: 4px solid var(--zolty); outline: 2px solid var(--ciem); }
.u-galeria { display: grid; gap: 12px; }
.u-galeria li { background: var(--ciem2); }
.u-galeria img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.u-galeria p { padding: 8px 12px 0; }
.u-serce { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; margin: 8px 12px 12px; padding: 0 14px; border: 2px solid var(--nie-j);
  background: transparent; color: var(--nie-j); font-weight: 700; }
.u-serce[aria-pressed="true"] { background: var(--nie-j); color: var(--ciem); }
.u-serce:disabled:not([aria-pressed="true"]) { color: var(--szary); border-color: var(--ciem3); }
.u-zegar-duzy { font: 700 120px/1 var(--kond); text-align: center; }
.u-zespoly { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
.u-zespoly button { min-height: 96px; border: 3px solid #fff; background: transparent; color: #fff; font: 700 36px/1 var(--kond); }

/* wpisanie kodu, jak pole kodu w u.html */
.u-strona .wpis-kodu { display: grid; gap: 10px; padding: 24px 16px; }
.u-strona .wpis-kodu h1 { font: 700 28px/1.1 var(--kond); }
.u-strona .wpis-kodu p { color: var(--jasny); }
.u-strona .wpis-kodu label { font-weight: 600; }
.u-strona .wpis-kodu input { min-height: 56px; padding: 0 14px; border: 2px solid #fff; border-radius: 0; background: var(--ciem2); color: #fff;
  font: 700 32px/1 var(--kond); letter-spacing: .08em; text-transform: uppercase; }
.u-strona .wpis-kodu .k1-btn-gl { justify-content: center; }

/* szukanie obrazem: przyciski pod zdjęciem (kroki_wspolne.js: szukajObrazemEl) */
.u-szukaj { display: grid; gap: 6px; }
.u-szukaj .k1-btn { flex: 1 1 auto; justify-content: center; }

/* Konsola prowadzącego (ciemna) jak p.html generatora debat (apka/styl_p.css): pasek ciem2, lista kroków jak lista faz,
   przyciski sterowania 72 px z białym obramowaniem, główny biały, panele ciem2. Szeroko: trzy kolumny; tablet w pionie: dwie; telefon: jedna. */
.p-uklad { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: var(--ciem); color: #fff; }
.p-g { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; min-height: 72px; padding: 10px 24px; background: var(--ciem2); }
.p-tytul { margin-right: auto; font: 700 24px/1.1 var(--kond); }
.p-kod { color: var(--jasny); }
.p-kod b { font: 700 28px/1 var(--kond); color: var(--zolty); letter-spacing: .06em; }
.p-telefony { color: var(--jasny); white-space: nowrap; }
.p-siatka { flex: 1; display: grid; grid-template-columns: 280px minmax(0, 1fr) 340px; gap: 24px; padding: 16px 24px 24px; align-items: start; }
.p-lewa { position: sticky; top: 12px; }
.p-kroki { display: grid; gap: 2px; max-height: calc(100vh - 120px); overflow: auto; }
.p-krok { width: 100%; min-height: 44px; display: grid; grid-template-columns: 34px 1fr; gap: 0 6px; padding: 9px 12px; border: 0; border-left: 4px solid transparent;
  background: none; color: var(--jasny); font-size: 15px; text-align: left; line-height: 1.3; }
.p-krok small { grid-column: 2; font-size: 13px; color: var(--szary); }
.p-kroki li.zrob .p-krok { color: var(--szary); }
.p-kroki li.akt .p-krok { border-left-color: #fff; background: var(--ciem2); color: #fff; font-weight: 700; }
.p-srodek { display: grid; gap: 12px; min-width: 0; }
.p-srodek > .k1-meta { color: var(--jasny); }
.p-naglowek { font: 700 30px/1.08 var(--kond); }
.p-fazy { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; }
.p-fazy li { padding-top: 6px; border-top: 6px solid var(--ciem3); font-size: 13px; color: var(--jasny); }
.p-fazy li.akt { border-top-color: #fff; color: #fff; font-weight: 700; }
.p-ster { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; }
.p-wstecz, .p-dalej { min-height: 72px; padding: 0 24px; border: 2px solid #fff; background: transparent; color: #fff; font: 700 24px/1.1 var(--kond); }
.p-dalej { background: #fff; color: var(--ciem); }
.p-wstecz:disabled, .p-dalej:disabled { opacity: .5; }
.p-mowisz { padding: 4px 0 4px 16px; border-left: 4px solid var(--jasny); }
.p-mowisz small { display: block; font-size: 14px; font-weight: 600; color: var(--jasny); }
.p-mowisz p { font-size: 20px; line-height: 1.35; }
.p-timer { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 12px 16px; background: var(--ciem2); }
.p-zegar { font: 700 96px/0.9 var(--kond); }
.p-zegar.malo { color: var(--zolty); }
.p-zegar.koniec { color: var(--nie-j); }
.p-podsum, .p-pudlo { display: grid; gap: 8px; padding: 14px 16px; background: var(--ciem2); }
.p-podsum:empty { display: none; }
.p-podsum h3, .p-pudlo h3 { font: 700 20px/1.1 var(--kond); }
.p-wyniki li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--ciem3); font-size: 15px; }
.p-wyniki b { font: 700 24px/1 var(--kond); white-space: nowrap; }
.p-wyniki li.p-poprawna { margin: 0 -10px; padding: 8px 10px; background: var(--tak-j); color: var(--ciem); font-weight: 700; }
.p-wyniki li.przygas { opacity: .45; }
.p-ok { width: 18px; height: 18px; vertical-align: -3px; }
.p-wyniki .p-tag { padding: 3px 8px; background: var(--ciem); color: #fff; font: 700 15px/1.2 var(--kond); text-transform: uppercase; letter-spacing: .04em; }
.p-lista { padding-left: 20px; list-style: decimal; }
.p-lista li { padding: 4px 0; }
.p-dopiski li { padding: 6px 0; border-bottom: 1px solid var(--ciem3); font-size: 15px; overflow-wrap: anywhere; }
.p-wpisy { display: grid; gap: 8px; max-height: 60vh; overflow: auto; }
.p-wpisy li { display: grid; gap: 6px; padding: 10px 12px; border: 1px solid var(--ciem3); overflow-wrap: anywhere; }
.p-wpisy li.ukryty { color: var(--szary); border-style: dashed; }
.p-wpisy small { color: var(--jasny); font-size: 13px; }
.p-prawa { display: grid; gap: 12px; }
.p-pudlo p { font-size: 15px; line-height: 1.45; }
.p-zrodla li { padding: 6px 0; border-bottom: 1px solid var(--ciem3); font-size: 14px; overflow-wrap: anywhere; }
.p-proba { outline: 2px dashed var(--zolty); }
.p-dropbox, .p-instrukcja { justify-content: center; }
.p-plik { position: fixed; right: 16px; bottom: 16px; z-index: 20; width: min(480px, 92vw); max-height: 80vh; overflow: auto; display: grid; gap: 8px;
  padding: 12px; background: var(--ciem2); border: 2px solid #fff; color: #fff; }
.p-plik img { width: 100%; height: auto; border: 1px solid var(--ciem3); }
.p-plik textarea { width: 100%; font: 14px/1.4 var(--tekst); padding: 8px; background: var(--ciem); color: #fff; border: 1px solid var(--ciem3); }
@media (max-width: 1100px) { .p-siatka { grid-template-columns: 240px minmax(0, 1fr); } .p-prawa { grid-column: 1 / -1; } }
@media (max-width: 760px) { .p-siatka { grid-template-columns: 1fr; padding: 12px 16px; } .p-lewa { position: static; } .p-kroki { max-height: 220px; } .p-zegar { font-size: 72px; } }

/* podglad.html: jasna strona z ramkami TV (1920×1080 zmniejszone przez --u), telefonu i tabletu (ciemne, klasa k1-ciemny). */
.pg { padding: 0 24px 64px; }
.pg-glowa { max-width: 1320px; margin: 0 auto; padding: 32px 0 8px; display: grid; gap: 8px; }
.pg-glowa h1 { font: 700 40px/1.05 var(--kond); }
.pg-glowa p { max-width: 900px; color: var(--mute); }
.pg-spis { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.pg-spis a { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; padding: 0 10px; border: 1px solid var(--linia);
  background: var(--biel); color: var(--ink); text-decoration: none; font-weight: 600; }
.pg-krok { max-width: 1320px; margin: 0 auto; padding-top: 40px; display: grid; gap: 16px; }
.pg-krok > h2 { font: 700 30px/1.1 var(--kond); padding-top: 16px; border-top: 4px solid var(--ciem); }
.pg-wiersz { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
.pg-ramka { display: grid; gap: 8px; }
.pg-ramka figcaption { max-width: 768px; font-size: 14px; color: var(--mute); }
.pg-tv { --u: 0.4px; position: relative; width: 768px; height: 432px; overflow: hidden; outline: 10px solid #111; }
.pg-tel { width: 360px; height: 640px; overflow: auto; border: 10px solid #202124; border-radius: 28px; background: var(--ciem); }
.pg-tel .u-strona { min-height: 100%; }
.pg-tel .u-pasek { position: static; }
.pg-tablet { width: 1180px; max-width: 100%; border: 12px solid #202124; border-radius: 18px; background: var(--ciem); overflow: hidden; }
.pg-tablet .p-uklad { min-height: 0; }
.pg-tablet .p-lewa { position: static; }
.pg-tablet .p-kroki { max-height: 520px; }
.pg-blad { padding: 8px 12px; background: var(--nie); color: #fff; font-weight: 700; }
@media (max-width: 860px) { .pg-tv { --u: 0.18px; width: 346px; height: 194px; } }

/* Typ kroku „macierz” (typ_macierz.js): tabela na TV (jednostka --u, tekst min. 64 px) i wiersze przycisków na telefonie. */
.tv-macierz { width: 100%; border-collapse: collapse; font: 700 calc(64 * var(--u))/1.1 var(--kond); }
.tv-macierz th, .tv-macierz td { padding: calc(4 * var(--u)) calc(20 * var(--u)); border-top: calc(4 * var(--u)) solid var(--ciem3); text-align: center; }
.tv-macierz thead th { border-top: 0; color: var(--jasny); }
.tv-macierz tbody th { text-align: left; white-space: nowrap; }
.tv-macierz td { font-size: calc(72 * var(--u)); }
.tv-macierz .mz-max { color: var(--zolty); }
.tv-macierz .mz-dobra { background: var(--tak-j); color: var(--ciem); }
.tv-macierz .mz-ok { width: calc(56 * var(--u)); height: calc(56 * var(--u)); margin-right: calc(8 * var(--u)); vertical-align: calc(-6 * var(--u)); }
.tv-macierz .mz-zla { color: var(--szary); opacity: .6; }
.tv-mz-dwie { display: grid; grid-template-columns: 1fr 1fr; gap: calc(64 * var(--u)); align-items: start; }
.tv-mz-dwie .tv-macierz th, .tv-mz-dwie .tv-macierz td { padding-left: calc(12 * var(--u)); padding-right: calc(12 * var(--u)); }
.tv-mz-dwie .tv-macierz thead th:first-child { text-align: left; }
.tv-mz-obok { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.tv-mz-wiersze { display: flex; flex-wrap: wrap; gap: calc(16 * var(--u)) calc(24 * var(--u)); font: 700 calc(64 * var(--u))/1.1 var(--kond); }
.tv-mz-wiersze li { padding: calc(6 * var(--u)) calc(20 * var(--u)); background: var(--ciem2); }
/* Wpisy zespołów przy wierszach (z_kroku): skrót zespołu i wpis do 2 linii; ciasno2 (ekran się nie mieści) ucina do 1 linii. Tekst zawsze 64 px. */
.tv-mz-wpisy { display: grid; grid-auto-flow: column; grid-template-rows: repeat(var(--wiersze), auto); column-gap: calc(56 * var(--u)); align-content: start;
  font: 700 calc(64 * var(--u))/1.05 var(--kond); }
.tv-mz-wpisy.dwie { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tv-mz-wpisy li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: calc(20 * var(--u)); padding: calc(8 * var(--u)) 0;
  border-top: calc(4 * var(--u)) solid var(--ciem3); }
.tv-mz-wpisy b { color: var(--zolty); }
.tv-mz-wpisy span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.ciasno2 .tv-mz-wpisy span { -webkit-line-clamp: 1; }

.u-mz-wiersz { display: grid; gap: 6px; padding: 8px 0; border-bottom: 1px solid var(--ciem3); }
.u-mz-wiersz > b { font: 700 20px/1.2 var(--kond); }
.u-mz-wpis { font-size: 17px; line-height: 1.35; overflow-wrap: anywhere; }
.u-glos.u-mz-przyciski { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; }
.u-glos.u-mz-przyciski button { flex: 1 1 0; min-width: 52px; min-height: 52px; padding: 6px 10px; justify-content: center; font: 700 20px/1.1 var(--kond);
  text-align: center; color: #fff; }
.u-glos.u-mz-przyciski button { gap: 6px; }
.u-glos.u-mz-przyciski .mz-ok { width: 22px; height: 22px; }
/* odsłona: poprawne wypełnione ze znakiem ✓, pozostałe szare, twój błędny wybór w pomarańczowej ramce */
.u-ekran .u-glos.u-mz-przyciski button.mz-dobra { background: var(--tak-j); border-color: var(--tak-j); color: var(--ciem); }
.u-ekran .u-glos.u-mz-przyciski button.mz-dobra > * { color: var(--ciem); }
.u-ekran .u-glos.u-mz-przyciski button.mz-zla { background: transparent; border-color: var(--ciem3); color: var(--szary); }
.u-ekran .u-glos.u-mz-przyciski button.mz-zla > * { color: var(--szary); }
.u-ekran .u-glos.u-mz-przyciski button.mz-zla[aria-pressed="true"] { border-color: var(--nie-j); border-style: solid; }

/* Style typów kroków o zdjęciach: zdjecie, przerobka, wyscig, losowanie, galeria_tv, podpisy (typ_*.js). Wchodzą do wszystkich stron.
   TV w jednostce --u, najmniejszy tekst treści 64 px przy 1080p. Czerwona ramka przeróbki: jedyny kolor spoza tokenów wyglądu A (znak „tu zmieniono”). */
:root { --czerwony: #FF4D4D; }

/* zdjecie: przekreślony podpis i tabelka danych */
.tv-falszywy { font: 400 calc(64 * var(--u))/1.15 var(--kond); color: var(--jasny); }
.tv-falszywy s { text-decoration-thickness: calc(6 * var(--u)); text-decoration-color: var(--nie-j); }
/* Na TV wiersz danych to jedna linia „etykieta wartość” (długie wartości łamią się pod spodem), żeby wąska kolumna nie łamała każdej wartości. */
.tv-dane { font: 700 calc(64 * var(--u))/1.15 var(--kond); }
.tv-dane dt { display: inline; color: var(--jasny); font-weight: 400; }
.tv-dane dt::after { content: " "; }
.tv-dane dd { display: inline; margin: 0; overflow-wrap: anywhere; }
.tv-dane dd::after { content: "\A"; white-space: pre; }
.u-falszywy { padding: 10px 12px; background: var(--ciem2); border-left: 4px solid var(--nie-j); }
.u-falszywy s { text-decoration-color: var(--nie-j); text-decoration-thickness: 2px; }
.u-dane { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; font-size: 16px; }
.u-dane dt { color: var(--jasny); }
.u-dane dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; }

/* przerobka: mapa stuknięć, czerwona ramka, oryginał */
.tv-pmapa { position: relative; width: max-content; justify-self: start; }
.tv-pmapa img { display: block; height: calc(760 * var(--u)); width: auto; }
.tv-przerobka { flex: none; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: calc(48 * var(--u)); align-items: start; }
.tv-przerobka .tv-pmapa img { height: calc(520 * var(--u)); }
.tv-przerobka .tv-kolumna { overflow: visible; }
.tv-p-werdykt { font: 700 calc(96 * var(--u))/1 var(--kond); }
.cel-przerobki { position: absolute; border: calc(8 * var(--u)) solid var(--czerwony); box-shadow: 0 0 0 calc(4 * var(--u)) var(--ciem); }
/* Telefon nie ma jednostki --u: pełna ramka w pikselach (bez tego obramowanie znikało i zostawał tylko ciemny cień). */

/* wyscig: miniatury i ranking na TV, przełącznik zdjęć na telefonie */

/* Ekran startowy z długim adresem (np. adres_uczniow z ustawienia plus długa nazwa zajęć): blok QR od góry, więc nadmiar wychodzi w dół
   i dopasujEkran go widzi; przy ciasnym ekranie mniejszy kod QR, żeby adres i kod sesji się zmieściły. Dotyczy ekranu startowego wszystkich zajęć. */
.tv-start .tv-qr-blok { align-self: start; }

  border-top: calc(4 * var(--u)) solid var(--ciem3); font: 700 calc(64 * var(--u))/1.1 var(--kond); }

/* galeria_tv i podpisy: zdjęcia z komputera przy TV */
.tv-plik { position: fixed; left: -9999px; width: 1px; height: 1px; opacity: 0; }

  border: calc(4 * var(--u)) solid #fff; font: 700 calc(64 * var(--u))/1 var(--kond); cursor: pointer; }

/* przydział na telefonie */

.p-zdj-czeka { display: grid; place-items: center; font-size: 14px; color: var(--jasny); }

/* TV: zdjęcia zespołów w drodze i na ekranie */

.tv-zdj-zespolow li { display: flex; justify-content: space-between; gap: calc(32 * var(--u)); padding: calc(12 * var(--u)) 0;
  border-top: calc(4 * var(--u)) solid var(--ciem3); font: 700 calc(72 * var(--u))/1.1 var(--kond); }

.tv-zdj-zespolow.dwie { grid-auto-flow: column; grid-template-rows: repeat(var(--wiersze), auto); grid-template-columns: 1fr 1fr; column-gap: calc(64 * var(--u)); }

  background: var(--zolty); color: var(--ciem); border: 3px solid var(--ciem); font: 700 16px/1 var(--kond); }

  border-width: calc(6 * var(--u)); font-size: calc(64 * var(--u)); }

  font: 700 calc(64 * var(--u))/1.05 var(--kond); }

  font: 700 calc(64 * var(--u))/1.05 var(--kond); }

.tv-mapa-przydzial { display: grid; gap: calc(16 * var(--u)); }
.tv-mapa-przydzial li { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) auto; gap: calc(32 * var(--u)); padding: calc(14 * var(--u)) 0;
  border-top: calc(4 * var(--u)) solid var(--ciem3); font: 700 calc(72 * var(--u))/1.1 var(--kond); }

/* Typ kroku „wyzwanie” (typ_wyzwanie.js): ranking i omówienie kategorii na TV, plan zespołu na telefonie; porównanie typu i wyniku

/* Ponad 6 zespołów: dwie kolumny, bez pasków. */

<script>
const ZAJECIA = zajeciaDlaZespolow({"slug":"slad-weglowy","tytul":{"pl":"Mój ślad węglowy z wyjazdu","en":"My carbon footprint from the trip"},"opis":{"pl":"Każdy zgaduje i liczy na telefonie ślad węglowy swojego pobytu, a potem zespoły planują wyjazd z jak najmniejszym śladem. Wyniki idą na ekran bez imion.","en":"Everyone guesses and then counts the carbon footprint of their stay on a phone, and then teams plan the trip with the smallest footprint. Results go on the screen with no names."},"zespoly":{"liczba":5,"nazwa":{"pl":"Zespół","en":"Team"},"glosuja":false},"instrukcja":{"cel":{"pl":"Każdy zna swój ślad węglowy z wyjazdu, wie, które zmiany dadzą najwięcej, i umie to przeliczyć na rzeczy z życia: jazdę autem, obiad, telefon. Na koniec zespoły sprawdzają tę wiedzę w wyzwaniu.","en":"Everyone knows their carbon footprint from the trip, which changes help most, and how to turn it into everyday things: driving, a dinner, a phone. At the end teams test this knowledge in a challenge."},"przygotowanie":[{"pl":"Telewizor albo rzutnik z komputerem, konsola prowadzącego (tablet albo laptop), telefony uczniów z internetem.","en":"A TV or projector with a computer, the teacher console (tablet or laptop), students' phones with internet."},{"pl":"Sprawdź, czy dane wyjazdu w kalkulatorze się zgadzają (uwagi niżej).","en":"Check that the trip data in the calculator is right (notes below)."}],"uwagi":[{"pl":"Kalkulator liczy wyjazd autokarem: 1930 km w jedną stronę (trasa OSRM/OpenStreetMap), 10 dni, czyli 9 nocy, hotel w Grecji poza kurortem. Inny wyjazd: pole wyjazd w zajecia.json (km, dni, noce, kg_pokoj_noc, km_wycieczka), potem przebudowa.","en":"The calculator counts a coach trip: 1930 km each way (OSRM/OpenStreetMap route), 10 days, so 9 nights, a hotel in Greece outside a resort. Another trip: the wyjazd field in zajecia.json (km, dni, noce, kg_pokoj_noc, km_wycieczka), then rebuild."},{"pl":"Metoda i współczynniki są te same co w kalkulatorze „Mój ślad węglowy w Grecji” (METODA.md). Wynik to szacunek, a nie pomiar.","en":"The method and factors are the same as in the calculator “My carbon footprint in Greece” (METODA.md). The result is an estimate, not a measurement."},{"pl":"Do grupy telefon wysyła same liczby: wynik i 5 części, bez imienia i bez odpowiedzi. Kto nie stuknie „Wyślij wynik do grupy”, nie wchodzi do średniej.","en":"The phone sends only numbers to the group: the result and its 5 parts, no name and no answers. Anyone who does not tap “Send your result to the group” is not in the average."},{"pl":"Plansze „Co to znaczy w życiu” i „Wyzwanie zespołowe” liczą ten sam wyjazd co kalkulator (1930 km autokarem, 9 nocy). Przy innym wyjeździe trzeba je przeliczyć.","en":"The “What it means in real life” slides and the “Team challenge” count the same trip as the calculator (1930 km by coach, 9 nights). For another trip they must be recalculated."},{"pl":"Zespoły są potrzebne tylko do wyzwania: telefon pyta o zespół na starcie, a kalkulator i zgadywanie każdy robi sam. Liczbę zespołów wybierasz przy otwarciu zajęć.","en":"Teams are needed only for the challenge: the phone asks for a team at the start, and everyone does the calculator and the guesses alone. You choose the number of teams when you open the lesson."},{"pl":"Kroki „Co waży więcej?” nr 2 i „Drobiazgi” można pominąć, gdy brakuje czasu (strzałka w konsoli prowadzącego).","en":"The second “What weighs more?” and the “Small things” slide can be skipped when time is short (arrow in the teacher console)."}]},"zrodla":[{"nazwa":{"pl":"UK DESNZ, GHG Conversion Factors 2026 (autokar)","en":"UK DESNZ, GHG Conversion Factors 2026 (coach)"},"url":"https://www.gov.uk/government/publications/greenhouse-gas-reporting-conversion-factors-2026"},{"nazwa":{"pl":"Cornell Hotel Sustainability Benchmarking Index 2025 (hotele w Grecji)","en":"Cornell Hotel Sustainability Benchmarking Index 2025 (hotels in Greece)"},"url":"https://ecommons.cornell.edu/entities/publication/c01af4e4-060a-4c53-aacb-d4991d5e729e"},{"nazwa":{"pl":"Electricity Maps, Grid in review 2025: Greece (prąd)","en":"Electricity Maps, Grid in review 2025: Greece (electricity)"},"url":"https://www.electricitymaps.com/grid-in-review-2025/greece"},{"nazwa":{"pl":"Scarborough i in., Nature Food 2023, tabela 3 (dieta)","en":"Scarborough et al., Nature Food 2023, table 3 (diet)"},"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC10365988/"},{"nazwa":{"pl":"Botto i in. 2011 (butelka wody, sprawdzony abstrakt)","en":"Botto et al. 2011 (water bottle, abstract checked)"},"url":"https://usiena-air.unisi.it/handle/11365/7842"},{"nazwa":{"pl":"TNS NIPO 2016 za Low-tech Magazine (prysznic)","en":"TNS NIPO 2016 via Low-tech Magazine (shower)"},"url":"https://solar.lowtechmagazine.com/2019/10/mist-showers-sustainable-decadence.html"},{"nazwa":{"pl":"US EPA, Greenhouse Gas Equivalencies (drzewa)","en":"US EPA, Greenhouse Gas Equivalencies (trees)"},"url":"https://www.epa.gov/energy/greenhouse-gases-equivalencies-calculator-calculations-and-references"},{"nazwa":{"pl":"Copernicus, European State of the Climate 2025: Europa ociepla się ponad 2 razy szybciej niż średnia świata","en":"Copernicus, European State of the Climate 2025: Europe is warming more than twice as fast as the global average"},"url":"https://climate.copernicus.eu/esotc/2025/press-resources"},{"nazwa":{"pl":"National Geographic Polska, 29.06.2026: 40,5 °C w Słubicach według wstępnych danych IMGW","en":"National Geographic Polska, 29.06.2026: 40.5 °C in Słubice, first IMGW data"},"url":"https://www.national-geographic.pl/przyroda/polska-w-objeciach-ekstremalnej-pogody-rekord-ciepla-nawalnice-i-kolejna-fala-upalow-na-horyzoncie/"},{"nazwa":{"pl":"ICAP, 10.03.2026: ETS2 (paliwa do budynków i transportu drogowego) od 1.01.2028","en":"ICAP, 10.03.2026: ETS2 (fuels for buildings and road transport) from 1.01.2028"},"url":"https://icapcarbonaction.com/en/news/eu-reaches-agreement-2040-climate-target-postpones-ets-2-one-year"},{"nazwa":{"pl":"UK DESNZ, metodologia 2026, pkt 8.37 i 8.38 (odległość lotu)","en":"UK DESNZ, methodology 2026, 8.37 and 8.38 (flight distance)"},"url":"https://assets.publishing.service.gov.uk/media/6a2940543b15d05a7ce3202e/2026-GHG-conversion-factors-methodology-report.pdf"},{"nazwa":{"pl":"ADEME, Impact CO2: smartfon","en":"ADEME, Impact CO2: smartphone"},"url":"https://impactco2.fr/outils/numerique/smartphone"},{"nazwa":{"pl":"ADEME, Impact CO2: koszulka bawełniana","en":"ADEME, Impact CO2: cotton T-shirt"},"url":"https://impactco2.fr/outils/habillement/tshirtencoton"},{"nazwa":{"pl":"ADEME, Impact CO2: wszystkie wartości (bluza bawełniana)","en":"ADEME, Impact CO2: all values (cotton sweatshirt)"},"url":"https://impactco2.fr/equivalents.csv"},{"nazwa":{"pl":"ADEME, Impact CO2: obiad z wołowiną, z kurczakiem, wegetariański","en":"ADEME, Impact CO2: beef, chicken and vegetarian meal"},"url":"https://impactco2.fr/outils/alimentation/repasavecduboeuf"},{"nazwa":{"pl":"ADEME, Impact CO2: woda butelkowana","en":"ADEME, Impact CO2: bottled water"},"url":"https://impactco2.fr/outils/boisson/eauenbouteille"},{"nazwa":{"pl":"US EPA, Greenhouse Gas Equivalencies (telefon, ładowarka)","en":"US EPA, Greenhouse Gas Equivalencies (phone, charger)"},"url":"https://www.epa.gov/energy/greenhouse-gas-equivalencies-calculator-calculations-and-references"},{"nazwa":{"pl":"US EPA, WaterSense Kids (wanna, prysznic, kran)","en":"US EPA, WaterSense Kids (bath, shower, tap)"},"url":"https://www.epa.gov/watersense/watersense-kids"},{"nazwa":{"pl":"US EPA, WaterSense: słuchawki prysznicowe","en":"US EPA, WaterSense: showerheads"},"url":"https://www.epa.gov/watersense/showerheads"},{"nazwa":{"pl":"Electricity Maps, Grid in review 2025: Poland","en":"Electricity Maps, Grid in review 2025: Poland"},"url":"https://www.electricitymaps.com/grid-in-review-2025/poland"},{"nazwa":{"pl":"Eurostat, odpady żywności w UE 2024","en":"Eurostat, food waste in the EU 2024"},"url":"https://ec.europa.eu/eurostat/statistics-explained/index.php?title=Food_waste_and_food_waste_prevention_-_estimates"},{"nazwa":{"pl":"Wikipedia: lotniska Warszawa Chopin i Saloniki (współrzędne)","en":"Wikipedia: Warsaw Chopin and Thessaloniki airports (coordinates)"},"url":"https://en.wikipedia.org/wiki/Thessaloniki_Airport"},{"nazwa":{"pl":"OpenStreetMap: OSRM (trasa z lotniska)","en":"OpenStreetMap: OSRM (route from the airport)"},"url":"https://router.project-osrm.org/"}],"kroki":[{"id":"start","typ":"info","tytul":{"pl":"Mój ślad węglowy z wyjazdu","en":"My carbon footprint from the trip"},"qr":true,"tresc":{"pl":"Zeskanuj kod. Policzysz, ile CO2 powoduje twój pobyt: przejazd, nocleg, jedzenie i to, co robisz na miejscu.","en":"Scan the code. You will count how much CO2 your stay causes: travel, hotel, food and what you do there."},"mowisz":{"pl":"Ślad węglowy to ilość CO2, którą powoduje to, co robimy: jak jedziemy, gdzie śpimy, co jemy. CO2 to gaz, który ociepla klimat. Dziś każdy policzy swój ślad z wyjazdu.","en":"A carbon footprint is the amount of CO2 caused by what we do: how we travel, where we sleep, what we eat. CO2 is a gas that warms the climate. Today everyone will count their own footprint from the trip."}},{"id":"zgadnij-kg","typ":"suwaki","naglowek":{"pl":"Zgadnij","en":"Guess"},"pytanie":{"pl":"Ile kg CO2 zostawisz przez cały wyjazd?","en":"How many kg of CO2 will you leave during the whole trip?"},"suwaki":[{"etykieta":{"pl":"kg CO2 na osobę","en":"kg CO2 per person"},"min":0,"max":1000,"krok":10,"start":0,"lewy":{"pl":"0 kg","en":"0 kg"},"prawy":{"pl":"1000 kg","en":"1000 kg"}}],"mowisz":{"pl":"Zanim policzymy, zgadnijcie. Przesuńcie suwak: ile kilogramów CO2 zostawi każdy z was przez cały wyjazd, razem z przejazdem? Zapamiętajcie swój typ, za chwilę telefon wam go pokaże obok wyniku.","en":"Before we count, guess. Move the slider: how many kilograms of CO2 will each of you leave during the whole trip, including the journey? Remember your guess, your phone will show it next to your result."}},{"id":"zgadnij-co","typ":"wybor","naglowek":{"pl":"Zgadnij","en":"Guess"},"pytanie":{"pl":"Co z wyjazdu zostawia u ciebie największy ślad?","en":"What part of the trip leaves your biggest footprint?"},"pozycje":[{"tekst":{"pl":"Przejazd autokarem","en":"Coach journey"},"czesc":"przejazd"},{"tekst":{"pl":"Jedzenie","en":"Food"},"czesc":"jedzenie"},{"tekst":{"pl":"Prysznic","en":"Shower"},"czesc":"nocleg"},{"tekst":{"pl":"Klimatyzacja","en":"Air conditioning"},"czesc":"nocleg"},{"tekst":{"pl":"Butelki wody","en":"Water bottles"},"czesc":"woda"}],"mowisz":{"pl":"Teraz drugie pytanie: co waży u was najwięcej? Jeden wybór.","en":"Second question: what weighs the most for you? One choice."}},{"id":"slad","typ":"kalkulator","naglowek":{"pl":"Mój ślad węglowy z wyjazdu","en":"My carbon footprint from the trip"},"pytanie":{"pl":"Policz swój ślad węglowy z wyjazdu","en":"Count your carbon footprint from the trip"},"wyjazd":{"km":1930,"dni":10,"noce":9},"mowisz":{"zbieranie":{"pl":"Otwórzcie kalkulator na telefonie. 8 pytań, jeden dotyk na każde. Gdy zobaczycie wynik, stuknijcie „Wyślij wynik do grupy”. Imienia nie wysyłacie.","en":"Open the calculator on your phone. 8 questions, one tap each. When you see your result, tap “Send your result to the group”. You don't send your name."},"wyniki":{"pl":"Przejazd jest taki sam dla wszystkich, tego nie zmienicie. Co z reszty zależy od was?","en":"The journey is the same for everyone, you can't change it. What else depends on you?"},"porownanie":{"pl":"Spójrzcie na telefon: wasz typ i wasz wynik. Kto trafił prawie dokładnie? Popatrzcie na ekran: częściej zaniżamy czy zawyżamy? Przejazd i jedzenie łatwo przeoczyć, a światło i butelki widać od razu. Za chwilę sprawdzimy, ile naprawdę ważą te drobiazgi.","en":"Look at your phone: your guess and your result. Who got it almost right? Look at the screen: do we guess too low or too high more often? The journey and food are easy to miss, but lights and bottles are easy to see. In a moment we will check how much these small things really weigh."}},"dla_prowadzacego":{"tekst":{"pl":"Prysznic, klimatyzacja i światło są liczone w noclegu jako różnica od średniej. Rady z liczbą kilogramów każdy widzi pod swoim wynikiem.","en":"Shower, air conditioning and lights are counted in the hotel figure as a difference from the average. Everyone sees tips with kilograms under their result."},"zrodla":[{"nazwa":{"pl":"UK DESNZ, GHG Conversion Factors 2026 (autokar)","en":"UK DESNZ, GHG Conversion Factors 2026 (coach)"},"url":"https://www.gov.uk/government/publications/greenhouse-gas-reporting-conversion-factors-2026"},{"nazwa":{"pl":"Cornell Hotel Sustainability Benchmarking Index 2025 (hotele w Grecji)","en":"Cornell Hotel Sustainability Benchmarking Index 2025 (hotels in Greece)"},"url":"https://ecommons.cornell.edu/entities/publication/c01af4e4-060a-4c53-aacb-d4991d5e729e"},{"nazwa":{"pl":"Electricity Maps, Grid in review 2025: Greece (prąd)","en":"Electricity Maps, Grid in review 2025: Greece (electricity)"},"url":"https://www.electricitymaps.com/grid-in-review-2025/greece"},{"nazwa":{"pl":"Scarborough i in., Nature Food 2023, tabela 3 (dieta)","en":"Scarborough et al., Nature Food 2023, table 3 (diet)"},"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC10365988/"},{"nazwa":{"pl":"Botto i in. 2011 (butelka wody, sprawdzony abstrakt)","en":"Botto et al. 2011 (water bottle, abstract checked)"},"url":"https://usiena-air.unisi.it/handle/11365/7842"},{"nazwa":{"pl":"TNS NIPO 2016 za Low-tech Magazine (prysznic)","en":"TNS NIPO 2016 via Low-tech Magazine (shower)"},"url":"https://solar.lowtechmagazine.com/2019/10/mist-showers-sustainable-decadence.html"},{"nazwa":{"pl":"US EPA, Greenhouse Gas Equivalencies (drzewa)","en":"US EPA, Greenhouse Gas Equivalencies (trees)"},"url":"https://www.epa.gov/energy/greenhouse-gases-equivalencies-calculator-calculations-and-references"}]},"porownanie":"zgadnij-kg","odslona":{"tekst":{"pl":"Prysznic i klimatyzacja są w noclegu. Najwięcej daje przejazd, a z rzeczy, które zależą od was, jedzenie.","en":"Shower and air conditioning are part of the hotel. The journey gives the most, and of the things you control, food."}},"zgadywanie":{"kg":"zgadnij-kg","czesc":"zgadnij-co"}},{"id":"zycie-przejazd","typ":"info","tytul":{"pl":"Przejazd: 178 kg na osobę","en":"Journey: 178 kg per person"},"lista":[{"pl":"Tyle co 850 km jednym autem.","en":"As much as 850 km in one car."},{"pl":"Ponad rok wożenia autem do szkoły, 2 km w jedną stronę.","en":"More than a year of being driven 2 km to school."},{"pl":"Samolot dałby ok. 340 kg, prawie 2 razy więcej.","en":"A plane would give about 340 kg, almost twice as much."}],"pozycje":{"tytul":{"pl":"Źródła","en":"Sources"},"lista":[{"nazwa":"DESNZ 2026","url":"https://www.gov.uk/government/publications/greenhouse-gas-reporting-conversion-factors-2026"},{"nazwa":"Wikipedia, OpenStreetMap","url":"https://en.wikipedia.org/wiki/Thessaloniki_Airport"}]},"mowisz":{"pl":"Przejazd to największa część waszego śladu, u większości ponad połowa. Na tym wyjeździe go nie zmienicie, ale za kilka lat to wy wybierzecie, czym jedziecie na wakacje. Autokar to jeden z najlepszych wyborów: samolot do Salonik to prawie 2 razy więcej, auta rodziców po 4 osoby ok. 200 kg. Kogo z was rodzice wożą autem do szkoły? 2 km w jedną stronę przez cały rok szkolny to ok. 150 kg, prawie tyle co nasz autokar w obie strony.","en":"The journey is the biggest part of your footprint, for most of you more than half. You can't change it on this trip, but in a few years you will choose how you travel on holiday. The coach is one of the best choices: a plane to Thessaloniki is almost twice as much, parents' cars with 4 people each about 200 kg. Who gets a lift to school by car? 2 km each way for a whole school year is about 150 kg, almost as much as our coach there and back."},"dla_prowadzacego":{"tekst":{"pl":"Autokar: 2 × 1930 km × 0,04604 = 177,7 kg (DESNZ). Auto: średnie auto 0,2099 kg/km (DESNZ 2026, spalanie 0,16591 + paliwo 0,04399), 177,7 ÷ 0,2099 = 847 km. Do szkoły: 2 km w jedną stronę, 180 dni nauki, 720 km × 0,2099 = 151 kg w rok. Samolot Warszawa do Salonik: 1304 km po kole wielkim (współrzędne lotnisk; 8% dopłaty DESNZ jest już we współczynniku), 2 × 1304 × 0,12572 (z dodatkowym ociepleniem na wysokości i z paliwem) = 328 kg, plus autokar z lotniska 2 × 118 km × 0,04604 = 11 kg, razem 339 kg. Bez dodatkowego ocieplenia (same spaliny) 222 kg. Dojazd na lotnisko w Polsce pominięty. Auta po 4 osoby: 2 × 1930 × 0,2099 ÷ 4 = 203 kg. Wycieczka 120 km autokarem: 5,5 kg na osobę, tyle co 26 km autem.","en":"Coach: 2 × 1930 km × 0.04604 = 177.7 kg (DESNZ). Car: average car 0.2099 kg/km (DESNZ 2026, burning 0.16591 + fuel 0.04399), 177.7 ÷ 0.2099 = 847 km. To school: 2 km each way, 180 school days, 720 km × 0.2099 = 151 kg a year. Plane Warsaw to Thessaloniki: 1304 km great-circle distance (airport coordinates; the 8% DESNZ uplift is already in the factor), 2 × 1304 × 0.12572 (with the extra warming at altitude and with fuel) = 328 kg, plus a coach from the airport 2 × 118 km × 0.04604 = 11 kg, 339 kg in total. Without the extra warming (exhaust only) 222 kg. The trip to the airport in Poland is left out. Cars with 4 people: 2 × 1930 × 0.2099 ÷ 4 = 203 kg. A 120 km coach trip: 5.5 kg per person, as much as 26 km by car."},"zrodla":[{"nazwa":{"pl":"UK DESNZ, GHG Conversion Factors 2026 (auto, autokar, samolot)","en":"UK DESNZ, GHG Conversion Factors 2026 (car, coach, plane)"},"url":"https://www.gov.uk/government/publications/greenhouse-gas-reporting-conversion-factors-2026"},{"nazwa":{"pl":"UK DESNZ, metodologia 2026, pkt 8.37 i 8.38 (odległość lotu)","en":"UK DESNZ, methodology 2026, 8.37 and 8.38 (flight distance)"},"url":"https://assets.publishing.service.gov.uk/media/6a2940543b15d05a7ce3202e/2026-GHG-conversion-factors-methodology-report.pdf"},{"nazwa":{"pl":"Wikipedia: lotniska Warszawa Chopin i Saloniki (współrzędne)","en":"Wikipedia: Warsaw Chopin and Thessaloniki airports (coordinates)"},"url":"https://en.wikipedia.org/wiki/Thessaloniki_Airport"},{"nazwa":{"pl":"OpenStreetMap: OSRM (trasa z lotniska)","en":"OpenStreetMap: OSRM (route from the airport)"},"url":"https://router.project-osrm.org/"}]}},{"id":"wiecej-1","typ":"glos","naglowek":{"pl":"Co waży więcej?","en":"What weighs more?"},"pytanie":{"pl":"Co dokłada więcej CO2 na osobę?","en":"What adds more CO2 per person?"},"opcje":[{"tekst":{"pl":"Klimatyzacja włączona cały czas przez cały wyjazd","en":"Air conditioning on all the time for the whole trip"}},{"tekst":{"pl":"Samolot zamiast autokaru","en":"A plane instead of the coach"}}],"poprawna":1,"odslona":{"tekst":{"pl":"Samolot: ok. 160 kg więcej. Klimatyzacja cały czas: ok. 14 kg więcej.","en":"Plane: about 160 kg more. Air conditioning all the time: about 14 kg more."}},"mowisz":{"glosowanie":{"pl":"Dwie rzeczy, które słychać w wiadomościach. Która dokłada więcej?","en":"Two things you hear about in the news. Which one adds more?"},"odslona":{"pl":"Samolot dokłada ponad 10 razy więcej niż klimatyzacja włączona bez przerwy. Kto zgadł?","en":"The plane adds more than 10 times as much as air conditioning that never stops. Who guessed right?"}},"dla_prowadzacego":{"tekst":{"pl":"Samolot: 339 − 178 = 161 kg. Klimatyzacja „prawie cały czas” (20 h na dobę) zamiast wyłączonej: 0,8 kW, 9 nocy, prąd w Grecji 0,296 kg/kWh, 3 osoby w pokoju: 14,2 kg (model kalkulatora). W porównaniu z klimatyzacją tylko przy was (8 h): 8,5 kg. 161 ÷ 14,2 = 11.","en":"Plane: 339 − 178 = 161 kg. Air conditioning “almost all the time” (20 h a day) instead of off: 0.8 kW, 9 nights, electricity in Greece 0.296 kg/kWh, 3 people in the room: 14.2 kg (calculator model). Compared with air conditioning only when you are in (8 h): 8.5 kg. 161 ÷ 14.2 = 11."},"zrodla":[{"nazwa":{"pl":"UK DESNZ, GHG Conversion Factors 2026 (auto, autokar, samolot)","en":"UK DESNZ, GHG Conversion Factors 2026 (car, coach, plane)"},"url":"https://www.gov.uk/government/publications/greenhouse-gas-reporting-conversion-factors-2026"},{"nazwa":{"pl":"Electricity Maps, Grid in review 2025: Greece","en":"Electricity Maps, Grid in review 2025: Greece"},"url":"https://www.electricitymaps.com/grid-in-review-2025/greece"}]}},{"id":"zycie-pokoj","typ":"info","tytul":{"pl":"Pokój: im więcej osób, tym mniej na każdą","en":"Room: more people, less for each"},"lista":[{"pl":"Sam w pokoju: 147 kg. We czwórkę: 37 kg na osobę.","en":"Alone in a room: 147 kg. Four in a room: 37 kg each."},{"pl":"Różnica 110 kg to tyle, co 22 obiady z wołowiną.","en":"The difference of 110 kg is as much as 22 beef dinners."}],"pozycje":{"tytul":{"pl":"Źródła","en":"Sources"},"lista":[{"nazwa":"Cornell 2025","url":"https://ecommons.cornell.edu/entities/publication/c01af4e4-060a-4c53-aacb-d4991d5e729e"},{"nazwa":"ADEME Impact CO2","url":"https://impactco2.fr/outils/alimentation/repasavecduboeuf"}]},"mowisz":{"pl":"Hotel zużywa prąd i ogrzewanie, a kalkulator dzieli to na osoby w pokoju. W domu jest tak samo: rachunek za prąd i ogrzewanie dzieli się na wszystkich domowników. Dlatego wspólny pokój to dobry wybór, nie kara.","en":"The hotel uses electricity and heating, and the calculator shares it between the people in the room. At home it is the same: the bill for electricity and heating is shared by everyone who lives there. So sharing a room is a good choice, not a punishment."},"dla_prowadzacego":{"tekst":{"pl":"16,3 kg na pokój i noc (Cornell, hotele w Grecji poza kurortem) × 9 nocy ÷ liczba osób: 146,7 / 73,4 / 48,9 / 36,7 kg. 110 kg ÷ 4,97 kg (obiad z wołowiną, ADEME, Agribalyse) = 22.","en":"16.3 kg per room per night (Cornell, hotels in Greece outside resorts) × 9 nights ÷ number of people: 146.7 / 73.4 / 48.9 / 36.7 kg. 110 kg ÷ 4.97 kg (beef dinner, ADEME, Agribalyse) = 22."},"zrodla":[{"nazwa":{"pl":"Cornell Hotel Sustainability Benchmarking Index 2025 (hotele w Grecji)","en":"Cornell Hotel Sustainability Benchmarking Index 2025 (hotels in Greece)"},"url":"https://ecommons.cornell.edu/entities/publication/c01af4e4-060a-4c53-aacb-d4991d5e729e"},{"nazwa":{"pl":"ADEME, Impact CO2: obiad z wołowiną, z kurczakiem, wegetariański","en":"ADEME, Impact CO2: beef, chicken and vegetarian meal"},"url":"https://impactco2.fr/outils/alimentation/repasavecduboeuf"}]}},{"id":"zycie-talerz","typ":"info","tytul":{"pl":"Talerz: największa rzecz, którą zmieniasz sam","en":"Your plate: the biggest thing you change yourself"},"lista":[{"pl":"Obiad z wołowiną: 5 kg CO2. Wegetariański: niecały 1 kg.","en":"Beef dinner: 5 kg CO2. Vegetarian dinner: less than 1 kg."},{"pl":"Obiad wegetariański zamiast wołowiny raz w tygodniu przez rok szkolny: ok. 150 kg mniej.","en":"A vegetarian dinner instead of beef once a week for a school year: about 150 kg less."}],"pozycje":{"tytul":{"pl":"Źródła","en":"Sources"},"lista":[{"nazwa":"ADEME Impact CO2","url":"https://impactco2.fr/outils/alimentation/repasavecduboeuf"},{"nazwa":"Eurostat 2024","url":"https://ec.europa.eu/eurostat/statistics-explained/index.php?title=Food_waste_and_food_waste_prevention_-_estimates"}]},"mowisz":{"pl":"Jedzenie na wyjeździe to od 42 do 102 kg na osobę, zależnie od tego, ile jecie mięsa. To jedyna duża część, którą każdy zmienia sam, przy każdym posiłku. W szkolnej stołówce działa to tak samo. Nie chodzi o to, żeby nigdy nie jeść mięsa: jeden obiad z wołowiną zamieniony na wegetariański to ok. 4 kg mniej, tyle co 20 km autem. Kurczak zamiast wołowiny też dużo daje: 1,5 kg zamiast 5. I bierzcie tyle, ile zjecie. W UE w domach wyrzucamy 69 kg jedzenia na osobę w roku, a w restauracjach i stołówkach jeszcze 15 kg.","en":"Food on the trip is 42 to 102 kg per person, depending on how much meat you eat. It is the only big part that everyone changes alone, at every meal. The school canteen works the same way. It's not about never eating meat: one beef dinner swapped for a vegetarian one is about 4 kg less, as much as 20 km by car. Chicken instead of beef also helps a lot: 1.5 kg instead of 5. And take as much as you will eat. In the EU, homes throw away 69 kg of food per person a year, and restaurants and canteens another 15 kg."},"dla_prowadzacego":{"tekst":{"pl":"Wyjazd: 10 dni × 4,16 / 5,37 / 7,04 / 10,24 kg (Scarborough, tabela 3). Obiady ADEME (Agribalyse 3.2): wołowina 4,97, kurczak 1,46, wegetariański 0,85 kg; 150 g mięsa, 300 g warzyw, deser, chleb. Różnica 4,12 kg × 36 tygodni (180 dni ÷ 5, założenie) = 148 kg; 4,12 ÷ 0,2099 = 20 km. Eurostat 2024: 129 kg odpadów żywności na mieszkańca UE, 69 kg w domach, 15 kg restauracje i stołówki. Dane ADEME są francuskie, diety z Wielkiej Brytanii; dla Polski może być inaczej.","en":"Trip: 10 days × 4.16 / 5.37 / 7.04 / 10.24 kg (Scarborough, table 3). ADEME meals (Agribalyse 3.2): beef 4.97, chicken 1.46, vegetarian 0.85 kg; 150 g of meat, 300 g of vegetables, dessert, bread. Difference 4.12 kg × 36 weeks (180 days ÷ 5, assumption) = 148 kg; 4.12 ÷ 0.2099 = 20 km. Eurostat 2024: 129 kg of food waste per EU resident, 69 kg at home, 15 kg in restaurants and canteens. ADEME data are French, diet data British; for Poland they may differ."},"zrodla":[{"nazwa":{"pl":"ADEME, Impact CO2: obiad z wołowiną, z kurczakiem, wegetariański","en":"ADEME, Impact CO2: beef, chicken and vegetarian meal"},"url":"https://impactco2.fr/outils/alimentation/repasavecduboeuf"},{"nazwa":{"pl":"Eurostat, odpady żywności w UE 2024","en":"Eurostat, food waste in the EU 2024"},"url":"https://ec.europa.eu/eurostat/statistics-explained/index.php?title=Food_waste_and_food_waste_prevention_-_estimates"},{"nazwa":{"pl":"Scarborough i in., Nature Food 2023, tabela 3 (dieta)","en":"Scarborough et al., Nature Food 2023, table 3 (diet)"},"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC10365988/"}]}},{"id":"wiecej-2","typ":"glos","naglowek":{"pl":"Co waży więcej?","en":"What weighs more?"},"pytanie":{"pl":"Co oszczędza więcej CO2?","en":"What saves more CO2?"},"opcje":[{"tekst":{"pl":"Gaszenie światła i wyjmowanie ładowarki przez cały wyjazd","en":"Switching off the light and unplugging the charger for the whole trip"}},{"tekst":{"pl":"Jeden dzień bez mięsa","en":"One day without meat"}}],"poprawna":1,"odslona":{"tekst":{"pl":"Dzień bez mięsa: ok. 3 kg. Światło i ładowarki przez cały wyjazd: mniej niż 1 kg.","en":"A day without meat: about 3 kg. Lights and chargers for the whole trip: less than 1 kg."}},"mowisz":{"glosowanie":{"pl":"Która z tych dwóch rzeczy oszczędza więcej CO2?","en":"Which of these two things saves more CO2?"},"odslona":{"pl":"Gaszenie światła jest dobre, ale jeden dzień bez mięsa daje kilka razy więcej niż światło przez cały wyjazd.","en":"Switching off the light is good, but one day without meat gives several times more than the light for the whole trip."}},"dla_prowadzacego":{"tekst":{"pl":"Dzień bez mięsa: 7,04 − 4,16 = 2,88 kg (Scarborough). Światło i ładowarki: cały zakres odpowiedzi w modelu kalkulatora to 0,3 kg na wyjazd przy 3 osobach w pokoju, 0,9 kg dla osoby samej.","en":"A day without meat: 7.04 − 4.16 = 2.88 kg (Scarborough). Lights and chargers: the whole range of answers in the calculator model is 0.3 kg for the trip with 3 people in the room, 0.9 kg for someone alone."},"zrodla":[{"nazwa":{"pl":"Scarborough i in., Nature Food 2023, tabela 3 (dieta)","en":"Scarborough et al., Nature Food 2023, table 3 (diet)"},"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC10365988/"},{"nazwa":{"pl":"Electricity Maps, Grid in review 2025: Greece","en":"Electricity Maps, Grid in review 2025: Greece"},"url":"https://www.electricitymaps.com/grid-in-review-2025/greece"}]}},{"id":"zycie-prad","typ":"info","tytul":{"pl":"Prąd: prysznic i klimatyzacja","en":"Electricity: shower and air conditioning"},"lista":[{"pl":"1 minuta gorącego prysznica: prąd na 10 naładowań telefonu.","en":"1 minute of hot shower: power for 10 phone charges."},{"pl":"1 godzina klimatyzacji: 42 naładowania telefonu.","en":"1 hour of air conditioning: 42 phone charges."},{"pl":"Ten sam prąd w Polsce daje ponad 2 razy więcej CO2 niż w Grecji.","en":"The same electricity in Poland gives more than twice as much CO2 as in Greece."}],"pozycje":{"tytul":{"pl":"Źródła","en":"Sources"},"lista":[{"nazwa":"US EPA","url":"https://www.epa.gov/energy/greenhouse-gas-equivalencies-calculator-calculations-and-references"},{"nazwa":"Electricity Maps 2025","url":"https://www.electricitymaps.com/grid-in-review-2025/poland"}]},"mowisz":{"pl":"W Grecji w 2025 r. kilowatogodzina prądu dawała 296 g CO2, w Polsce 677 g, bo u nas wciąż dużo prądu pochodzi z węgla. Dlatego ten sam prysznic w domu, jeśli wodę grzeje prąd, daje ok. 0,14 kg CO2 na minutę. 5 minut krócej każdego dnia przez rok to ok. 17 000 litrów wody, czyli 65 dużych wanien. Klimatyzację w upał włączajcie, bo w upale trzeba się wyspać. Wyłączajcie ją, gdy wychodzicie: działająca cały czas to ok. 14 kg na osobę, włączana tylko przy was ok. 6 kg.","en":"In 2025 one kilowatt-hour of electricity gave 296 g of CO2 in Greece and 677 g in Poland, because a lot of our electricity still comes from coal. So the same shower at home, if electricity heats the water, gives about 0.14 kg of CO2 per minute. 5 minutes shorter every day for a year is about 17,000 litres of water, or 65 large bathtubs. Use air conditioning in the heat, because you need to sleep. Switch it off when you go out: running all the time it is about 14 kg per person, only when you are in about 6 kg."},"dla_prowadzacego":{"tekst":{"pl":"Minuta: 8,6 l × 20 °C × 1,163 Wh = 0,2 kWh (model); naładowanie telefonu 0,019 kWh (EPA), 0,2 ÷ 0,019 = 10,5. Klimatyzacja 0,8 kW ÷ 0,019 = 42. Prąd: Electricity Maps 2025, Polska 676,6 g, Grecja 296,3 g CO2e/kWh; 0,2 × 0,677 = 0,135 kg. Woda: 2,5 galona (9,46 l) na minutę (EPA) × 5 × 365 = 17 265 l ÷ 265 l (wanna, EPA) = 65. Klimatyzacja na osobę (3 osoby w pokoju, 9 nocy, 0,296 kg/kWh): 20 h na dobę 14,2 kg, 8 h na dobę 5,7 kg (model kalkulatora). W wielu domach wodę grzeje gaz albo ciepło z sieci, wtedy CO2 jest inne; liczba litrów zostaje.","en":"One minute: 8.6 l × 20 °C × 1.163 Wh = 0.2 kWh (model); one phone charge 0.019 kWh (EPA), 0.2 ÷ 0.019 = 10.5. Air conditioning 0.8 kW ÷ 0.019 = 42. Electricity: Electricity Maps 2025, Poland 676.6 g, Greece 296.3 g CO2e/kWh; 0.2 × 0.677 = 0.135 kg. Water: 2.5 gallons (9.46 l) a minute (EPA) × 5 × 365 = 17,265 l ÷ 265 l (bathtub, EPA) = 65. Air conditioning per person (3 people in the room, 9 nights, 0.296 kg/kWh): 20 h a day 14.2 kg, 8 h a day 5.7 kg (calculator model). In many homes gas or district heating heats the water, then the CO2 is different; the litres stay the same."},"zrodla":[{"nazwa":{"pl":"US EPA, Greenhouse Gas Equivalencies (telefon, ładowarka)","en":"US EPA, Greenhouse Gas Equivalencies (phone, charger)"},"url":"https://www.epa.gov/energy/greenhouse-gas-equivalencies-calculator-calculations-and-references"},{"nazwa":{"pl":"US EPA, WaterSense Kids (wanna, prysznic, kran)","en":"US EPA, WaterSense Kids (bath, shower, tap)"},"url":"https://www.epa.gov/watersense/watersense-kids"},{"nazwa":{"pl":"US EPA, WaterSense: słuchawki prysznicowe","en":"US EPA, WaterSense: showerheads"},"url":"https://www.epa.gov/watersense/showerheads"},{"nazwa":{"pl":"Electricity Maps, Grid in review 2025: Poland","en":"Electricity Maps, Grid in review 2025: Poland"},"url":"https://www.electricitymaps.com/grid-in-review-2025/poland"},{"nazwa":{"pl":"Electricity Maps, Grid in review 2025: Greece","en":"Electricity Maps, Grid in review 2025: Greece"},"url":"https://www.electricitymaps.com/grid-in-review-2025/greece"}]}},{"id":"zycie-drobiazgi","typ":"info","tytul":{"pl":"Drobiazgi: światło, ładowarka, butelki, telefon","en":"Small things: lights, chargers, bottles, phone"},"lista":[{"pl":"Światło i ładowarki przez cały wyjazd: najwyżej ok. 1 kg.","en":"Lights and chargers for the whole trip: about 1 kg at most."},{"pl":"Litr wody z butelki ma ślad jak 2430 litrów z kranu.","en":"One litre of bottled water has the footprint of 2,430 litres of tap water."},{"pl":"Nowy telefon: 80 kg, z tego 79 kg w fabryce.","en":"A new phone: 80 kg, 79 kg of it in the factory."}],"pozycje":{"tytul":{"pl":"Źródła","en":"Sources"},"lista":[{"nazwa":"US EPA","url":"https://www.epa.gov/energy/greenhouse-gas-equivalencies-calculator-calculations-and-references"},{"nazwa":"ADEME Impact CO2","url":"https://impactco2.fr/outils/numerique/smartphone"}]},"mowisz":{"pl":"Gaszenie światła jest dobre, ale to najmniejsza rzecz w kalkulatorze. Telefon, który został w ładowarce po naładowaniu, pobiera 0,4 W: przez cały rok to w Polsce ok. 2,4 kg CO2, mniej niż jeden dzień bez mięsa. Za to sam telefon to 80 kg, prawie wszystko przy produkcji. Ładowanie przez 2,5 roku to niecały kilogram. Najwięcej dla klimatu robi telefon, który służy dłużej: przy 2,5 roku to 32 kg na rok, przy 3,5 roku 23 kg. Butelki: woda z kranu ma ślad tysiące razy mniejszy.","en":"Switching off the light is good, but it's the smallest thing in the calculator. A phone left on the charger after it is full uses 0.4 W: for a whole year in Poland that's about 2.4 kg of CO2, less than one day without meat. The phone itself is 80 kg, almost all from making it. Charging it for 2.5 years is less than a kilogram. What helps most is a phone that lasts longer: over 2.5 years it's 32 kg a year, over 3.5 years 23 kg. Bottles: tap water has a footprint thousands of times smaller."},"dla_prowadzacego":{"tekst":{"pl":"0,411 W × 8760 h = 3,6 kWh (EPA), × 0,677 = 2,4 kg. Smartfon ADEME/ARCEP 2025: 80,2 kg, produkcja 79,3 kg, używanie 0,64 kg przez 2,5 roku; 80,2 ÷ 2,5 = 32,1; 80,2 ÷ 3,5 = 22,9. Światło i ładowarki w kalkulatorze: cały zakres odpowiedzi to 0,3 kg na wyjazd przy 3 osobach w pokoju, 0,9 kg dla osoby samej. Woda: ADEME 321 g CO2e na litr z butelki, strona porównuje z 2430 l z kranu. Model kalkulatora liczy butelkę z Botto (0,11 kg na 0,5 l), ADEME daje 0,16 kg; oba to ten sam rząd wielkości.","en":"0.411 W × 8760 h = 3.6 kWh (EPA), × 0.677 = 2.4 kg. Smartphone ADEME/ARCEP 2025: 80.2 kg, making it 79.3 kg, use 0.64 kg over 2.5 years; 80.2 ÷ 2.5 = 32.1; 80.2 ÷ 3.5 = 22.9. Lights and chargers in the calculator: the whole range of answers is 0.3 kg for the trip with 3 people in the room, 0.9 kg for someone alone. Water: ADEME 321 g CO2e per litre from a bottle; the page compares it with 2,430 l from the tap. The calculator model counts a bottle from Botto (0.11 kg per 0.5 l), ADEME gives 0.16 kg; both are the same order of size."},"zrodla":[{"nazwa":{"pl":"ADEME, Impact CO2: smartfon","en":"ADEME, Impact CO2: smartphone"},"url":"https://impactco2.fr/outils/numerique/smartphone"},{"nazwa":{"pl":"ADEME, Impact CO2: woda butelkowana","en":"ADEME, Impact CO2: bottled water"},"url":"https://impactco2.fr/outils/boisson/eauenbouteille"},{"nazwa":{"pl":"US EPA, Greenhouse Gas Equivalencies (telefon, ładowarka)","en":"US EPA, Greenhouse Gas Equivalencies (phone, charger)"},"url":"https://www.epa.gov/energy/greenhouse-gas-equivalencies-calculator-calculations-and-references"},{"nazwa":{"pl":"Electricity Maps, Grid in review 2025: Poland","en":"Electricity Maps, Grid in review 2025: Poland"},"url":"https://www.electricitymaps.com/grid-in-review-2025/poland"}]}},{"id":"skutki","typ":"info","tytul":{"pl":"Co to zmienia dla was","en":"What this changes for you"},"lista":[{"pl":"Upały: Europa ociepla się ponad 2 razy szybciej niż średnia świata. W czerwcu 2026 r. w Słubicach było 40,5 °C, wstępnie rekord Polski.","en":"Heat: Europe is warming more than 2 times faster than the world average. In June 2026 Słubice had 40.5 °C, a preliminary Polish record."},{"pl":"Rachunki: od 2028 r. unijny system ETS2 dodaje opłatę za CO2 z paliw do ogrzewania domów i do aut.","en":"Bills: from 2028 the EU system ETS2 adds a CO2 charge to fuels for heating homes and for cars."}],"pozycje":{"tytul":{"pl":"Źródła","en":"Sources"},"lista":[{"nazwa":{"pl":"Copernicus 2025","en":"Copernicus 2025"},"url":"https://climate.copernicus.eu/esotc/2025/press-resources"},{"nazwa":{"pl":"IMGW za National Geographic","en":"IMGW via National Geographic"},"url":"https://www.national-geographic.pl/przyroda/polska-w-objeciach-ekstremalnej-pogody-rekord-ciepla-nawalnice-i-kolejna-fala-upalow-na-horyzoncie/"},{"nazwa":{"pl":"ICAP 2026","en":"ICAP 2026"},"url":"https://icapcarbonaction.com/en/news/eu-reaches-agreement-2040-climate-target-postpones-ets-2-one-year"}]},"mowisz":{"pl":"Kilogramy CO2 to nie tylko liczba. Co to znaczy dla was: więcej upałów latem i droższe ogrzewanie i paliwo za kilka lat. ETS2 to unijny system opłat za CO2 z paliw. Która z tych zmian dotknie was najbardziej?","en":"Kilograms of CO2 are not just a number. What it means for you: more heatwaves in summer and more expensive heating and fuel in a few years. ETS2 is the EU system of charges for CO2 from fuels. Which change will affect you most?"},"dla_prowadzacego":{"tekst":{"pl":"Rekord 40,5 °C to wstępne dane IMGW. ETS2 obejmie paliwa do budynków i transportu drogowego; start przesunięto z 2027 na 2028 r.","en":"The 40.5 °C record is first data from IMGW. ETS2 will cover fuels for buildings and road transport; the start was moved from 2027 to 2028."},"zrodla":[{"nazwa":{"pl":"Copernicus, European State of the Climate 2025: Europa ociepla się ponad 2 razy szybciej niż średnia świata","en":"Copernicus, European State of the Climate 2025: Europe is warming more than twice as fast as the global average"},"url":"https://climate.copernicus.eu/esotc/2025/press-resources"},{"nazwa":{"pl":"National Geographic Polska, 29.06.2026: 40,5 °C w Słubicach według wstępnych danych IMGW","en":"National Geographic Polska, 29.06.2026: 40.5 °C in Słubice, first IMGW data"},"url":"https://www.national-geographic.pl/przyroda/polska-w-objeciach-ekstremalnej-pogody-rekord-ciepla-nawalnice-i-kolejna-fala-upalow-na-horyzoncie/"},{"nazwa":{"pl":"ICAP, 10.03.2026: ETS2 (paliwa do budynków i transportu drogowego) od 1.01.2028","en":"ICAP, 10.03.2026: ETS2 (fuels for buildings and road transport) from 1.01.2028"},"url":"https://icapcarbo /* Adres kanału sesji wspólny dla silnika zajęć, quizu, kalkulatora i konsoli: korzeń zestawu zajęć z ?baza= albo ze stałej publikacji.
   Kod QR to <korzeń>/<folder apki>/index.html?k=…, więc korzeń nie może kończyć się na „/index.html” ani mieć zapytania czy #.
   Bez DOM: testy w test_kanal.js. */

/* Pełny adres http(s) jako URL albo null (inne protokoły, np. javascript:, i tekst, który nie jest adresem, odpadają). */
function oczyscLink(tekst) {
  try {
    const u = new URL(String(tekst || ""));
    return u.protocol === "http:" || u.protocol === "https:" ? u : null;
  } catch (blad) {
    /* Po nazwie, nie instanceof: w testach (vm) URL pochodzi z innego kontekstu niż TypeError. */
    if (blad && blad.name === "TypeError") return null;
    throw blad;
  }
}

/* Korzeń zestawu: adres http(s) bez zapytania, #, końcowego „/index.html” i ukośników. Zły adres to null. */
function oczyscBaze(tekst) {
  if (/\s/.test(String(tekst || "").trim())) return null;
  const u = oczyscLink(String(tekst || "").trim());
  if (!u) return null;
  return `${u.origin}${u.pathname.replace(/\/index\.html$/i, "").replace(/\/+$/, "")}`;
}

if (typeof module !== "undefined") module.exports = { oczyscLink, oczyscBaze };
