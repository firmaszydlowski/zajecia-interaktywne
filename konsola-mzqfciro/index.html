<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Konsola zajęć</title>
<style>
/* Kopia 1:1 z generator-debat/apka/styl.css (Wygląd A „Tablica wyników”). Zmiany wyglądu nanosić tam i kopiować tu. */
/* Wygląd A „Tablica wyników” (makiety/kierunek-A-v2.html): tokeny i elementy wspólne wszystkich stron.
   Tokeny i typografia 1:1 z makiety. Strony: <body class="k1"> (jasna) albo <body class="k1 k1-ciemny">.
   Kontrast WCAG AA sprawdzony dla par tokenów (najniższa para szary/ciem2: 4,9:1). */
:root {
  --tlo: #F2F0EB; --biel: #FFFFFF; --ink: #16181D; --mute: #4F5560; --linia: #D6D2C8; --ciem: #16181D; --ciem2: #22262E; --ciem3: #2E333D;
  --jasny: #C9CED8; --szary: #8B93A1; --tak: #1D5FD6; --nie: #C2410C; --tak-j: #7AAEFF; --nie-j: #FF9B54; --zolty: #FFC94D; --uwaga: #8A3A0A; --uwaga-t: #FDEBD9;
  --kond: "Avenir Next Condensed", "DIN Condensed", "Bahnschrift SemiCondensed", "Arial Narrow", sans-serif;
  --tekst: "Avenir Next", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
h1, h2, h3, h4, p, dl, dd, figure, blockquote { margin: 0; }
ol, ul { margin: 0; padding: 0; list-style: none; }
[hidden] { display: none !important; }
button { cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--zolty); outline-offset: 2px; }
.k1 :focus-visible { outline-color: var(--tak); }
.k1-ciemny :focus-visible { outline-color: var(--zolty); }

.k1 { font: 16px/1.45 var(--tekst); color: var(--ink); background: var(--tlo); }
:where(.k1) button, :where(.k1) input, :where(.k1) select { font: inherit; }
.k1-ciemny { background: var(--ciem); color: #fff; }
.ik { width: 1em; height: 1em; flex: none; vertical-align: -.14em; }
.kbd { display: inline-block; min-width: 1.9em; padding: 0 .4em; border: 1px solid currentColor; border-bottom-width: 3px; border-radius: 4px; font-size: .85em; text-align: center; line-height: 1.5; }
.num { font-variant-numeric: tabular-nums; }
.qr { display: block; shape-rendering: crispEdges; }
.qr svg { display: block; width: 100%; height: auto; }

/* przełączniki: język i widok urządzenia */
.k1 .jez, .k1 .urz { display: inline-flex; border: 1px solid currentColor; }
.k1 .jez button, .k1 .urz button { background: none; border: 0; color: inherit; font-weight: 600; padding: 0 14px; min-height: 44px; white-space: nowrap; }
.k1 .jez button[aria-pressed="true"], .k1 .urz button[aria-pressed="true"] { background: #fff; color: var(--ciem); }

/* przyciski */
.k1-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border: 1px solid var(--ink); background: var(--biel); color: var(--ink); font-weight: 600; white-space: nowrap; text-decoration: none; }
.k1-btn.pelny { background: var(--ciem); color: #fff; }
.k1-btn:disabled { border-color: var(--linia); color: var(--mute); background: transparent; font-weight: 400; }
.k1-ciemny .k1-btn { background: transparent; color: #fff; border-color: #fff; }
.k1-ciemny .k1-btn.pelny { background: #fff; color: var(--ciem); }
.k1-ciemny .k1-btn:disabled { border-color: var(--ciem3); color: var(--szary); }
.k1-btn-gl { display: inline-flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 24px; border: 0; background: var(--zolty); color: var(--ciem); font: 700 22px/1 var(--kond); }
.k1-btn-gl:disabled { opacity: .6; }
.k1-akcje { display: flex; gap: 8px; flex-wrap: wrap; }

/* drobne teksty */
.k1-meta { font-size: 14px; color: var(--mute); }
.k1-ciemny .k1-meta { color: var(--jasny); }
.k1-ang { display: block; color: var(--mute); font-size: 15px; }
.k1-ciemny .k1-ang { color: var(--jasny); }
.k1-hint { font-size: 14px; color: var(--jasny); }
.k1 a { color: var(--tak); }
.k1-ciemny a { color: var(--tak-j); }
.k1-powiedz { font-size: 13px; font-weight: 700; color: var(--mute); display: block; }
.k1-ciemny .k1-powiedz { color: var(--jasny); }
.k1-tylko { display: flex; gap: 8px; align-items: center; padding: 10px 12px; background: var(--uwaga-t); color: var(--uwaga); font-weight: 700; font-size: 15px; }
.k1-tylko .ik { width: 20px; height: 20px; }
.komunikat { padding: 10px 12px; background: var(--uwaga-t); color: var(--uwaga); font-weight: 600; font-size: 15px; }
.komunikat-sesji { padding: 48px 24px; font: 700 28px/1.2 var(--kond); text-align: center; }

/* stan łącza */
.k1-lacze { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--jasny); white-space: nowrap; }
.k1-lacze::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--nie-j); }
.k1-lacze.czesc::before { background: var(--zolty); }
.k1-lacze.ok::before { background: #4ADE80; }

/* TAK i NIE: kolor plus kształt (kółko i kwadrat), żeby nie polegać na samym kolorze */
.strona-tak { color: var(--tak); }
.strona-nie { color: var(--nie); }
.k1-ciemny .strona-tak { color: var(--tak-j); }
.k1-ciemny .strona-nie { color: var(--nie-j); }

/* tryb testowy */
.baner-testu { background: var(--zolty); color: var(--ciem); font-weight: 700; text-align: center; padding: 8px 16px; letter-spacing: .02em; }

/* Konsola zajęć: układ ze strony startowej generatora debat (styl_start.css, kierunek A), tylko tokeny z styl_k1.css.
   Laptop: lista zajęć i kolumna ustawień obok. Tablet pionowo i węższe: kolumny jedna pod drugą. */
.k1-ukryty { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.k1-pasek :focus-visible, .k1-hero :focus-visible, .k1-ghero :focus-visible { outline-color: var(--zolty); }
[tabindex="-1"]:focus { outline: none; }

/* pasek */
.k1-pasek { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 24px; min-height: 64px; padding: 10px 32px; background: var(--ciem); color: #fff; }
.k1-logo { font: 700 26px/1 var(--kond); }
.k1-proj { color: var(--jasny); font-size: 15px; margin-right: auto; }
.zi-telefony { font-size: 15px; color: var(--jasny); }
.zi-telefony b { color: #fff; font-weight: 600; word-break: break-all; }

/* przyciski jako linki: bez koloru i podkreślenia linku z styl_k1.css */
.k1 a.k1-btn, .k1 a.k1-btn-gl { color: var(--ciem); text-decoration: none; }
.k1 a.k1-btn.pelny { color: #fff; }

/* hero */
.k1-hero { display: grid; grid-template-columns: 1fr 1.25fr; gap: 48px; padding: 32px; background: var(--ciem2); color: #fff; }
.k1-hero h1 { font: 700 46px/1.02 var(--kond); }
.k1-hero p { color: var(--jasny); margin-top: 12px; font-size: 17px; max-width: 520px; }
.k1-kroki { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-self: center; }
.k1-kroki li { border-top: 4px solid #fff; padding-top: 12px; }
.k1-kroki b { font: 700 56px/1 var(--kond); display: block; }
.k1-kroki h2 { font-size: 18px; margin-top: 8px; }
.k1-kroki p { font-size: 15px; color: var(--jasny); margin-top: 4px; }

/* układ: lista zajęć i kolumna ustawień */
.zi-uklad { display: grid; grid-template-columns: 1fr 360px; gap: 24px; padding: 24px 32px; align-items: start; }
.zi-kolumna { display: grid; gap: 24px; }
.zi-naglowek { font: 700 28px/1.1 var(--kond); margin-bottom: 12px; }
.k1-pusto { padding: 16px; background: var(--biel); }
.k1-wiersz { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; padding: 16px; background: var(--biel); border-left: 6px solid var(--linia); }
.k1-wiersz + .k1-wiersz { margin-top: 8px; }
.k1-wiersz.wybr { border-left-color: var(--zolty); }
.k1-wiersz h3 { font: 700 26px/1.1 var(--kond); }
.k1-wiersz .k1-meta { margin-top: 4px; max-width: 640px; }
.k1-uwaga { display: flex; gap: 8px; align-items: baseline; margin-top: 6px; font-size: 14px; color: var(--uwaga); }
.k1-wiersz .k1-akcje { justify-content: flex-end; }

/* panele po prawej */
.k1-kosz { background: var(--biel); padding: 16px; border-top: 6px solid var(--ciem); display: grid; gap: 12px; }
.k1-kosz h2 { font: 700 22px/1.1 var(--kond); }
.k1-ust { border: 0; margin: 0; padding: 0; min-width: 0; display: grid; gap: 8px; }
.k1-ust legend { float: left; width: 100%; padding: 0; margin-bottom: 4px; font: 700 22px/1.1 var(--kond); }
.k1-zazn { display: grid; grid-template-columns: 44px 1fr; align-items: start; }
.k1-zazn input[type="radio"] { width: 22px; height: 22px; margin: 11px; }
.k1-zazn label { padding-top: 10px; font-weight: 600; }
.k1-zazn .k1-meta { display: block; font-weight: 400; overflow-wrap: anywhere; }
.k1-zazn .k1-pole { grid-column: 2; margin-top: 6px; }
.k1-etyk { display: block; font-weight: 600; font-size: 15px; }
.k1-pole { width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--mute); background: var(--biel); color: var(--ink); }
.k1-pole[aria-invalid="true"] { border: 2px solid var(--uwaga); }
.zi-ostatnie li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--linia); }
.zi-ostatnie b { font: 700 24px/1 var(--kond); letter-spacing: .04em; }
.zi-ostatnie .k1-meta { grid-column: 1; }
.zi-ostatnie .k1-btn { grid-row: 1 / span 2; grid-column: 2; }
.zi-proba { display: inline-block; margin-left: 8px; padding: 2px 6px; background: var(--zolty); color: var(--ciem); font: 700 13px/1.2 var(--tekst); letter-spacing: 0; vertical-align: 3px; }

/* sesja: nagłówek, tryb, trzy karty */
.k1-ghero { display: grid; grid-template-columns: 1fr 1fr; gap: 32px 48px; padding: 28px 32px; background: var(--ciem2); color: #fff; }
.k1-ghero h1 { font: 700 46px/1.02 var(--kond); }
.zi-kodsesji { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 16px; margin-top: 16px; }
.zi-kodsesji span { color: var(--jasny); font-size: 15px; }
.zi-kodsesji b { font: 700 64px/1 var(--kond); color: var(--zolty); letter-spacing: .06em; }
.zi-tryb legend { font: 700 20px/1.1 var(--kond); color: #fff; }
.zi-tryb .k1-seg { display: grid; gap: 4px; }
.zi-tryb button { display: grid; gap: 2px; min-height: 44px; padding: 8px 12px; border: 1px solid var(--ciem3); background: transparent; color: #fff; text-align: left; }
.zi-tryb button[aria-pressed="true"] { background: #fff; color: var(--ciem); border-color: #fff; font-weight: 600; }
.zi-tryb small { font-size: 14px; color: var(--jasny); font-weight: 400; }
.zi-tryb button[aria-pressed="true"] small { color: var(--mute); }
.k1-ghero .k1-akcje { margin-top: 12px; }
.zi-jezyk-zajec { display: flex; align-items: center; gap: 12px; margin-top: 16px; color: var(--jasny); font-size: 15px; }
.k1-pasek .jez { flex: none; }
/* liczba zespołów: rząd przycisków 2…10 jak przełącznik języka */
.zi-zespoly { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 16px; color: var(--jasny); font-size: 15px; }
.zi-zespoly-wybor { display: inline-flex; flex-wrap: wrap; border: 1px solid #fff; }
.zi-zespoly-wybor button { min-width: 44px; min-height: 44px; padding: 0 8px; border: 0; background: none; color: #fff; font: 700 20px/1 var(--kond); }
.zi-zespoly-wybor button[aria-pressed="true"] { background: #fff; color: var(--ciem); }
.zi-zespoly small { flex-basis: 100%; font-size: 14px; color: var(--jasny); }
.zi-jez { margin-left: 8px; font: 600 14px/1 var(--tekst); color: var(--mute); }
.zi-komunikat { margin: 24px 32px 0; }
.k1-linki { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 24px; padding: 24px 32px; }
.k1-link { background: var(--biel); border-top: 6px solid var(--ciem); padding: 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.k1-link h2 { font: 700 30px/1 var(--kond); }
.k1-adres { display: block; font-family: inherit; padding: 10px 12px; background: var(--tlo); border: 1px solid var(--linia); font-size: 15px; font-weight: 600; word-break: break-all; }
.k1-link .k1-btn-gl { justify-content: center; }
.k1-link > .k1-btn { align-self: flex-start; }
.k1-potw:empty { display: none; }
.zi-qr { width: min(100%, 280px); border: 1px solid var(--linia); }
.zi-qr-maly { width: min(100%, 180px); border: 1px solid var(--linia); }
.zi-pod { font-size: 15px; font-weight: 600; margin-top: 4px; }

/* QR na cały ekran do pokazania klasie */
.zi-pelny { width: 100vw; height: 100vh; max-width: none; max-height: none; margin: 0; padding: 24px; border: 0; background: var(--ciem); color: #fff; }
.zi-pelny[open] { display: grid; grid-template-rows: auto 1fr auto; justify-items: center; gap: 16px; }
.zi-pelny::backdrop { background: var(--ciem); }
.zi-pelny h2 { font: 700 40px/1.05 var(--kond); text-align: center; }
.zi-pelny .qr { height: 100%; aspect-ratio: 1; max-width: 100%; min-height: 0; }
.zi-pelny .qr svg { height: 100%; width: auto; max-width: 100%; }
.zi-pelny p { font-size: 20px; color: var(--jasny); text-align: center; }
.zi-pelny p b { font: 700 48px/1 var(--kond); color: var(--zolty); letter-spacing: .06em; margin-left: 8px; }

@media (max-width: 1199px) {
  .k1-linki { grid-template-columns: 1fr 1fr; }
  .k1-linki > :nth-child(2) { grid-row: span 2; }
}
@media (max-width: 999px) {
  .k1-hero, .k1-ghero { grid-template-columns: 1fr; gap: 24px; }
  .zi-uklad { grid-template-columns: 1fr; }
  .zi-kolumna { grid-template-columns: 1fr 1fr; align-items: start; }
}
@media (max-width: 799px) {
  .k1-linki { grid-template-columns: 1fr; }
  .k1-linki > :nth-child(2) { grid-row: auto; }
  .k1-wiersz { grid-template-columns: 1fr; }
  .k1-wiersz .k1-akcje { justify-content: flex-start; }
  .zi-kolumna { grid-template-columns: 1fr; }
}
@media (max-width: 599px) {
  .k1-pasek { padding: 10px 16px; gap: 4px 16px; }
  .k1-hero, .k1-ghero { padding: 24px 16px; }
  .k1-hero h1, .k1-ghero h1 { font-size: 36px; }
  .k1-kroki { grid-template-columns: 1fr; }
  .k1-kroki b { font-size: 40px; }
  .zi-uklad, .k1-linki { padding: 16px; gap: 16px; }
  .zi-komunikat { margin: 16px 16px 0; }
  .k1-btn { white-space: normal; text-align: left; }
}
.zi-zamknij { justify-content: center; margin-top: 12px; }

</style>
</head>
<body class="k1">
<header class="k1-pasek" id="pasek"></header>
<main id="konsola"></main>
<dialog class="zi-pelny k1-ciemny" id="pelny-qr" aria-labelledby="pelny-qr-tytul"></dialog>
<p class="k1-ukryty" id="ogloszenie" role="status" aria-live="polite"></p>

  if (!obecny || nowy.v > obecny.v) return nowy;
  return obecny;
}

/* Wersja stanu z sieci: liczba całkowita (bez 1e300, przy którym v + 1 === v) i najwyżej dobę przed zegarem tego urządzenia. */
const ZAPAS_WERSJI_MS = 86400000;
const poprawnaWersja = (stan, teraz) => Boolean(stan) && Number.isSafeInteger(stan.v) && stan.v <= teraz + ZAPAS_WERSJI_MS;

  if (!poprawnaWersja(stan, teraz) || !Number.isInteger(stan.krok) || stan.krok < 0) return null;
  return Number.isInteger(stan.zespoly) && stan.zespoly >= 2 && stan.zespoly <= 10 ? stan.zespoly : null;

/* Start konsoli prowadzącego: nowszy z zapisanego w pamięci i zachowanego w sieci; nowy stan dopiero, gdy nie ma żadnego.
   publikuj: false, gdy w sieci już jest ten stan (starszy zapis z pamięci nie nadpisze trwającej sesji). */

  const wybrany = wybierzNowszy(zapisany || null, zSieci || null);
  if (!wybrany) return { stan: nowy(), publikuj: true };
  return { stan: wybrany, publikuj: wybrany !== zSieci };
}

/* Zegar sesji: TV i telefon liczą timer zegarem konsoli prowadzącego. Próbka = zegar odbiorcy minus chwila wysłania stanu (pole zegar),
   tylko ze stanów na żywo (zachowany stan z serwera bywa stary). Najmniejsza z ostatnich próbek = przesunięcie zegara plus najkrótsze opóźnienie. */

function dodajProbkeZegara(probki, stan, teraz) {
  if (!stan || !Number.isFinite(stan.zegar)) return probki;
  return [...probki, teraz - stan.zegar].slice(-PROBKI_ZEGARA);
}

const przesuniecieZegara = (probki) => (probki.length ? Math.min(...probki) : 0);

/* Obecność telefonu widziana przez dwa serwery naraz (lacze.js): testament jednego serwera (pusta wiadomość po zerwaniu połączenia)
   nie kasuje telefonu, który drugi serwer nadal widzi. na: {telefon: [numery serwerów]}. */
function obecnoscPoWiadomosci({ obecni, na }, urz, dane, serwer) {
  const serwery = new Set(na[urz] || []);
  if (dane) serwery.add(serwer);
  else serwery.delete(serwer);
  const noweObecni = { ...obecni };
  const noweNa = { ...na, [urz]: [...serwery] };
  if (serwery.size) noweObecni[urz] = dane || obecni[urz];
  else {
    delete noweObecni[urz];
    delete noweNa[urz];
  }
  return { obecni: noweObecni, na: noweNa };
}

/* Klucz sesji i szyfrowanie end-to-end (DECYZJE.md, runda 2): zdjęcia z telefonów i tajny przydział zespołów.
   Klucz: 16 losowych bajtów jako 22 znaki base64url w części # adresu (#z=…), w kodzie QR i w linkach konsoli. Część # nie idzie do żadnego
   serwera (ani strony, ani MQTT), więc publiczny serwer MQTT widzi tylko szyfrogram. Szyfr: AES-GCM 128 bit (WebCrypto), losowe IV 12 bajtów
   przed szyfrogramem. Zły klucz albo zmieniony bajt = BladSzyfru. Duże dane (zdjęcie) idą w kawałkach (podzielNaKawalki, zlozKawalki).
   Bez DOM; crypto.subtle działa tylko w bezpiecznym kontekście (https, localhost, file), getRandomValues wszędzie. Testy: test_szyfr.js. */
const DLUGOSC_KLUCZA = 16;
const DLUGOSC_IV = 12;
const WZOR_KLUCZA = /^[A-Za-z0-9_-]{22}$/;
/* Kawałek szyfrogramu w jednej wiadomości MQTT: 16 KiB, czyli ok. 22 KB tekstu base64 w JSON. Limitów publicznych serwerów (HiveMQ, EMQX)
   ich strony nie podają; domyślny limit EMQX to 1 MB, MQTT dopuszcza 256 MB. 16 KiB zostawia duży zapas, a zdjęcie 1280 px to ok. 10 do 20 kawałków. */
const KAWALEK_BAJTY = 16 * 1024;
/* Próba w kartach (?test bez sieci): wszystko zostaje w tej przeglądarce, więc stały klucz wystarcza, gdy adres nie ma #z=. */
const KLUCZ_PROBY = "AAAAAAAAAAAAAAAAAAAAAA";

class BladSzyfru extends Error {}

function doBase64(bajty) {
  let tekst = "";
  for (let i = 0; i < bajty.length; i += 0x8000) tekst += String.fromCharCode(...bajty.subarray(i, i + 0x8000));
  return btoa(tekst);
}

function zBase64(tekst) {
  const surowy = atob(tekst);
  const bajty = new Uint8Array(surowy.length);
  for (let i = 0; i < surowy.length; i++) bajty[i] = surowy.charCodeAt(i);
  return bajty;
}

const doBase64Url = (bajty) => doBase64(bajty).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const zBase64Url = (tekst) => zBase64(tekst.replace(/-/g, "+").replace(/_/g, "/") + "==");

function nowyKluczSesji(losowe = (n) => crypto.getRandomValues(new Uint8Array(n))) {
  return doBase64Url(losowe(DLUGOSC_KLUCZA));
}

const poprawnyKlucz = (tekst) => (typeof tekst === "string" && WZOR_KLUCZA.test(tekst) ? tekst : null);

/* Klucz z części # adresu („#z=…”); inne pola w # są dozwolone. */
function kluczZFragmentu(hash) {
  return poprawnyKlucz(new URLSearchParams(String(hash || "").replace(/^#/, "")).get("z"));
}

const fragmentKlucza = (klucz) => (poprawnyKlucz(klucz) ? `#z=${klucz}` : "");

/* Klucz tej strony: z adresu, a w próbie w kartach bez # klucz próby. Poza przeglądarką (testy, podgląd bez adresu) null. */
function kluczSesjiTekst() {
  if (typeof location === "undefined") return null;
  const zAdresu = kluczZFragmentu(location.hash);
  if (zAdresu) return zAdresu;
  return typeof PARAMETRY !== "undefined" && PARAMETRY.test === "lokalnie" ? KLUCZ_PROBY : null;
}

const szyfrowanieDostepne = () => typeof crypto !== "undefined" && Boolean(crypto.subtle);

async function importujKlucz(tekst) {
  if (!poprawnyKlucz(tekst)) throw new BladSzyfru("Zły klucz sesji");
  if (!szyfrowanieDostepne()) throw new BladSzyfru("Szyfrowanie niedostępne (adres bez https)");
  return crypto.subtle.importKey("raw", zBase64Url(tekst).slice(0, DLUGOSC_KLUCZA), "AES-GCM", false, ["encrypt", "decrypt"]);
}

/* Kontekst (np. „krok|zespół|zdjęcie”) idzie jako dane dodatkowe AES-GCM: szyfrogram odszyfruje się tylko z tym samym kontekstem,
   więc jawny spis nie przypisze cudzego zdjęcia innemu zespołowi ani krokowi. Pusty kontekst = bez danych dodatkowych. */
const parametryGcm = (iv, kontekst) => (kontekst ? { name: "AES-GCM", iv, additionalData: new TextEncoder().encode(kontekst) } : { name: "AES-GCM", iv });

async function zaszyfrujBajty(klucz, bajty, kontekst = "") {
  const iv = crypto.getRandomValues(new Uint8Array(DLUGOSC_IV));
  const szyfr = new Uint8Array(await crypto.subtle.encrypt(parametryGcm(iv, kontekst), klucz, bajty));
  const wynik = new Uint8Array(DLUGOSC_IV + szyfr.length);
  wynik.set(iv);
  wynik.set(szyfr, DLUGOSC_IV);
  return wynik;
}

async function odszyfrujBajty(klucz, dane, kontekst = "") {
  if (!(dane instanceof Uint8Array) || dane.length <= DLUGOSC_IV) throw new BladSzyfru("Za krótki szyfrogram");
  try {
    return new Uint8Array(await crypto.subtle.decrypt(parametryGcm(dane.subarray(0, DLUGOSC_IV), kontekst), klucz, dane.subarray(DLUGOSC_IV)));
  } catch (blad) {
    throw new BladSzyfru(`Nie da się odszyfrować (zły klucz albo uszkodzone dane): ${blad.name}`);
  }
}

/* Mały obiekt JSON (np. opis przeróbki) jako napis base64 do wiadomości. */
async function zaszyfrujDane(klucz, obiekt, kontekst = "") {
  return doBase64(await zaszyfrujBajty(klucz, new TextEncoder().encode(JSON.stringify(obiekt)), kontekst));
}

async function odszyfrujDane(klucz, tekst, kontekst = "") {
  return JSON.parse(new TextDecoder().decode(await odszyfrujBajty(klucz, zBase64(String(tekst || "")), kontekst)));
}

function podzielNaKawalki(bajty, rozmiar = KAWALEK_BAJTY) {
  const kawalki = [];
  for (let i = 0; i < bajty.length; i += rozmiar) kawalki.push(bajty.subarray(i, i + rozmiar));
  return kawalki;
}

const brakujaceKawalki = (kawalki, n) => Array.from({ length: n }, (_, i) => i).filter((i) => !kawalki[i]);

/* Całość z kawałków 0…n-1 albo null, gdy któregoś brakuje. */
function zlozKawalki(kawalki, n) {
  if (!Number.isInteger(n) || n < 1 || brakujaceKawalki(kawalki, n).length) return null;
  const wynik = new Uint8Array(kawalki.slice(0, n).reduce((suma, k) => suma + k.length, 0));
  let poz = 0;
  for (const k of kawalki.slice(0, n)) {
    wynik.set(k, poz);
    poz += k.length;
  }
  return wynik;
}

/* Powtarzalny los z napisu (np. klucz + krok): każde urządzenie z tym samym kluczem dostaje to samo losowanie (FNV-1a, potem mulberry32). */
function losZZiarna(tekst) {
  let h = 0x811c9dc5;
  for (const znak of String(tekst)) h = Math.imul(h ^ znak.codePointAt(0), 0x01000193) >>> 0;
  let a = h;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let x = Math.imul(a ^ (a >>> 15), 1 | a);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}

/* Czy JPEG ma segment EXIF (APP1 „Exif”). Do sprawdzenia, że zmniejszone zdjęcie nie niesie danych o miejscu. */
function maExif(bajty) {
  if (bajty[0] !== 0xff || bajty[1] !== 0xd8) return false;
  let i = 2;
  while (i + 4 <= bajty.length && bajty[i] === 0xff) {
    const znacznik = bajty[i + 1];
    if (znacznik === 0xda || znacznik === 0xd9) return false;
    const dlugosc = (bajty[i + 2] << 8) | bajty[i + 3];
    const exif = znacznik === 0xe1 && String.fromCharCode(...bajty.subarray(i + 4, i + 8)) === "Exif";
    if (exif) return true;
    i += 2 + dlugosc;
  }
  return false;
}

/* Konsola bez DOM: kod sesji, adres bazowy, adresy trzech widoków, ustawienia i ostatnie sesje.
   Kod sesji i zapytanie adresu biorę z silnika zajęć (../silnik/logika.js), żeby konsola budowała dokładnie
   te adresy, które apki czytają. Testy: test_konsola_logika.js. */

  ? require("../silnik/logika.js")

  ? require("../wspolne/szyfr.js")
  : { nowyKluczSesji, poprawnyKlucz, fragmentKlucza };

const LIMIT_OSTATNICH = 10;
/* Wpis ostatniej sesji wygasa po dobie: na wspólnym szkolnym tablecie następna osoba nie wejdzie jednym kliknięciem w cudzą sesję. */
const WAZNOSC_OSTATNICH_MS = 24 * 60 * 60 * 1000;
const WZOR_SLUGA = /^[a-z0-9][a-z0-9-]*$/;
const TRYBY_TESTU = [null, "siec", "lokalnie"];
/* Wersja do udostępniania (KONSOLA_PRYWATNA = false w zbuduj.py) nie ma próby w kartach. */
const TRYBY_UDOSTEPNIANE = [null, "siec"];
const ZRODLA_BAZY = ["lan", "pages"];
const JEZYKI_ZAJEC = ["pl", "en"];
const DOMYSLNE_USTAWIENIA = { zrodlo: null, pages: "", dropbox: "" };

/* Hosty sieci lokalnej: telefony w tej samej sieci Wi-Fi mogą je otworzyć. */
function hostSieciLokalnej(host) {
  if (/\.local$/i.test(host)) return true;
  const m = /^(\d+)\.(\d+)\.\d+\.\d+$/.exec(host);
  if (!m) return false;
  const [a, b] = [Number(m[1]), Number(m[2])];
  return a === 10 || (a === 192 && b === 168) || (a === 172 && b >= 16 && b <= 31);
}

/* Konsola leży w wyniki/konsola-xxxxxxxx/, apki w wyniki/<slug>/: korzeń wyników to katalog wyżej. */
function korzenWynikow(href) {
  return new URL("../", href).href;
}

const bezUkosnika = (adres) => adres.replace(/\/+$/, "");
const hostTegoKomputera = (host) => ["localhost", "127.0.0.1", "[::1]"].includes(host);

/* Adres Maca w Wi-Fi: z ?lan= (ustawia Konsola.command) albo z adresu strony, gdy konsolę otwarto z sieci lokalnej. */
function wykryjLan(href) {
  const url = new URL(href);
  const zParametru = SILNIK.poprawnaBaza(url.searchParams.get("lan"));
  if (zParametru) return zParametru;
  if (/^https?:$/.test(url.protocol) && hostSieciLokalnej(url.hostname)) return bezUkosnika(korzenWynikow(href));
  return null;
}

/* Konsola otwarta z internetu (GitHub Pages): uczniowie dostają ten sam adres, pod którym stoi konsola. */
function wykryjPubliczny(href) {
  const url = new URL(href);
  if (url.protocol !== "https:" || hostTegoKomputera(url.hostname) || hostSieciLokalnej(url.hostname)) return null;
  return bezUkosnika(korzenWynikow(href));
}

/* Prośba o pliki w Dropboxie albo link do folderu: tylko https na dropbox.com. */
function poprawnyDropbox(tekst) {
  const t = String(tekst || "").trim();
  return /^https:\/\/(www\.)?dropbox\.com\/[^\s"'<>]+$/i.test(t) ? t : null;
}

/* Ustawienia z localStorage: nieznane pola i złe wartości wracają do domyślnych. zrodlo null = wybór automatyczny. */
function normalizujUstawienia(dane) {
  const u = dane && typeof dane === "object" ? dane : {};
  return {
    zrodlo: ZRODLA_BAZY.includes(u.zrodlo) ? u.zrodlo : null,
    pages: typeof u.pages === "string" ? u.pages.trim() : "",
    dropbox: typeof u.dropbox === "string" ? u.dropbox.trim() : "",

const ADRES_PAGES_DOMYSLNY = "https://firmaszydlowski.github.io/zajecia-interaktywne";

function wybierzBaze(ustawienia, { lan, publiczny }) {
  const zrodlo = ustawienia.zrodlo || (publiczny ? "pages" : lan ? "lan" : "pages");
  if (zrodlo === "lan") return lan ? { zrodlo, baza: lan, brak: null } : { zrodlo, baza: null, brak: "lan" };
  return { zrodlo, baza: SILNIK.poprawnaBaza(ustawienia.pages) || publiczny || ADRES_PAGES_DOMYSLNY, brak: null };

/* Zapytanie silnika (k, test, zespoly, baza) plus język zajęć i Dropbox. */
function zapytanieWidoku({ kod, test, jez, baza = null, dropbox = null, zespoly = null }) {
  const dodatki = [`jez=${jez}`];
  if (dropbox) dodatki.push(`dropbox=${encodeURIComponent(dropbox)}`);
  const zapytanie = SILNIK.zapytanieAdresu(kod, test, baza, null, zespoly);
  return `${zapytanie}${zapytanie ? "&" : "?"}${dodatki.join("&")}`;
}

/* Nazwa albo opis z manifestu: napis albo {pl, en}. Brakujący język zastępuje drugi. */
function tekstWJezyku(wartosc, jezyk) {
  if (typeof wartosc === "string") return wartosc;
  if (!wartosc || typeof wartosc !== "object") return "";
  const drugi = jezyk === "pl" ? "en" : "pl";
  return wartosc[jezyk] || wartosc[drugi] || "";
}

/* Trzy adresy jednej sesji. TV i konsola prowadzącego otwierane stąd (względem korzenia wyników), uczniowie i konsola prowadzącego
   z innego urządzenia przez adres bazowy. Język zajęć i liczba zespołów (zespoly, tylko zajęcia zespołowe) idą do wszystkich trzech widoków,

   klucz: klucz szyfrowania sesji; idzie do wszystkich adresów w części # (także w kodzie QR), a zły rzuca błąd. */
function adresySesji({ zajecia, kod, test, jez, baza, dropbox, korzen, zespoly = null, klucz = null }) {
  if (!SILNIK.poprawnyKod(kod)) throw new RangeError(`Zły kod sesji: ${kod}`);
  if (!TRYBY_TESTU.includes(test)) throw new RangeError(`Zły tryb: ${test}`);
  if (!JEZYKI_ZAJEC.includes(jez)) throw new RangeError(`Zły język: ${jez}`);
  if (zespoly !== null && !poprawneZespoly(zespoly)) throw new RangeError(`Zła liczba zespołów: ${zespoly}`);
  if (klucz !== null && !SZYFR.poprawnyKlucz(klucz)) throw new RangeError("Zły klucz sesji");
  const { slug } = zajecia;
  const fragment = klucz ? SZYFR.fragmentKlucza(klucz) : "";
  const z = zajecia.zespoly ? zespoly : null;
  const obok = (plik, zapytanie) => (plik ? new URL(`${slug}/${plik}${zapytanie}${fragment}`, korzen).href : null);
  const zBazy = (plik, zapytanie) => (plik && baza ? `${baza}/${slug}/${plik}${zapytanie}${fragment}` : obok(plik, zapytanie));
  const dlaProwadzacego = zapytanieWidoku({ kod, test, jez, baza, dropbox: zajecia.dropbox ? dropbox : null, zespoly: z });
  return {
    uczen: zBazy(zajecia.uczen, zapytanieWidoku({ kod, test, jez, zespoly: z })),
    uczenTutaj: obok(zajecia.uczen, zapytanieWidoku({ kod, test, jez, zespoly: z })),
    tv: obok(zajecia.tv, zapytanieWidoku({ kod, test, jez, baza, zespoly: z })),
    prowadzacy: obok(zajecia.prowadzacy, dlaProwadzacego),
    prowadzacyZdalnie: zBazy(zajecia.prowadzacy, dlaProwadzacego),
  };
}

/* Ostatnie sesje: najnowsza na górze, bez powtórek tej samej pary zajęcia + kod. Wpis: {slug, kod, test, jez, zespoly?, czas?}.
   Klucz szyfrowania nie trafia do pamięci (ponowne otwarcie i tak losuje nowy); czas: chwila otwarcia, do wygaśnięcia po dobie. */
function dodajDoOstatnich(lista, wpis, limit = LIMIT_OSTATNICH, teraz = null) {
  const { klucz, ...bezKlucza } = wpis;
  const nowy = teraz === null ? bezKlucza : { ...bezKlucza, czas: teraz };
  const reszta = lista.filter((w) => !(w.slug === wpis.slug && w.kod === wpis.kod));
  return [nowy, ...reszta].slice(0, limit);
}

/* Wpisy z pamięci przeglądarki. tryby: dozwolone tryby tej konsoli; próba spoza nich (np. próba w kartach zapisana w konsoli prywatnej,
   otwierana w wersji do udostępniania) zostaje próbą, ale przez internet. Liczba zespołów tylko gdy poprawna. Klucza nie przepisujemy (dawne wpisy go miały).
   teraz: z nim odpadają wpisy starsze niż doba i wpisy bez czasu. */
function normalizujOstatnie(dane, tryby = TRYBY_TESTU, teraz = null) {
  if (!Array.isArray(dane)) return [];
  const tryb = (test) => (tryby.includes(test) ? test : TRYBY_TESTU.includes(test) && test ? "siec" : null);
  const wazny = (w) => teraz === null || (Number.isFinite(w.czas) && teraz - w.czas >= 0 && teraz - w.czas < WAZNOSC_OSTATNICH_MS);
  return dane
    .filter((w) => w && WZOR_SLUGA.test(w.slug || "") && SILNIK.poprawnyKod(w.kod) === w.kod && wazny(w))
    .map((w) => ({ slug: w.slug, kod: w.kod, test: tryb(w.test), jez: JEZYKI_ZAJEC.includes(w.jez) ? w.jez : "pl",
      ...(poprawneZespoly(w.zespoly) ? { zespoly: w.zespoly } : {}), ...(Number.isFinite(w.czas) ? { czas: w.czas } : {}) }))
    .slice(0, LIMIT_OSTATNICH);
}

/* JSON z pamięci przeglądarki: uszkodzony albo pusty daje null. */
function czytajJson(tekst) {
  if (!tekst) return null;
  try {
    return JSON.parse(tekst);
  } catch (blad) {
    console.warn("Uszkodzone dane w pamięci przeglądarki", blad);
    return null;
  }
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = {
    LIMIT_OSTATNICH, WAZNOSC_OSTATNICH_MS, ADRES_PAGES_DOMYSLNY, nowyKluczSesji: SZYFR.nowyKluczSesji, TRYBY_TESTU, TRYBY_UDOSTEPNIANE, poprawneZespoly, nowyKod: SILNIK.nowyKod, poprawnyKod: SILNIK.poprawnyKod, hostSieciLokalnej, korzenWynikow, wykryjLan, wykryjPubliczny, poprawnyDropbox,
    JEZYKI_ZAJEC, normalizujUstawienia, wybierzBaze, tekstWJezyku, adresySesji, dodajDoOstatnich, normalizujOstatnie, czytajJson,
  };
}

/* Konsola: drobne elementy DOM (węzły, przyciski, adres z kopiowaniem, kod QR) i pamięć przeglądarki. */
const KLUCZ_USTAWIEN = "zi-konsola/ustawienia";
const KLUCZ_OSTATNICH = "zi-konsola/ostatnie";

function el(tag, wlasciwosci = {}, ...dzieci) {
  const wezel = Object.assign(document.createElement(tag), wlasciwosci);
  wezel.append(...dzieci.filter((d) => d !== null && d !== undefined && d !== false));
  return wezel;
}

function przycisk(tekst, klasa, naKlik, id = "") {
  const b = el("button", { type: "button", className: klasa, textContent: tekst });
  if (id) b.id = id;
  b.addEventListener("click", naKlik);
  return b;
}

/* Link do strony w nowej karcie. Gdy adresu nie ma, nieaktywny przycisk z powodem w podpowiedzi. */
function linkNowaKarta(tekst, adres, klasa = "k1-btn") {
  if (!adres) return el("button", { type: "button", className: klasa, textContent: tekst, disabled: true, title: t("brakPliku") });
  return el("a", { className: klasa, href: adres, target: "_blank", rel: "noopener", textContent: tekst });
}

/* Pamięć przeglądarki bywa wyłączona (tryb prywatny, file:// w niektórych przeglądarkach): wtedy konsola działa bez niej. */
function czytajPamiec(klucz) {
  try {
    return czytajJson(localStorage.getItem(klucz));
  } catch (blad) {
    console.warn("Pamięć przeglądarki niedostępna", blad);
    return null;
  }
}

function zapiszPamiec(klucz, wartosc) {
  try {
    localStorage.setItem(klucz, JSON.stringify(wartosc));
  } catch (blad) {
    console.warn("Nie zapisano w pamięci przeglądarki", blad);
  }
}

function ogloszenie(tekst) {
  document.getElementById("ogloszenie").textContent = tekst;
}

function zaznaczTekst(wezel) {
  const zakres = document.createRange();
  zakres.selectNodeContents(wezel);
  const zaznaczenie = window.getSelection();
  zaznaczenie.removeAllRanges();
  zaznaczenie.addRange(zakres);
}

/* Adres w ramce z przyciskiem Kopiuj. Bez schowka (file://, stary Safari) adres zostaje zaznaczony. */
function adresDoSkopiowania(adres) {
  const pole = el("code", { className: "k1-adres", textContent: adres });
  const potwierdzenie = el("p", { className: "k1-meta k1-potw", role: "status" });
  const awaryjnie = (blad) => {
    console.warn("Schowek niedostępny", blad);
    zaznaczTekst(pole);
    potwierdzenie.textContent = t("zaznaczono");
  };
  const kopiuj = przycisk(t("kopiuj"), "k1-btn", () => {
    potwierdzenie.textContent = "";
    if (!navigator.clipboard) { awaryjnie(new Error("Brak navigator.clipboard")); return; }
    navigator.clipboard.writeText(adres).then(() => { potwierdzenie.textContent = t("skopiowano"); }).catch(awaryjnie);
  });
  return [pole, el("div", { className: "k1-akcje" }, kopiuj), potwierdzenie];
}

/* Kod QR (SVG z silnika). Adres spoza ASCII nie da się zakodować: wtedy komunikat zamiast kodu. */
function obrazQr(adres, opis, klasa) {
  const obraz = el("div", { className: `qr ${klasa}` });
  try {
    obraz.innerHTML = svgQr(adres);
    obraz.querySelector("svg").setAttribute("aria-label", opis);
  } catch (blad) {
    console.warn("Nie da się zrobić kodu QR", blad);
    return el("p", { className: "komunikat", textContent: t("bezQr") });
  }
  return obraz;
}

/* Język interfejsu konsoli PL/EN (wzór: generator-debat/apka/jezyk.js). Wybór pamięta przeglądarka. */
const KLUCZ_JEZYKA = "zi-konsola/jezyk";
const JEZYKI_KONSOLI = ["pl", "en"];

let JEZYK = (() => {
  const zapisany = czytajPamiec(KLUCZ_JEZYKA);
  return JEZYKI_KONSOLI.includes(zapisany) ? zapisany : "pl";
})();

function ustawJezyk(jezyk) {
  if (!JEZYKI_KONSOLI.includes(jezyk)) throw new RangeError(`Nieznany język: ${jezyk}`);
  JEZYK = jezyk;
  zapiszPamiec(KLUCZ_JEZYKA, jezyk);
  document.documentElement.lang = jezyk;
  document.title = t("tytulStrony");
}

function t(klucz, ...argumenty) {
  const wartosc = SLOWNIK_KONSOLI[JEZYK][klucz];
  if (wartosc === undefined) throw new RangeError(`Brak tekstu „${klucz}” (${JEZYK})`);
  return typeof wartosc === "function" ? wartosc(...argumenty) : wartosc;
}

/* Nazwa albo opis zajęć w języku konsoli. */
const poJezyku = (wartosc) => tekstWJezyku(wartosc, JEZYK);

/* Przełącznik PL/EN (klasa .jez z styl_k1.css). Używany w pasku i w wyborze języka zajęć. */
function przelacznikPlEn({ etykieta, wybrany, naWybor, idPrefiks }) {
  const grupa = el("div", { className: "jez", role: "group" });
  grupa.setAttribute("aria-label", etykieta);
  for (const jezyk of JEZYKI_KONSOLI) {
    const b = el("button", { type: "button", id: `${idPrefiks}-${jezyk}`, textContent: jezyk.toUpperCase() });
    b.setAttribute("aria-pressed", String(wybrany === jezyk));
    b.addEventListener("click", () => naWybor(jezyk, b.id));
    grupa.append(b);
  }
  return grupa;
}

document.documentElement.lang = JEZYK;

/* Uruchamianie zajęć: ekran otwartej sesji (kod, tryb, język zajęć, liczba zespołów, karty TV, uczniów i konsoli prowadzącego)
   oraz kod QR na cały ekran. Tryby: TRYBY_SESJI (konsola.js), bez próby w kartach w wersji do udostępniania. */
const ZAKRES_ZESPOLOW = [2, 3, 4, 5, 6, 7, 8, 9, 10];

/* Okno TV: osobne okno, żeby przeciągnąć je na ekran telewizora. Gdy przeglądarka blokuje okna, link otwiera kartę. */
function przyciskTv(adres, kod) {
  const link = linkNowaKarta(t("otworzTv"), adres, "k1-btn-gl");
  if (!adres) return link;
  link.addEventListener("click", (zdarzenie) => {
    const okno = window.open(adres, `tv-${kod}`, "popup,width=1280,height=720");
    if (!okno) return;
    okno.opener = null;
    zdarzenie.preventDefault();
  });
  return link;
}

function wyborTrybu(sesja, zmienTryb) {
  const przyciski = t("tryby").slice(0, TRYBY_SESJI.length).map(([nazwa, opis], i) => {
    const b = el("button", { type: "button", id: `tryb-${i}` }, el("span", { textContent: nazwa }), el("small", { textContent: opis }));
    b.setAttribute("aria-pressed", String(TRYBY_SESJI[i] === sesja.test));
    b.addEventListener("click", () => zmienTryb(TRYBY_SESJI[i], b.id));
    return b;
  });
  return el("fieldset", { className: "k1-ust zi-tryb" }, el("legend", { textContent: t("tryb") }), el("div", { className: "k1-seg" }, ...przyciski));
}

/* Liczba zespołów przy otwarciu zajęć zespołowych: 2 do 10, domyślnie z zajęć. Trafia do adresów wszystkich widoków (?zespoly=). */
function wyborZespolow(sesja, zajecia, zmienZespoly) {
  if (!zajecia.zespoly) return null;
  const przyciski = ZAKRES_ZESPOLOW.map((n) => {
    const b = el("button", { type: "button", id: `zespoly-${n}`, className: "num", textContent: String(n) });
    b.setAttribute("aria-pressed", String(n === sesja.zespoly));
    b.addEventListener("click", () => zmienZespoly(n, b.id));
    return b;
  });
  const grupa = el("div", { className: "zi-zespoly-wybor", role: "group" }, ...przyciski);
  grupa.setAttribute("aria-label", t("liczbaZespolow"));
  return el("div", { className: "zi-zespoly" }, el("span", { textContent: t("liczbaZespolow") }), grupa,
    el("small", { textContent: t("zespolyDomyslnie", zajecia.zespoly) }));
}

function naglowekSesji(sesja, zajecia, akcje) {
  const kod = el("p", { className: "zi-kodsesji" }, el("span", { textContent: t("kodSesji") }), el("b", { className: "num", textContent: sesja.kod }));
  const jezyk = el("div", { className: "zi-jezyk-zajec" }, el("span", { textContent: t("jezykZajec") }),
    przelacznikPlEn({ etykieta: t("jezykZajec"), wybrany: sesja.jez, naWybor: akcje.zmienJezyk, idPrefiks: "jez-zajec" }));
  return el("header", { className: "k1-ghero" },
    el("div", {}, el("h1", { id: "sesja-h1", tabIndex: -1, textContent: poJezyku(zajecia.nazwa) }), kod, jezyk,
      wyborZespolow(sesja, zajecia, akcje.zmienZespoly),
      el("div", { className: "k1-akcje" },
        przycisk(t("nowyKod"), "k1-btn", akcje.nowyKod, "nowy-kod"),
        przycisk(t("zamknij"), "k1-btn", akcje.zamknij, "zamknij-sesje"))),
    wyborTrybu(sesja, akcje.zmienTryb));
}

function kartaTv(adresy, sesja) {
  return el("section", { className: "k1-link" },
    el("h2", { textContent: t("tv") }), el("p", { className: "k1-meta", textContent: t("tvOpis") }),
    przyciskTv(adresy.tv, sesja.kod),
    adresy.tv ? el("code", { className: "k1-adres", textContent: adresy.tv }) : el("p", { className: "komunikat", textContent: t("tvBrak") }));
}

/* Tryb lokalny (tylko konsola prywatna): telefon ucznia otwiera się w karcie tej przeglądarki (QR nie da się kliknąć). */
function przyciskiUcznia(adresy, sesja, pokazQr) {
  const qr = przycisk(t("pokazQr"), sesja.test === "lokalnie" ? "k1-btn" : "k1-btn-gl", pokazQr, "pokaz-qr");
  if (!KONSOLA_PRYWATNA || sesja.test !== "lokalnie" || !adresy.uczenTutaj) return [qr];

function kartaUczniow(adresy, zajecia, sesja, pokazQr) {
  if (!adresy.uczen) {
    return el("section", { className: "k1-link" }, el("h2", { textContent: t("uczniowie") }), el("p", { className: "komunikat", textContent: t("uczniowieBrak") }));

    el("h2", { textContent: t("uczniowie") }), el("p", { className: "k1-meta", textContent: t("uczniowieOpis") }),

    ...adresDoSkopiowania(adresy.uczen));
}

function kartaTabletu(adresy, zajecia, ustawienia) {
  const naDropbox = ustawienia.dropbox && !zajecia.dropbox ? el("p", { className: "k1-meta", textContent: t("dropboxNaStale") }) : null;
  const qrTabletu = adresy.prowadzacyZdalnie ? obrazQr(adresy.prowadzacyZdalnie, t("qrTabletu"), "zi-qr-maly") : null;
  if (qrTabletu) qrTabletu.hidden = true;
  const pokaz = qrTabletu ? przycisk(t("pokazQrTabletu"), "k1-btn", (z) => {
    qrTabletu.hidden = !qrTabletu.hidden;
    z.currentTarget.textContent = qrTabletu.hidden ? t("pokazQrTabletu") : t("schowajQr");
  }) : null;
  return el("section", { className: "k1-link" },
    el("h2", { textContent: t("tablet") }),
    el("p", { className: "k1-tylko" }, ikona("uwaga"), t("tylkoTy")),
    linkNowaKarta(t("otworzTablet"), adresy.prowadzacy, "k1-btn-gl"),
    adresy.prowadzacyZdalnie ? el("p", { className: "zi-pod", textContent: t("osobnyTablet") }) : null,
    ...(adresy.prowadzacyZdalnie ? adresDoSkopiowania(adresy.prowadzacyZdalnie) : []),
    pokaz, qrTabletu, naDropbox);
}

function ekranSesji({ sesja, zajecia, adresy, baza, ustawienia, akcje }) {
  const brak = baza.brak === "lan" ? "brakBazyLan" : null;
  return [
    sesja.test ? el("p", { className: "baner-testu", textContent: t("banerProby", t("tryby")[TRYBY_TESTU.indexOf(sesja.test)][0]) }) : null,
    naglowekSesji(sesja, zajecia, akcje),
    brak ? el("p", { className: "komunikat zi-komunikat", role: "alert", textContent: t(brak) }) : null,
    el("div", { className: "k1-linki" },
      kartaTv(adresy, sesja), kartaUczniow(adresy, zajecia, sesja, akcje.pokazQr), kartaTabletu(adresy, zajecia, ustawienia)),
  ];
}

/* Kod QR na cały ekran laptopa, gdy TV jeszcze nie działa. Esc albo przycisk zamyka. */
function pokazPelnyQr(adres, zajecia, kod) {
  const okno = document.getElementById("pelny-qr");
  okno.replaceChildren(
    el("div", {}, el("h2", { id: "pelny-qr-tytul", textContent: poJezyku(zajecia.nazwa) }), el("p", { textContent: t("zeskanuj") })),
    obrazQr(adres, t("qrUczniow", poJezyku(zajecia.nazwa), kod), ""),
    el("div", {}, el("p", {}, t("kodSesji"), el("b", { className: "num", textContent: kod })),
      el("div", { className: "k1-akcje zi-zamknij" }, przycisk(t("zamknijOkno"), "k1-btn", () => okno.close()))));
  okno.showModal();
}

/* Uruchamianie zajęć: pasek, wstęp, lista zajęć, ustawienia adresu i Dropboxa, ostatnie sesje. */
const PODPOWIEDZ_PAGES = "https://firmaszydlowski.github.io/zajecia-interaktywne/";

function pasek(baza, zmienJezykKonsoli) {
  const telefony = baza.baza
    ? el("span", { className: "zi-telefony" }, t("telefony"), el("b", { textContent: baza.baza }))
    : el("span", { className: "zi-telefony", textContent: t("telefonyBrak") });
  return [el("b", { className: "k1-logo", textContent: t("logo") }), el("span", { className: "k1-proj", textContent: t("projekt") }), telefony,
    przelacznikPlEn({ etykieta: t("jezyk"), wybrany: JEZYK, naWybor: zmienJezykKonsoli, idPrefiks: "jez-konsoli" })];
}

function wstep() {
  return el("header", { className: "k1-hero" },
    el("div", {}, el("h1", { id: "start-h1", tabIndex: -1, textContent: t("wstepH1") }), el("p", { textContent: t("wstepOpis") })),
    el("ol", { className: "k1-kroki" }, ...t("kroki").map(([tytul, opis], i) =>
      el("li", {}, el("b", { className: "num", textContent: String(i + 1) }), el("h2", { textContent: tytul }), el("p", { textContent: opis })))));
}

function wierszZajec(zajecia, korzen, wybrany, nowaSesja) {
  const adres = (plik) => (plik ? new URL(`${zajecia.slug}/${plik}`, korzen).href : null);
  const uwagi = [];
  if (!zajecia.manifest) uwagi.push(t("bezManifestu"));
  if (zajecia.braki.length) uwagi.push(t("brakPlikow", zajecia.braki.map((p) => t("widoki")[p]).join(", ")));
  const opis = poJezyku(zajecia.opis);
  return el("li", { className: `k1-wiersz${wybrany ? " wybr" : ""}` },
    el("div", {}, el("h3", { textContent: poJezyku(zajecia.nazwa) }),
      opis ? el("p", { className: "k1-meta", textContent: opis }) : null,
      uwagi.length ? el("p", { className: "k1-uwaga" }, ikona("uwaga"), uwagi.join(" ")) : null),
    el("div", { className: "k1-akcje" },
      linkNowaKarta(t("podglad"), adres(zajecia.podglad)),
      linkNowaKarta(t("instrukcja"), adres(zajecia.instrukcja)),
      przycisk(t("nowaSesja"), "k1-btn pelny", () => nowaSesja(zajecia.slug), `nowa-${zajecia.slug}`)));
}

function listaZajec(wszystkie, korzen, aktywnySlug, nowaSesja) {
  const tresc = wszystkie.length
    ? el("ul", {}, ...wszystkie.map((z) => wierszZajec(z, korzen, z.slug === aktywnySlug, nowaSesja)))
    : el("p", { className: "k1-pusto", textContent: t("pusto") });
  return el("section", {}, el("h2", { className: "zi-naglowek", textContent: t("zajecia") }), tresc);
}

function opcjaBazy({ wartosc, etykieta, opis, zaznaczona, poZmianie, dodatek = null }) {
  const id = `baza-${wartosc}`;
  const radio = el("input", { type: "radio", name: "baza", id, value: wartosc, checked: zaznaczona });
  radio.addEventListener("change", () => poZmianie(wartosc, id));
  return el("div", { className: "k1-zazn" }, radio,
    el("label", { htmlFor: id }, etykieta, el("span", { className: "k1-meta", textContent: opis })), dodatek);
}

/* Pole tekstowe zapisuje przy każdym znaku, a stronę przerysowuje dopiero po wyjściu z pola. */
function poleUstawienia({ id, wartosc, podpowiedz, sprawdz, zapisz, przerysuj }) {
  const pole = el("input", { type: "url", id, className: "k1-pole", value: wartosc, placeholder: podpowiedz, autocomplete: "off", spellcheck: false });
  const oznacz = () => pole.setAttribute("aria-invalid", String(Boolean(pole.value.trim()) && !sprawdz(pole.value)));
  oznacz();
  pole.addEventListener("input", () => { oznacz(); zapisz(pole.value); });
  pole.addEventListener("change", () => przerysuj(id));
  return pole;
}

function panelUstawien({ ustawienia, baza, lan, publiczny, wszystkie, zmienUstawienia }) {
  const zmienZrodlo = (zrodlo, fokus) => zmienUstawienia({ zrodlo }, fokus, true);
  const przerysuj = (fokus) => zmienUstawienia({}, fokus, true);
  const polePages = poleUstawienia({
    id: "pole-pages", wartosc: ustawienia.pages, podpowiedz: publiczny ? `${publiczny}/` : PODPOWIEDZ_PAGES, sprawdz: (x) => Boolean(poprawnaBaza(x.trim())),
    zapisz: (pages) => zmienUstawienia({ pages }, null, false), przerysuj,
  });
  const poleDropbox = poleUstawienia({
    id: "pole-dropbox", wartosc: ustawienia.dropbox, podpowiedz: "https://www.dropbox.com/request/…", sprawdz: (x) => Boolean(poprawnyDropbox(x)),
    zapisz: (dropbox) => zmienUstawienia({ dropbox }, null, false), przerysuj,
  });
  const przyjmuja = wszystkie.filter((z) => z.dropbox).map((z) => poJezyku(z.nazwa));
  return el("section", { className: "k1-kosz" },
    el("fieldset", { className: "k1-ust" }, el("legend", { textContent: t("adresTelefonow") }),
      opcjaBazy({ wartosc: "lan", etykieta: t("wifi"), zaznaczona: baza.zrodlo === "lan", poZmianie: zmienZrodlo, opis: lan || t("wifiBrak") }),
      opcjaBazy({ wartosc: "pages", etykieta: t("pages"), zaznaczona: baza.zrodlo === "pages", poZmianie: zmienZrodlo,
        opis: publiczny ? t("pagesPusty", publiczny) : t("pagesOpis"), dodatek: polePages })),
    el("p", { className: "komunikat", textContent: t("hotel") }),
    el("label", { className: "k1-etyk", htmlFor: "pole-dropbox", textContent: t("dropbox") }), poleDropbox,
    el("p", { className: "k1-meta", textContent: przyjmuja.length ? t("dropboxCzesc", przyjmuja.join(", ")) : t("dropboxNikt") }));
}

function panelOstatnich(ostatnie, wszystkie, otworz, wyczysc) {
  const znane = ostatnie.filter((w) => wszystkie.some((z) => z.slug === w.slug));
  const tresc = znane.length
    ? el("ul", { className: "zi-ostatnie" }, ...znane.map((w, i) => el("li", {},
      el("span", {}, el("b", { className: "num", textContent: w.kod }), el("span", { className: "zi-jez", textContent: w.jez.toUpperCase() }),
        w.zespoly ? el("span", { className: "zi-jez", textContent: t("zespolyKrotko", w.zespoly) }) : null,
        w.test ? el("span", { className: "zi-proba", textContent: t("proba") }) : null),
      el("span", { className: "k1-meta", textContent: poJezyku(wszystkie.find((z) => z.slug === w.slug).nazwa) }),
      przycisk(t("otworz"), "k1-btn", () => otworz(w), `ostatnia-${i}`))))
    : el("p", { className: "k1-meta", textContent: t("ostatniePusto") });
  return el("section", { className: "k1-kosz" }, el("h2", { textContent: t("ostatnie") }), tresc,
    znane.length ? el("div", { className: "k1-akcje" }, przycisk(t("wyczysc"), "k1-btn", wyczysc, "wyczysc-ostatnie")) : null);
}

/* Uruchamianie zajęć: stan strony, akcje i rysowanie. ZAJECIA i KONSOLA_PRYWATNA wstawia zbuduj.py (ZAJECIA z manifestów w wyniki/).
   Wersja prywatna ma wszystkie tryby, wersja do udostępniania nie ma próby w kartach (TRYBY_SESJI). */
const TRYBY_SESJI = KONSOLA_PRYWATNA ? TRYBY_TESTU : TRYBY_UDOSTEPNIANE;
const KORZEN = korzenWynikow(location.href);
const LAN = wykryjLan(location.href);
const PUBLICZNY = wykryjPubliczny(location.href);

const stanKonsoli = {
  ustawienia: normalizujUstawienia(czytajPamiec(KLUCZ_USTAWIEN)),
  ostatnie: normalizujOstatnie(czytajPamiec(KLUCZ_OSTATNICH), TRYBY_SESJI, Date.now()),
  sesja: null,
};

const zajeciaPoSlugu = (slug) => ZAJECIA.find((z) => z.slug === slug) || null;

function otworzSesje(sesja, fokus = "sesja-h1") {
  stanKonsoli.sesja = sesja;
  stanKonsoli.ostatnie = dodajDoOstatnich(normalizujOstatnie(stanKonsoli.ostatnie, TRYBY_SESJI, Date.now()), sesja, LIMIT_OSTATNICH, Date.now());
  zapiszPamiec(KLUCZ_OSTATNICH, stanKonsoli.ostatnie);
  rysuj(fokus);
  if (fokus === "sesja-h1") window.scrollTo(0, 0);
}

const akcjeKonsoli = {
  nowaSesja: (slug) => {
    const zajecia = zajeciaPoSlugu(slug);
    otworzSesje({ slug, kod: nowyKod(), klucz: nowyKluczSesji(), test: null, jez: JEZYK, ...(zajecia && zajecia.zespoly ? { zespoly: zajecia.zespoly } : {}) });
    ogloszenie(t("ogloszenieSesja", stanKonsoli.sesja.kod));
  },
  nowyKod: () => {
    otworzSesje({ ...stanKonsoli.sesja, kod: nowyKod(), klucz: nowyKluczSesji() }, "nowy-kod");
    ogloszenie(t("ogloszenieKod", stanKonsoli.sesja.kod));
  },
  zmienTryb: (test, fokus) => otworzSesje({ ...stanKonsoli.sesja, test }, fokus),
  /* Język zajęć: domyślnie język konsoli w chwili otwarcia sesji, potem zmiana tylko dla tej sesji. */
  zmienJezyk: (jez, fokus) => otworzSesje({ ...stanKonsoli.sesja, jez }, fokus),
  /* Liczba zespołów tej sesji (2 do 10); domyślna z zajęć, zapamiętana w ostatnich sesjach. */
  zmienZespoly: (zespoly, fokus) => otworzSesje({ ...stanKonsoli.sesja, zespoly }, fokus),
  zmienJezykKonsoli: (jezyk, fokus) => {
    ustawJezyk(jezyk);
    rysuj(fokus);
  },
  zamknij: () => {
    const slug = stanKonsoli.sesja.slug;
    stanKonsoli.sesja = null;
    rysuj(`nowa-${slug}`);
  },
  /* Ostatnia sesja dostaje nowy klucz (klucz nie jest zapisywany; telefony i tak trzeba połączyć z nowego kodu QR). */
  otworzOstatnia: (wpis) => otworzSesje({ ...wpis, klucz: nowyKluczSesji() }),
  wyczyscOstatnie: () => {
    stanKonsoli.ostatnie = [];
    zapiszPamiec(KLUCZ_OSTATNICH, []);
    rysuj(stanKonsoli.sesja ? "sesja-h1" : "start-h1");
  },
  /* Zapis ustawień; przerysowanie tylko gdy trzeba, żeby nie zabrać fokusu z pola w trakcie pisania. */
  zmienUstawienia: (zmiany, fokus, przerysuj) => {
    stanKonsoli.ustawienia = normalizujUstawienia({ ...stanKonsoli.ustawienia, ...zmiany });
    zapiszPamiec(KLUCZ_USTAWIEN, stanKonsoli.ustawienia);
    if (przerysuj) rysuj(fokus);
  },
};

function bazaTeraz() {
  return wybierzBaze(stanKonsoli.ustawienia, { lan: LAN, publiczny: PUBLICZNY });
}

function widokSesji(baza) {
  const { sesja, ustawienia } = stanKonsoli;
  const zajecia = zajeciaPoSlugu(sesja.slug);
  const dropbox = poprawnyDropbox(ustawienia.dropbox);
  const zespoly = zajecia.zespoly ? poprawneZespoly(sesja.zespoly) || zajecia.zespoly : null;
  const adresy = adresySesji({ zajecia, kod: sesja.kod, test: sesja.test, jez: sesja.jez, baza: baza.baza, dropbox, korzen: KORZEN, zespoly, klucz: sesja.klucz || null });
  const akcje = {
    nowyKod: akcjeKonsoli.nowyKod, zamknij: akcjeKonsoli.zamknij, zmienTryb: akcjeKonsoli.zmienTryb, zmienJezyk: akcjeKonsoli.zmienJezyk,
    zmienZespoly: akcjeKonsoli.zmienZespoly,
    pokazQr: () => pokazPelnyQr(adresy.uczen, zajecia, sesja.kod),
  };
  return ekranSesji({ sesja: { ...sesja, zespoly }, zajecia, adresy, baza, ustawienia, akcje });
}

function rysuj(fokus = null) {
  const baza = bazaTeraz();
  if (stanKonsoli.sesja && !zajeciaPoSlugu(stanKonsoli.sesja.slug)) stanKonsoli.sesja = null;
  document.getElementById("pasek").replaceChildren(...pasek(baza, akcjeKonsoli.zmienJezykKonsoli));
  const gora = stanKonsoli.sesja ? widokSesji(baza) : [wstep()];
  const kolumna = el("div", { className: "zi-kolumna" },
    panelUstawien({ ustawienia: stanKonsoli.ustawienia, baza, lan: LAN, publiczny: PUBLICZNY, wszystkie: ZAJECIA, zmienUstawienia: akcjeKonsoli.zmienUstawienia }),
    panelOstatnich(stanKonsoli.ostatnie, ZAJECIA, akcjeKonsoli.otworzOstatnia, akcjeKonsoli.wyczyscOstatnie));
  document.getElementById("konsola").replaceChildren(...gora.filter(Boolean),
    el("div", { className: "zi-uklad" }, listaZajec(ZAJECIA, KORZEN, stanKonsoli.sesja && stanKonsoli.sesja.slug, akcjeKonsoli.nowaSesja), kolumna));
  const cel = fokus && document.getElementById(fokus);
  if (cel) cel.focus();
}

document.title = t("tytulStrony");
rysuj();

</script>
</body>
</html>
