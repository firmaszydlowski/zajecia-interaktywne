<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Fakt czy fejk o przyrodzie · TV</title>
<style>
/* Kopia 1:1 z generator-debat/apka/styl.css. Wygląd A „Tablica wyników” (makiety/kierunek-A-v2.html): tokeny i elementy wspólne wszystkich stron.
   Tokeny i typografia 1:1 z makiety. Strony: <body class="k1"> (jasna) albo <body class="k1 k1-ciemny">.
   Kontrast WCAG AA sprawdzony dla par tokenów (najniższa para szary/ciem2: 4,9:1). */
:root {
  --tlo: #F2F0EB; --biel: #FFFFFF; --ink: #16181D; --mute: #4F5560; --linia: #D6D2C8; --ciem: #16181D; --ciem2: #22262E; --ciem3: #2E333D;
  --jasny: #C9CED8; --szary: #8B93A1; --tak: #1D5FD6; --nie: #C2410C; --tak-j: #7AAEFF; --nie-j: #FF9B54; --zolty: #FFC94D; --uwaga: #8A3A0A; --uwaga-t: #FDEBD9;
  --kond: "Avenir Next Condensed", "DIN Condensed", "Bahnschrift SemiCondensed", "Arial Narrow", sans-serif;
  --tekst: "Avenir Next", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
h1, h2, h3, h4, p, dl, dd, figure, blockquote { margin: 0; }
ol, ul { margin: 0; padding: 0; list-style: none; }
[hidden] { display: none !important; }
button { cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--zolty); outline-offset: 2px; }
.k1 :focus-visible { outline-color: var(--tak); }
.k1-ciemny :focus-visible { outline-color: var(--zolty); }

.k1 { font: 16px/1.45 var(--tekst); color: var(--ink); background: var(--tlo); }
:where(.k1) button, :where(.k1) input, :where(.k1) select { font: inherit; }
.k1-ciemny { background: var(--ciem); color: #fff; }
.ik { width: 1em; height: 1em; flex: none; vertical-align: -.14em; }
.kbd { display: inline-block; min-width: 1.9em; padding: 0 .4em; border: 1px solid currentColor; border-bottom-width: 3px; border-radius: 4px; font-size: .85em; text-align: center; line-height: 1.5; }
.num { font-variant-numeric: tabular-nums; }
.qr { display: block; shape-rendering: crispEdges; }
.qr svg { display: block; width: 100%; height: auto; }

/* przełączniki: język i widok urządzenia */
.k1 .jez, .k1 .urz { display: inline-flex; border: 1px solid currentColor; }
.k1 .jez button, .k1 .urz button { background: none; border: 0; color: inherit; font-weight: 600; padding: 0 14px; min-height: 44px; white-space: nowrap; }
.k1 .jez button[aria-pressed="true"], .k1 .urz button[aria-pressed="true"] { background: #fff; color: var(--ciem); }

/* przyciski */
.k1-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border: 1px solid var(--ink); background: var(--biel); color: var(--ink); font-weight: 600; white-space: nowrap; text-decoration: none; }
.k1-btn.pelny { background: var(--ciem); color: #fff; }
.k1-btn:disabled { border-color: var(--linia); color: var(--mute); background: transparent; font-weight: 400; }
.k1-ciemny .k1-btn { background: transparent; color: #fff; border-color: #fff; }
.k1-ciemny .k1-btn.pelny { background: #fff; color: var(--ciem); }
.k1-ciemny .k1-btn:disabled { border-color: var(--ciem3); color: var(--szary); }
.k1-btn-gl { display: inline-flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 24px; border: 0; background: var(--zolty); color: var(--ciem); font: 700 22px/1 var(--kond); }
.k1-btn-gl:disabled { opacity: .6; }
.k1-akcje { display: flex; gap: 8px; flex-wrap: wrap; }

/* drobne teksty */
.k1-meta { font-size: 14px; color: var(--mute); }
.k1-ciemny .k1-meta { color: var(--jasny); }
.k1-ang { display: block; color: var(--mute); font-size: 15px; }
.k1-ciemny .k1-ang { color: var(--jasny); }
.k1-hint { font-size: 14px; color: var(--jasny); }
.k1 a { color: var(--tak); }
.k1-ciemny a { color: var(--tak-j); }
.k1-powiedz { font-size: 13px; font-weight: 700; color: var(--mute); display: block; }
.k1-ciemny .k1-powiedz { color: var(--jasny); }
.k1-tylko { display: flex; gap: 8px; align-items: center; padding: 10px 12px; background: var(--uwaga-t); color: var(--uwaga); font-weight: 700; font-size: 15px; }
.k1-tylko .ik { width: 20px; height: 20px; }
.komunikat { padding: 10px 12px; background: var(--uwaga-t); color: var(--uwaga); font-weight: 600; font-size: 15px; }
.komunikat-sesji { padding: 48px 24px; font: 700 28px/1.2 var(--kond); text-align: center; }

/* stan łącza */
.k1-lacze { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--jasny); white-space: nowrap; }
.k1-lacze::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--nie-j); }
.k1-lacze.czesc::before { background: var(--zolty); }
.k1-lacze.ok::before { background: #4ADE80; }

/* TAK i NIE: kolor plus kształt (kółko i kwadrat), żeby nie polegać na samym kolorze */
.strona-tak { color: var(--tak); }
.strona-nie { color: var(--nie); }
.k1-ciemny .strona-tak { color: var(--tak-j); }
.k1-ciemny .strona-nie { color: var(--nie-j); }

/* tryb testowy */
.baner-testu { background: var(--zolty); color: var(--ciem); font-weight: 700; text-align: center; padding: 8px 16px; letter-spacing: .02em; }

/* TV (ciemny): ekran 1920×1080 liczony w jednostce --u. Strona ustawia --u z okna (styl_tv_strona.css), podgląd z ramki.
   Najmniejszy tekst treści: 64 px przy 1080p. Wyjątki: pasek sterowania i baner próby (znikają w pełnym ekranie / tylko próba). */
.tv-ekran { position: relative; width: calc(1920 * var(--u)); height: calc(1080 * var(--u)); padding: calc(48 * var(--u)) calc(72 * var(--u));
  display: flex; flex-direction: column; gap: calc(32 * var(--u)); overflow: hidden; background: var(--ciem); color: #fff;
  font: 400 calc(64 * var(--u))/1.15 var(--tekst); text-align: left; }
.tv-ekran .ik { width: .9em; height: .9em; }
.tv-g { flex: none; display: flex; justify-content: space-between; align-items: baseline; gap: calc(48 * var(--u)); font: 700 calc(64 * var(--u))/1 var(--kond); color: var(--jasny); }
.tv-gl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tv-g > :not(.tv-gl) { flex: none; white-space: nowrap; }
.tv-zegar-maly { flex: none; color: #fff; font-size: calc(96 * var(--u)); }
.tv-ekran .malo { color: var(--zolty); }
.tv-ekran .koniec { color: var(--nie-j); }
.tv-tresc { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: calc(32 * var(--u)); overflow: hidden; }
.tv-kolumna { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: calc(32 * var(--u)); overflow: hidden; }
.tv-z-obrazem { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); gap: calc(56 * var(--u)); }
.tv-dwie { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: calc(48 * var(--u)); }
.tv-obraz, .tv-obraz-ramka { width: 100%; height: 100%; min-height: 0; }
.tv-obraz { display: block; object-fit: cover; }
.tv-obraz-ramka { display: flex; flex-direction: column; gap: calc(12 * var(--u)); }
.tv-obraz-ramka .tv-obraz { flex: 1; height: auto; }
.tv-obraz-ramka figcaption { font: 700 calc(64 * var(--u))/1.05 var(--kond); color: var(--jasny); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* teksty */
.tv-tytul { font: 700 calc(132 * var(--u))/0.95 var(--kond); }
.tv-pyt { font: 700 calc(84 * var(--u))/1.08 var(--tekst); }
.tv-pyt.maly { font-size: calc(64 * var(--u)); line-height: 1.12; }
.tv-tekst { font-size: calc(64 * var(--u)); line-height: 1.2; }
.tv-akcent { color: var(--tak-j); }
.tv-pole { min-height: 0; display: flex; flex-direction: column; gap: calc(16 * var(--u)); padding: calc(28 * var(--u)) calc(36 * var(--u)); background: var(--ciem2); overflow: hidden; }
.tv-pole h2 { font: 700 calc(64 * var(--u))/1 var(--kond); color: var(--zolty); }
.tv-pole-duze { flex: 1; }
.tv-d { flex: none; margin-top: auto; display: flex; flex-wrap: wrap; justify-content: space-between; gap: calc(16 * var(--u)) calc(48 * var(--u));
  font: 700 calc(64 * var(--u))/1.1 var(--kond); color: var(--jasny); }
.tv-zrodlo { font-family: var(--tekst); font-weight: 400; }
.tv-lista { counter-reset: s; display: grid; gap: calc(20 * var(--u)); }
.tv-lista li { counter-increment: s; display: grid; grid-template-columns: calc(88 * var(--u)) 1fr; font-weight: 700; line-height: 1.12; }
.tv-lista li::before { content: counter(s); font-family: var(--kond); color: var(--zolty); }
ul.tv-lista li { grid-template-columns: 1fr; }
ul.tv-lista li::before { content: none; }
.tv-pozycje { display: grid; gap: calc(12 * var(--u)); }
.tv-pozycje h2 { font: 700 calc(64 * var(--u))/1 var(--kond); color: var(--jasny); }
.tv-lista-pozycji li { padding: calc(10 * var(--u)) 0; border-top: calc(4 * var(--u)) solid var(--ciem3); font-weight: 700; line-height: 1.12; }

/* opcje: kolor plus kształt znaku */
.tv-ekran .op-tak { color: var(--tak-j); }
.tv-ekran .op-nie { color: var(--nie-j); }
.tv-ekran .op-jesli { color: var(--zolty); }
.tv-ekran .op-n { color: #fff; }
.op-litera { display: inline-grid; place-items: center; flex: none; width: 1em; height: 1em; border: .08em solid currentColor; font: 700 .7em/1 var(--kond); }
.tv-opcje { display: grid; gap: calc(8 * var(--u)); }
.tv-opcje li { display: flex; align-items: center; gap: calc(28 * var(--u)); padding: calc(18 * var(--u)) 0; border-top: calc(4 * var(--u)) solid var(--ciem3);
  font: 700 calc(84 * var(--u))/1.02 var(--kond); }
.tv-opcje .op-znak, .tv-opcje .op-litera, .tv-sl-nazwa .op-znak, .tv-sl-nazwa .op-litera { width: calc(76 * var(--u)); height: calc(76 * var(--u)); }
.tv-slupki { display: grid; gap: calc(28 * var(--u)); }
.tv-slupki li { display: grid; grid-template-columns: minmax(0, 860fr) minmax(0, 520fr) calc(230 * var(--u)); align-items: center; gap: calc(32 * var(--u)); }
.tv-sl-nazwa { display: flex; align-items: center; gap: calc(20 * var(--u)); font: 700 calc(72 * var(--u))/1 var(--kond); }
.tv-sl-pasek { display: block; height: calc(76 * var(--u)); background: var(--ciem3); }
.tv-sl-pasek i { display: block; height: 100%; background: currentColor; }
.tv-sl-proc { font: 700 calc(120 * var(--u))/1 var(--kond); text-align: right; }
.przygas { opacity: .35; }
.tv-werdykt-rzad { display: flex; flex-wrap: wrap; align-items: center; gap: calc(24 * var(--u)) calc(48 * var(--u)); }
.tv-werdykt { font: 700 calc(150 * var(--u))/0.95 var(--kond); }
/* odsłona: poprawna opcja wypełniona swoim kolorem, ze znakiem ✓ i napisem „Poprawna”; złe szare, bez wypełnienia */
.tv-odsl { flex: none; display: flex; flex-wrap: wrap; gap: calc(16 * var(--u)) calc(24 * var(--u)); }
.tv-odsl li { display: flex; align-items: center; gap: calc(20 * var(--u)); padding: calc(12 * var(--u)) calc(28 * var(--u));
  border: calc(4 * var(--u)) solid var(--ciem3); font: 700 calc(64 * var(--u))/1 var(--kond); }
.tv-odsl li .ik { width: calc(64 * var(--u)); height: calc(64 * var(--u)); }
.tv-ekran .tv-odsl li.zla { color: var(--szary); }
.tv-odsl li.poprawna { background: currentColor; border-color: currentColor; }
.tv-odsl li.poprawna > * { color: var(--ciem); }
.tv-odsl li.poprawna > .odsl-tag { padding: calc(8 * var(--u)) calc(16 * var(--u)); background: var(--ciem); color: #fff; }
.tv-z-obrazem .tv-odsl li { gap: calc(14 * var(--u)); padding: calc(8 * var(--u)) calc(18 * var(--u)); }
.tv-z-obrazem .tv-odsl li.poprawna > .odsl-tag { padding: calc(4 * var(--u)) calc(12 * var(--u)); }
.tv-odsl.duze li.poprawna { font-size: calc(110 * var(--u)); }
.tv-odsl.duze li.poprawna .ik { width: calc(96 * var(--u)); height: calc(96 * var(--u)); }
.tv-odsl.duze li.poprawna > .odsl-tag { font-size: calc(64 * var(--u)); }
.tv-znacznik { padding: calc(12 * var(--u)) calc(24 * var(--u)); background: var(--zolty); color: var(--ciem); font: 700 calc(64 * var(--u))/1 var(--kond); }

/* start i kod QR */
.tv-start { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) calc(640 * var(--u)); gap: calc(96 * var(--u)); align-items: center; }
.tv-qr-blok { display: flex; flex-direction: column; align-items: center; gap: calc(16 * var(--u)); text-align: center; }
.tv-qr { width: calc(560 * var(--u)); padding: calc(24 * var(--u)); background: #fff; }
.tv-qr svg { display: block; width: 100%; height: auto; }
.tv-adres { font: 700 calc(64 * var(--u))/1.05 var(--kond); color: var(--jasny); overflow-wrap: anywhere; }
.tv-kod { font: 700 calc(64 * var(--u))/1 var(--kond); color: var(--jasny); }
.tv-kod b { color: var(--zolty); font-size: calc(120 * var(--u)); letter-spacing: .06em; }
.tv-nakladka { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: calc(24 * var(--u)); background: var(--ciem); color: #fff; }

/* suwaki */
.tv-suwaki { flex: 1; min-height: 0; display: grid; grid-auto-rows: minmax(0, 1fr); gap: calc(40 * var(--u)); }
.tv-suwak-wynik { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: calc(12 * var(--u)); }
.tv-suwak-g, .tv-konce { display: flex; justify-content: space-between; gap: calc(32 * var(--u)); font: 700 calc(64 * var(--u))/1 var(--kond); }
.tv-suwak-g b { color: var(--zolty); }
.tv-konce { color: var(--jasny); }
.tv-histogram { display: flex; align-items: flex-end; gap: calc(12 * var(--u)); min-height: calc(100 * var(--u)); border-bottom: calc(4 * var(--u)) solid var(--jasny); }
.tv-histogram span { flex: 1; height: 100%; display: flex; align-items: flex-end; }
.tv-histogram i { display: block; width: 100%; min-height: calc(4 * var(--u)); background: var(--tak-j); }

/* ściana tekstów */
.tv-sciana { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, max-content); align-content: start;
  gap: calc(24 * var(--u)); overflow: hidden; }
.tv-wpis { display: flex; flex-direction: column; gap: calc(8 * var(--u)); padding: calc(20 * var(--u)) calc(28 * var(--u)); background: var(--ciem2);
  border-left: calc(10 * var(--u)) solid var(--tak-j); overflow: hidden; }
.tv-wpis p { line-height: 1.15; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tv-dwie .tv-sciana { grid-template-columns: minmax(0, 1fr); }
.tv-wpis-kto { font: 700 calc(64 * var(--u))/1 var(--kond); color: var(--zolty); }
.tv-wpis.ocena-dobrze { border-left-color: #4ADE80; }
.tv-wpis.ocena-popraw { border-left-color: var(--nie-j); }
.tv-ocena { font: 700 calc(64 * var(--u))/1 var(--kond); color: var(--jasny); }

/* stuknięcie */
.tv-dwie-mapa { grid-template-columns: auto minmax(0, 1fr); align-items: start; }
.tv-mapa { position: relative; height: calc(760 * var(--u)); }
.tv-mapa img { display: block; height: 100%; width: auto; }
.tv-cel { position: absolute; border: calc(8 * var(--u)) solid var(--zolty); box-shadow: 0 0 0 calc(4 * var(--u)) var(--ciem); }
.tv-kropka { position: absolute; width: calc(30 * var(--u)); height: calc(30 * var(--u)); margin: calc(-15 * var(--u)) 0 0 calc(-15 * var(--u));
  border-radius: 50%; background: var(--tak-j); border: calc(4 * var(--u)) solid var(--ciem); }
.tv-kropka.poza { background: var(--nie-j); }
.tv-wielka-liczba { font: 700 calc(150 * var(--u))/1 var(--kond); color: var(--zolty); }

/* galeria, timer, ranking */
.tv-galeria { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(var(--kol, 3), minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: calc(32 * var(--u)); }
.tv-galeria li { min-height: 0; display: flex; flex-direction: column; background: var(--ciem2); }
.tv-galeria img { flex: 1; min-height: 0; width: 100%; object-fit: cover; display: block; }
.tv-galeria li.pierwsze { outline: calc(8 * var(--u)) solid var(--zolty); }
.tv-kafel-opis { display: flex; align-items: center; gap: calc(24 * var(--u)); padding: calc(14 * var(--u)) calc(24 * var(--u)); font: 700 calc(64 * var(--u))/1.05 var(--kond);
  white-space: nowrap; overflow: hidden; }
.tv-kafel-opis > b { color: var(--zolty); }
.tv-serca { display: inline-flex; align-items: center; gap: calc(8 * var(--u)); }
.tv-serca .ik { color: var(--nie-j); }
.tv-timer { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(24 * var(--u)); text-align: center; }
.tv-zegar-duzy { font: 700 calc(420 * var(--u))/0.85 var(--kond); }
.tv-ranking li { display: grid; grid-template-columns: calc(150 * var(--u)) 1fr auto; padding: calc(14 * var(--u)) 0; border-top: calc(4 * var(--u)) solid var(--ciem3);
  font: 700 calc(84 * var(--u))/1.1 var(--kond); }
.tv-ranking li:first-child { color: var(--zolty); }
.tv-ranking.dwie { display: grid; grid-auto-flow: column; grid-template-rows: repeat(var(--wiersze), auto); grid-template-columns: 1fr 1fr; column-gap: calc(96 * var(--u)); }

/* dopasowanie, gdy treść się nie mieści (tv_kroki.js: dopasujEkran) */
.ciasno .tv-tytul { font-size: calc(100 * var(--u)); }
.ciasno .tv-pyt { font-size: calc(72 * var(--u)); }
.ciasno .tv-werdykt { font-size: calc(112 * var(--u)); }
.ciasno .tv-odsl.duze li.poprawna { font-size: calc(84 * var(--u)); }
.ciasno .tv-tresc, .ciasno .tv-kolumna { gap: calc(20 * var(--u)); }
.ciasno .tv-opcje li { padding: calc(10 * var(--u)) 0; }
.ciasno .tv-ranking li { padding: calc(6 * var(--u)) 0; font-size: calc(72 * var(--u)); }
.ciasno2 .tv-tytul, .ciasno2 .tv-pyt, .ciasno2 .tv-werdykt, .ciasno2 .tv-odsl.duze li.poprawna { font-size: calc(64 * var(--u)); }
.ciasno2 .tv-tekst, .ciasno2 .tv-pole p, .ciasno2 .tv-lista li, .ciasno2 .tv-lista-pozycji li { font-family: var(--kond); line-height: 1.08; }

/* Strona TV na żywo: jednostka --u z okna, ekran wyśrodkowany, sterowanie i stan łącza w rogach (wyjątek od 64 px). */
:root { --u: min(100vw / 1920, 100vh / 1080); }
html, body { height: 100%; }
body { overflow: hidden; background: var(--ciem); }
#tv { position: relative; height: 100%; display: flex; align-items: center; justify-content: center; }
.baner-testu { position: fixed; left: 50%; bottom: 0; z-index: 20; transform: translateX(-50%); font: 700 calc(36 * var(--u))/1.1 var(--kond); padding: calc(6 * var(--u)) calc(24 * var(--u)); }
.start { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(24 * var(--u));
  border: 0; background: var(--ciem); color: #fff; }
.start-tytul { font: 700 calc(132 * var(--u))/1 var(--kond); }
.start-opis { font-size: calc(64 * var(--u)); color: var(--jasny); }
.sterowanie { position: fixed; right: calc(16 * var(--u)); bottom: calc(16 * var(--u)); z-index: 6; display: flex; gap: calc(8 * var(--u)); font-size: calc(22 * var(--u)); opacity: .7; }
.sterowanie > button { min-height: 44px; padding: 0 calc(16 * var(--u)); border: 1px solid var(--jasny); background: transparent; color: #fff; }
#lacze { position: fixed; left: calc(16 * var(--u)); bottom: calc(16 * var(--u)); z-index: 6; font-size: calc(22 * var(--u)); opacity: .7; }
:fullscreen .sterowanie, :fullscreen #lacze { display: none; }
.wpis-kodu { width: calc(1100 * var(--u)); display: grid; gap: calc(24 * var(--u)); color: #fff; font-size: calc(64 * var(--u)); }
.wpis-kodu h1 { font: 700 calc(132 * var(--u))/1 var(--kond); }
.wpis-kodu p, .wpis-kodu label { color: var(--jasny); }
.wpis-kodu input { min-height: calc(140 * var(--u)); padding: 0 calc(24 * var(--u)); border: calc(4 * var(--u)) solid #fff; background: var(--ciem2); color: #fff;
  font: 700 calc(96 * var(--u))/1 var(--kond); letter-spacing: .1em; text-transform: uppercase; }
.wpis-kodu .k1-btn-gl { min-height: calc(120 * var(--u)); justify-content: center; font-size: calc(64 * var(--u)); }
.wpis-kodu .komunikat { font-size: calc(48 * var(--u)); }

/* Typ kroku „macierz” (typ_macierz.js): tabela na TV (jednostka --u, tekst min. 64 px) i wiersze przycisków na telefonie. */
.tv-macierz { width: 100%; border-collapse: collapse; font: 700 calc(64 * var(--u))/1.1 var(--kond); }
.tv-macierz th, .tv-macierz td { padding: calc(4 * var(--u)) calc(20 * var(--u)); border-top: calc(4 * var(--u)) solid var(--ciem3); text-align: center; }
.tv-macierz thead th { border-top: 0; color: var(--jasny); }
.tv-macierz tbody th { text-align: left; white-space: nowrap; }
.tv-macierz td { font-size: calc(72 * var(--u)); }
.tv-macierz .mz-max { color: var(--zolty); }
.tv-macierz .mz-dobra { background: var(--tak-j); color: var(--ciem); }
.tv-macierz .mz-ok { width: calc(56 * var(--u)); height: calc(56 * var(--u)); margin-right: calc(8 * var(--u)); vertical-align: calc(-6 * var(--u)); }
.tv-macierz .mz-zla { color: var(--szary); opacity: .6; }
.tv-mz-dwie { display: grid; grid-template-columns: 1fr 1fr; gap: calc(64 * var(--u)); align-items: start; }
.tv-mz-dwie .tv-macierz th, .tv-mz-dwie .tv-macierz td { padding-left: calc(12 * var(--u)); padding-right: calc(12 * var(--u)); }
.tv-mz-dwie .tv-macierz thead th:first-child { text-align: left; }
.tv-mz-obok { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.tv-mz-wiersze { display: flex; flex-wrap: wrap; gap: calc(16 * var(--u)) calc(24 * var(--u)); font: 700 calc(64 * var(--u))/1.1 var(--kond); }
.tv-mz-wiersze li { padding: calc(6 * var(--u)) calc(20 * var(--u)); background: var(--ciem2); }
/* Wpisy zespołów przy wierszach (z_kroku): skrót zespołu i wpis do 2 linii; ciasno2 (ekran się nie mieści) ucina do 1 linii. Tekst zawsze 64 px. */
.tv-mz-wpisy { display: grid; grid-auto-flow: column; grid-template-rows: repeat(var(--wiersze), auto); column-gap: calc(56 * var(--u)); align-content: start;
  font: 700 calc(64 * var(--u))/1.05 var(--kond); }
.tv-mz-wpisy.dwie { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tv-mz-wpisy li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: calc(20 * var(--u)); padding: calc(8 * var(--u)) 0;
  border-top: calc(4 * var(--u)) solid var(--ciem3); }
.tv-mz-wpisy b { color: var(--zolty); }
.tv-mz-wpisy span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.ciasno2 .tv-mz-wpisy span { -webkit-line-clamp: 1; }

.u-mz-wiersz { display: grid; gap: 6px; padding: 8px 0; border-bottom: 1px solid var(--ciem3); }
.u-mz-wiersz > b { font: 700 20px/1.2 var(--kond); }
.u-mz-wpis { font-size: 17px; line-height: 1.35; overflow-wrap: anywhere; }
.u-glos.u-mz-przyciski { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; }
.u-glos.u-mz-przyciski button { flex: 1 1 0; min-width: 52px; min-height: 52px; padding: 6px 10px; justify-content: center; font: 700 20px/1.1 var(--kond);
  text-align: center; color: #fff; }
.u-glos.u-mz-przyciski button { gap: 6px; }
.u-glos.u-mz-przyciski .mz-ok { width: 22px; height: 22px; }
/* odsłona: poprawne wypełnione ze znakiem ✓, pozostałe szare, twój błędny wybór w pomarańczowej ramce */
.u-ekran .u-glos.u-mz-przyciski button.mz-dobra { background: var(--tak-j); border-color: var(--tak-j); color: var(--ciem); }
.u-ekran .u-glos.u-mz-przyciski button.mz-dobra > * { color: var(--ciem); }
.u-ekran .u-glos.u-mz-przyciski button.mz-zla { background: transparent; border-color: var(--ciem3); color: var(--szary); }
.u-ekran .u-glos.u-mz-przyciski button.mz-zla > * { color: var(--szary); }
.u-ekran .u-glos.u-mz-przyciski button.mz-zla[aria-pressed="true"] { border-color: var(--nie-j); border-style: solid; }

/* Style typów kroków o zdjęciach: zdjecie, przerobka, wyscig, losowanie, galeria_tv, podpisy (typ_*.js). Wchodzą do wszystkich stron.
   TV w jednostce --u, najmniejszy tekst treści 64 px przy 1080p. Czerwona ramka przeróbki: jedyny kolor spoza tokenów wyglądu A (znak „tu zmieniono”). */
:root { --czerwony: #FF4D4D; }

/* zdjecie: przekreślony podpis i tabelka danych */
.tv-falszywy { font: 400 calc(64 * var(--u))/1.15 var(--kond); color: var(--jasny); }
.tv-falszywy s { text-decoration-thickness: calc(6 * var(--u)); text-decoration-color: var(--nie-j); }
/* Na TV wiersz danych to jedna linia „etykieta wartość” (długie wartości łamią się pod spodem), żeby wąska kolumna nie łamała każdej wartości. */
.tv-dane { font: 700 calc(64 * var(--u))/1.15 var(--kond); }
.tv-dane dt { display: inline; color: var(--jasny); font-weight: 400; }
.tv-dane dt::after { content: " "; }
.tv-dane dd { display: inline; margin: 0; overflow-wrap: anywhere; }
.tv-dane dd::after { content: "\A"; white-space: pre; }
.u-falszywy { padding: 10px 12px; background: var(--ciem2); border-left: 4px solid var(--nie-j); }
.u-falszywy s { text-decoration-color: var(--nie-j); text-decoration-thickness: 2px; }
.u-dane { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; font-size: 16px; }
.u-dane dt { color: var(--jasny); }
.u-dane dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; }

/* przerobka: mapa stuknięć, czerwona ramka, oryginał */
.tv-pmapa { position: relative; width: max-content; justify-self: start; }
.tv-pmapa img { display: block; height: calc(760 * var(--u)); width: auto; }
.tv-przerobka { flex: none; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: calc(48 * var(--u)); align-items: start; }
.tv-przerobka .tv-pmapa img { height: calc(520 * var(--u)); }
.tv-przerobka .tv-kolumna { overflow: visible; }
.tv-p-werdykt { font: 700 calc(96 * var(--u))/1 var(--kond); }
.cel-przerobki { position: absolute; border: calc(8 * var(--u)) solid var(--czerwony); box-shadow: 0 0 0 calc(4 * var(--u)) var(--ciem); }
/* Telefon nie ma jednostki --u: pełna ramka w pikselach (bez tego obramowanie znikało i zostawał tylko ciemny cień). */
.u-mapa .cel-przerobki { border: 5px solid var(--czerwony); box-shadow: 0 0 0 2px var(--ciem), inset 0 0 0 2px var(--ciem); }
.tv-pmapa .tv-kropka.poza, .u-mapa .u-kropka.poza { background: var(--szary); }
.tv-p-lewa { display: flex; flex-direction: column; gap: calc(12 * var(--u)); min-height: 0; }
.tv-p-podpis { font: 700 calc(64 * var(--u))/1.05 var(--kond); color: var(--jasny); }
.tv-p-procent { font: 700 calc(84 * var(--u))/1 var(--kond); color: var(--zolty); }
.tv-oryginal { display: flex; flex-direction: column; gap: calc(10 * var(--u)); min-height: 0; }
.tv-oryginal img { display: block; height: calc(220 * var(--u)); width: auto; max-width: 100%; object-fit: contain; object-position: left; }
.tv-oryginal figcaption { font: 700 calc(64 * var(--u))/1.05 var(--kond); color: var(--jasny); }
.ciasno .tv-oryginal img { height: calc(200 * var(--u)); }
.ciasno .tv-przerobka .tv-pmapa img { height: calc(440 * var(--u)); }
.u-brak { justify-content: center; min-height: 56px; }
.u-brak[aria-pressed="true"] { background: #fff; color: var(--ciem); }
.u-oryginal img { display: block; width: 100%; height: auto; }
.u-oryginal figcaption { margin-top: 4px; font-size: 14px; color: var(--jasny); }

/* wyscig: miniatury i ranking na TV, przełącznik zdjęć na telefonie */
.tv-miniatury { flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: calc(24 * var(--u)); height: calc(200 * var(--u)); }
.tv-miniatury { grid-template-rows: 100%; }
.tv-miniatury li { position: relative; min-width: 0; height: 100%; overflow: hidden; }
.tv-miniatury img { display: block; width: 100%; height: 100%; object-fit: cover; }
.tv-miniatury b { position: absolute; left: 0; top: 0; padding: 0 calc(18 * var(--u)); background: var(--ciem); color: var(--zolty); font: 700 calc(64 * var(--u))/1.2 var(--kond); }
.tv-wyscig { flex: none; display: grid; gap: calc(4 * var(--u)); }
.tv-wyscig li { display: grid; grid-template-columns: calc(110 * var(--u)) minmax(0, 1fr) auto calc(240 * var(--u)); align-items: baseline; gap: calc(32 * var(--u));
  padding: calc(10 * var(--u)) 0; border-top: calc(4 * var(--u)) solid var(--ciem3); font: 700 calc(72 * var(--u))/1.1 var(--kond); }
.tv-wyscig li > :last-child { text-align: right; color: var(--jasny); }
.tv-wyscig.wyniki li:first-child { color: var(--zolty); }
.ciasno .tv-wyscig li { padding: calc(4 * var(--u)) 0; font-size: calc(64 * var(--u)); }
.tv-wyscig.dwie { grid-auto-flow: column; grid-template-rows: repeat(var(--wiersze), auto); grid-template-columns: 1fr 1fr; column-gap: calc(64 * var(--u)); }
.tv-wyscig.dwie li { grid-template-columns: calc(90 * var(--u)) minmax(0, 1fr) auto; gap: calc(24 * var(--u)); font-size: calc(64 * var(--u)); }
.tv-wyscig.dwie li > :last-child { display: none; }
.ciasno .tv-miniatury { height: calc(160 * var(--u)); }
/* Ekran startowy z długim adresem (np. adres_uczniow z ustawienia plus długa nazwa zajęć): blok QR od góry, więc nadmiar wychodzi w dół
   i dopasujEkran go widzi; przy ciasnym ekranie mniejszy kod QR, żeby adres i kod sesji się zmieściły. Dotyczy ekranu startowego wszystkich zajęć. */
.tv-start .tv-qr-blok { align-self: start; }
.ciasno .tv-qr { width: calc(460 * var(--u)); }
.ciasno2 .tv-qr { width: calc(380 * var(--u)); }
.ciasno .tv-start { grid-template-columns: minmax(0, 1fr) calc(720 * var(--u)); gap: calc(64 * var(--u)); }
.u-chipy { display: flex; flex-wrap: wrap; gap: 8px; }
.u-chip { min-width: 52px; min-height: 52px; border: 2px solid #fff; background: transparent; color: #fff; font: 700 24px/1 var(--kond); }
.u-chip.zrobione { border-color: var(--tak-j); color: var(--tak-j); }
.u-chip[aria-current="true"] { background: #fff; color: var(--ciem); }
.u-wyscig-panel { display: grid; gap: 10px; }

/* losowanie */
.tv-dwie-rowne { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.tv-tematy { display: grid; gap: calc(4 * var(--u)); }
.tv-tematy li { display: grid; grid-template-columns: calc(130 * var(--u)) minmax(0, 1fr); gap: calc(24 * var(--u)); padding: calc(10 * var(--u)) 0;
  border-top: calc(4 * var(--u)) solid var(--ciem3); font: 700 calc(64 * var(--u))/1.1 var(--kond); }
.tv-tematy b { color: var(--zolty); }
.tv-tematy.dwie { grid-auto-flow: column; grid-template-rows: repeat(var(--wiersze), auto); grid-template-columns: 1fr 1fr; column-gap: calc(64 * var(--u)); }
.u-ekran .u-temat { font: 700 32px/1.1 var(--kond); color: var(--zolty); }

/* galeria_tv i podpisy: zdjęcia z komputera przy TV */
.tv-plik { position: fixed; left: -9999px; width: 1px; height: 1px; opacity: 0; }
.tv-wczytaj { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(520 * var(--u)), 1fr)); gap: calc(24 * var(--u)); }
.tv-wczytaj-z { display: flex; justify-content: space-between; align-items: center; gap: calc(24 * var(--u)); padding: calc(20 * var(--u)) calc(32 * var(--u));
  border: calc(4 * var(--u)) solid #fff; font: 700 calc(64 * var(--u))/1 var(--kond); cursor: pointer; }
.tv-wczytaj-z b { color: var(--zolty); }
.tv-wczytaj-z:hover { background: var(--ciem2); }
.tv-wczytaj.maly { display: flex; flex-wrap: wrap; gap: calc(12 * var(--u)); }
.tv-wczytaj.maly .tv-wczytaj-z { padding: calc(6 * var(--u)) calc(16 * var(--u)); border-width: calc(3 * var(--u)); }
.tv-foto li.pusty { background: transparent; }
.tv-foto .tv-kafel-opis { padding: calc(8 * var(--u)) calc(20 * var(--u)); }
.tv-reportaz { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: calc(48 * var(--u)); }
.tv-reportaz figure { min-height: 0; display: flex; flex-direction: column; gap: calc(16 * var(--u)); }
.tv-reportaz img { display: block; width: 100%; height: calc(440 * var(--u)); object-fit: cover; }
.tv-reportaz figcaption { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.tv-g-prawa { display: flex; align-items: baseline; gap: calc(32 * var(--u)); }
.tv-zapisz { min-height: calc(80 * var(--u)); padding: 0 calc(24 * var(--u)); border: calc(4 * var(--u)) solid #fff; background: transparent; color: #fff;
  font: 700 calc(64 * var(--u))/1 var(--kond); }
.u-serca-siatka { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.u-serca-siatka .u-serce { margin: 0; justify-content: center; min-height: 56px; }
.p-odp-wyscigu { display: grid; gap: 6px; }
.p-odp-wyscigu li { display: grid; gap: 4px; padding-top: 6px; border-top: 1px solid var(--ciem3); }
.p-pokaz { align-self: center; font: 700 22px/1 var(--kond); }

/* Tajny przydział, zdjęcia z telefonów i przeróbki zespołów (typ_przydzial.js, typ_zdjecia_telefonow.js, typ_przerobki_*.js).
   Wygląd A: tylko tokeny ze styl.css. TV w jednostce --u, tekst treści min. 64 px przy 1080p. */

/* przydział na telefonie */
.u-przydzial { border-left: 4px solid var(--zolty); }
.u-przydzial p { font-size: 16px; line-height: 1.4; }
.k1-ciemny a.u-link-przydzialu { justify-content: center; margin-top: 4px; color: var(--ciem); text-decoration: none; }
.u-przydzial-tekst { display: grid; gap: 8px; }
.u-wskazowka { padding: 8px 12px; border-left: 4px solid var(--zolty); background: var(--ciem2); font-size: 16px; line-height: 1.4; }

/* zdjęcia wysłane z telefonu */
.u-wybierz-zdj { justify-content: center; cursor: pointer; }
.u-moje-zdj { display: grid; gap: 8px; }
.u-moje-zdj li { display: grid; grid-template-columns: 72px minmax(0, 1fr); align-items: center; gap: 12px; padding: 6px; background: var(--ciem2); font-size: 15px; }
.u-moje-zdj img, .u-moje-brak { display: block; width: 72px; height: 54px; object-fit: cover; background: var(--ciem3); }

/* konsola: miniatury zdjęć z telefonów, „Pokaż” przed TV */
.p-zdj-moderacja { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.p-zdj-moderacja li { display: grid; gap: 6px; align-content: start; padding: 8px; background: var(--ciem); border-left: 6px solid var(--ciem3); }
.p-zdj-moderacja li.pokazane { border-left-color: var(--tak-j); }
.p-zdj-moderacja img, .p-zdj-czeka { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: var(--ciem3); }
.p-zdj-czeka { display: grid; place-items: center; font-size: 14px; color: var(--jasny); }

/* TV: zdjęcia zespołów w drodze i na ekranie */
.tv-zdj-zespolow { display: grid; gap: calc(4 * var(--u)); }
.tv-zdj-zespolow li { display: flex; justify-content: space-between; gap: calc(32 * var(--u)); padding: calc(12 * var(--u)) 0;
  border-top: calc(4 * var(--u)) solid var(--ciem3); font: 700 calc(72 * var(--u))/1.1 var(--kond); }
.tv-zdj-zespolow b { color: var(--zolty); }
.tv-zdj-zespolow.dwie { grid-auto-flow: column; grid-template-rows: repeat(var(--wiersze), auto); grid-template-columns: 1fr 1fr; column-gap: calc(64 * var(--u)); }
.tv-zdj-zespolow.dwie li { font-size: calc(64 * var(--u)); }
.tv-opis-zdjec { flex: none; color: var(--jasny); }
.ciasno .tv-zdj-zespolow li { padding: calc(6 * var(--u)) 0; font-size: calc(64 * var(--u)); }

/* przeróbki zespołów: kropki z numerem zespołu */
.przr-mapa { position: relative; }
.przr-czeka { padding: 24px; color: var(--jasny); }
.przr-kropka { position: absolute; display: grid; place-items: center; width: 32px; height: 32px; margin: -16px 0 0 -16px; border-radius: 50%;
  background: var(--zolty); color: var(--ciem); border: 3px solid var(--ciem); font: 700 16px/1 var(--kond); }
.przr-kropka.traf { background: var(--tak-j); }
.przr-kropka.pudlo { background: var(--nie-j); }
.tv-pmapa .przr-kropka { width: calc(88 * var(--u)); height: calc(88 * var(--u)); margin: calc(-44 * var(--u)) 0 0 calc(-44 * var(--u));
  border-width: calc(6 * var(--u)); font-size: calc(64 * var(--u)); }
.tv-pmapa .przr-czeka { padding: calc(48 * var(--u)); font-size: calc(64 * var(--u)); }
.tv-tekst.przr-traf { font-weight: 700; color: var(--tak-j); }

/* blokada zespołu (zespol_blokada.js): nazwa zespołu w pasku telefonu bez „zmień”, zwalnianie w konsoli prowadzącego */
.u-pasek .u-zm:disabled { color: #fff; font-weight: 700; text-decoration: none; cursor: default; }
.p-zwolnij { display: grid; gap: 6px; margin: 6px 0 10px; }
.p-zwolnij li { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

/* Typ kroku „kalkulator” (typ_kalkulator.js): TV w jednostce --u (tekst min. 64 px), telefon ciemny jak styl_u.css.
   .kalk-pasek (tor i wypełnienie paska) używają też typ_wybor.js i typ_mapa.js. */
.kalk-pasek { display: block; height: calc(56 * var(--u)); background: var(--ciem3); }
.kalk-pasek i { display: block; height: 100%; background: var(--tak-j); }
.staly .kalk-pasek i { background: var(--jasny); }

.tv-kalk { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: calc(48 * var(--u)); }
.tv-kalk-liczba { font: 700 calc(200 * var(--u))/0.95 var(--kond); color: var(--zolty); }
.tv-kalk-paski { display: grid; gap: calc(20 * var(--u)); }
.tv-kalk-paski li { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) auto; align-items: center; gap: calc(24 * var(--u));
  font: 700 calc(64 * var(--u))/1.05 var(--kond); }
.tv-kalk-paski li > b { text-align: right; }
.ciasno .tv-kalk-liczba { font-size: calc(150 * var(--u)); }

.u-kalk { display: grid; gap: 14px; }
.u-kalk-pyt { display: grid; gap: 6px; padding-top: 10px; border-top: 1px solid var(--ciem3); }
.u-kalk-pyt h3 { font: 700 20px/1.25 var(--tekst); }
.u-kalk-odp { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.u-kalk-odp button { min-height: 56px; padding: 8px 10px; border: 2px solid #fff; background: transparent; color: #fff; font: 600 16px/1.2 var(--tekst); text-align: left; }
.u-kalk-odp button[aria-pressed="true"] { background: var(--zolty); border-color: var(--zolty); color: var(--ciem); }
.u-kalk-postep { font: 700 22px/1 var(--kond); color: var(--zolty); }
.u-kalk-dol { display: grid; gap: 12px; }
.u-ekran .u-kalk-kg { font: 700 64px/1 var(--kond); color: var(--zolty); }
.u-kalk-kg small { font: 600 17px/1.2 var(--tekst); color: #fff; }
.u-kalk-paski { display: grid; gap: 8px; }
.u-kalk-paski li { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 15px; }
.u-kalk-paski li > b { grid-row: 1; grid-column: 2; font: 700 20px/1 var(--kond); text-align: right; }
.u-kalk-paski .kalk-pasek { grid-column: 1 / -1; height: 10px; }
.u-kalk-rady li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--ciem3); }
.u-kalk-rady b { font: 700 20px/1.1 var(--kond); color: var(--zolty); white-space: nowrap; }
.u-kalk-jak summary { min-height: 44px; display: flex; align-items: center; font-weight: 700; cursor: pointer; }
.u-kalk-jak ul { display: grid; gap: 8px; padding-left: 18px; list-style: disc; font-size: 15px; color: var(--jasny); }

/* Typ kroku „wybor” (typ_wybor.js): karty, ranking i podium na TV (tekst min. 64 px), lista przycisków na telefonie. */
.tv-wybor-karty { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: calc(32 * var(--u)); }
.tv-wybor-karty li { justify-content: space-between; }
.tv-wybor-karty p { font-weight: 700; line-height: 1.12; }
.tv-wybor-karty b { font: 700 calc(96 * var(--u))/1 var(--kond); color: var(--tak-j); }
.tv-wybor-karty span { font: 700 calc(64 * var(--u))/1 var(--kond); color: var(--jasny); }
.tv-wybor-ranking { display: grid; gap: calc(20 * var(--u)); }
.tv-wybor-ranking li { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 1fr) calc(120 * var(--u)); align-items: center; gap: calc(28 * var(--u));
  font-weight: 700; line-height: 1.1; }
.tv-wybor-ranking li > b { font: 700 calc(84 * var(--u))/1 var(--kond); text-align: right; color: var(--zolty); }
.tv-wybor-podium { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: calc(32 * var(--u)); }
.tv-wybor-podium li > b { font: 700 calc(160 * var(--u))/0.9 var(--kond); color: var(--zolty); }
.tv-wybor-podium p { font-weight: 700; line-height: 1.12; }
.tv-wybor-podium li > span { margin-top: auto; font: 700 calc(64 * var(--u))/1 var(--kond); color: var(--jasny); }
.ciasno .tv-wybor-ranking { gap: calc(10 * var(--u)); }

.u-glos.u-wybor { gap: 8px; }
.u-glos.u-wybor button { flex-direction: column; align-items: flex-start; gap: 4px; min-height: 56px; padding: 10px 14px; border-width: 2px;
  font: 600 17px/1.25 var(--tekst); }
.u-glos.u-wybor button small { font: 700 16px/1.1 var(--kond); color: var(--zolty); }
.u-glos.u-wybor button[aria-pressed="true"] small { color: var(--ciem); }
.u-ekran .u-wybor-znacznik { font: 700 40px/1.05 var(--kond); color: var(--tak-j); }
.u-wybor-znacznik small { font: 600 16px/1 var(--tekst); color: var(--jasny); }
.tv-lista-pozycji.tv-dwie-kolumny { columns: 2; column-gap: calc(64 * var(--u)); }
/* Ponad 6 zespołów: tytuł w jednej linii wąskim krojem, nadmiar ucięty wielokropkiem (numer zespołu zawsze widać). */
.tv-lista-pozycji.tv-dwie-kolumny li { break-inside: avoid; font-family: var(--kond); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Typ kroku „mapa” (typ_mapa.js): tabela różnic na TV (tekst min. 64 px), karty z dwoma suwakami na telefonie. */
.tv-mapa-tab { display: grid; gap: calc(18 * var(--u)); }
.tv-mapa-tab li { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.2fr); align-items: center; gap: calc(32 * var(--u));
  font: 700 calc(64 * var(--u))/1.05 var(--kond); }
.tv-mapa-g { color: var(--jasny); }
.tv-mapa-g .s0 { color: var(--zolty); }
.tv-mapa-st { display: grid; grid-template-columns: minmax(0, 1fr) calc(120 * var(--u)); align-items: center; gap: calc(16 * var(--u)); }
.tv-mapa-st b { text-align: right; }
.tv-mapa-st .kalk-pasek { height: calc(48 * var(--u)); }
.tv-mapa-st i.s0 { background: var(--zolty); }
.tv-mapa-st i.s1 { background: var(--jasny); }
.tv-mapa-opis { color: var(--jasny); }
.tv-mapa-opis.roznica { color: var(--zolty); }
.tv-mapa-przydzial { display: grid; gap: calc(16 * var(--u)); }
.tv-mapa-przydzial li { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) auto; gap: calc(32 * var(--u)); padding: calc(14 * var(--u)) 0;
  border-top: calc(4 * var(--u)) solid var(--ciem3); font: 700 calc(72 * var(--u))/1.1 var(--kond); }
.tv-mapa-przydzial b { color: var(--zolty); }

.u-mapa-karta .u-suwak { padding: 4px 0; }
.u-mapa-karta .u-suwak:last-child { border-bottom: 0; }

/* Typ kroku „wyzwanie” (typ_wyzwanie.js): ranking i omówienie kategorii na TV, plan zespołu na telefonie; porównanie typu i wyniku
   kalkulatora (kalk_porownanie.js). TV w jednostce --u, tekst min. 64 px. Paski: .kalk-pasek ze styl_kalkulator.css. Wygląd zatwierdzony w podglądzie 10.11. */
.tv-wyz-ranking { display: grid; gap: calc(20 * var(--u)); }
.tv-wyz-ranking li { display: grid; grid-template-columns: calc(96 * var(--u)) minmax(0, 300fr) minmax(0, 620fr) calc(250 * var(--u)) calc(380 * var(--u));
  align-items: center; gap: calc(28 * var(--u)); font: 700 calc(72 * var(--u))/1 var(--kond); }
.tv-wyz-ranking .miejsce { font-size: calc(96 * var(--u)); color: var(--zolty); }
.tv-wyz-ranking .kg { font-size: calc(84 * var(--u)); text-align: right; white-space: nowrap; }
.tv-wyz-ranking .szac { font-size: calc(64 * var(--u)); color: var(--jasny); }
.tv-wyz-ranking .szac.najlepszy { padding: calc(4 * var(--u)) calc(14 * var(--u)); background: var(--zolty); color: var(--ciem); justify-self: start; }

.tv-wyz-opcje { display: grid; gap: calc(24 * var(--u)); }
.tv-wyz-opcje li { display: grid; grid-template-columns: minmax(0, 640fr) minmax(0, 400fr) calc(290 * var(--u)) calc(250 * var(--u));
  align-items: center; gap: calc(28 * var(--u)); font-weight: 700; line-height: 1.08; }
.tv-wyz-opcje .kg { font: 700 calc(84 * var(--u))/1 var(--kond); text-align: right; white-space: nowrap; }
.tv-wyz-opcje .ile { font: 700 calc(64 * var(--u))/1 var(--kond); color: var(--jasny); }
.tv-wyz-opcje li.najmniej .kalk-pasek i { background: var(--zolty); }

.tv-kalk-pomylki { flex: none; display: flex; flex-wrap: wrap; gap: calc(12 * var(--u)) calc(48 * var(--u)); font: 700 calc(64 * var(--u))/1.1 var(--kond); }

.u-wyz-kat { display: grid; gap: 6px; padding-top: 10px; border-top: 1px solid var(--ciem3); }
.u-wyz-kat h3 { font: 700 20px/1.25 var(--tekst); }
.u-porown p { font-size: 17px; }
.u-porown .u-porown-kg { font: 700 40px/1 var(--kond); color: var(--zolty); }

.tv-wyz-ranking li.bez { color: var(--szary); }
/* Ponad 6 zespołów: dwie kolumny, bez pasków. */
.tv-wyz-ranking.dwie { grid-auto-flow: column; grid-template-rows: repeat(var(--wiersze), auto); grid-template-columns: 1fr 1fr; column-gap: calc(64 * var(--u)); row-gap: calc(16 * var(--u)); }
.tv-wyz-ranking.dwie li { grid-template-columns: calc(64 * var(--u)) minmax(0, 1fr) auto auto; gap: calc(20 * var(--u)); font-size: calc(64 * var(--u)); }
.tv-wyz-ranking.dwie li > span:nth-child(2) { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tv-wyz-ranking.dwie .kalk-pasek { display: none; }
/* W dwóch kolumnach sam numer szacunku (bez słowa), żeby nazwa zespołu zmieściła się w 64 px. */
.tv-wyz-ranking.dwie .szac-et { display: none; }
.tv-wyz-ranking.dwie .miejsce, .tv-wyz-ranking.dwie .kg { font-size: calc(64 * var(--u)); }
.ciasno .tv-wyz-ranking { gap: calc(8 * var(--u)); }

.tv-wyz-zespoly { display: flex; flex-wrap: wrap; gap: calc(20 * var(--u)); }
.tv-wyz-zespoly li { display: flex; align-items: center; justify-content: space-between; gap: calc(12 * var(--u)); padding: calc(16 * var(--u)) calc(24 * var(--u));
  background: var(--ciem2); font: 700 calc(64 * var(--u))/1 var(--kond); color: var(--szary); white-space: nowrap; }
.tv-wyz-zespoly li.jest { color: #fff; }
.tv-wyz-zespoly .ik { width: calc(64 * var(--u)); height: calc(64 * var(--u)); color: var(--zolty); flex: none; }

.u-kalk-km { display: block; font-size: 14px; color: var(--jasny); }

/* Typ kroku „mapa_obietnic” (typ_mapa_obietnic.js): obszary skutku i pole „Razem” w siatce 3 × 2 na TV. Jednostka --u, tekst min. 64 px.
   Kropka = jedna osoba, której obietnica działa w obszarze. Kolory tylko z tokenów styl.css. Wygląd zatwierdzony w podglądzie 10.11. */
.tv-mob { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr));
  gap: calc(32 * var(--u)); }
.tv-mob > li { min-height: 0; display: flex; flex-direction: column; gap: calc(8 * var(--u)); padding: calc(20 * var(--u)) calc(32 * var(--u));
  background: var(--ciem2); border-top: calc(8 * var(--u)) solid var(--ciem3); overflow: hidden; }
.tv-mob > li.ma { border-top-color: var(--tak-j); }
.tv-mob > li.razem { border-top-color: var(--zolty); }
.tv-mob h2 { font: 700 calc(64 * var(--u))/1 var(--kond); color: var(--jasny); }
.tv-mob-suma { font: 700 calc(112 * var(--u))/1 var(--kond); color: var(--zolty); white-space: nowrap; }
.tv-mob-suma small { font-size: calc(64 * var(--u)); color: #fff; }
.tv-mob-por { font: 700 calc(64 * var(--u))/1.05 var(--kond); color: #fff; }
.tv-mob-kropki { margin-top: auto; display: flex; flex-wrap: wrap; gap: calc(8 * var(--u)); }
.tv-mob-kropki i { width: calc(32 * var(--u)); height: calc(32 * var(--u)); border-radius: 50%; background: var(--tak-j); }
.tv-mob > li:not(.ma):not(.razem) .tv-mob-suma { color: var(--szary); }
.tv-mob > li:not(.ma):not(.razem) .tv-mob-por { color: var(--szary); }
@media (prefers-reduced-motion: no-preference) {
  .tv-mob-kropki i { animation: mob-kropka .3s both; animation-delay: calc(var(--i, 0) * 40ms); }
  @keyframes mob-kropka { from { opacity: 0; transform: scale(.4); } }
}
.tv-mob-kropki b { font: 700 calc(64 * var(--u))/1 var(--kond); color: var(--tak-j); }

/* Krok „glos” z cytatem materiału i listą fact-checkerów (glos_material.js). Wygląd A: tokeny ze styl.css. TV: tekst min. 64 px przy 1080p. */

/* TV: karta z cytatem (żółta krawędź jak cytat w ścianie wpisów), opcje w jednym rzędzie */
.gm-tv { flex: none; min-height: 0; display: flex; flex-direction: column; gap: calc(16 * var(--u)); padding: calc(28 * var(--u)) calc(40 * var(--u));
  background: var(--ciem2); border-left: calc(12 * var(--u)) solid var(--zolty); overflow: hidden; }
.gm-tv .gm-cytat { font: 600 calc(72 * var(--u))/1.18 var(--tekst); }
.gm-tv .gm-podpis { font: 400 calc(64 * var(--u))/1.1 var(--kond); color: var(--jasny); }
.gm-opcje { flex: none; display: flex; flex-wrap: wrap; gap: calc(16 * var(--u)) calc(24 * var(--u)); }
.gm-opcje li { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; gap: calc(20 * var(--u)); padding: calc(14 * var(--u)) calc(28 * var(--u));
  border: calc(4 * var(--u)) solid var(--ciem3); font: 700 calc(72 * var(--u))/1 var(--kond); }
.gm-opcje .op-znak, .gm-opcje .op-litera { width: calc(64 * var(--u)); height: calc(64 * var(--u)); }

/* TV, odsłona: „Sprawdzili to także”, każda pozycja w jednej linii */
.gm-sprawdzili { flex: none; margin-top: auto; display: grid; gap: calc(8 * var(--u)); padding: calc(20 * var(--u)) calc(32 * var(--u)); background: var(--ciem2); }
.gm-sprawdzili h2 { font: 700 calc(64 * var(--u))/1 var(--kond); color: var(--zolty); }
.gm-sprawdzili ul { display: grid; grid-template-columns: minmax(0, 1fr); gap: calc(4 * var(--u)); }
.gm-sprawdzili li { min-width: 0; display: flex; align-items: baseline; gap: calc(24 * var(--u)); white-space: nowrap; font: 400 calc(64 * var(--u))/1.15 var(--tekst); }
.gm-sprawdzili b { flex: none; font: 700 calc(64 * var(--u))/1.15 var(--kond); }
.gm-sprawdzili .gm-data { flex: none; font-family: var(--kond); color: var(--jasny); }
.gm-sprawdzili .gm-tytul { min-width: 0; overflow: hidden; text-overflow: ellipsis; }

/* dopasowanie, gdy treść się nie mieści (tv_kroki.js: dopasujEkran) */
.ciasno .gm-tv .gm-cytat, .ciasno .gm-opcje li { font-size: calc(64 * var(--u)); }
.ciasno .gm-tv { padding: calc(20 * var(--u)) calc(32 * var(--u)); }
.ciasno2 .gm-tv .gm-cytat, .ciasno2 .gm-sprawdzili li { font-family: var(--kond); line-height: 1.08; }

/* telefon */
.gm-tel { display: grid; gap: 6px; padding: 12px 14px; background: var(--ciem2); border-left: 4px solid var(--zolty); }
.gm-tel .gm-cytat { font: 600 18px/1.35 var(--tekst); }
.gm-tel .gm-podpis { font-size: 14px; line-height: 1.4; color: var(--jasny); }
.gm-tel-lista { display: grid; gap: 6px; padding: 12px 14px; background: var(--ciem2); }
.gm-tel-lista h3 { font: 700 22px/1.1 var(--kond); }
.gm-tel-lista li { padding: 6px 0 10px; border-bottom: 1px solid var(--ciem3); }
.gm-tel-lista li:last-child { border-bottom: 0; }
.gm-tel-lista a, .gm-tel-lista b { display: block; padding: 8px 0 2px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.gm-linki small { display: block; font-size: 14px; color: var(--jasny); }

/* konsola prowadzącego */
.gm-p-karta { display: grid; gap: 4px; padding-left: 12px; border-left: 4px solid var(--zolty); }
.gm-p-karta .gm-cytat { font-size: 15px; font-weight: 600; line-height: 1.45; }
.gm-p-karta .gm-podpis { font-size: 14px; color: var(--jasny); }
.gm-p-lista { display: grid; gap: 4px; }
.gm-p-lista h3 { font: 700 18px/1.1 var(--kond); }
.gm-p-lista li { padding: 6px 0; border-bottom: 1px solid var(--ciem3); font-size: 14px; overflow-wrap: anywhere; }
.gm-p-lista a, .gm-p-lista b { font-weight: 700; }

/* Krok „glos” z mapami (glos_mapy.js): mapa odpowiedzi w głosowaniu, mapa w odsłonie. Wygląd A: tokeny ze styl.css. TV: tekst min. 64 px przy 1080p. */

/* TV, głosowanie: pytanie na całą szerokość, pod nim zdjęcie, mapa odpowiedzi i opcje. Obrazy całe (contain), bez przycinania. */
.tv-mapy { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: calc(28 * var(--u)); }
.tv-mapy .tv-pyt { flex: none; font-size: calc(72 * var(--u)); }
.tv-mapy-rzad { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .9fr) minmax(0, 1.05fr);
  grid-template-rows: minmax(0, 1fr); gap: calc(40 * var(--u)); }
.tv-mapy.bez-zdjecia .tv-mapy-rzad { grid-template-columns: minmax(0, .9fr) minmax(0, 1.5fr); }
.tv-mapy-obraz { display: block; width: 100%; height: 100%; min-height: 0; object-fit: contain; object-position: center top; }
.tv-mapy .tv-opcje li { gap: calc(20 * var(--u)); padding: calc(12 * var(--u)) 0; font-size: calc(64 * var(--u)); }
.tv-mapy .tv-opcje .op-znak, .tv-mapy .tv-opcje .op-litera { width: calc(64 * var(--u)); height: calc(64 * var(--u)); }

/* TV, odsłona: mapa po lewej, poprawna odpowiedź i tekst obok (opcje zwarte jak przy zdjęciu) */
.tv-mapy-odsl { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1.7fr) minmax(0, 1fr);
  gap: calc(32 * var(--u)) calc(48 * var(--u)); }
.tv-mapy-odsl > .tv-mapy-obraz { object-position: left top; }
.tv-mapy-dol { grid-column: 1 / -1; }
.tv-mapy-odsl .tv-odsl li { gap: calc(14 * var(--u)); padding: calc(8 * var(--u)) calc(18 * var(--u)); }
.tv-mapy-odsl .tv-odsl li.poprawna > .odsl-tag { padding: calc(4 * var(--u)) calc(12 * var(--u)); }
.tv-mapy-odsl .tv-odsl.duze li.poprawna { font-size: calc(84 * var(--u)); }
.tv-mapy-odsl .tv-odsl.duze li.poprawna .ik { width: calc(72 * var(--u)); height: calc(72 * var(--u)); }

/* dopasowanie, gdy treść się nie mieści (tv_kroki.js: dopasujEkran) */
.ciasno .tv-mapy .tv-opcje li { padding: calc(6 * var(--u)) 0; }
.ciasno2 .tv-mapy .tv-pyt, .ciasno2 .tv-mapy-odsl .tv-odsl.duze li.poprawna { font-size: calc(64 * var(--u)); }

/* telefon: mapa w linku do pliku (powiększenie palcami w przeglądarce) */
.u-mapy { display: grid; gap: 4px; }
.u-mapy a { display: block; border: 2px solid var(--ciem3); }
.u-mapy a:focus-visible { outline: 3px solid var(--zolty); outline-offset: 2px; }

/* Typ kroku „skala” (typ_skala.js): „Jak jest naprawdę”. TV: dwa problemy obok siebie, paski jak w mapie różnic (styl_mapa.css), tekst min. 64 px.
   Telefon: karty „wasza ocena / naprawdę” ze znacznikiem zgodności. Konsola prowadzącego: tabela danych. */
.tv-typ-skala .tv-g { color: #fff; }
.tv-skala { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 calc(80 * var(--u)); }
.tv-skala-pb { min-width: 0; display: flex; flex-direction: column; gap: calc(14 * var(--u)); }
.tv-skala-nazwa { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 calc(28 * var(--u)); font: 700 calc(88 * var(--u))/1.02 var(--kond); }
.tv-skala-werdykt { font-size: calc(72 * var(--u)); color: var(--zolty); }
.tv-skala-werdykt.podobnie { color: var(--jasny); }
.tv-skala-rz { display: grid; grid-template-columns: calc(210 * var(--u)) minmax(0, 1fr) calc(120 * var(--u)); align-items: center; gap: calc(24 * var(--u));
  font: 700 calc(64 * var(--u))/1.05 var(--kond); }
.tv-skala-rz .s0 { color: var(--zolty); }
.tv-skala-rz .s1 { color: var(--jasny); }
.tv-skala-rz .num { text-align: right; }
.tv-skala-tor { position: relative; display: block; height: calc(52 * var(--u)); background: var(--ciem3); }
.tv-skala-tor i { display: block; height: 100%; }
.tv-skala-tor i.s0 { background: var(--zolty); }
.tv-skala-tor i.s1 { background: var(--jasny); }
.tv-skala-kreska { position: absolute; left: 50%; top: calc(-10 * var(--u)); bottom: calc(-10 * var(--u)); width: calc(6 * var(--u)); margin-left: calc(-3 * var(--u)); background: #fff; }
.tv-skala-ref { display: flex; align-items: center; gap: calc(18 * var(--u)); font: 700 calc(64 * var(--u))/1.05 var(--kond); color: var(--jasny); }
.tv-skala-ref i { flex: none; width: calc(6 * var(--u)); height: calc(60 * var(--u)); background: #fff; }
.tv-skala-zd { font: 500 calc(64 * var(--u))/1.1 var(--kond); }
.tv-skala-leg { flex: none; padding-top: calc(20 * var(--u)); border-top: calc(4 * var(--u)) solid var(--ciem3); font: 700 calc(64 * var(--u))/1.08 var(--kond); color: var(--jasny); }
.ciasno .tv-skala-nazwa { font-size: calc(72 * var(--u)); }
.ciasno .tv-skala-werdykt { font-size: calc(64 * var(--u)); }
.ciasno .tv-skala-pb { gap: calc(8 * var(--u)); }
.ciasno2 .tv-skala-zd { line-height: 1.04; }

.u-skala-karta { gap: 8px; }
.u-skala-w { display: grid; grid-template-columns: 1fr auto; gap: 0 12px; padding: 6px 0; border-top: 1px solid var(--ciem3); }
.u-skala-w > span { font-size: 15px; color: var(--jasny); }
.u-skala-w b { font: 700 20px/1.2 var(--kond); text-align: right; }
.u-skala-w b .s0 { color: var(--zolty); }
.u-skala-w small { grid-column: 1 / -1; font-size: 14px; color: var(--jasny); }
.u-ekran .u-skala-znak { justify-self: start; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; font: 700 18px/1.2 var(--kond); }
.u-skala-znak.zgodne { background: var(--tak-j); color: var(--ciem); }
.u-skala-znak.inne { border: 2px solid var(--nie-j); color: var(--nie-j); }

.p-skala { display: grid; gap: 6px; padding-bottom: 12px; border-bottom: 1px solid var(--ciem3); }
.p-skala-werdykt { color: var(--zolty); }
.p-skala-tab { width: 100%; border-collapse: collapse; font-size: 15px; }
.p-skala-tab th, .p-skala-tab td { padding: 6px 8px; border-bottom: 1px solid var(--ciem3); text-align: left; }

  for (let i = 0; i < DLUGOSC_KODU; i++) kod += ALFABET_KODU[Math.floor(losuj() * ALFABET_KODU.length)];
  return kod;
}

function poprawnyKod(tekst) {
  const kod = String(tekst || "").trim().toLowerCase().replace(/[\s-]/g, "");
  return WZOR_KODU.test(kod) ? kod : null;
}

/* Adres bazowy z ?baza=: tylko http(s), bez końcowego ukośnika, index.html, zapytania i #. */
function poprawnaBaza(tekst) {
  return KANAL_WSPOLNY.oczyscBaze(tekst);
}

/* ?zespoly=N: liczba zespołów 2 do 10 wybrana w konsoli uruchamiania, inna wartość = null (liczba z zajęć). Bez stałych spoza funkcji:
   strona woła ją w pierwszej linii skryptu (zbuduj.py). */
function liczbaZespolowZAdresu(search) {
  const tekst = new URLSearchParams(search || "").get("zespoly");
  const n = /^\d{1,2}$/.test(tekst || "") ? Number(tekst) : NaN;
  return n >= 2 && n <= 10 ? n : null;
}

/* Parametry adresu: ?k=<kod>, ?test (lokalnie, w kartach jednej przeglądarki) albo ?test=siec (przez serwery),
   ?baza=<url> (nadpisuje ADRES_UCZNIOW w kodzie QR), ?jez=pl|en (język domyślny), ?zespoly=2…10 (liczba zespołów, zespoly.js). */
function parametryAdresu(search) {
  const p = new URLSearchParams(search || "");
  const test = p.has("test") ? (p.get("test") === "siec" ? "siec" : "lokalnie") : null;
  const jez = ["pl", "en"].includes(p.get("jez")) ? p.get("jez") : null;
  return { kod: poprawnyKod(p.get("k")), test, baza: poprawnaBaza(p.get("baza")), jez, zespoly: liczbaZespolowZAdresu(search) };
}

/* Zapytanie do linków między widokami. Język tylko angielski (polski jest domyślny); baza tylko między TV i konsolą prowadzącego. */
function zapytanieAdresu(kod, test, baza = null, jez = null, zespoly = null) {
  const czesci = [];
  if (kod) czesci.push(`k=${kod}`);
  if (test === "siec") czesci.push("test=siec");
  else if (test) czesci.push("test");
  if (jez === "en") czesci.push("jez=en");
  if (zespoly) czesci.push(`zespoly=${zespoly}`);
  if (baza) czesci.push(`baza=${encodeURIComponent(baza)}`);
  return czesci.length ? `?${czesci.join("&")}` : "";
}

/* Adres dla telefonów (kod QR): <baza>/<slug>/index.html?k=…, a bez bazy index.html obok bieżącej strony. */
function adresUczniow({ baza, slug, kod, test, biezacy, jez = null, zespoly = null }) {
  const zapytanie = zapytanieAdresu(kod, test, null, jez, zespoly);
  if (baza) return `${baza}/${slug}/index.html${zapytanie}`;
  return new URL(`index.html${zapytanie}`, biezacy).href;
}

/* Pełny publiczny adres pliku zajęć (np. media/x.jpg) dla wyszukiwarek obrazem: z bazy (?baza albo adres_uczniow z ustawień),
   a bez niej względem bieżącej strony. Wyszukiwarka pobiera obraz sama, więc adres musi być bezwzględny. */
function adresPublicznyObrazu({ plik, baza, slug, biezacy }) {
  if (baza) return `${baza}/${slug}/${plik.replace(/^\.?\//, "")}`;
  return new URL(plik, biezacy).href;
}

/* Wyszukiwanie obrazem po adresie: Google Lens, Bing, TinEye. */
function adresySzukaniaObrazem(adres) {
  const a = encodeURIComponent(adres);
  return { lens: `https://lens.google.com/uploadbyurl?url=${a}`, bing: `https://www.bing.com/images/search?view=detailv2&iss=sbi&q=imgurl:${a}`,
    tineye: `https://tineye.com/search?url=${a}` };
}

function prefiksKanalu(kod, test) {
  if (!WZOR_KODU.test(kod || "")) throw new RangeError(`Zły kod sesji: ${kod}`);
  return `${test ? "zi-test" : "zi"}/${kod}`;
}

/* Pole kroku jest (ma wartość) albo strona ucznia ma tylko jego nazwę w tajne_pola: odpowiedź przyjdzie w stanie sesji (tajne.js), a fazy są te same. */
const maPole = (krok, pole) => (krok[pole] !== undefined && krok[pole] !== null) || (Array.isArray(krok.tajne_pola) && krok.tajne_pola.includes(pole));

function fazyKroku(krok) {
  switch (krok.typ) {
    case "glos": {
      const fazy = ["glosowanie", "wyniki"];
      if (maPole(krok, "poprawna") || maPole(krok, "odslona")) fazy.push("odslona");
      if (maPole(krok, "dodatek")) fazy.push("dodatek");
      return fazy;
    }
    case "suwaki": case "galeria": return ["zbieranie", "wyniki"];
    case "tekst": return ["zbieranie", "sciana"];
    case "stukniecie": return maPole(krok, "cel") ? ["zbieranie", "wyniki", "odslona"] : ["zbieranie", "wyniki"];
    default: return TYPY_DODATKOWE[krok.typ] ? TYPY_DODATKOWE[krok.typ].fazy(krok) : ["pokaz"];
  }
}

const czyZbieranie = (faza) => FAZY_ZBIERANIA.includes(faza);

/* Timer kroku na wejściu: krok z polem czas startuje sam w fazie zbierania; typ timer czeka na Start. */
function timerWejscia(krok, teraz) {
  if (!krok.czas) return null;
  const czasMs = krok.czas * 1000;
  const startuje = krok.typ !== "timer" && czyZbieranie(fazyKroku(krok)[0]);
  return { czasMs, koniec: startuje ? teraz + czasMs : null, zostaloMs: czasMs };
}

/* Stan sesji; przy zajęciach zespołowych z liczbą zespołów (TV i telefony z inną liczbą w adresie przeładowują się, widok.js). */
function nowyStan(teraz, zajecia, jez = "pl") {
  const stan = { v: teraz, krok: 0, faza: "", timer: null, ukryte: {}, pokazane: {}, oceny: {}, qr: false, jez };
  if (zajecia.zespoly) stan.zespoly = zajecia.zespoly.liczba;
  return wejdzWKrok(stan, zajecia, 0, teraz);
}

function wejdzWKrok(stan, zajecia, indeks, teraz) {
  const krok = zajecia.kroki[indeks];
  return { ...stan, v: nowaWersja(stan, teraz), krok: indeks, faza: fazyKroku(krok)[0], timer: timerWejscia(krok, teraz) };
}

/* Wersja rośnie zawsze, także gdy zegar urządzenia się cofnie. */
const nowaWersja = (stan, teraz) => Math.max(teraz, (stan.v || 0) + 1);

function zmien(stan, teraz, zmiany) {
  return { ...stan, ...zmiany, v: nowaWersja(stan, teraz) };
}

/* Dalej: kolejna faza kroku, a po ostatniej pierwszy etap następnego kroku. Na ostatniej pozycji bez zmian. */
function dalej(stan, zajecia, teraz) {
  const fazy = fazyKroku(zajecia.kroki[stan.krok]);
  const i = fazy.indexOf(stan.faza);
  if (i >= 0 && i < fazy.length - 1) {
    const timer = czyZbieranie(fazy[i + 1]) ? stan.timer : zatrzymajTimer(stan.timer, teraz);
    return zmien(stan, teraz, { faza: fazy[i + 1], timer });
  }
  if (stan.krok >= zajecia.kroki.length - 1) return stan;
  return wejdzWKrok(stan, zajecia, stan.krok + 1, teraz);
}

/* Wstecz: poprzednia faza; z pierwszej fazy do ostatniej fazy poprzedniego kroku. */
function wstecz(stan, zajecia, teraz) {
  const fazy = fazyKroku(zajecia.kroki[stan.krok]);
  const i = fazy.indexOf(stan.faza);
  if (i > 0) return zmien(stan, teraz, { faza: fazy[i - 1] });
  if (stan.krok === 0) return stan;
  const poprzedni = wejdzWKrok(stan, zajecia, stan.krok - 1, teraz);
  const fazyPoprzedniego = fazyKroku(zajecia.kroki[stan.krok - 1]);
  return zmien(poprzedni, teraz, { faza: fazyPoprzedniego[fazyPoprzedniego.length - 1], timer: zatrzymajTimer(poprzedni.timer, teraz) });
}

/* Co zrobi Dalej (tablet podpisuje przycisk): następna faza, następny krok albo koniec. */
function celDalej(stan, zajecia) {
  const fazy = fazyKroku(zajecia.kroki[stan.krok]);
  const i = fazy.indexOf(stan.faza);
  if (i >= 0 && i < fazy.length - 1) return { rodzaj: "faza", faza: fazy[i + 1] };
  return { rodzaj: stan.krok >= zajecia.kroki.length - 1 ? "koniec" : "krok", faza: null };
}

/* Timer: koniec (epoka ms) gdy działa, zostaloMs gdy stoi. */
function zostaloMs(timer, teraz) {
  if (!timer) return null;
  if (timer.koniec === null) return timer.zostaloMs;
  return Math.max(0, timer.koniec - teraz);
}

function uruchomTimer(timer, teraz) {
  if (!timer || timer.koniec !== null) return timer;
  return { ...timer, koniec: teraz + timer.zostaloMs };
}

function zatrzymajTimer(timer, teraz) {
  if (!timer || timer.koniec === null) return timer;
  return { ...timer, koniec: null, zostaloMs: zostaloMs(timer, teraz) };
}

function dodajCzas(timer, ms, teraz) {
  if (!timer) return { czasMs: ms, koniec: teraz + ms, zostaloMs: ms };
  if (timer.koniec === null) return { ...timer, zostaloMs: timer.zostaloMs + ms };
  return { ...timer, koniec: Math.max(timer.koniec, teraz) + ms };
}

function resetujTimer(timer) {
  return timer ? { ...timer, koniec: null, zostaloMs: timer.czasMs } : timer;
}

/* Dźwięk między dwoma odczytami zegara: „ostrzezenie” przy 30 s (dla timerów od minuty wzwyż), „koniec” przy zerze. */
function zdarzenieTimera(poprzednioMs, terazMs, czasMs) {
  if (poprzednioMs === null || terazMs === null || terazMs >= poprzednioMs) return null;
  if (poprzednioMs > 0 && terazMs === 0) return "koniec";
  if (czasMs >= MIN_CZAS_Z_OSTRZEZENIEM_MS && poprzednioMs > OSTRZEZENIE_MS && terazMs <= OSTRZEZENIE_MS) return "ostrzezenie";
  return null;
}

function formatCzasu(ms) {
  const s = Math.ceil(Math.max(0, ms) / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

/* Ocena wpisu po nowej odpowiedzi tego samego telefonu (nowsze t): „do poprawy” to polecenie poprawki, więc po poprawce ocena znika
   i prowadzący ocenia jeszcze raz. Ocena wpisu: napis; w wyścigu: lista na zdjęcie, zdejmujemy „popraw” tylko przy zmienionych zdjęciach. */
function ocenaPoNowejOdpowiedzi(ocena, poprzednia, nowa) {
  if (!poprzednia || !nowa || !(nowa.t > poprzednia.t)) return ocena;
  if (ocena === "popraw") return null;
  if (!Array.isArray(ocena)) return ocena;
  const zdjecie = (d, i) => JSON.stringify(d && Array.isArray(d.a) ? d.a[i] ?? null : null);
  return ocena.map((o, i) => (o === "popraw" && zdjecie(poprzednia, i) !== zdjecie(nowa, i) ? null : o));
}

/* Nowszy z dwóch stanów sesji; null przegrywa. */
function wybierzNowszy(obecny, nowy) {
  if (!nowy || typeof nowy.v !== "number") return obecny;
  if (!obecny || nowy.v > obecny.v) return nowy;
  return obecny;
}

/* Wersja stanu z sieci: liczba całkowita (bez 1e300, przy którym v + 1 === v) i najwyżej dobę przed zegarem tego urządzenia. */
const ZAPAS_WERSJI_MS = 86400000;
const poprawnaWersja = (stan, teraz) => Boolean(stan) && Number.isSafeInteger(stan.v) && stan.v <= teraz + ZAPAS_WERSJI_MS;

/* Liczba zespołów ze stanu sesji, gdy jest w zakresie 2 do 10 (jak ?zespoly=); inaczej null, a widok się nie przeładowuje. */
function zespolyStanu(stan, teraz) {
  if (!poprawnaWersja(stan, teraz) || !Number.isInteger(stan.krok) || stan.krok < 0) return null;
  return Number.isInteger(stan.zespoly) && stan.zespoly >= 2 && stan.zespoly <= 10 ? stan.zespoly : null;
}

/* Start konsoli prowadzącego: nowszy z zapisanego w pamięci i zachowanego w sieci; nowy stan dopiero, gdy nie ma żadnego.
   publikuj: false, gdy w sieci już jest ten stan (starszy zapis z pamięci nie nadpisze trwającej sesji). */
function stanStartowy(zapisany, zSieci, nowy) {
  const wybrany = wybierzNowszy(zapisany || null, zSieci || null);
  if (!wybrany) return { stan: nowy(), publikuj: true };
  return { stan: wybrany, publikuj: wybrany !== zSieci };
}

/* Zegar sesji: TV i telefon liczą timer zegarem konsoli prowadzącego. Próbka = zegar odbiorcy minus chwila wysłania stanu (pole zegar),
   tylko ze stanów na żywo (zachowany stan z serwera bywa stary). Najmniejsza z ostatnich próbek = przesunięcie zegara plus najkrótsze opóźnienie. */
const PROBKI_ZEGARA = 5;

function dodajProbkeZegara(probki, stan, teraz) {
  if (!stan || !Number.isFinite(stan.zegar)) return probki;
  return [...probki, teraz - stan.zegar].slice(-PROBKI_ZEGARA);
}

const przesuniecieZegara = (probki) => (probki.length ? Math.min(...probki) : 0);

/* Obecność telefonu widziana przez dwa serwery naraz (lacze.js): testament jednego serwera (pusta wiadomość po zerwaniu połączenia)
   nie kasuje telefonu, który drugi serwer nadal widzi. na: {telefon: [numery serwerów]}. */
function obecnoscPoWiadomosci({ obecni, na }, urz, dane, serwer) {
  const serwery = new Set(na[urz] || []);
  if (dane) serwery.add(serwer);
  else serwery.delete(serwer);
  const noweObecni = { ...obecni };
  const noweNa = { ...na, [urz]: [...serwery] };
  if (serwery.size) noweObecni[urz] = dane || obecni[urz];
  else {
    delete noweObecni[urz];
    delete noweNa[urz];
  }
  return { obecni: noweObecni, na: noweNa };
}

if (typeof module !== "undefined") {
  module.exports = {
    nowyKod, poprawnyKod, poprawnaBaza, liczbaZespolowZAdresu, parametryAdresu, zapytanieAdresu, adresUczniow, adresPublicznyObrazu, adresySzukaniaObrazem, prefiksKanalu, maPole, fazyKroku, czyZbieranie, timerWejscia,
    nowyStan, wejdzWKrok, zmien, dalej, wstecz, celDalej, zostaloMs, uruchomTimer, zatrzymajTimer, dodajCzas, resetujTimer,
    zdarzenieTimera, formatCzasu, ocenaPoNowejOdpowiedzi, wybierzNowszy, poprawnaWersja, zespolyStanu, stanStartowy, dodajProbkeZegara, przesuniecieZegara, obecnoscPoWiadomosci,
    TYPY_DODATKOWE,
  };
}

/* Odpowiedzi poza kodem strony ucznia i TV (README.md, „Odpowiedzi poza kodem strony ucznia”). Lista pól: tajne_pola.json, na stronie stała TAJNE_POLA
   (wstawia zbuduj.py). index.html i tv.html mają zajęcia bez tych pól (ZAJECIA.publiczne, tajne.py). Konsola prowadzącego dokłada do stanu sesji pole
   tajne = {<id kroku>: {<ścieżka>: wartość}}: pola bieżącego kroku od fazy odsłony, wszystkie tajne pola kroków, do których bieżący krok się odwołuje
   (np. z_kroku, losowanie, przydzial), i pola „klucz” kroków już minionych (punkty w rankingu). Telefon i TV nakładają je na swoje ZAJECIA przy każdym
   stanie (nalozTajne), więc Wstecz zabiera odsłonę, a przeładowanie strony w trakcie odsłony dostaje ją z zachowanego stanu. */

/* Ścieżka pola: "odslona", "obraz.podpis", "kategorie[].opcje[].kg". */
const czesciSciezki = (sciezka) => sciezka.split(".").map((c) => (c.endsWith("[]") ? { nazwa: c.slice(0, -2), lista: true } : { nazwa: c, lista: false }));
const obiektPola = (o) => o !== null && typeof o === "object" && !Array.isArray(o);

/* Wartość po ścieżce; lista[].pole daje listę wartości elementów (null przy elemencie bez pola), undefined, gdy żaden element go nie ma. */
function wartoscSciezki(obiekt, sciezka) {
  const idz = (o, czesci) => {
    if (!obiektPola(o) || !czesci.length) return undefined;
    const [{ nazwa, lista }, ...reszta] = czesci;
    const v = o[nazwa];
    if (!lista) return reszta.length ? idz(v, reszta) : v;
    const wartosci = Array.isArray(v) && reszta.length ? v.map((x) => idz(x, reszta) ?? null) : [];
    return wartosci.some((x) => x !== null) ? wartosci : undefined;
  };
  return idz(obiekt, czesciSciezki(sciezka));
}

function usunSciezke(obiekt, sciezka) {
  const idz = (o, czesci) => {
    if (!obiektPola(o)) return;
    const [{ nazwa, lista }, ...reszta] = czesci;
    if (!reszta.length) delete o[nazwa];
    else if (lista) (Array.isArray(o[nazwa]) ? o[nazwa] : []).forEach((x) => idz(x, reszta));
    else idz(o[nazwa], reszta);
  };
  idz(obiekt, czesciSciezki(sciezka));
}

/* Ustawia wartość (z wartoscSciezki); przy lista[].pole element po elemencie, null usuwa pole elementu. */
function ustawSciezke(obiekt, sciezka, wartosc) {
  const idz = (o, czesci, v) => {
    if (!obiektPola(o)) return;
    const [{ nazwa, lista }, ...reszta] = czesci;
    if (!reszta.length) {
      if (v === null || v === undefined) delete o[nazwa];
      else o[nazwa] = v;
    } else if (lista) {
      if (Array.isArray(o[nazwa]) && Array.isArray(v)) o[nazwa].forEach((x, i) => idz(x, reszta, v[i]));
    } else {
      if (!obiektPola(o[nazwa])) o[nazwa] = {};
      idz(o[nazwa], reszta, v);
    }
  };
  idz(obiekt, czesciSciezki(sciezka), wartosc);
}

const polaTajneTypu = (typ, spec) => (spec.tajne || {})[typ] || {};
const polaProwadzacegoTypu = (typ, spec) => [...((spec.prowadzacy || {})["*"] || []), ...((spec.prowadzacy || {})[typ] || [])];

/* Krok bez pól prowadzącego (te nie idą nigdzie poza konsolę, także w odsłonie). */
function bezPolProwadzacego(krok, spec) {
  const kopia = JSON.parse(JSON.stringify(krok));
  for (const s of polaProwadzacegoTypu(krok.typ, spec)) usunSciezke(kopia, s);
  return kopia;
}

/* Id wcześniejszych kroków, do których krok się odwołuje: napis w polu kroku albo w polu obiektu (np. zgadywanie.kg). */
function odwolaniaKroku(krok, zajecia, indeks) {
  const wczesniejsze = new Set(zajecia.kroki.slice(0, indeks).map((k) => k.id));
  const napisy = Object.values(krok).flatMap((v) => (obiektPola(v) ? Object.values(v) : [v])).filter((v) => typeof v === "string");
  return [...new Set(napisy.filter((v) => wczesniejsze.has(v)))];
}

/* Pole „tajne” stanu sesji, liczy je konsola prowadzącego (pełne ZAJECIA) przy każdym wysłaniu stanu. */
function tajneStanu(zajecia, stan, spec = TAJNE_POLA) {
  const wynik = {};
  const dodaj = (krok, sciezki) => {
    const zrodlo = bezPolProwadzacego(krok, spec);
    for (const s of sciezki) {
      const v = wartoscSciezki(zrodlo, s);
      if (v !== undefined) wynik[krok.id] = { ...(wynik[krok.id] || {}), [s]: v };
    }
  };
  zajecia.kroki.slice(0, stan.krok).forEach((k) => dodaj(k, (spec.klucz || {})[k.typ] || []));
  const krok = zajecia.kroki[stan.krok];
  const fazy = fazyKroku(krok);
  const teraz = fazy.indexOf(stan.faza);
  const pola = polaTajneTypu(krok.typ, spec);
  dodaj(krok, Object.keys(pola).filter((s) => fazy.indexOf(pola[s]) >= 0 && fazy.indexOf(pola[s]) <= teraz));
  for (const id of odwolaniaKroku(krok, zajecia, stan.krok)) {
    const inny = zajecia.kroki.find((k) => k.id === id);
    dodaj(inny, Object.keys(polaTajneTypu(inny.typ, spec)));
  }
  return wynik;
}

/* Telefon i TV (ZAJECIA.publiczne): tajne pola kroków dokładnie takie, jak w stanie sesji (brak w stanie = brak na stronie). Konsola i podgląd: bez zmian. */
function nalozTajne(zajecia, tajne, spec = TAJNE_POLA) {
  if (!zajecia.publiczne) return;
  const dane = obiektPola(tajne) ? tajne : {};
  for (const krok of zajecia.kroki) {
    const zKroku = obiektPola(dane[krok.id]) ? dane[krok.id] : {};
    for (const s of Object.keys(polaTajneTypu(krok.typ, spec))) {
      if (Object.prototype.hasOwnProperty.call(zKroku, s)) ustawSciezke(krok, s, JSON.parse(JSON.stringify(zKroku[s])));
      else usunSciezke(krok, s);
    }

/* Zapis na komputerze przy TV: samodzielny plik HTML, zdjęcia przez canvas (bez EXIF, bez GPS), najdłuższy bok 1600 px. */
async function obrazDoZapisu(url) {
  const img = new Image();
  img.src = url;
  await img.decode();
  const skala = Math.min(1, MAKS_BOK_ZAPISU / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.round(img.naturalWidth * skala);
  c.height = Math.round(img.naturalHeight * skala);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.85);
}

const MOJE_ZDJECIA = {};
const POLA_ZDJEC = {};

const laczeZdjec = () => typeof zdjecieOdebrane === "function" && typeof sesja !== "undefined";

/* Wysłane zdjęcia tego telefonu w kroku: [{f, n, stan: "wysylanie" | "wyslane" | "blad" | "format"}], zapamiętane na wypadek odświeżenia strony. */
function mojeZdjecia(krokId) {
  if (!MOJE_ZDJECIA[krokId]) MOJE_ZDJECIA[krokId] = laczeZdjec() ? czytajPamiec(kluczMoichZdjec(krokId), []).map((x) => ({ ...x, stan: "wyslane" })) : [];

function zapiszMojeZdjecia(krokId) {
  zapiszPamiec(kluczMoichZdjec(krokId), mojeZdjecia(krokId).filter((x) => x.stan === "wyslane").map(({ f, n, s }) => ({ f, n, ...(s ? { s } : {}) })));

/* Nieudane wysyłki nie zajmują miejsca w limicie zespołu. */
const zajeteMiejsca = (lista) => lista.filter((x) => !STANY_BLEDU_ZDJECIA.includes(x.stan)).length;
const stanPoBledzie = (blad) => (typeof BladFormatu === "function" && blad instanceof BladFormatu ? "format" : "blad");

/* Pole wyboru zdjęć leży poza ekranem telefonu, który się przerysowuje, więc okno wyboru nie ginie przy nowej wiadomości. */
function poleZdjecTelefonu(id, wiele, naPliki) {
  POLA_ZDJEC[id] = naPliki;
  if (!document.getElementById(id)) {
    const pole = el("input", { type: "file", accept: "image/*", multiple: wiele, id, className: "tv-plik" });
    pole.addEventListener("change", () => { const pliki = [...pole.files]; pole.value = ""; POLA_ZDJEC[id](pliki); });

const kluczPokazanych = (krokId) => `${krokId}~zdj`;

function pokazaneZdjecia(stan, krokId) {
  const d = ((stan && stan.dodatki) || {})[kluczPokazanych(krokId)];
  return new Set(d && Array.isArray(d.f) ? d.f.filter((f) => typeof f === "string") : []);

const czyPokazaneZdjecie = (stan, krokId, f) => pokazaneZdjecia(stan, krokId).has(f);

function zmienPokazane(p, krokId, f, pokaz) {
  const zbior = pokazaneZdjecia(p.stan, krokId);
  if (pokaz) zbior.add(f);
  else zbior.delete(f);
  p.akcje.dodatek(kluczPokazanych(krokId), { f: [...zbior] });

/* Wszystkie zdjęcia z telefonów w kroku: [{z, f, n}] po zespołach (1…liczba), w zespole w kolejności wysłania, bez powtórek. */
function zdjeciaSpisow(odp, krokId, liczba) {
  const widziane = new Set();
  return spisyKroku(odp, krokId).flatMap((s) => s.zd.map((x) => ({ z: s.z, f: x.f, n: x.n })))
    .filter((x) => x.z >= 1 && x.z <= liczba && !widziane.has(x.f) && widziane.add(x.f)).sort((a, b) => a.z - b.z);
}

function kartaModeracji(p, krokId, x, pokazane) {
  const o = zdjecieOdebrane(krokId, x.f, x.n, x.z);
  const podglad = o.url ? el("img", { src: o.url, alt: t("zdjecieZTelefonu", x.z) })
    : el("span", { className: "p-zdj-czeka", textContent: o.blad ? t("zdjNieDotarlo") : t("zdjWDrodzeIle", o.ile, o.n) });
  const akcja = pokazane ? przycisk(t("ukryj"), () => zmienPokazane(p, krokId, x.f, false))
    : przycisk(t("pokaz"), () => zmienPokazane(p, krokId, x.f, true), "k1-btn pelny", !o.url);
  return el("li", { className: pokazane ? "pokazane" : "" }, podglad, el("b", { textContent: nazwaZespolu(p.zajecia, x.z) }), el("div", { className: "k1-akcje" }, akcja));
}

/* Konsola: miniatura każdego zdjęcia z telefonów i „Pokaż” / „Ukryj”. Poza łączem (podgląd) nic. */
function moderacjaZdjec(p, krokId) {
  if (!laczeZdjec()) return [];
  const zdjecia = zdjeciaSpisow(p.odp, krokId, liczbaZespolow(p.zajecia));
  if (!zdjecia.length) return [el("p", { className: "k1-meta", textContent: t("zdjModeracjaPusta") })];
  const pokazane = pokazaneZdjecia(p.stan, krokId);
  const lista = el("ul", { className: "p-zdj-moderacja" }, ...zdjecia.map((x) => kartaModeracji(p, krokId, x, pokazane.has(x.f))));
  lista.dataset.przewin = `zdj-${krokId}`;
  return [el("p", { className: "k1-meta", textContent: t("zdjModeracjaOpis", zdjecia.filter((x) => pokazane.has(x.f)).length, zdjecia.length) }), lista];

/* Wysyłka po kolei; po każdym zdjęciu nowy spis telefonu (odp/<krok>~z/<telefon>). Nieudane wpisy z poprzedniej próby znikają z listy. */
async function wyslijZdjeciaGalerii(u, pliki) {
