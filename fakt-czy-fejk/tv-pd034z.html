/* Wyjazd kroku: pola z JSON (km, dni, noce, kg_pokoj_noc, km_wycieczka) nadpisują domyślne. */
function sladWyjazd(krok) {
  return { ...SLAD_WYJAZD, ...((krok && krok.wyjazd) || {}) };
}

function sladOdpowiedz(pytanie, odpowiedzi) {
  const wybrana = pytanie.odpowiedzi.find((a) => a.id === odpowiedzi[pytanie.id]);
  if (!wybrana) throw new RangeError(`Brak odpowiedzi na pytanie: ${pytanie.id}`);
  return wybrana;
}

const sladKomplet = (odpowiedzi) => SLAD_PYTANIA.every((p) => p.odpowiedzi.some((a) => a.id === (odpowiedzi || {})[p.id]));

// Prysznic, klimatyzacja i światło to odchylenia od średniej zawartej w noclegu, więc mogą być ujemne.
function sladOblicz(odpowiedzi, wyjazd = SLAD_WYJAZD) {
  const w = Object.fromEntries(SLAD_PYTANIA.map((p) => [p.id, sladOdpowiedz(p, odpowiedzi).wartosc]));
  const nocnyPrad = (kw, godziny, srednio) => ((godziny - srednio) * kw * SLAD.KG_KWH_GRECJA * wyjazd.noce) / w.pokoj;
  const jedzenie = w.mieso * wyjazd.dni;
  const czesci = {
    przejazd: 2 * wyjazd.km * SLAD.KG_KM_AUTOKAR,
    nocleg: (wyjazd.kg_pokoj_noc * wyjazd.noce) / w.pokoj,
    prysznic: (w.prysznic - SLAD.MINUT_PRYSZNIC_SREDNIO) * SLAD.KG_MINUTA_PRYSZNICA * wyjazd.noce,
    klima: nocnyPrad(SLAD.KW_KLIMATYZACJA, w.klima, SLAD.GODZIN_KLIMATYZACJA_SREDNIO),
    swiatlo: nocnyPrad(SLAD.KW_SWIATLO_I_LADOWARKI, w.swiatlo, SLAD.GODZIN_ZOSTAWIONE_SREDNIO),
    jedzenie,
    resztki: jedzenie * w.resztki,
    woda: w.butelki * SLAD.KG_BUTELKA * wyjazd.dni,
    wycieczki: w.wycieczki * wyjazd.km_wycieczka * SLAD.KG_KM_AUTOKAR,
  };
  const suma = Object.values(czesci).reduce((a, b) => a + b, 0);
  return { suma, czesci };
}

// Największe reszty: pokazane całe kilogramy dają dokładnie zaokrągloną sumę, bo uczeń może je dodać na kartce.
function sladZaokraglDoSumy(wartosciKg, suma) {
  const wynik = wartosciKg.map(Math.floor);
  const brakuje = Math.round(suma) - wynik.reduce((a, b) => a + b, 0);
  const kolejnosc = wartosciKg.map((v, i) => [v - wynik[i], i]).sort((a, b) => b[0] - a[0]);
  kolejnosc.slice(0, brakuje).forEach(([, i]) => { wynik[i] += 1; });
  return wynik;
}

/* Pięć części w stałej kolejności (nazwy w słowniku: kalk_cz_<id>). */
const SLAD_CZESCI = ["przejazd", "jedzenie", "nocleg", "wycieczki", "woda"];

function sladPodzial(wynik) {
  const c = wynik.czesci;
  const kg = { przejazd: c.przejazd, jedzenie: c.jedzenie + c.resztki, nocleg: c.nocleg + c.prysznic + c.klima + c.swiatlo, wycieczki: c.wycieczki, woda: c.woda };
  const zaokraglone = sladZaokraglDoSumy(SLAD_CZESCI.map((id) => kg[id]), wynik.suma);
  return SLAD_CZESCI.map((id, i) => ({ id, kg: kg[id], zaokraglone: zaokraglone[i] }));
}

function sladWszystkiePodpowiedzi(odpowiedzi, wyjazd = SLAD_WYJAZD) {
  const bazowa = sladOblicz(odpowiedzi, wyjazd).suma;
  return SLAD_PYTANIA
    .map((p) => ({ pytanie: p.id, odpowiedz: sladOdpowiedz(p, odpowiedzi) }))
    .filter(({ odpowiedz }) => odpowiedz.cel !== undefined)
    .map(({ pytanie, odpowiedz }) => ({
      pytanie,
      rada: odpowiedz.rada,
      oszczednosc: bazowa - sladOblicz({ ...odpowiedzi, [pytanie]: odpowiedz.cel }, wyjazd).suma,
    }))
    .sort((a, b) => b.oszczednosc - a.oszczednosc);
}

function sladPodpowiedzi(odpowiedzi, wyjazd = SLAD_WYJAZD) {
  return sladWszystkiePodpowiedzi(odpowiedzi, wyjazd).slice(0, SLAD_LIMIT_PODPOWIEDZI);
}

function sladIleDrzew(suma) {
  return Math.round(suma / SLAD.KG_DRZEWO_ROK);
}

if (typeof module !== "undefined") {
  module.exports = { SLAD, SLAD_WYJAZD, SLAD_PYTANIA, SLAD_CZESCI, SLAD_LIMIT_PODPOWIEDZI, sladWyjazd, sladKomplet, sladOblicz, sladZaokraglDoSumy,
    sladPodzial, sladWszystkiePodpowiedzi, sladPodpowiedzi, sladIleDrzew };
}

const MAKS_KG_KALK = 5000;

/* Liczby wysyłane do grupy: wynik i części w całych kg. */
function kalkDane(odpowiedzi, wyjazd) {
  const wynik = sladOblicz(odpowiedzi, wyjazd);
  return { kg: Math.round(wynik.suma), c: sladPodzial(wynik).map((p) => p.zaokraglone) };

const dobryWynikKalk = (d) => d && typeof d.kg === "number" && d.kg >= 0 && d.kg <= MAKS_KG_KALK && Array.isArray(d.c)
  && d.c.length === SLAD_CZESCI.length && d.c.every((x) => typeof x === "number" && Math.abs(x) <= MAKS_KG_KALK);

/* Średnia grupy i średnie części (zaokrąglone tak, żeby dawały średnią); suma wszystkich wyników. */
function wynikKalkulatora(lista) {
  const dobre = lista.filter(dobryWynikKalk);
  if (!dobre.length) return { ile: 0, srednia: null, suma: 0, czesci: SLAD_CZESCI.map(() => 0) };
  const suma = dobre.reduce((a, d) => a + d.kg, 0);
  const srednia = suma / dobre.length;
  const czesci = SLAD_CZESCI.map((_, i) => dobre.reduce((a, d) => a + d.c[i], 0) / dobre.length);
  return { ile: dobre.length, srednia: Math.round(srednia), suma, czesci: sladZaokraglDoSumy(czesci, srednia) };
}

  const odpowiedzi = Object.fromEntries(SLAD_PYTANIA.map((p) => [p.id, p.odpowiedzi[Math.floor(los() * p.odpowiedzi.length)].id]));

/* Typ kroku „wybor”: wybór z listy dłuższej niż 4 opcje (np. 12 obietnic), 1 albo kilka pozycji (ile), opcjonalnie losowanie i własny wpis.

   Głos na zespoły: z_kroku = id kroku „tekst”; pozycjami są zespoły, a TV pokazuje ich pierwsze pole (np. tytuł). Na swój zespół się nie głosuje.
   pokaz_wybory = id innego kroku „wybor”: w zbieraniu TV pokazuje, ile osób wybrało każdą pozycję tam. Fazy: zbieranie, wyniki, sciana (gdy wlasna).
   Plik dokłada się do TYPY_DODATKOWE (logika.js) i do słownika. Format: README.md, „wybor”. */
const NA_TV_WYBORU = { ranking: 5, sciana: 6, lista: 6 };
const SZANSA_WLASNEJ = 0.2;

const limitWyboru = (krok) => krok.ile || 1;

/* Liczba pozycji: pozycje z JSON albo zespoły (głos na zespoły). */
const ilePozycji = (krok, zajecia) => (krok.z_kroku ? zajecia.zespoly.liczba : krok.pozycje.length);

/* Wybrane pozycje telefonu; w głosie na zespoły bez głosu na własny zespół (przyciski go nie mają, ale wiadomość mogłaby). */
function wybraneWyboru(krok, d, n) {
  const surowe = d && Array.isArray(d.s) ? d.s : [];
  const wlasny = (i) => Boolean(krok.z_kroku) && d.z === i + 1;
  return [...new Set(surowe.filter((i) => Number.isInteger(i) && i >= 0 && i < n && !wlasny(i)))].slice(0, limitWyboru(krok));
}

const wlasnyWpis = (krok, d) => (krok.wlasna && d && typeof d.w === "string" && d.w.trim() ? d.w.trim().slice(0, krok.wlasna.maks || 80) : "");

/* liczby: ile razy wybrano każdą pozycję; ranking: numery pozycji malejąco (remis: kolejność z listy); wlasne: wpisy z id do ukrywania. */
function wynikWyboru(krok, lista, n = krok.pozycje.length, stan = {}) {
  const liczby = Array.from({ length: n }, () => 0);
  let glosujacych = 0;
  const wlasne = [];
  for (const d of lista) {
    const wybrane = wybraneWyboru(krok, d, n);
    const wlasny = wlasnyWpis(krok, d);
    if (wybrane.length || wlasny) glosujacych += 1;
    for (const i of wybrane) liczby[i] += 1;
    if (wlasny) {
      const id = `${krok.id}/${d.urz}`;
      wlasne.push({ id, urz: d.urz, z: d.z, t: d.t || 0, tekst: wlasny, ukryty: Boolean((stan.ukryte || {})[id]) });
    }
  }
  const ranking = liczby.map((ile, i) => ({ i, ile })).sort((a, b) => b.ile - a.ile || a.i - b.i);
  wlasne.sort((a, b) => a.t - b.t || (a.urz < b.urz ? -1 : 1));
  return { liczby, ranking, glosujacych, wlasne };
}

function symulujWybor(krok, los) {
  const przyklady = krok.przyklady || [];
  if (krok.wlasna && przyklady.length && los() < SZANSA_WLASNEJ) return { s: [], w: przyklady[Math.floor(los() * przyklady.length)] };
  /* Głos na zespoły: liczba zespołów z zajęć na stronie (ZAJECIA wstawia zbuduj.py). */
  const n = krok.z_kroku ? (typeof ZAJECIA !== "undefined" && ZAJECIA.zespoly ? ZAJECIA.zespoly.liczba : 2) : krok.pozycje.length;
  const wybrane = new Set();
  while (wybrane.size < Math.min(limitWyboru(krok), n)) wybrane.add(Math.floor(los() * n));
  return { s: [...wybrane] };
}

/* Tytuły zespołów z kroku „tekst” (pierwsze pole najnowszego widocznego wpisu): { <zespół>: tekst }. */
function tytulyZespolow(zajecia, krok, odp, stan) {
  const zrodlo = zajecia.kroki.find((x) => x.id === krok.z_kroku);
  const tytuly = {};
  for (const w of wpisyTekstu(zrodlo, odpowiedziKroku(odp, zrodlo.id), stan)) if (w.z && w.teksty[0]) tytuly[w.z] = w.teksty[0];
  return tytuly;
}

/* Nazwa pozycji do wyświetlenia: tekst z JSON albo „Zespół N: tytuł”. */
function nazwaPozycji(zajecia, krok, i, tytuly = {}) {
  if (!krok.z_kroku) return tx(krok.pozycje[i].tekst);
  return tytuly[i + 1] ? `${nazwaZespolu(zajecia, i + 1)}: ${tytuly[i + 1]}` : nazwaZespolu(zajecia, i + 1);
}

;
/* Typ kroku „mapa”: mapa różnic. Przy każdej pozycji (np. problem przyrody) uczeń ustawia 2 suwaki, po jednym na stronę (np. Grecja i Polska).
   Odpowiedź telefonu: { w: [[strona 1, strona 2], …] } (lista na pozycję). TV w wynikach: średnie obu stron i podpis różnicy.
   Podpis: różnica od MAPA_PROG = „więcej” strony z wyższą średnią (pole wiecej w JSON), mniejsza i obie średnie od MAPA_POWAZNY = „wspólny”,
   mniejsza przy niższych = „podobny”. Z polem przydzial (wymaga zespołów) faza „przydzial”: pozycje z największą różnicą dla zespołów.
   Plik dokłada się do TYPY_DODATKOWE (logika.js) i do słownika. Format: README.md, „mapa”. */
const MAPA_PROG = 1;
const MAPA_POWAZNY = 3;

const zakresMapy = (krok) => ({ min: krok.min ?? 1, max: krok.max ?? 5 });

function wartosciMapy(krok, d, r) {
  const { min, max } = zakresMapy(krok);
  const para = d && Array.isArray(d.w) && Array.isArray(d.w[r]) ? d.w[r] : [];
  return [0, 1].map((s) => (typeof para[s] === "number" && para[s] >= min && para[s] <= max ? para[s] : null));
}

const sredniaMapy = (liczby) => (liczby.length ? Math.round((liczby.reduce((a, b) => a + b, 0) / liczby.length) * 10) / 10 : null);

/* Na pozycję: średnie obu stron, różnica (strona 1 minus strona 2) i rodzaj: „wiecej0”, „wiecej1”, „wspolny”, „podobny” albo null. */
function wynikMapy(krok, lista) {
  const odpowiedzi = lista.filter((d) => krok.pozycje.some((_, r) => wartosciMapy(krok, d, r).some((v) => v !== null)));
  const pozycje = krok.pozycje.map((_, r) => {
    const [a, b] = [0, 1].map((s) => sredniaMapy(odpowiedzi.map((d) => wartosciMapy(krok, d, r)[s]).filter((v) => v !== null)));
    if (a === null || b === null) return { a, b, roznica: null, rodzaj: null };
    const roznica = Math.round((a - b) * 10) / 10;
    const rodzaj = Math.abs(roznica) >= MAPA_PROG ? (roznica > 0 ? "wiecej0" : "wiecej1") : Math.min(a, b) >= MAPA_POWAZNY ? "wspolny" : "podobny";
    return { a, b, roznica, rodzaj };
  });
  return { ile: odpowiedzi.length, pozycje };
}

/* Przydział: tyle pozycji o największej różnicy, ile par zespołów (zaokrąglone w górę); zespoły po kolei, po 2 na pozycję. */
function przydzialMapy(w, liczbaZespolow) {
  const kolejnosc = w.pozycje.map((p, r) => ({ r, d: p.roznica === null ? -1 : Math.abs(p.roznica) })).filter((x) => x.d >= 0)
    .sort((x, y) => y.d - x.d || x.r - y.r);
  const ile = Math.min(kolejnosc.length, Math.ceil(liczbaZespolow / 2));
  const grupy = kolejnosc.slice(0, ile).map((x) => ({ r: x.r, roznica: x.d, zespoly: [] }));
  if (!grupy.length) return [];
  for (let z = 1; z <= liczbaZespolow; z++) grupy[Math.floor(((z - 1) * ile) / liczbaZespolow)].zespoly.push(z);
  return grupy;
}

function symulujMape(krok, los) {
  const { min, max } = zakresMapy(krok);
  const rozpietosc = max - min;
  /* Każda pozycja ma swoje stałe przesunięcie, żeby podgląd pokazał różne rodzaje różnic. */
  return { w: krok.pozycje.map((_, r) => [0, 1].map((s) => {
    const srodek = min + rozpietosc * (((r * 3 + s * 5) % 7) / 6);
    return Math.max(min, Math.min(max, Math.round(srodek + (los() - 0.5) * 2)));
  })) };
}

const liczbaMapy = (x) => (x === null ? t("brak") : JEZYK === "pl" ? String(x.toFixed(1)).replace(".", ",") : x.toFixed(1));

function opisRodzaju(krok, rodzaj) {
  if (rodzaj === "wiecej0") return tx(krok.strony[0].wiecej);
  if (rodzaj === "wiecej1") return tx(krok.strony[1].wiecej);
  return rodzaj ? t(rodzaj === "wspolny" ? "mapaWspolny" : "mapaPodobny") : "";
}

  const wypelnienie = el("i", { className: klasa });
  wypelnienie.style.width = `${wartosc === null ? 0 : Math.max(2, ((wartosc - min) / (max - min)) * 100)}%`;
  return el("span", { className: "tv-mapa-st" }, el("span", { className: "kalk-pasek" }, wypelnienie), el("b", { className: "num", textContent: liczbaMapy(wartosc) }));
}

function tabelaMapy(krok, w) {

    return el("li", {}, el("span", { textContent: tx(p.tekst) }), pasekMapy(x.a, krok, "s0"), pasekMapy(x.b, krok, "s1"),
      el("span", { className: `tv-mapa-opis${x.rodzaj && x.rodzaj.startsWith("wiecej") ? " roznica" : ""}`, textContent: opisRodzaju(krok, x.rodzaj) }));

function tvPrzydzial(k, w) {

/* Typ kroku „wyzwanie” bez DOM (rysowanie: typ_wyzwanie.js). Zespoły planują ten sam wyjazd: po jednej opcji w każdej kategorii, kilogramów

   Liczy się pierwszy plan zespołu (najmniejsze t). Ranking: mniejszy ślad wyżej, remis: mniejsza różnica szacunku, potem wcześniejszy plan.
   „Najlepszy szacunek”: zespół z najmniejszą różnicą, niezależnie od miejsca. Format: README.md, „wyzwanie”. Testy: test_wyzwanie.js. */

const sumaStalych = (krok) => (krok.stale || []).reduce((a, s) => a + s.kg, 0);

/* Wybory w każdej kategorii, każdy numer istniejącej opcji. */
const pelnyPlan = (krok, w) => Array.isArray(w) && w.length === krok.kategorie.length
  && w.every((i, k) => Number.isInteger(i) && i >= 0 && i < krok.kategorie[k].opcje.length);

const dobrySzacunek = (krok, s) => typeof s === "number" && Number.isFinite(s) && s >= krok.szacunek.min && s <= krok.szacunek.max;

const dobryPlan = (krok, d) => Boolean(d) && pelnyPlan(krok, d.w) && dobrySzacunek(krok, d.s);

function sumaPlanu(krok, w) {
  if (!pelnyPlan(krok, w)) throw new RangeError("Plan wyzwania musi mieć wybór w każdej kategorii");
  return krok.kategorie.reduce((a, kat, i) => a + kat.opcje[w[i]].kg, sumaStalych(krok));

/* Pierwszy dobry plan każdego zespołu 1…liczba: Map(numer zespołu → odpowiedź). Zespół spoza zakresu (np. 99) się nie liczy. */
function pierwszePlany(krok, lista, liczba = Infinity) {
  const plany = new Map();

/* Typ kroku „mapa_obietnic” (faza pokaz): obietnice z kroku wybor (z_kroku) pogrupowane w obszary skutku. Każda pozycja tamtego kroku ma
   efekty [{ grupa, ile, czesc?, poza_suma? }] na rok. Obszar: kropka za każdą osobę, której obietnica tam działa, suma na rok i jedno porównanie
   (porownanie.dziel: suma ÷ dziel; porownanie.czesc: suma efektów z tą częścią, np. „w tym 12 kg ubrań”; zero: tekst, gdy tej części nie ma).
   Efekt z poza_suma liczy się tylko w swojej części (np. opakowania z kaucją obok sumy plastiku). Własne wpisy idą tylko do pola „Razem”,
   bez wpisów ukrytych przez prowadzącego na ścianie (stan.ukryte). Sumy i porównania na TV są przybliżone do 2 cyfr znaczących.
   Format: README.md, „mapa_obietnic”. Testy: test_mapa_obietnic.js. */
const MAKS_KROPEK = 30;

const krokZrodlowyMapy = (zajecia, krok) => zajecia.kroki.find((k) => k.id === krok.z_kroku) || null;

/* Wybrana pozycja z odpowiedzi kroku wybor (ile 1) albo null; własny wpis to { wlasna: true }. */
function pozycjaObietnicy(ref, d) {
  if (d && Array.isArray(d.s) && Number.isInteger(d.s[0]) && ref.pozycje[d.s[0]]) return ref.pozycje[d.s[0]];
  return d && typeof d.w === "string" && d.w.trim() ? { wlasna: true } : null;
}

/* { grupy: [{ id, osoby, suma, czesci: { <czesc>: suma } }], osoby, wlasne } */
function wynikMapyObietnic(krok, ref, lista, stan = {}) {
  const grupy = krok.grupy.map((g) => ({ id: g.id, osoby: 0, suma: 0, czesci: {} }));
  const wedlugId = Object.fromEntries(grupy.map((g) => [g.id, g]));
  let osoby = 0;
  let wlasne = 0;
  for (const d of lista) {
    const poz = pozycjaObietnicy(ref, d);
    if (!poz) continue;
    if (poz.wlasna) {
      if (!((stan && stan.ukryte) || {})[`${ref.id}/${d.urz}`]) wlasne += 1;
      continue;
    }
    osoby += 1;
    const efekty = (poz.efekty || []).filter((e) => wedlugId[e.grupa]);
    for (const e of efekty) {
      const g = wedlugId[e.grupa];
      if (!e.poza_suma) g.suma += e.ile;
      if (e.czesc) g.czesci[e.czesc] = (g.czesci[e.czesc] || 0) + e.ile;
    }
    for (const id of new Set(efekty.map((e) => e.grupa))) wedlugId[id].osoby += 1;
  }
  return { grupy, osoby, wlasne };

    naWiadomosc: (temat, dane, zachowany, serwer = 0) => {
      if (temat === "stan" && !zachowany && !sesja.zrodloStanu) sesja.probkiZegara = dodajProbkeZegara(sesja.probkiZegara, dane, Date.now());
      const obsluz = (tresc) => {
        const zmiana = przyjmijWiadomosc(temat, tresc, serwer);
        if (zmiana) naZmiane(zmiana, zachowany);
      };
      if (temat.startsWith("odp/") && zaszyfrowanaOdpowiedz(dane)) odszyfrujWiadomosc(dane).then((tresc) => tresc && obsluz(tresc));
      else obsluz(dane);
    },
  }, PARAMETRY.test);
  return sesja.lacze;
}

/* Klucz odpowiedzi (odpowiedzi_szyfr.js): z #z= adresu; null bez klucza albo bez WebCrypto (wtedy odpowiedzi idą jawnie). */
let kluczOdpowiedzi;
function kluczSesjiOdpowiedzi() {
  if (kluczOdpowiedzi === undefined) {
    const tekst = kluczSesjiTekst();
    kluczOdpowiedzi = tekst && szyfrowanieDostepne() ? importujKlucz(tekst) : Promise.resolve(null);
  }
  return kluczOdpowiedzi;
}

async function odszyfrujWiadomosc(dane) {
  const klucz = await kluczSesjiOdpowiedzi();
  if (!klucz) {
    console.warn("Zaszyfrowana odpowiedź, a ta strona nie ma klucza sesji (kod wpisany ręcznie)");
    return null;
  }
  try {
    return await odszyfrujOdpowiedz(klucz, dane);
  } catch (blad) {
    if (!(blad instanceof BladSzyfru)) throw blad;
    console.warn("Pominięta odpowiedź, której nie da się odszyfrować", blad);
    return null;
  }
}

/* Odpowiedź telefonu do odp/<krok>/<telefon>: zaszyfrowana, gdy jest klucz, inaczej jawna. */
async function publikujOdpowiedz(temat, tresc) {
  const klucz = await kluczSesjiOdpowiedzi();
  return sesja.lacze.publikuj(temat, klucz ? await zaszyfrujOdpowiedz(klucz, tresc) : tresc);

/* Identyfikator telefonu na jedną sesję (w ?test osobny dla każdej karty): odpowiedzi jednego dziecka z różnych lekcji nie dają się połączyć.
   Dawny stały identyfikator (zi-urz, wspólny dla wszystkich lekcji) jest usuwany. */

;
/* Zdjęcia z telefonów przez łącze zajęć, szyfrowane end-to-end (DECYZJE.md, runda 2; klucz i szyfr: szyfr.js).
   Telefon zmniejsza zdjęcie (najdłuższy bok 1280 px, JPEG 0,8; nowy plik nie ma EXIF ani GPS), szyfruje je kluczem sesji z kontekstem
   „krok|zespół|zdjęcie” (dane dodatkowe AES-GCM: jawny spis nie przypisze zdjęcia innemu zespołowi) i wysyła w kawałkach jako wiadomości
   niezachowane: zdj/<krok>/<zdjęcie>/<nr> = {n, d}. Serwer MQTT niczego z nich nie przechowuje i widzi tylko szyfrogram.
   Spis zdjęć telefonu idzie jak odpowiedź (zachowany): odp/<krok>~z/<telefon> = {z, t, zd: [{f, n, s?}]} (s: zaszyfrowany opis, np. przeróbki).
   Odbiorca (TV, konsola prowadzącego z miniaturami do „Pokaż”; w „przerobki_zespolow” także telefony) składa kawałki i odszyfrowuje;
   obraz trzyma tylko w pamięci (adres blob:). Kawałek: 1 <= n < 1000, numer < n, istniejącego nie nadpisuje.
   Brakujące kawałki: odbiorca prosi prosba/<krok>/<zdjęcie> = {b: [numery]}, odsyła telefon-nadawca albo TV, gdy ma całość (najwyżej 3 razy całość).
   Nieudane odszyfrowanie: kawałki do kosza i prośba o całość, najwyżej 3 próby. TV potwierdza odbiór: potw/<krok>/<zdjęcie> = {ok: 1}
   (telefon pisze „dotarło”; „na dużym ekranie” dopiero po „Pokaż” w konsoli). Kroki ze zdjęciami: TYPY_DODATKOWE[typ].zdjecia(krok). */
const MAKS_BOK_ZDJECIA = 1280;
const JAKOSC_JPEG = 0.8;
const CISZA_PRZED_PROSBA_MS = 2500;
const PRZERWA_PROSBY_MS = 4000;
const PRZERWA_ODESLANIA_MS = 2000;
const CO_ILE_SPRAWDZAC_MS = 1500;
const MAKS_KAWALKOW = 1000;
const MAKS_PROB_ODBIORU = 3;
const MAKS_ODESLAN_CALOSCI = 3;
const WZOR_KAWALKA = /^[A-Za-z0-9+/]+={0,2}$/;
const MAKS_DLUGOSC_KAWALKA = Math.ceil(KAWALEK_BAJTY / 3) * 4;
const ZDJ = { rola: null, wyslane: new Map(), odebrane: new Map(), potw: new Set(), odeslane: new Map(), ileOdeslanych: new Map(), opisy: new Map(),
  klucz: null, czeka: false, petla: null };

class BladFormatu extends Error {}

const krokiZeZdjeciami = () => ZAJECIA.kroki.filter((k) => TYPY_DODATKOWE[k.typ] && TYPY_DODATKOWE[k.typ].zdjecia && TYPY_DODATKOWE[k.typ].zdjecia(k));
const tematSpisu = (krokId) => `${krokId}~z`;
const kontekstZdjecia = (krokId, z, f) => `${krokId}|${z}|${f}`;

/* Odpowiedzi innych kroków, które telefon pokazuje (np. clickbait zespołu w wierszu macierzy): TYPY_DODATKOWE[typ].wpisyDlaTelefonow(krok). */
const wpisyDlaTelefonow = () => [...new Set(ZAJECIA.kroki.flatMap((k) => (TYPY_DODATKOWE[k.typ] && TYPY_DODATKOWE[k.typ].wpisyDlaTelefonow
  ? TYPY_DODATKOWE[k.typ].wpisyDlaTelefonow(k) : [])))].map((id) => `odp/${id}/#`);

/* Tematy łącza dla widoku: TV i konsola odbierają wszystkie zdjęcia (konsola do „Pokaż”), telefony tylko tam, gdzie je pokazują,
   plus odpowiedzi kroków z wpisyDlaTelefonow. */
function subskrypcjeZdjec(rola) {
  ZDJ.rola = rola;
  const kroki = krokiZeZdjeciami();
  const wpisy = rola === "uczen" ? wpisyDlaTelefonow() : [];
  if (!kroki.length) return wpisy;
  if (rola === "tv") return ["zdj/#", "prosba/#"];
  if (rola === "prowadzacy") return ["zdj/#", "potw/#"];
  return ["prosba/#", "potw/#", ...wpisy, ...kroki.filter((k) => TYPY_DODATKOWE[k.typ].zdjecia(k).telefony)
    .flatMap((k) => [`zdj/${k.id}/#`, `odp/${k.id}/#`, `odp/${tematSpisu(k.id)}/#`])];
}

/* Dlaczego tu nie da się wysłać ani obejrzeć zdjęć: brak klucza w adresie albo adres bez https (crypto.subtle). null = można. */
function przeszkodaZdjec() {
  if (!kluczSesjiTekst()) return "brakKlucza";
  return szyfrowanieDostepne() ? null : "brakHttps";
}

async function kluczObiekt() {
  if (!ZDJ.klucz) ZDJ.klucz = importujKlucz(kluczSesjiTekst());
  return ZDJ.klucz;
}

function odswiezWidokZdjec() {
  if (ZDJ.czeka) return;
  ZDJ.czeka = true;
  setTimeout(() => {
    ZDJ.czeka = false;
    if (typeof rysujUcznia === "function") rysujUcznia(true);
    else if (typeof rysujTv === "function") rysujTv();
    else if (typeof rysujTablet === "function") rysujTablet();
  }, 150);
}

function zaladujObraz(adres) {
  return new Promise((ok, blad) => {
    const img = new Image();
    img.onload = () => ok(img);
    img.onerror = () => blad(new BladFormatu("Przeglądarka nie otwiera tego pliku jako zdjęcia (np. HEIC na Androidzie)"));
    img.src = adres;
  });
}

/* Duże zdjęcie (np. 48 MP): createImageBitmap zmniejsza już przy dekodowaniu, bez pełnego obrazu w pamięci. Zapas: zwykły Image. */
async function obrazDoRysowania(plik, adres, maks) {
  const img = await zaladujObraz(adres);
  const skala = Math.min(1, maks / Math.max(img.naturalWidth, img.naturalHeight));
  if (skala < 1 && typeof createImageBitmap === "function") {
    try {
      return await createImageBitmap(plik, { resizeWidth: Math.max(1, Math.round(img.naturalWidth * skala)), resizeQuality: "high", imageOrientation: "from-image" });
    } catch (blad) {
      console.warn("Zmniejszanie przy dekodowaniu nie działa, rysuję przez Image", blad);
    }
  }
  await img.decode();
  return img;
}

/* Zdjęcie z pliku przez canvas: najdłuższy bok najwyżej maks, JPEG. Plik z canvas nie ma EXIF ani GPS. Nieznany format: BladFormatu. */
async function zmniejszZdjecie(plik, maks = MAKS_BOK_ZDJECIA) {
  const adres = URL.createObjectURL(plik);
  try {
    const obraz = await obrazDoRysowania(plik, adres, maks);
    const [szer, wys] = obraz.naturalWidth ? [obraz.naturalWidth, obraz.naturalHeight] : [obraz.width, obraz.height];
    const skala = Math.min(1, maks / Math.max(szer, wys));
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(szer * skala));
    c.height = Math.max(1, Math.round(wys * skala));
    c.getContext("2d").drawImage(obraz, 0, 0, c.width, c.height);
    if (typeof obraz.close === "function") obraz.close();
    const blob = await new Promise((ok, blad) => c.toBlob((b) => (b ? ok(b) : blad(new Error("Canvas nie zapisał JPEG"))), "image/jpeg", JAKOSC_JPEG));
    return new Uint8Array(await blob.arrayBuffer());
  } finally {
    URL.revokeObjectURL(adres);
  }
}

const publikujKawalek = (krokId, f, i, n, kawalek) => sesja.lacze.publikuj(`zdj/${krokId}/${f}/${i}`, { n, d: doBase64(kawalek) }, false);

/* Wysyła zdjęcie zespołu z z telefonu; zwraca {f, n}. Własny podgląd (niezaszyfrowany JPEG) zostaje w pamięci tego telefonu. */
async function wyslijZdjecie(krokId, plik, z) {
  const jpeg = await zmniejszZdjecie(plik);
  const f = Math.random().toString(36).slice(2, 10);
  const kawalki = podzielNaKawalki(await zaszyfrujBajty(await kluczObiekt(), jpeg, kontekstZdjecia(krokId, z, f)));
  ZDJ.wyslane.set(f, { krokId, kawalki });
  ZDJ.odebrane.set(f, { ...nowyOdbior(krokId), z, n: kawalki.length, kawalki, url: URL.createObjectURL(new Blob([jpeg], { type: "image/jpeg" })) });
  for (const [i, k] of kawalki.entries()) await publikujKawalek(krokId, f, i, kawalki.length, k);
  return { f, n: kawalki.length };
}

/* Spis zdjęć tego telefonu w kroku (zachowany, jak odpowiedź). */
function opublikujSpis(krokId, urz, z, zd) {
  return sesja.lacze.publikuj(`odp/${tematSpisu(krokId)}/${urz}`, { z, t: Date.now(), zd });
}

/* Spisy wszystkich telefonów w kroku, od najstarszego: [{urz, z, t, zd}]. */
function spisyKroku(odp, krokId) {
  return Object.entries((odp && odp[tematSpisu(krokId)]) || {})
    .filter(([, d]) => d && Array.isArray(d.zd) && Number.isInteger(d.z))
    .map(([urz, d]) => ({ urz, ...d, zd: d.zd.filter((x) => x && /^[a-z0-9]{1,12}$/.test(x.f) && Number.isInteger(x.n) && x.n > 0 && x.n < MAKS_KAWALKOW) }))
    .sort((a, b) => (a.t || 0) - (b.t || 0));
}

/* Odbiór jednego zdjęcia. n: liczba kawałków (ze spisu, a od pierwszego kawałka z niego); kandydaci: zespoły ze spisów, których kontekst sprawdzamy. */
const nowyOdbior = (krokId) => ({ krokId, n: 0, nSpisu: 0, nZKawalka: false, kawalki: [], url: null, z: null, kandydaci: new Set(),
  ostatnio: 0, prosba: 0, oczekiwane: false, proby: 0, blad: false, sklada: false });

function wpisOdbioru(krokId, f) {
  if (!ZDJ.odebrane.has(f)) ZDJ.odebrane.set(f, nowyOdbior(krokId));
  return ZDJ.odebrane.get(f);
}

/* Stan zdjęcia zespołu z dla widoku: {url} gdy gotowe, inaczej {ile, n, blad}. Rejestruje oczekiwanie, więc brakujące kawałki pójdą prośbą.
   Zdjęcie odszyfrowane z kontekstem innego zespołu dla tego spisu nie istnieje (spis podszywa się pod cudze zdjęcie). */
function zdjecieOdebrane(krokId, f, n, z) {
  const o = wpisOdbioru(krokId, f);
  o.nSpisu = n;
  if (!o.nZKawalka) o.n = n;
  o.oczekiwane = true;
  if (Number.isInteger(z) && !o.kandydaci.has(z)) {
    o.kandydaci.add(z);
    if (o.blad) Object.assign(o, { blad: false, proby: 0 });
    sprobujZlozyc(f, o);
  }
  if (!ZDJ.petla && typeof setInterval === "function") ZDJ.petla = setInterval(prosOBraki, CO_ILE_SPRAWDZAC_MS);
  if (o.url) return o.z === z ? { url: o.url } : { url: null, ile: 0, n: o.n, blad: true };
  return { url: null, ile: o.kawalki.filter(Boolean).length, n: o.n, blad: o.blad };
}

const potwierdzoneZdjecie = (f) => ZDJ.potw.has(f);

function sprobujZlozyc(f, o) {
  if (o.url || o.sklada || o.blad || !o.kandydaci.size) return null;
  const dane = zlozKawalki(o.kawalki, o.n);
  return dane ? zlozZdjecie(f, o, dane) : null;
}

/* Odszyfrowanie po kolei z kontekstem każdego zespołu ze spisów (także dopisanego w trakcie); pierwszy pasujący ustala zespół zdjęcia. */
async function zlozZdjecie(f, o, dane) {
  o.sklada = true;
  const sprawdzone = new Set();
  const nastepny = () => [...o.kandydaci].find((z) => !sprawdzone.has(z));
  for (let z = nastepny(); z !== undefined; z = nastepny()) {
    sprawdzone.add(z);
    try {
      const jpeg = await odszyfrujBajty(await kluczObiekt(), dane, kontekstZdjecia(o.krokId, z, f));
      Object.assign(o, { z, url: URL.createObjectURL(new Blob([jpeg], { type: "image/jpeg" })) });
      break;
    } catch (blad) {
      console.warn("Zdjęcie nie pasuje do zespołu ze spisu albo do klucza", f, z, blad);
    }
  }
  o.sklada = false;
  if (o.url && ZDJ.rola === "tv") sesja.lacze.publikuj(`potw/${o.krokId}/${f}`, { ok: 1 }).catch((b) => console.warn("Potwierdzenie czeka na połączenie", b));
  if (!o.url) poNieudanymOdbiorze(f, o);
  odswiezWidokZdjec();
}

/* Złe kawałki (obce albo uszkodzone): do kosza i prośba o całość; po MAKS_PROB_ODBIORU próbach zdjęcie zostaje z błędem. */
function poNieudanymOdbiorze(f, o) {
  o.proby += 1;
  Object.assign(o, { kawalki: [], nZKawalka: false, n: o.nSpisu || o.n, ostatnio: 0, prosba: 0 });
  if (o.proby < MAKS_PROB_ODBIORU) return;
  o.blad = true;
  console.warn("Zdjęcie pominięte po kolejnych nieudanych próbach", f);
}

const poprawnyKawalek = (dane, i) => Boolean(dane) && typeof dane.d === "string" && dane.d.length <= MAKS_DLUGOSC_KAWALKA && WZOR_KAWALKA.test(dane.d)
  && Number.isInteger(dane.n) && dane.n >= 1 && dane.n < MAKS_KAWALKOW && i < dane.n;

function przyjmijKawalek(krokId, f, i, dane) {
  const o = wpisOdbioru(krokId, f);
  if (o.url || o.blad || o.sklada || !poprawnyKawalek(dane, i) || o.kawalki[i]) return;
  if (o.nZKawalka && dane.n !== o.n) return;
  Object.assign(o, { n: dane.n, nZKawalka: true, ostatnio: Date.now() });
  o.kawalki[i] = zBase64(dane.d);
  sprobujZlozyc(f, o);
}

/* Prośbę obsługuje nadawca i TV z całym zdjęciem; ten sam kawałek najwyżej raz na 2 s, całość najwyżej MAKS_ODESLAN_CALOSCI razy. */
function odeslij(krokId, f, numery) {
  const wlasne = ZDJ.wyslane.get(f);
  const odebrane = ZDJ.rola === "tv" && ZDJ.odebrane.get(f);
  const kawalki = wlasne ? wlasne.kawalki : odebrane && odebrane.url ? odebrane.kawalki : null;
  if (!kawalki || !Array.isArray(numery)) return;
  const teraz = Date.now();
  let ile = ZDJ.ileOdeslanych.get(f) || 0;
  for (const i of [...new Set(numery)].filter((x) => Number.isInteger(x) && x >= 0 && x < kawalki.length)) {
    if (ile >= MAKS_ODESLAN_CALOSCI * kawalki.length) break;
    if (teraz - (ZDJ.odeslane.get(`${f}/${i}`) || 0) < PRZERWA_ODESLANIA_MS) continue;
    ZDJ.odeslane.set(`${f}/${i}`, teraz);
    ile += 1;
    publikujKawalek(krokId, f, i, kawalki.length, kawalki[i]).catch((b) => console.warn("Kawałek czeka na połączenie", b));
  }
  ZDJ.ileOdeslanych.set(f, ile);
}

function prosOBraki() {
  if (typeof sesja === "undefined" || !sesja.lacze) return;
  const teraz = Date.now();
  for (const [f, o] of ZDJ.odebrane) {
    if (o.url || o.blad || o.sklada || !o.oczekiwane || !o.n) continue;
    if (teraz - o.ostatnio < CISZA_PRZED_PROSBA_MS || teraz - o.prosba < PRZERWA_PROSBY_MS) continue;
    o.prosba = teraz;
    sesja.lacze.publikuj(`prosba/${o.krokId}/${f}`, { b: brakujaceKawalki(o.kawalki, o.n) }, false).catch((b) => console.warn("Prośba czeka na połączenie", b));
  }
}

function przyjmijTematZdjec(temat, dane) {
  const [rodzaj, krokId, f, nr] = temat.split("/");

function tvWynikiGlosu(k, w) {

/* Werdykt: przy poprawnej odpowiedzi opcje z wyróżnioną poprawną (nad nimi werdykt, gdy jest własny); bez poprawnej sam werdykt. */
function werdyktTv(krok) {
  const o = krok.odslona || {};
  const znacznik = o.znacznik ? el("span", { className: "tv-znacznik", textContent: tx(o.znacznik) }) : null;
  const naglowek = (tekst) => el("div", { className: "tv-werdykt-rzad" }, el("b", { className: `tv-werdykt ${klasaWerdyktu(krok)}`, textContent: tekst }), znacznik);
  if (!Number.isInteger(krok.poprawna)) return [naglowek(werdyktGlosu(krok))];
  /* Duża poprawna opcja zastępuje werdykt; obok obrazu (wąska kolumna) i pod własnym werdyktem opcje zostają w jednym rzędzie. */
  const opcje = opcjeOdslony(krok, `tv-odsl${wlasnyWerdykt(krok) || krok.obraz ? "" : " duze"}`);
  return wlasnyWerdykt(krok) ? [naglowek(tx(o.werdykt)), opcje] : [opcje, znacznik];

function tvDodatek(k) {

function tvGlos(k) {

;
/* TV: ekrany kroków innych niż „glos” (ten w tv_glos.js), ekran startowy i nakładka z kodem QR.
   k = { zajecia, indeks, krok, faza, odp, stan, teraz, adres, kod }. Najmniejszy tekst treści: 64 px przy 1080p. */
const NA_SCIANIE = { zbieranie: 4, zWskazowkami: 2 };
const MAKS_RANKINGU_W_KOLUMNIE = 6;

const adresBezZapytania = (adres) => adres.replace(/^https?:\/\//, "").replace(/[?#].*$/, "");

function blokQr(k) {
  return el("div", { className: "tv-qr-blok" }, qrEl(k.adres, "tv-qr"),
    el("p", { className: "tv-adres", textContent: adresBezZapytania(k.adres) }),
    el("p", { className: "tv-kod" }, `${t("kod")} `, el("b", { className: "num", textContent: kodSesjiTekst(k.kod) })));
}

function pozycjeTv(pozycje) {
  if (!pozycje) return null;
  return el("div", { className: "tv-pozycje" }, pozycje.tytul ? el("h2", { textContent: tx(pozycje.tytul) }) : null,
    listaEl(pozycje.lista.map((p) => p.nazwa), "tv-lista-pozycji", false));
}

function tvInfo(k) {
  const kr = k.krok;
  const tresc = [el("h1", { className: "tv-tytul", textContent: tx(kr.tytul) }),
    kr.tresc ? el("p", { className: "tv-tekst", textContent: tx(kr.tresc) }) : null, listaEl(kr.lista, "tv-lista"), pozycjeTv(kr.pozycje)];
  if (kr.qr) return tvRama(k, null, el("div", { className: "tv-start" }, el("div", { className: "tv-kolumna" }, ...tresc), blokQr(k)));
  return tvRama(k, prawaZegar(k), zObrazem(kr.obraz, ...tresc));
}

function histogramEl(s, w) {
  const max = Math.max(1, ...w.kubelki.map((b) => b.ile));
  const slupki = el("div", { className: "tv-histogram" }, ...w.kubelki.map((b) => {
    const slupek = el("i");
    slupek.style.height = `${(b.ile / max) * 100}%`;
    return el("span", {}, slupek);
  }));
  return el("div", { className: "tv-suwak-wynik" },
    el("div", { className: "tv-suwak-g" }, el("span", { textContent: tx(s.etykieta) }),
      el("b", { className: "num", textContent: w.srednia === null ? t("brak") : t("srednia", w.srednia) })),
    slupki, el("div", { className: "tv-konce" }, el("span", { textContent: tx(s.lewy) || String(s.min) }), el("span", { textContent: tx(s.prawy) || String(s.max) })));
}

function tvSuwaki(k) {
  const lista = odpowiedziKroku(k.odp, k.krok.id);
  const w = wynikSuwakow(k.krok, lista);
  const licznik = el("span", { textContent: t("odpowiedzi", w[0] ? w[0].ile : 0) });
  if (k.faza === "wyniki") {
    return tvRama(k, licznik, el("h1", { className: "tv-pyt maly", textContent: tx(k.krok.pytanie) }),
      el("div", { className: "tv-suwaki" }, ...k.krok.suwaki.map((s, i) => histogramEl(s, w[i]))));
  }
  const opis = k.krok.suwaki.map((s) => t("odDo", tx(s.etykieta), tx(s.lewy) || s.min, tx(s.prawy) || s.max));
  return tvRama(k, prawaZegar(k), zObrazem(k.krok.obraz, el("h1", { className: "tv-pyt", textContent: tx(k.krok.pytanie) }),
    listaEl(opis, "tv-lista", false)), el("footer", { className: "tv-d" }, licznik));
}

function kartaWpisu(zajecia, krok, w) {
  const pola = polaTekstu(krok);
  const teksty = w.teksty.filter((t, i) => t && pola[i].na_tv !== false);
  return el("li", { className: `tv-wpis${w.ocena ? ` ocena-${w.ocena}` : ""}` },
    w.z ? el("b", { className: "tv-wpis-kto", textContent: nazwaZespolu(zajecia, w.z) }) : null,
    el("p", { textContent: teksty.join(" · ") }),
    w.ocena ? el("span", { className: "tv-ocena", textContent: t(w.ocena === "dobrze" ? "dobrze" : "doPoprawy") }) : null);
}

/* Faza ściany: strona wpisów wybrana w konsoli (stronaSciany, kroki_wspolne.js), w kolejności wysłania. */
function tvStronaSciany(k, wpisy) {
  const s = stronaSciany(k.krok, k.stan, wpisy.length);
  const sciana = el("ol", { className: "tv-sciana" }, ...wpisy.slice(s.od, s.do).map((w) => kartaWpisu(k.zajecia, k.krok, w)));
  const opis = s.stron > 1 ? t("wpisyStrona", wpisy.length, s.strona + 1, s.stron) : t("wpisy", wpisy.length, 0);
  return tvRama(k, null, sciana, el("footer", { className: "tv-d" }, el("span", { textContent: opis })));
}

function tvTekst(k) {
  const wpisy = wpisyTekstu(k.krok, odpowiedziKroku(k.odp, k.krok.id), k.stan);
  if (k.faza === "sciana") return tvStronaSciany(k, wpisy);
  const wsk = k.faza === "zbieranie" ? k.krok.wskazowki : null;
  const widoczne = wpisy.slice(-(wsk ? NA_SCIANIE.zWskazowkami : NA_SCIANIE.zbieranie)).reverse();
  const sciana = el("ol", { className: "tv-sciana" }, ...widoczne.map((w) => kartaWpisu(k.zajecia, k.krok, w)));
  const dol = el("footer", { className: "tv-d" }, el("span", { textContent: t("wpisy", wpisy.length, wpisy.length > widoczne.length ? widoczne.length : 0) }));
  const bok = wsk ? el("div", { className: "tv-pole" }, el("h2", { textContent: tx(wsk.tytul) }), listaEl(wsk.lista, "tv-lista-pozycji", false)) : null;
  const glowna = el("div", { className: "tv-kolumna" }, el("h1", { className: "tv-pyt", textContent: tx(k.krok.pytanie) }), sciana);
  return tvRama(k, prawaZegar(k), bok ? el("div", { className: "tv-dwie" }, glowna, bok) : glowna, dol);
}

function mapaStukniec(krok, punkty, pokazCel) {
  const mapa = el("div", { className: "tv-mapa" }, el("img", { src: krok.obraz.plik, alt: tx(krok.obraz.opis) }));
  if (pokazCel && krok.cel) {
    const ramka = el("i", { className: "tv-cel" });
    Object.assign(ramka.style, { left: `${krok.cel.x}%`, top: `${krok.cel.y}%`, width: `${krok.cel.szer}%`, height: `${krok.cel.wys}%` });
    mapa.append(ramka);
  }
  for (const p of punkty) {
    const kropka = el("b", { className: `tv-kropka${pokazCel && krok.cel && !wCelu(krok.cel, p) ? " poza" : ""}` });
    Object.assign(kropka.style, { left: `${p.x}%`, top: `${p.y}%` });
    mapa.append(kropka);
  }
  return mapa;
}

function tvStukniecie(k) {
  const w = wynikStukniec(k.krok, odpowiedziKroku(k.odp, k.krok.id));
  const pokazPunkty = k.faza !== "zbieranie";
  const opis = [el("h1", { className: "tv-pyt maly", textContent: tx(k.krok.pytanie) }),
    el("p", { className: "tv-tekst", textContent: t("stukniecia", w.razem) })];
  if (k.faza === "odslona") {
    opis.push(el("p", { className: "tv-wielka-liczba num", textContent: t("wCelu", w.procentTrafionych ?? 0) }));
    if (k.krok.wyjasnienie) opis.push(el("p", { className: "tv-tekst", textContent: tx(k.krok.wyjasnienie) }));
  }
  return tvRama(k, k.faza === "zbieranie" ? prawaZegar(k) : null,
    el("div", { className: "tv-dwie tv-dwie-mapa" }, mapaStukniec(k.krok, pokazPunkty ? w.punkty : [], k.faza === "odslona"),
      el("div", { className: "tv-kolumna" }, ...opis)));
}

function tvGaleria(k) {
  const w = wynikGalerii(k.krok, odpowiedziKroku(k.odp, k.krok.id));
  const kolejnosc = k.faza === "wyniki" ? w.ranking.map((r) => r.i) : k.krok.obrazy.map((_, i) => i);
  const kafle = kolejnosc.map((i, miejsce) => el("li", { className: k.faza === "wyniki" && miejsce === 0 && w.serca[i] ? "pierwsze" : "" },
    el("img", { src: k.krok.obrazy[i].plik, alt: tx(k.krok.obrazy[i].opis) }),
    el("span", { className: "tv-kafel-opis" }, el("b", { className: "num", textContent: String(i + 1) }),
      k.faza === "wyniki" ? el("span", { className: "tv-serca num" }, ikona("serce"), ` ${w.serca[i]}`) : el("span", { textContent: tx(k.krok.obrazy[i].tytul) }))));
  const siatka = el("ol", { className: "tv-galeria" }, ...kafle);
  siatka.style.setProperty("--kol", String(Math.min(4, kafle.length)));
  return tvRama(k, k.faza === "zbieranie" ? prawaZegar(k) : el("span", { textContent: t("glosujacy", w.glosujacych) }),
    el("h1", { className: "tv-pyt maly", textContent: tx(k.krok.pytanie) }), siatka);
}

function tvTimer(k) {
  return tvRama(k, null, el("div", { className: "tv-timer" }, el("h1", { className: "tv-tytul", textContent: tx(k.krok.tytul) }),
    zegarEl(k.stan.timer, k.teraz, "tv-zegar-duzy"), k.krok.tresc ? el("p", { className: "tv-tekst", textContent: tx(k.krok.tresc) }) : null));
}

function tvRanking(k) {
  const wiersze = rankingZespolow(k.zajecia, k.odp).map((p) => el("li", {},
    el("b", { className: "num", textContent: `${p.miejsce}.` }), el("span", { textContent: nazwaZespolu(k.zajecia, p.zespol) }),
    el("b", { className: "num", textContent: t("pkt", p.punkty) })));
  /* Ponad 6 zespołów (wybór w konsoli uruchamiania, do 10): ranking w dwóch kolumnach, żeby zmieścił się bez zmniejszania tekstu. */
  const lista = el("ol", { className: `tv-ranking${wiersze.length > MAKS_RANKINGU_W_KOLUMNIE ? " dwie" : ""}` }, ...wiersze);
  lista.style.setProperty("--wiersze", String(Math.ceil(wiersze.length / 2)));
  return tvRama(k, null, el("h1", { className: "tv-tytul", textContent: tx(k.krok.tytul) }),
    lista, k.krok.tresc ? el("p", { className: "tv-tekst", textContent: tx(k.krok.tresc) }) : null);
}

const EKRANY_TV = { info: tvInfo, glos: tvGlos, suwaki: tvSuwaki, tekst: tvTekst, stukniecie: tvStukniecie, galeria: tvGaleria, timer: tvTimer, ranking: tvRanking };

/* Ekran TV dla stanu sesji; przy stan.qr na wierzchu nakładka z kodem QR. */
function ekranTv(k) {
  const ekran = (EKRANY_TV[k.krok.typ] || TYPY_DODATKOWE[k.krok.typ].tv)(k);
  if (!k.stan.qr) return [ekran];
  return [ekran, el("div", { className: "tv-nakladka" }, el("h2", { className: "tv-tytul", textContent: t("dolaczDoZajec") }), blokQr(k))];
}

/* Zanim tablet wyśle pierwszy stan: tytuł, kod QR, kod sesji. */
function ekranTvStart(zajecia, adres, kod) {
  const k = { zajecia, krok: { typ: "info", naglowek: zajecia.tytul }, faza: "pokaz", adres, kod };
  return tvRama(k, null, el("div", { className: "tv-start" }, el("div", { className: "tv-kolumna" },
    el("h1", { className: "tv-tytul", textContent: tx(zajecia.tytul) }), el("p", { className: "tv-tekst", textContent: t("zeskanujStart") })), blokQr(k)));
}

/* Gdy treść się nie mieści (zapas ćwierć linii na zaokrąglenia): najpierw ciaśniejsze nagłówki, potem wąski krój. Tekst treści nigdy poniżej 64 px.
   Jeśli i to nie wystarcza, ekran dostaje data-przepelnienie (podglad.html pokazuje ostrzeżenie). */
function przepelniony(ekran) {
  const zapas = parseFloat(getComputedStyle(ekran).fontSize) / 4;
  return [...ekran.querySelectorAll(".tv-tresc, .tv-kolumna, .tv-pole")].some((w) => w.scrollHeight > w.clientHeight + zapas);
}

function dopasujEkran(ekran) {
  if (!ekran) return;
  ekran.classList.remove("ciasno", "ciasno2");
  delete ekran.dataset.przepelnienie;
  for (const klasa of ["ciasno", "ciasno2"]) {
    if (!przepelniony(ekran)) return;
    ekran.classList.add(klasa);
  }
  if (przepelniony(ekran)) ekran.dataset.przepelnienie = "1";
}

;
/* TV na żywo (ciemny, 1920×1080 w jednostce --u): pokazuje to, co prowadzący przełącza w konsoli prowadzącego, i liczy odpowiedzi z telefonów.
   Dźwięki timera po kliknięciu „Kliknij, aby zacząć” (przeglądarka gra dopiero po geście). Ekrany: tv_kroki.js, tv_glos.js. */
const TV = { dzwiek: false, poprzednioMs: null, krokZegara: null, czekaRysowanie: false };
const korzenTv = document.getElementById("tv");

function kontekstTv() {
  const stan = sesja.stan;
  return { zajecia: ZAJECIA, indeks: stan.krok, krok: ZAJECIA.kroki[stan.krok], faza: stan.faza, odp: sesja.odp, stan,
    teraz: terazSesji(), adres: adresDlaUczniow(), kod: sesja.kod };
}

function rysujTv() {
  TV.czekaRysowanie = false;
  if (!sesja.stan) wstaw(korzenTv, ekranTvStart(ZAJECIA, adresDlaUczniow(), sesja.kod));
  else wstaw(korzenTv, ...ekranTv(kontekstTv()));
  dopasujEkran(korzenTv.querySelector(".tv-ekran"));
  odswiezBaner();
}

/* Głosy przychodzą seriami: jedno przerysowanie na serię. */
function zaplanujRysowanie() {
  if (TV.czekaRysowanie) return;
  TV.czekaRysowanie = true;
  setTimeout(rysujTv, 200);
}

function tykniecie() {
  const timer = sesja.stan && sesja.stan.timer;
  const teraz = terazSesji();
  odswiezZegary(korzenTv, timer, teraz);
  const ms = zostaloMs(timer, teraz);
  const krok = sesja.stan ? sesja.stan.krok : null;
  if (krok !== TV.krokZegara) TV.poprzednioMs = null;
  const zdarzenie = timer ? zdarzenieTimera(TV.poprzednioMs, ms, timer.czasMs) : null;
  if (zdarzenie && TV.dzwiek) zagraj(zdarzenie).catch((blad) => console.warn("Nie zagrał dźwięk", blad));
  TV.poprzednioMs = ms;
  TV.krokZegara = krok;
}

function przygotujSterowanie() {
  const start = document.getElementById("start");
  start.addEventListener("click", () => {
    odblokujDzwieki();
    TV.dzwiek = true;
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch((b) => console.warn("Bez pełnego ekranu", b));
    start.hidden = true;
    opiszDzwiek();
  });
  document.getElementById("pelny").addEventListener("click", () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch((b) => console.warn("Bez pełnego ekranu", b));
  });
  document.getElementById("dzwiek").addEventListener("click", () => {
    TV.dzwiek = !TV.dzwiek;
    if (TV.dzwiek) odblokujDzwieki();
    opiszDzwiek();
  });
  opiszDzwiek();
  window.addEventListener("resize", () => dopasujEkran(korzenTv.querySelector(".tv-ekran")));
}

function opiszDzwiek() {
  document.getElementById("dzwiek").textContent = t("dzwiekTv", TV.dzwiek);
  document.getElementById("pelny").textContent = t("pelnyEkran");
  document.getElementById("start-tytul").textContent = t("startTytul");
  document.getElementById("start-opis").textContent = t("startOpis");
  wstaw(document.getElementById("jezyk"), przelacznikJezyka(() => { opiszDzwiek(); rysujTv(); }));
  document.title = `${tx(ZAJECIA.tytul)} · TV`;
}

function startTv() {
  sesja.naInneZespoly = przeladujDlaZespolow;
  rysujTv();
  polaczSesje({
    subskrypcje: ["odp/#", "obecni/#", ...subskrypcjeZdjec("tv")],
    naZmiane: (rodzaj) => (rodzaj === "stan" ? (opiszDzwiek(), rysujTv()) : zaplanujRysowanie()),
    naStatus: (status) => pokazLaczeWezel(document.getElementById("lacze"), status, PARAMETRY.test),
  });
  setInterval(tykniecie, 250);
}

pokazBanerTestu(Boolean(PARAMETRY.test), TEKST_BANERU(PARAMETRY.test));
przygotujSterowanie();
if (sesja.kod) startTv();
else {
  document.getElementById("start").hidden = true;
  ekranKodu(korzenTv, { tytul: tx(ZAJECIA.tytul), opis: t("kodOpisTv"), naKod: (kod) => {
    ustawKodWAdresie(kod);
    document.getElementById("start").hidden = false;
    startTv();
  } });
}
